# Copy to .github/workflows/ in your repo. Builds the plug-in (.NET Framework 4.6.2) and runs the unit tests on Linux.
name: plugin-tests
on:
  push:
    paths: ['src/**']
  pull_request:
    paths: ['src/**']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build plug-in (net462, signed)
        run: dotnet build src/MGLab.Plugins -c Release
      - name: Unit tests
        run: dotnet test src/MGLab.Plugins.Tests -c Release --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        with:
          name: MGLab.Plugins
          path: src/MGLab.Plugins/bin/Release/net462/MGLab.Plugins.dll
