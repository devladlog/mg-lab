    narration: >
      Here it is in the MG Lab Demo solution, in our DEV environment: the MGLab.Plugins assembly, version 1.0.1,
      and its two steps, create and update, both switched on, sitting next to the tables they protect.

  - id: form-before
    type: screen
    heading: "Save a big request…"
    image: screens/form-before.jpg
    crop: [0, 240, 980, 340]
    highlight: [160, 168, 815, 34]
    bar: "Project Request · new record"
    narration: >
      Let's try it. A new request for a warehouse robotics pilot, budget eighty-five thousand euros,
      and someone picked Low priority.

  - id: form-after
    type: screen
    heading: "…and the plugin sets High"
    image: screens/form-after.jpg
    crop: [0, 240, 980, 340]
    highlight: [160, 168, 815, 34]
    bar: "Project Request · saved"
    short: priority
    narration: >
      We save, and the record comes back as High priority. The user didn't change it, and no form script did.
      The plugin changed the target in pre-operation, inside the same transaction, so it works the same way
      for imports, flows and API calls.

  - id: form-error
    type: screen
    heading: "Rules that block the save"
    image: screens/form-error.jpg
    crop: [0, 240, 980, 340]
    highlight: [604, 6, 358, 210]
    bar: "Project Request · Business Process Error"
    short: error
    narration: >
      Now we clear the department and set the status to Approved. Save, and the plugin blocks it with our message.
      Nothing was written. The same message comes back to an API client as an error response.

  - id: platform
    type: bullets
    heading: "Don't code what the platform does"
    bullets:
      - "First draft: 'Budget can't be negative'"
      - "Never ran: the column's minimum value is 0"
      - "Platform validation runs first"
      - "Less code, fewer tests, fewer surprises"
    short: platform
    narration: >
      A lesson from building this. Our first draft had a rule: budget can't be negative. In the real environment it
      never ran, because the currency column already has a minimum value of zero, and the platform rejects the value
      before our plugin sees it. So we deleted that rule and replaced it with the due date check. Don't write code
      for what the platform already does.

  - id: trace
    type: screen
    heading: "Plugin trace log"
    image: screens/trace-log.jpg
    crop: [0, 280, 1000, 170]
    highlight: [160, 58, 836, 50]
    bar: "Plug-in Trace Log · Execution"
    narration: >
      And when something goes wrong, turn on the plugin trace log. Every trace line we wrote is here, with the message,
      the stage, the duration, forty-six milliseconds, and any exception. Use "exception only" in production and "all" in development.

  - id: recap
    type: bullets
    heading: "Five rules"
    bullets:
      - "Low-code first, plugin when it must always run"
      - "Pre-operation to change, exceptions to block"
      - "Pure rules, thin plugin, injected clock"
      - "Unit tests in CI, no environment needed"
      - "Filtering attributes, pre-images, tracing"
    narration: >
      Five rules. Low-code first, and a plugin when the rule must always run. Use pre-operation to change data and
      exceptions to block it. Keep the rules pure, the plugin thin, and inject the clock. Run the unit tests in CI.
      And always set filtering attributes, pre-images and tracing.

  - id: outro
    type: outro
    heading: "Plugin source and tests on GitHub"
    sub: "github.com/devladlog/mg-lab"
    narration: >
