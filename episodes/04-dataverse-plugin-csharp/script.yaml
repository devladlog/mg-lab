scenes:
  - id: hook
    type: title
    heading: "A Dataverse plugin in C#"
    sub: "Real code, real environment, real tests"
    short: hook
    narration: >
      Some rules can't live in a form. They have to run no matter who saves the record: the app, an API call,
      an import or a flow. That's what Dataverse plugins are for. In this episode we write one in C#, test it
      without a Dataverse environment, register it in a real one, and watch it work. Welcome to MG Lab.

  - id: when
    type: bullets
    heading: "Do you even need a plugin?"
    bullets:
      - "Try low-code first: column rules, business rules, Power Fx"
      - "Plugin: runs inside the transaction"
      - "Same rule for apps, API, imports and flows"
      - "Can change the data before it's saved"
      - "Can block the save with a clear message"
    narration: >
      First, do you even need one? Try low-code first: column settings, business rules, Power Fx and flows.
      Reach for a plugin when the rule must run inside the database transaction, for every client, not just one form.
      A plugin can change the data before it's saved, or block the save with a clear message for the user.

  - id: pipeline
    type: bullets
    heading: "Where your code runs"
    bullets:
      - "Pre-validation (stage 10)"
      - "Pre-operation (stage 20): change the Target"
      - "Main operation: the save itself"
      - "Post-operation (stage 40): react, call others"
      - "2-minute limit per operation, aim for < 2 s"
    narration: >
      Every create or update goes through an event pipeline. Pre-validation runs first, then pre-operation, where
      you can still change the record being saved. Then the main operation, and post-operation to react to it.
      The whole operation, including every synchronous plugin, must finish within two minutes, so keep yours
      under two seconds.

  - id: rules
    type: bullets
    heading: "Our three rules"
    bullets:
      - "Due date can't be in the past"
      - "Budget ≥ €50,000 → priority High"
      - "No approval without a department"
      - "Pre-operation, synchronous, Create + Update"
    narration: >
      We'll use the Project Request table from episode three. Three rules. A due date can't be in the past.
      Any request with a budget of fifty thousand euros or more is automatically High priority.
      And a request can't be approved without a department. One plugin, registered pre-operation,
      synchronous, on create and update.

  - id: code-rules
    type: code
    heading: "Keep the rules pure"
    lang: csharp
    code: |
      public static void Apply(Entity target, Entity preImage,
                               ITracingService tracing, DateTime today)
      {
          if (target.Contains(DueDate) && target[DueDate] is DateTime due
              && due.Date < today.Date)
              throw new InvalidPluginExecutionException(
                  $"Due date can't be in the past ({due:yyyy-MM-dd}).");

          var budget = Read<Money>(target, preImage, Budget)?.Value;
          if (budget >= HighBudgetThreshold && ...)
              target[Priority] = new OptionSetValue(PriorityHigh);

          if (status == StatusApproved && department == null)
              throw new InvalidPluginExecutionException(
                  "A request needs a department before it can be approved.");
      }
    narration: >
      Keep the rules pure. This static method takes the columns being saved, the current row from the pre-image,
      a tracing service and today's date, and makes no calls to Dataverse. Today is injected so tests don't depend
      on the clock. An InvalidPluginExecutionException is the way to show a message to the user and roll back the save.

  - id: code-plugin
    type: code
    heading: "A thin plugin around it"
    lang: csharp
    code: |
      public sealed class ProjectRequestValidationPlugin : PluginBase
      {
          protected override void ExecuteCore(LocalContext local)
          {
              var target = local.Target;
              if (target?.LogicalName != "mgl_projectrequest") return;

              var preImage = local.Context.MessageName == "Update"
                  ? local.PreImage("PreImage") : null;

              ProjectRequestRules.Apply(target, preImage,
                                        local.Tracing, DateTime.UtcNow);
          }
      }
    narration: >
      The plugin itself stays thin. A small base class resolves the execution context and the tracing service,
      writes a trace line, and turns unexpected exceptions into a clear error. The plugin reads the target,
      takes the pre-image on updates, and calls the rules. That's it.

  - id: tests
    type: code
    heading: "Unit tests, no environment needed"
    lang: csharp
    short: tests
    code: |
      [Fact]
      public void Create_with_big_budget_sets_priority_high()
      {
          var target = Request(e => {
              e[Budget] = new Money(75000);
              e[Priority] = new OptionSetValue(PriorityLow); });

          Run(ctx, "Create", target);

          Assert.Equal(PriorityHigh,
              target.GetAttributeValue<OptionSetValue>(Priority).Value);
      }
      // dotnet test  ->  Passed: 9, Failed: 0  (16 ms)
    narration: >
      Now the tests. With xUnit and Moq we fake the service provider Dataverse passes in, run the real plugin,
      and assert on the target. Nine tests cover every rule, the pre-image cases, other tables, and the error wrapping.
      They run in milliseconds, on Linux too, so they belong in your CI pipeline.

  - id: register
    type: bullets
    heading: "Build and register"
    bullets:
      - "Target .NET Framework 4.6.2, sign the assembly"
      - "Assembly → plugin type → step"
      - "Update step: filtering attributes + pre-image"
      - "Register into your solution, not Default"
      - "Plugin Registration Tool, pac CLI or Web API"
    narration: >
      To deploy, the plugin project targets .NET Framework 4.6.2 and the assembly must be signed.
      Then you register three things: the assembly, the plugin type, and a step per message. On the update step,
      set filtering attributes so it only fires when those columns change, and add a pre-image with the current values.
      Register everything into your solution so it travels with your ALM pipeline.

  - id: solution
    type: screen
    heading: "Registered in the solution"
    image: screens/solution.jpg
    crop: [262, 145, 900, 215]
