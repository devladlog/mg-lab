linkedin_company:
  text: |
    Every report in this series carried its own copy of the data preparation: the same combine, the same clean-up, the same security, rebuilt in every file.

    Episode 7 of DEVLADLOG Power BI prepares the data once, on the fictional Contoso Bikes project:
    - a Dataflow Gen2 that reads the monthly exports from SharePoint, so no gateway is needed (Microsoft now calls Gen1 legacy)
    - a written contract that lists every entity, column and type, plus a check that fails before the nightly refresh does when someone renames a column
    - one shared semantic model with the measures and RLS roles, and thin reports that connect live and own no data
    - two workspaces, a REST API audit of both, and a model promoted so people can find it

    The gotcha: two refreshes, no cascade.

    Watch: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.
    #PowerBI #Dataflows #MicrosoftFabric #SemanticModel #PowerPlatform
linkedin_personal:
  text: |
    Refreshing a dataflow does not refresh the model that reads it. An import model has to be refreshed independently, so a report can sit one run behind without any error.

    That is the gotcha in this episode. The fix is ordering: schedule the model after the dataflow, or use the Power Automate trigger that fires when a dataflow refresh completes.

    The setup around it is what I would copy: prepare the data once in a dataflow, publish a contract file of columns and types, keep measures and RLS in one shared model, and let thin reports own no data.

    Episode 7: {YOUTUBE_URL}

    #PowerBI #Dataflows #MicrosoftFabric

    Narration uses an AI voice.
