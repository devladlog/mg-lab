linkedin_company:
  text: |
    The fact table has two million rows and nobody wants to wait for a refresh. So the big table stays in SQL Server, a small summary table sits in the model, and the engine decides, query by query, who answers.

    Episode 11 of DEVLADLOG Power BI builds a composite model on fictional Contoso Bikes data:
    - the sales table in DirectQuery, the dimensions in Dual mode so relationships stay regular
    - a hidden Import aggregation table at the grain of date, product and store, with each column mapped to its detail column
    - a check on SQL Server itself: clear the plan cache, run a query, and see which statements still arrive
    - a Tabular Object Model check that flags limited relationships and unhidden aggregations and predicts which measures will hit

    The gotcha: a distinct count of order numbers has no column in the aggregation, so every visual with that measure goes to SQL Server.

    Watch: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.
    #PowerBI #CompositeModels #DirectQuery #SQLServer #PowerPlatform
linkedin_personal:
  text: |
    A distinct count of order numbers looks harmless. In a composite model it is an aggregation killer.

    The aggregation table has no column for it, so every visual that includes that measure goes to SQL Server, whatever else is on it. Adding a group by order number to the aggregation would make it as big as the detail table. So it stays a miss, and the point of the episode is deciding that with open eyes.

    How I check hits and misses: clear the plan cache, run the query, and look at what SQL Server received. If the aggregation answered, nothing arrives.

    Episode 11: {YOUTUBE_URL}

    #PowerBI #CompositeModels #SQLServer

    Narration uses an AI voice.
