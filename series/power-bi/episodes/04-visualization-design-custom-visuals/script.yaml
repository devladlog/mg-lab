scenes:
  - id: hook
    type: title
    heading: "Green means good. Unless you can't see green."
    sub: "Report design you can check, plus a custom visual"
    short: hook
    narration: >
      Green for good, red for bad. For many people with red green colour blindness those two colours look almost the
      same, and Microsoft's own accessibility guide says to avoid using them together. In this episode we build an
      accessible report theme, a report page as code, and a custom visual in TypeScript, and we check all three with
      tools before anyone opens Power BI.

  - id: plan
    type: bullets
    heading: "What we're building"
    bullets:
      - "Contoso Bikes theme: colours checked for contrast and colour blindness"
      - "A report page generated from a 12-column grid spec (PBIR)"
      - "report-lint: alt text, titles, tab order, grid, model fields"
      - "Target bullet: a custom visual, actual vs target"
      - "Tested, packaged with pbiviz, imported into Desktop"
    narration: >
      Same Contoso Bikes model as episode two. First a report theme, with every colour checked. Then a report page
      generated from a grid spec, in the enhanced report format, and a linter for it. Then a custom visual, target
      bullet, written in TypeScript, unit tested, packaged with p b i viz and imported into Desktop.

  - id: theme
    type: code
    heading: "The theme: colours, sentiment, text"
    lang: json
    code: |
      {
        "name": "Contoso Bikes",
        "dataColors": ["#0B5CAD", "#CC6677", "#7A6A00", "#882255", "#6699CC", "#999933", "#332288", "#44AA99"],
        "good": "#0B5CAD",
        "neutral": "#7A6A00",
        "bad": "#B34700",
        "background": "#FFFFFF",
        "foreground": "#252423",
        "secondLevelElements": "#605E5C",
        "textClasses": {
          "callout": { "fontSize": 28, "fontFace": "Segoe UI Semibold", "color": "#252423" },
          "label": { "fontSize": 10, "fontFace": "Segoe UI", "color": "#3B3A39" }
        }
      }
    narration: >
      A report theme is a J S O N file. Data colours in the order visuals use them, sentiment colours for good, neutral
      and bad, and text classes. Good is blue and bad is a burnt orange, not green and red. Power BI validates the file
      against a published schema when you import it, and our tests validate it against the same schema first.

  - id: gotcha
    type: code
    heading: "Gotcha: the documentation's own example"
    lang: text
    code: |
      $ theme-check tests/fixtures/learn-example-theme.json        # example colours from Learn
        ERROR    TC003  good #1AAB40 vs bad #D64554 (deuteranopia): difference 5.6, needs 20
        WARNING  TC004  dataColors[1] #12239E vs [3] #6B007B (protanopia): difference 5.4, needs 10
        WARNING  TC004  dataColors[4] #E044A7 vs [5] #744EC2 (protanopia): difference 8.2, needs 10
        WARNING  TC004  dataColors[1] #12239E vs [3] #6B007B (deuteranopia): difference 8.3, needs 10
        WARNING  TC004  dataColors[2] #E66C37 vs [4] #E044A7 (tritanopia): difference 8.1, needs 10
      Custom Theme: 1 error(s), 4 warning(s)

      $ theme-check src/themes/ContosoBikes.json
      Contoso Bikes: 0 error(s), 0 warning(s)
    short: gotcha
    narration: >
      Here's the gotcha. The theme documentation's example uses green for good and red for bad. Theme check simulates
      colour vision deficiency and measures the difference between colours. With normal vision that pair is seventy
      four apart. Simulated deuteranopia: five point six. Practically the same colour. Our theme passes, and text
      contrast is checked against the four and a half to one the accessibility checklist asks for.

  - id: grid
    type: code
    heading: "The layout is code: a 12-column grid"
    lang: python
    code: |
      PAGE_W, PAGE_H, MARGIN, GUTTER, COLS = 1280, 720, 24, 16, 12
      COL_W = (PAGE_W - 2 * MARGIN - (COLS - 1) * GUTTER) // COLS          # 88

      def cell(col, span, y, height):
          return {"x": MARGIN + col * (COL_W + GUTTER), "y": y,
                  "width": span * (COL_W + GUTTER) - GUTTER, "height": height}

      ("kpiSales", "card", cell(0, 3, ROW1, 112), "Sales amount",
       "Total sales amount for the selected years.",
       {"Values": [("Sales", "Sales Amount", "m")]}, None),
      ("trendSales", "lineChart", cell(0, 8, ROW2, 264), "Sales amount and prior year by month",
       "Monthly sales amount compared with the same month of the prior year.",
       {"Category": [("Date", "Year Month", "c")], "Y": [("Sales", "Sales Amount", "m"), ...]}, ...),
    narration: >
      The report page is generated. Twelve columns, sixteen pixel gutters, twenty four pixel margins, everything on an
      eight pixel grid. Each visual is one line: type, grid cell, title, alt text and fields. Change a span, regenerate,
      and the whole page stays aligned.

  - id: visualjson
    type: code
    heading: "One visual in PBIR"
    lang: json
    code: |
      {
        "$schema": ".../report/definition/visualContainer/2.4.0/schema.json",
        "name": "kpiSales",
        "position": { "x": 24, "y": 24, "width": 296, "height": 112, "z": 0, "tabOrder": 0 },
        "visual": {
          "visualType": "card",
          "query": { "queryState": { "Values": { "projections": [ { "field": { "Measure": {
            "Expression": { "SourceRef": { "Entity": "Sales" } }, "Property": "Sales Amount" } },
            "queryRef": "Sales.Sales Amount", "nativeQueryRef": "Sales Amount" } ] } } },
          "visualContainerObjects": {
            "title":   [ { "properties": { "text": { "expr": { "Literal": { "Value": "'Sales amount'" } } } } } ],
            "general": [ { "properties": { "altText": { "expr": { "Literal": {
              "Value": "'Total sales amount for the selected years.'" } } } } } ]
          }
        }
      }
    narration: >
      This is what lands on disk: the enhanced report format, one file per visual, each with a public schema. Position
      and tab order, the query against the model, the title, and the alt text a screen reader reads out. Every file is
      validated against Microsoft's schemas in the tests.

