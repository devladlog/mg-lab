    narration: >
      One more page from the same generator, on a twenty four pixel grid: a headline, year tiles, four cards, target
      bullet as the hero, the monthly trend against last year, and the top products. Now import a second theme,
      Contoso Night Ride, by typing its path in the file name box. The whole page goes dark, and not one visual was
      edited. Theme check measured every text and data colour at four and a half to one or better on that background.

  - id: recap
    type: bullets
    heading: "Five rules for report design"
    bullets:
      - "Theme colours only; check contrast and colour blindness"
      - "Never encode meaning in colour alone"
      - "Alt text, titles and tab order on every data visual"
      - "Layout from a grid, lint the PBIR files"
      - "Custom visuals: pure logic, rendering events, high contrast"
    narration: >
      Five rules. Use theme colours, and check them for contrast and colour blindness. Never encode meaning in colour
      alone. Alt text, titles and tab order on every data visual. Generate the layout from a grid and lint the report
      files. And for custom visuals: pure, tested logic, rendering events, and high contrast support.

