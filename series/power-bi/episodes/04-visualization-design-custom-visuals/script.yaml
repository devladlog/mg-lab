    bar: "Power BI Desktop · Report view · Sales overview"
    demo: "Report view, page 'Sales overview', Year slicer = 2025. Three cards across the top (Sales amount 967,472.88, Sales growth vs prior year 8.1%, Orders 1,268) and the Year slicer at the right; line chart Sales amount and prior year by month; bar chart Sales amount by category; products table bottom left; empty space bottom right (for the custom visual). Contoso Bikes theme applied (blue first series). Optionally show View > Selection > Tab order."
    narration: >
      Open the project in Desktop and there it is. Cards across the top, the trend and the categories in the middle,
