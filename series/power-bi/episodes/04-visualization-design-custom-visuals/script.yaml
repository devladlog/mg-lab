    demo: "Report view with the Target Bullet in the free bottom-right cell, Category = Product[Category], Actual = Sales Amount, Target = Sales PY, Year slicer = 2025. Rows: Accessories marker up +8.4%, Bikes marker up +9.0%, Clothing circle -3.0% (on target at 5% tolerance). Format pane open on Bands showing On-target tolerance (%) = 5. Then set tolerance to 2: Clothing turns down marker -3.0%."
    narration: >
      In Desktop, import the packaged visual from a file. Category, sales amount as
      actual, prior year sales as target. Bikes up nine percent, accessories up eight point four, clothing down three,
      which counts as on target at five percent tolerance. Tighten it to two percent and clothing turns into a down
      triangle.

  - id: hcscreen
    type: screen
    heading: "Same visual, Windows high contrast"
    image: screens/viz-high-contrast.jpg
    video: screens/viz-high-contrast.mp4
    bar: "Power BI Desktop · Windows high contrast"
    demo: "Windows contrast theme on (Settings > Accessibility > Contrast themes, e.g. Night sky). Desktop applies it automatically. Target Bullet shows outlined bars in the theme foreground colour on the background, markers and percentages still visible. Core visuals next to it also in high contrast."
    short: highcontrast
    narration: >
      And the same report with a Windows contrast theme. Power BI Desktop picks it up automatically, and target bullet
      follows: outlined bars, one foreground colour, and the markers and percentages still tell you which category is
      above or below target. Nothing depends on colour alone.

  - id: denebscreen
    type: screen
    heading: "No build step: the same chart in Deneb"
    image: screens/viz-deneb.jpg
    video: screens/viz-deneb.mp4
    video_compact: true
    video_full: true
    crop: [0, 36, 1906, 988]   # title bar (signed-in account) cropped out
    bar: "Power BI Desktop · Deneb (Vega-Lite) · Sales vs prior year by category"
    demo: "Deneb 2.0.0 imported from file (standalone .pbiviz from the GitHub release, no sign-in). New page 'Deneb', Year slicer = 2025. Values: Product[Category], Sales Amount, Sales PY. ... > Edit > Create new specification > [empty] > Vega-Lite > Create; paste src/deneb/target-bullet.vl.json into Specification, Ctrl+Enter. Rows: Bikes and Accessories with up triangles +9.0% / +8.4%, Clothing circle -3.0%, a dark tick at the prior year on each bar. Back to report. Optional: hover a bar (the spec sets tooltip on the bars; keep it only if Deneb shows one)."
    narration: >
      Not every chart needs a packaged visual. Deneb, a free and open source custom visual, draws a Vega Lite spec you
      paste into the report. Same three fields, same bands and markers, J S O N instead of TypeScript, nothing to
      compile. The catch: Desktop won't test the spec for you, so the repo keeps a copy, and Vega Lite's own compiler
      checks it.

