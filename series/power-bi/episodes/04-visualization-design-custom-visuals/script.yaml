    video: screens/viz-target-bullet.mp4
    video_compact: true
    video_full: true
    crop: [0, 36, 1906, 990]   # title bar (account) and the taskbar cropped out
    video_cuts: [[16.5, 32.0]]   # file dialog (shows the Windows user folder)
