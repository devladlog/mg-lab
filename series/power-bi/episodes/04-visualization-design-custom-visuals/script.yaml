  - id: lint
    type: code
    heading: "report-lint on a messy page"
    lang: text
    code: |
      $ report-lint tests/fixtures/messy-report --model .../definition --max-visuals 2
        WARNING  RL009  messy: 3 visuals on the page (team limit 2)
        ERROR    RL001  messy/chart1: outside the 1280x720 page: x=1100 y=500 w=300 h=300
        ERROR    RL004  messy/chart1: lineChart has no alt text
        WARNING  RL006  messy/chart1: lineChart has no title text
        WARNING  RL008  messy/chart2: hard-coded colour(s) '#FF0000': use theme colours
        ERROR    RL010  messy/chart2: 'Sales'[Revenue] isn't in the semantic model
        ERROR    RL005  messy/chart3: alt text is 303 characters (max 250)
        WARNING  RL002  messy/chart2: overlaps chart3
        WARNING  RL007  messy: tab order isn't the reading order: chart2 > chart3 > chart1
        (+ 2 x RL003 not on the 8 px grid)
      4 error(s), 7 warning(s)

      $ report-lint src/ContosoSales.Report --model ...   ->   0 error(s), 0 warning(s)
    narration: >
      Report lint turns the accessibility checklist into rules. A messy page that's perfectly valid for the schema:
      a chart off the page, no alt text, alt text over the two hundred fifty character limit, a hard coded red instead
      of a theme colour, a measure that doesn't exist, and a tab order that jumps around. Our page: zero findings.

  - id: logic
    type: code
    heading: "Target bullet: the logic is pure TypeScript"
    lang: typescript
    code: |
      export function classify(actual: number | null, target: number | null, tolerance: number) {
          if (actual === null) return { variance: null, band: "noActual" };
          if (target === null || target === 0) return { variance: null, band: "noTarget" };
          const variance = (actual - target) / Math.abs(target);
          const band: Band = variance > tolerance ? "above" : variance < -tolerance ? "below" : "near";
          return { variance, band };
      }

      export function marker(band: Band): string {
          switch (band) {
              case "above": return "▲"; // up triangle
              case "below": return "▼"; // down triangle
              case "near": return "●";  // circle
              default: return "–";
          }
      }
    narration: >
      Now the custom visual. Three data roles: category, actual and target. The logic is pure TypeScript with no Power
      BI imports, so it runs in plain node tests. No actual is not minus one hundred percent, remember episode two. And
      every band gets a marker, a triangle or a circle, so colour is never the only cue.

  - id: render
    type: code
    heading: "update(): rendering events, no innerHTML"
    lang: typescript
    code: |
      public update(options: VisualUpdateOptions): void {
          this.events.renderingStarted(options);
          try {
              const items = buildItems(readCategorical(options.dataViews?.[0]), tolerance);
              const tree = renderBullets(items, options.viewport.width, options.viewport.height, this.palette(), ...);
              this.root.replaceChildren(toDom(tree));
              this.events.renderingFinished(options);
          } catch (error) {
              this.events.renderingFailed(options, String(error));
              throw error;
          }
      }
      // toDom: createElementNS + setAttribute + textContent. Never innerHTML.
    narration: >
      The update method follows the certification rules from Microsoft's documentation: rendering started first,
      finished or failed at the end, so export to P D F waits for the visual. The view is built as a plain tree and
      turned into S V G with create element and text content, never inner H T M L.

  - id: highcontrast
    type: code
    heading: "High contrast: foreground and background only"
    lang: typescript
    code: |
      private palette(): Palette {
          const cp = this.host.colorPalette as ISandboxExtendedColorPalette;
          if (cp.isHighContrast) {
              const fg = cp.foreground.value;
              const bg = cp.background.value;
              return { isHighContrast: true, foreground: fg, background: bg, above: fg, near: fg, below: fg, track: bg };
          }
          ...
      }

      test("high contrast: only foreground and background, outlined bars at least 2 px", ...)
    narration: >
      Windows high contrast. When the host says high contrast is on, the visual uses only the foreground and
      background colours it's given, and draws bars as outlines at least two pixels thick, as Microsoft's guidance for
      custom visuals describes. A unit test checks that no other colour appears.

  - id: package
    type: code
    heading: "Tested and packaged"
    lang: text
    code: |
      $ npm test
      # tests 16
      # pass 16

      $ npx pbiviz package --certification-audit
       info   powerbi-visuals-tools version - 7.2.1
       info   Running lint check...
       info   External requests audit:
       info   No external requests found in the visual.
       info   Package created!
       done   Build completed successfully

      dist/contosoTargetBullet7C1E2A9B4D5F4E0A8B3C6D2E1F0A9B8C.1.0.0.0.pbiviz   (6 KB)
    narration: >
      Sixteen tests pass. P b i viz package lints the code and builds a six kilobyte p b i viz file, and the
      certification audit finds no external requests. No fetch, no eval, no web access in the capabilities.

