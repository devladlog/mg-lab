linkedin_company:
  text: |
    Green for good, red for bad. For many people with red-green colour blindness those two colours look almost the same, and Microsoft's own accessibility guide says to avoid using them together.

    Episode 4 of DEVLADLOG Power BI builds five things and checks each with tools before anyone opens Power BI:
    - an accessible report theme, with good as blue and bad as burnt orange, validated against the published JSON schema
    - a report page generated from a 12-column grid spec in the enhanced report format (PBIR), with report-lint for alt text, tab order and hard-coded colours
    - a custom visual in TypeScript, target bullet, with 16 tests and high contrast support, packaged with pbiviz and imported into Desktop from a file
    - the same chart as a Deneb Vega-Lite spec, with no build step, checked by Vega-Lite's own compiler
    - Contoso Night Ride, a dark theme that restyles a generated showcase page

    In Desktop the generated page shows 2025 sales of 967K, up 8.1%. Target bullet compares 2025 with prior year: Bikes +9.0%, Accessories +8.4%, Clothing -3.0%, which is on target at 5% tolerance and turns into a down marker at 2%.

    The gotcha: the theme documentation's own example uses green and red. Our checker simulates deuteranopia and measures the real difference.

    Watch: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.
    #PowerBI #Accessibility #DataVisualization #TypeScript #PowerPlatform
linkedin_personal:
  text: |
    Microsoft's theme documentation uses green for good and red for bad in its example. Microsoft's accessibility guide says not to use those two together.

    I put numbers on it. My theme check simulates colour vision deficiency: with normal vision the pair is 74 apart, with simulated deuteranopia 5.6. Practically the same colour. So good is blue and bad is a burnt orange in the theme, and text contrast is checked against 4.5 to 1.

    The wider lesson in this episode: turn the accessibility checklist into lint rules, and never let colour be the only cue. The custom visual adds a triangle or circle marker to every band: Clothing at -3.0% shows a circle at 5% tolerance and a down triangle at 2%.

    Episode 4: {YOUTUBE_URL}

    #PowerBI #Accessibility

    Narration uses an AI voice.
