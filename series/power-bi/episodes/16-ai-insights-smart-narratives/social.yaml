linkedin_company:
  text: |
    Power BI has four visuals that promise to find the story for you. Before we believe any of them, we check the answer with a few lines of plain Python.

    Episode 16 of DEVLADLOG Power BI asks a simple question on the fictional Contoso Bikes model: why do some orders get a low rating? The rating is simulated, the code says so, and the effect is planted on purpose, so we know what the visual should find.
    - a readiness check built from the limits on Microsoft Learn: at least 100 observations of the state you analyse, a warning above ten unique values, four points for anomaly detection
    - key influencers compared with a rate-inside over rate-outside reference
    - the decomposition tree and anomaly detection
    - a smart narrative in Custom mode, with the sentences written as measures

    The gotcha: Copilot needs a paid capacity, and trial capacities are not supported.

    Watch: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.
    #PowerBI #KeyInfluencers #AnomalyDetection #SmartNarrative #PowerPlatform
linkedin_personal:
  text: |
    AI visuals in Power BI fail quietly, so I check them against something I can read.

    In this episode the lab simulates a survey rating, plants an effect (slow delivery, online orders), and a short Python script computes the comparison Microsoft Learn describes for key influencers: the rate of low ratings inside a value divided by the rate in all the other values. I check direction and order, not exact numbers, because Power BI fits a logistic regression and can disagree on thin groups.

    One more thing worth repeating: an influencer is a pattern in the data, not a cause.

    Episode 16: {YOUTUBE_URL}

    #PowerBI #KeyInfluencers

    Narration uses an AI voice.
