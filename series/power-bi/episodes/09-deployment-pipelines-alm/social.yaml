linkedin_company:
  text: |
    One workspace, and every change goes straight to the people reading the report. Episode 9 of DEVLADLOG Power BI adds Development, Test and Production with deployment pipelines: same model, different data, no copying files by hand.

    On the fictional Contoso Bikes project we cover:
    - stage-specific values turned into Text parameters, because a parameter rule only works with text parameters
    - deployment rules per stage (they cannot be created on Development, and apply at the next deployment)
    - Selective Deploy and Deploy All through the REST API, polled until the operation succeeds, with a what-if switch that prints every request and sends nothing
    - a checker that reads the TMDL files and the stage file in a GitHub workflow on every pull request, without a secret

    The honest part: a deployment copies the model and report, not the data, refresh schedule or credentials. And a model that uses a Dataflow Gen2 CI/CD item as its source cannot be deployed by a pipeline.

    Watch: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.
    #PowerBI #DeploymentPipelines #ALM #PowerShell #MicrosoftFabric
linkedin_personal:
  text: |
    In episode 7 I built the model on a Dataflow Gen2. In episode 9 I had to undo that.

    Microsoft Learn says a semantic model that uses a Dataflow Gen2 (CI/CD) item as its source cannot be deployed by a deployment pipeline. So this episode's model reads files from SharePoint instead, and the video says so openly.

    Two more things a pipeline will not do for you: a deployment copies metadata, not data, refresh schedule or credentials, so the Test model is empty until it is refreshed with its own credentials. And rules only work with Text parameters.

    Some of these mistakes can be caught in a pull request, with no tenant.

    Episode 9: {YOUTUBE_URL}

    #PowerBI #DeploymentPipelines #ALM

    Narration uses an AI voice.
