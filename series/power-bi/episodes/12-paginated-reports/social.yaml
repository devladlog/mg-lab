linkedin_company:
  text: |
    Power BI reports are made for screens. Some documents have to print exactly as designed: a header on every page, a page number in the corner, one store per sheet.

    Episode 12 of DEVLADLOG Power BI builds a monthly statement per store with a paginated report, on fictional Contoso Bikes data:
    - an RDL file whose data source is the published semantic model, addressed by workspace and model name, with no credentials in the file
    - one DAX query with a year parameter, so the measures stay defined in the model
    - a table grouped by store with a page break between groups and headers that repeat
    - a PowerShell module that uploads the file and exports a PDF through the REST API
    - a verify script that reads each PDF page and compares the figures with numbers computed from the source files

    The gotcha: a body wider than the page minus both margins gives a blank page after every page. A lint applies Learn's formula before upload.

    Watch: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.
    #PowerBI #PaginatedReports #RDL #PowerShell #PowerPlatform
linkedin_personal:
  text: |
    A paginated report that exports to PDF with a blank page after every page is almost always a width problem. If the body is wider than the page minus both margins, the renderer spills over.

    In this episode the page is A4: 8.27 inches wide with 0.75 inch margins, so 6.77 usable. The body is 6.5 inches. That is not a detail, it decides whether the PDF has blank pages. Learn gives the formula, and a lint applies it before upload.

    The second habit: a file that downloads is not a file that is right, so a script reads the PDF and checks every figure against numbers from the source files.

    Episode 12: {YOUTUBE_URL}

    #PowerBI #PaginatedReports

    Narration uses an AI voice.
