linkedin_company:
  text: |
    Publishing from Power BI Desktop takes ten seconds. The surprises come later: a dashboard that never updates, tiles that point to a deleted report, store managers who see every store.

    Episode 6 of DEVLADLOG Power BI covers the part after Publish, on the fictional Contoso Bikes project:
    - a preflight check of the project folder before publishing, which warns when local CSV sources will need a gateway to refresh
    - what a dashboard really is: one page, built only in the service, no file for git, and alerts only on refreshed data
    - a read-only REST API audit of reports, models, dashboards and tiles, and a tile-by-tile dashboard copy
    - a workspace app for the store managers, where row-level security applies to app users

    The gotcha: published is not refreshed.

    Watch: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.
    #PowerBI #PowerShell #RESTAPI #DataGovernance #PowerPlatform
linkedin_personal:
  text: |
    A dashboard can look perfect today and look exactly the same next month. That is the gotcha in this episode.

    Publish uploaded the data once. My model reads CSV files from a local folder, so the service cannot refresh it without an on-premises data gateway, and Microsoft is clear that data alerts only fire on refreshed data. A small preflight script read the project folder and warned me before I published.

    The habit I am keeping: check the project before Publish, not after. And give consumers the app, creators the workspace.

    Episode 6: {YOUTUBE_URL}

    #PowerBI #PowerPlatform

    Narration uses an AI voice.
