series: "DEVLADLOG Power BI"
status: draft-hold-for-review
ai_label: true
youtube_url: "{YOUTUBE_URL}"
linkedin_company:
  text: |
    Your row-level security works. You test it as a role. Then someone adds a store manager to the workspace as a Contributor, and from that moment they see every store. Row-level security only applies to viewers.

    Episode 5 of DEVLADLOG Power BI builds one dynamic role for every store manager on the fictional Contoso Bikes model:
    - a hidden mapping table of aliases, with the domain appended from a parameter so no real tenant name sits in the repo
    - one role that filters the store dimension and returns nothing for an unmapped user
    - rls-lint, 12 rules on the TMDL files, each tied to a Microsoft Learn page
    - a Python reference that computes what every user should see, and a PowerShell test that asks the service the same question as each user through the Execute Queries API

    Watch: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.
    #PowerBI #RowLevelSecurity #DAX #PowerShell #PowerPlatform
linkedin_personal:
  text: |
    A store filter does not hide everything. Filters flow from the one side to the many side, so my store-manager role reached the sales table but not the customers. Every manager could still scroll through all 301 customer names.

    The documented fix is "apply security filter in both directions" on that one relationship. Microsoft warns it can cost performance, so I use it once, on purpose.

    The other lesson from this episode: testing "view as role" by hand does not scale. I wrote a Python reference of what each user should see, and a script that asks the service the same question per user. Then a role change turns a test red.

    Episode 5: {YOUTUBE_URL}

    #PowerBI #RowLevelSecurity #DAX

    Narration uses an AI voice.
facebook:
  text: |
    Row-level security in Power BI has a catch that surprises a lot of people: it only applies to viewers. Admins, members and contributors can edit the model, so they see everything. This episode builds one dynamic role for every store manager, lints the role files and tests the result user by user. Fictional Contoso Bikes data.

    Watch: {YOUTUBE_URL}

    #PowerBI #RowLevelSecurity #DAX

    Narration uses an AI voice.
