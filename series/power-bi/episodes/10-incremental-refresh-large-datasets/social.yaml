linkedin_company:
  text: |
    Reloading two million rows every night to pick up ten days of changes is a waste. Incremental refresh keeps the old years as they are and reloads only the recent days.

    Episode 10 of DEVLADLOG Power BI builds it on a fictional Contoso Bikes order table in a free Azure SQL database:
    - the reserved RangeStart and RangeEnd parameters (case sensitive, DateTime), with a filter that uses greater-or-equal on one side and strictly less on the other so a boundary row lands in exactly one partition
    - a policy in TMDL: keep three years, refresh ten days, detect data changes on a modified date
    - a partition calculator that reproduces the worked example on Microsoft Learn
    - an enhanced refresh REST call for a single partition, and a lint with eleven kinds of finding

    The gotcha: publish the same model from Desktop a second time and it removes the partitions and the data.

    Watch: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.
    #PowerBI #IncrementalRefresh #AzureSQL #PowerShell #PowerPlatform
linkedin_personal:
  text: |
    The nastiest incremental refresh detail is not in the setup. It is what happens after.

    Microsoft Learn: once you have published a model with a refresh policy, publishing the same model from Desktop again removes the partitions and the data, and you cannot download the file back. Later schema changes go through a metadata-only deployment, ALM Toolkit for example.

    Two smaller ones from the episode. The service decides the current day in UTC unless you configure a time zone. And the filter must use >= on one side and < on the other, or a boundary row is loaded twice or never.

    Episode 10: {YOUTUBE_URL}

    #PowerBI #IncrementalRefresh

    Narration uses an AI voice.
