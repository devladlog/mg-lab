linkedin_company:
  text: |
    Your year-over-year measure says next year is down 100%. Your "top customers" count says everyone is a top customer. Both formulas look right.

    Episode 2 of DEVLADLOG Power BI covers the DAX that people get wrong, on the fictional Contoso Bikes model from episode 1:
    - time intelligence on the marked date table, with variables and DIVIDE
    - context transition: 247 customers over 1,000 in sales in 2025 with a measure, 300 without it
    - ranking inside a category with RANKX, and share of category with ALLEXCEPT
    - the minus 100% gotcha, and the guard that fixes it

    We also build a Python reference that computes what each saved query should return, plus dax-lint on the Tabular Object Model. In DAX query view, Desktop confirms the reference to the cent: 2025 year to date ends at 967,472.88.

    Watch: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.
    #PowerBI #DAX #TimeIntelligence #SemanticModel #PowerPlatform
linkedin_personal:
  text: |
    A growth measure showing minus 100% for 2026 looks like a bug in the formula. It is not. It is blank behaving like zero.

    My date table runs to the end of 2026 because orders at year end ship in January. So 2026 has a prior year but no sales. Blank minus last year, divided by last year, gives minus one. The fix is one guard: if there are no current sales, return blank, not zero.

    In this episode I also show context transition, where the same formula shape returns 247 or 300 customers for 2025 depending on whether a measure sits in the row context.

    Episode 2: {YOUTUBE_URL}

    #PowerBI #DAX

    Narration uses an AI voice.
