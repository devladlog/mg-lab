linkedin_company:
  text: |
    Everyone has a theory about why the report is slow. Bidirectional filters. The big table. That one measure.

    Episode 8 of DEVLADLOG Power BI measures first, then changes one thing at a time, on a generated, fictional export of two million Contoso Bikes order lines:
    - a DAX query that lists column dictionary sizes; before tuning the top four were Line Ref 62.3 MB, Order Timestamp 40.1 MB, Order Number 26.8 MB and Note 10.3 MB
    - a lint on the TMDL and report files where every rule comes from a Microsoft Learn recommendation
    - data reduction in Power Query: columns from 13 to 9, bits per row down by more than 40 percent, identical totals
    - three measures rewritten with DIVIDE, variables and Boolean filters, and the order-lines table (352 ms) moved off the executive page
    - Performance Analyzer before and after, compared by a script that fails if a visual got slower
    - DAX Studio Server Timings and VertiPaq Analyzer on both models

    Result on the warm run: 871 ms to 502 ms in total, 1.7x, and every visual measured in both is faster. The cards are identical in both reports: 2.85 billion in sales, 40.0% margin.

    The gotcha: a faster rewrite can change the answer.

    Watch: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.
    #PowerBI #DAX #PerformanceTuning #PowerQuery #PowerPlatform
linkedin_personal:
  text: |
    One of my "performance fixes" in this episode was faster and wrong.

    Replacing a FILTER over the whole Store table with a Boolean filter looks like a pure optimisation. But a filter over the table replaces the filter on Store, while KEEPFILTERS keeps it. The grand total agreed. The store rows did not.

    So before replacing a measure, I compare results under filters, not just the total. And I do not remove a bidirectional filter blindly: in this model it exists for row-level security.

    The page did get faster: 871 ms to 502 ms on the warm Performance Analyzer run, with identical cards. Measure first, change one thing, measure again.

    Episode 8: {YOUTUBE_URL}

    #PowerBI #DAX #PerformanceTuning

    Narration uses an AI voice.
