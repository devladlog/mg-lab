scenes:
  - id: hook
    type: title
    heading: "One big table is not a model"
    sub: "Build a star schema in Power BI, and test it"
    short: hook
    narration: >
      Most Power BI reports start with one big export: every order line repeats the customer, the product and the store.
      It works, until totals go blank, slicers lie and the file gets huge. In this episode we turn that export into a
      star schema, write the model as text, and add a linter that fails the build when someone breaks it.

  - id: why
    type: bullets
    heading: "Why a star schema?"
    bullets:
      - "Dimension tables filter and group"
      - "Fact tables summarize"
      - "Relationships decide which is which"
      - "One-to-many: the one side is the dimension"
      - "Each fact table keeps one consistent grain"
    narration: >
      Microsoft's guidance is simple. Dimension tables filter and group, fact tables summarize. There's no table
      property for that: the relationships decide it. In a one-to-many relationship, the one side is always the
      dimension and the many side is the fact. And a fact table should always load data at one consistent grain.

  - id: export
    type: code
    heading: "The starting point: one big table"
    lang: text
    code: |
      sales_export.csv   4,071 rows x 19 columns

      OrderNumber  LineNumber  OrderDate   ShipDate
      CustomerCode CustomerName CustomerCity CustomerCountry
      StoreName    StoreCountry Channel
      ProductCode  ProductName  Subcategory  Category  Color
      Quantity     UnitPrice    UnitCost

      SO000001, 1, 2024-01-01, ..., Remy Draft 090, Madrid, ..., U-Lock, Locks, ...
      SO000001, 2, 2024-01-01, ..., Remy Draft 090, Madrid, ..., Jersey Classic, ...
    narration: >
      Here's our starting point, fictional Contoso Bikes data. Four thousand and seventy one order lines, nineteen
      columns. The customer's name and city, the product, its subcategory and category, all repeated on every line.
      And three percent of the orders are guest checkouts, with no customer at all.

  - id: build
    type: code
    heading: "Split it: surrogate keys and an unknown member"
    lang: python
    code: |
      def build_dim(rows, business_key, attrs, start_key=1):
          """One surrogate key per distinct business key, sorted so keys are stable."""
          ...

      products, prod_key = build_dim(rows, "ProductCode", [
          ("Product", "ProductName"), ("Subcategory", "Subcategory"),
          ("Category", "Category"), ("Color", "Color")])      # flattened: no snowflake

      customers.insert(0, {"key": -1, "Customer": "Unknown customer", ...})

      fact.append({"OrderNumber": r["OrderNumber"],            # degenerate dimension
                   "CustomerKey": cust_key.get(r["CustomerCode"], -1),
                   "ProductKey": prod_key[r["ProductCode"]], ...})
    narration: >
      A small Python script does the split. Each dimension gets a surrogate key. Category and subcategory are flattened
      into the product dimension, so there's no snowflake. Guest orders point to an explicit unknown customer with key
      minus one. And the order number stays on the fact table as a degenerate dimension.

  - id: pytest
    type: code
    heading: "Tests before Power BI ever opens"
    lang: text
    code: |
      $ python3 -m pytest tests -v
      test_fact_grain_is_one_row_per_order_line PASSED
      test_totals_reconcile_with_the_export PASSED
      test_every_foreign_key_finds_its_dimension_row[CustomerKey-...] PASSED
      test_every_foreign_key_finds_its_dimension_row[ShipDate-...] PASSED
      test_guest_orders_point_to_the_unknown_customer PASSED
      test_date_table_is_contiguous_unique_and_spans_full_years PASSED
      test_date_table_covers_ship_dates_that_spill_into_the_next_year PASSED
      test_file_matches_published_schema[ContosoSales.pbip-...] PASSED
      ...
      ============ 31 passed in 0.30s ============
    narration: >
      Then the tests. One row per order line. Totals reconcile with the export to the cent. Every foreign key finds its
      dimension row. The date table has no gaps and spans full years. And the Power BI project files validate against
      Microsoft's published JSON schemas. Thirty one tests, in a third of a second.

  - id: date
    type: code
    heading: "A real date table, in TMDL"
    lang: text
    code: |
      table Date
          dataCategory: Time

          column Date
              dataType: dateTime
              isKey

          column Month
              dataType: string
              sortByColumn: 'Month Number'

          hierarchy Calendar
              level Year ...  level Quarter ...  level Month ...  level Date
    narration: >
      The model itself is written in TMDL, the text format of Power BI projects. The date table is marked: data category
      Time and a unique date key. Month sorts by month number, so January comes before April. The date table also has to
      cover the ship dates, and an order on the thirty first of December ships in January. So it runs to the end of
      twenty twenty six.

  - id: relationships
    type: code
    heading: "Relationships: many-to-one, single direction"
    lang: text
    code: |
      relationship 'Sales Order Date to Date'
          fromColumn: Sales.'Order Date'
          toColumn: Date.Date

      relationship 'Sales Ship Date to Date'
          isActive: false
          fromColumn: Sales.'Ship Date'
          toColumn: Date.Date

      relationship 'Sales to Product'
          fromColumn: Sales.ProductKey
          toColumn: Product.ProductKey
    narration: >
      Every relationship goes from the fact to a dimension, many to one, filtering in a single direction. The ship date
      is a role-playing dimension: a second relationship to the same date table, inactive. A measure turns it on with
      USE RELATIONSHIP when someone needs sales by ship date. That's for the next episode.

  - id: measures
    type: code
    heading: "Hide the columns, ship the measures"
    lang: text
    code: |
      measure 'Sales Amount' = SUMX(Sales, Sales[Quantity] * Sales[Unit Price])
          formatString: #,0.00
      measure 'Margin %' = DIVIDE([Margin], [Sales Amount])
          formatString: 0.0%

      column ProductKey
          dataType: int64
          isHidden
          summarizeBy: none

      column 'Unit Price'
          dataType: decimal
          isHidden
    narration: >
      Keys and raw numbers are hidden. Report authors get measures with format strings: sales amount, margin, margin
      percent with DIVIDE, units and orders. Implicit measures are discouraged at model level, so nobody drags a unit
      price column and sums it.

  - id: modelview
    type: screen
    heading: "The star in Model view"
    image: screens/model-view.jpg
    video: screens/model-view.mp4
    video_compact: true
    video_full: true
    crop: [0, 36, 1906, 1036]   # title bar (signed-in account) cropped out
    bar: "Power BI Desktop · ContosoSales.pbip · Model view"
    demo: "Model view of ContosoSales.pbip after refresh: Sales in the centre, Date, Customer, Product, Store around it. Four solid one-to-many single-arrow lines, one dashed line Sales Ship Date to Date. Hover the dashed line so both columns highlight."
    narration: >
      The project is open and refreshed in Power BI Desktop. Here's the star: Sales in the middle, four dimensions around it,
      single arrows pointing at the fact table. The dashed line is the inactive ship date relationship.

  - id: lint
    type: code
    heading: "star-lint: the model reviews itself"
    lang: text
    code: |
      $ star-lint ContosoSales.SemanticModel/definition --data data/star
        fact tables      : Sales
        dimension tables : Customer, Date, Product, Store
        relationships    : 4 active, 1 inactive

        PASS SS001  every relationship is many-to-one (fact to dimension)
        PASS SS002  relationships filter in a single direction
        PASS SS003  no snowflake chains (a dimension never filters through
                    another dimension)
        PASS SS006  a marked date table exists (dataCategory Time + date key column)
        PASS SS009  every sourceColumn exists in the CSV the partition reads
        ...
      0 error(s), 0 warning(s)
    narration: >
      Because the model is text, we can test it. Star lint is a small dot net tool on the Tabular Object Model. It loads
      the TMDL folder, works out which tables are facts and dimensions from the relationships, and checks nine rules.
      It even compares every source column with the CSV header.

  - id: snowflake
    type: code
    heading: "Break the rules, fail the build"
    lang: text
    code: |
      $ star-lint tests/fixtures/snowflake-model/definition --data tests/fixtures/data
        ERROR   SS001  Budget[CategoryKey] -> Category[CategoryKey] is Many-to-Many
        ERROR   SS006  no marked date table
        ERROR   SS009  Sales[Amount] has sourceColumn 'SalesAmount', not found in fact_sales.csv
        WARNING SS002  Sales[CustomerKey] -> Customer[CustomerKey] filters in both directions
        WARNING SS003  snowflake: dimension Product filters through Subcategory
        WARNING SS004  Sales[ProductKey] is a foreign key and should be hidden
        WARNING SS007  measure [Total] has no format string

      3 error(s), 7 warning(s)          exit code 1
    short: lint
    narration: >
      Now a model built the old way. A snowflake from product to subcategory to category. A bi-directional relationship.
      A many-to-many. Visible keys, no date table, and a typo in a source column. Star lint lists every one and exits
      with code one, so a pull request pipeline stops it before anyone opens Desktop.

  - id: datapane
    type: screen
    heading: "What report authors see"
    image: screens/data-pane.jpg
    video: screens/data-pane.mp4
    video_compact: true
    video_rate: 1.5
    video_full: true
    crop: [0, 36, 1906, 1036]   # title bar (signed-in account) cropped out
    bar: "Power BI Desktop · Report view · Data pane"
    demo: "Report view, Data pane fully expanded: Sales shows only Order Number and the measures in display folders Sales and Margin (no keys, no Unit Price). Product shows the Product Hierarchy Category > Subcategory > Product. Date shows the Calendar hierarchy."
    narration: >
      This is what report authors see. No keys, no unit price to sum by mistake. Measures in display folders, a product
      hierarchy from category down to product in one table, and a calendar hierarchy on the date table.

  - id: report
    type: screen
    heading: "Same numbers as the CSV files"
    image: screens/report.jpg
    video: screens/report.mp4
    video_compact: true
    video_rate: 1.5
    video_full: true
    crop: [0, 36, 1906, 1036]   # title bar (signed-in account) cropped out
    video_cuts: [[96.6, 174.0]]   # format-pane detour (the pane opens at 96.67 s), seconds of the original take
    bar: "Power BI Desktop · Report view · Overview page"
    demo: "Matrix visual: rows Product[Category], columns Date[Year], values Sales Amount and Margin %. Expected: 2024 total 894,929.10, 2025 total 967,472.88, grand total 1,862,401.98; Bikes 2024 716,095.45; Margin % 43.7% both years. Card with Orders = 2,440."
    narration: >
      A quick matrix to check the numbers. Sales by category and year, one point eight six million in total, margin
      around forty four percent, two thousand four hundred and forty orders. Exactly what the CSV files add up to.

  - id: gotcha
    type: screen
    heading: "Gotcha: the blank customer"
    image: screens/unknown-customer.jpg
    video: screens/unknown-customer.mp4
    video_compact: true
    video_full: true
    crop: [0, 36, 1906, 1036]   # title bar (signed-in account) cropped out
    video_cuts: [[0, 4.37]]   # idle start (empty page until the table visual is inserted at 4.37 s), seconds of the original take
    short_crop: [48, 182, 360, 302]   # Short: the table visual only, three times larger, so the rows are readable on a phone
    bar: "Power BI Desktop · Report view · Sales by customer country"
    demo: "Table visual: Customer[Country] and Sales Amount, sorted descending. A row 'Unknown' with 61,345.69 is visible and there is no '(Blank)' row. Highlight the Unknown row."
    short: gotcha
    narration: >
      The gotcha. When a fact row has no matching dimension row, Power BI quietly adds a blank virtual row to the
      dimension, and your visuals show a customer called blank. Our guest orders would have done exactly that. Instead
      they map to an explicit unknown customer, sixty one thousand in sales you can now explain, and a test makes
      sure no key is ever missing.

  - id: recap
    type: bullets
    heading: "Five rules"
    bullets:
      - "Facts summarize, dimensions filter: one grain per fact"
      - "Many-to-one, single direction, no snowflakes"
      - "A marked date table that covers every date column"
      - "Hide keys, ship measures with format strings"
      - "Model as TMDL, linted and tested in the pipeline"
    narration: >
      Five rules. Facts summarize and dimensions filter, with one grain per fact table. Many-to-one relationships in a
      single direction, and no snowflakes. A marked date table that covers every date column. Hide the keys and ship
      measures. And keep the model as TMDL, linted and tested in your pipeline.

  - id: outro
    type: outro
    heading: "Code on GitHub, guides on devladlog.com"
    sub: "github.com/devladlog/mg-lab"
    narration: >
      The data generator, the TMDL model, star lint and all the tests are on GitHub, and the complete guide is on dev
      lad log dot com. Links are in the description. Next episode, advanced DAX on this same model. Subscribe so you
      don't miss it. This was DEVLADLOG Power BI, by Momento Galático.
