      caption: |
        The call is Generate Token, the version 2 API. It takes the report, the semantic model, and a list of identities with a username, the roles, and the models they apply to. The lifetime can only shorten the token's life, never extend it. The service principal's own Entra token is only used for this call. The browser gets the embed token.
        Full episode: link in bio.
