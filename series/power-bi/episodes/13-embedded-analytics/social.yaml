  - id: gotcha
    youtube_short_title: "Embedded Power BI: no identity, no token #Shorts"
    instagram_reel:
      caption: |
        Row-level security only protects the people you tell the service about. Learn says that with a service principal, a token request without a username and a role is refused. With a master user account it succeeds, and the report shows every row. Also: a free trial token is for development only. In production you need a capacity.
        Full episode: link in bio.
        Narration uses an AI voice.
