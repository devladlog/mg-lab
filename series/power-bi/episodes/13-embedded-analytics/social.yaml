linkedin_company:
  text: |
    Store partners should see their own sales inside your portal, without a Power BI account and without ever seeing Power BI. The report and the row-level security already exist. The question is who decides who is looking.

    Episode 13 of DEVLADLOG Power BI embeds the report for your customers, on fictional Contoso Bikes data:
    - a service principal with workspace access, and the four tenant-side setup steps, including two tenant settings that are a click, not code
    - a small Node server in TypeScript that signs in as the service principal and calls Generate Token (v2)
    - an identity built on the server from its own role table: the browser sends an alias and nothing else, and a test checks that an extra roles parameter is ignored
    - a page that embeds the report with the Power BI client library and replaces the token before it expires

    The gotcha: with a service principal, a token request without a username and role is refused. With a master user it succeeds and nothing is filtered.

    Watch: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.
    #PowerBI #PowerBIEmbedded #TypeScript #RowLevelSecurity #PowerPlatform
linkedin_personal:
  text: |
    In an embedded Power BI app, the browser must never tell the server which roles it has.

    My server takes one thing from the browser: an alias. It looks the person up in its own table, builds the effective identity with the user principal name and the roles, and only then asks for an embed token. A test sends an extra roles=Head Office parameter and checks that it is ignored.

    Why it matters: Learn says that with an embed token, who is a member of a role in the service does not count. Only the identity in the token does.

    Episode 13: {YOUTUBE_URL}

    #PowerBI #PowerBIEmbedded #TypeScript

    Narration uses an AI voice.
