scenes:
  - id: hook
    type: title
    heading: "Your app. Their data. No Power BI licence."
    sub: "Embed for your customers, with a service principal"
    short: hook
    narration: >
      Contoso Bikes wants its store partners to see their own sales, inside the partner portal, without a Power BI
      account and without ever seeing Power BI. The report and the row level security from episode five are already
      there. In this episode we put them in an app, and we let the server, not the browser, decide who is looking.

  - id: plan
    type: bullets
    heading: "What we're building"
    bullets:
      - "A service principal that is a member of the workspace"
      - "A small Node server that asks for an embed token"
      - "A page that embeds the report with the JavaScript library"
      - "A probe that shows what happens without an identity"
    narration: >
      Four pieces. A service principal that has access to the workspace. A small Node server written in TypeScript, which
      signs in as that service principal and asks Power BI for an embed token. A page that embeds the report. And a probe, for the
      mistake everybody makes once. Same Contoso Bikes model as the last twelve episodes.

  - id: two
    type: bullets
    heading: "Two ways to embed"
    bullets:
      - "For your customers: the app owns the data"
      - "A service principal signs in, users need no licence"
      - "For your organization: each user signs in to Entra ID"
      - "A service principal can't be used there"
    narration: >
      There are two solutions. Embed for your customers, where the app signs in with a service principal and the people
      using it need no Power BI licence. And embed for your organization, where every user signs in with Entra I D and
      needs a licence. This episode is the first one.

  - id: setup
    type: screen
    heading: "Four things in the tenant"
    image: screens/sp-setup.jpg
    video: screens/sp-setup.mp4
    bar: "Entra admin center and Power BI admin portal · lab tenant"
    demo: "Entra: the app registration 'Contoso Embed (Lab)' (Overview with the application ID blurred, Certificates and secrets with one secret, no API permissions). Power BI admin portal, Tenant settings, Developer settings: 'Embed content in apps' and 'Allow service principals to use Power BI APIs', both enabled for the security group 'Contoso Embed SPs (Lab)'. Workspace Contoso Sales (Lab), Manage access: the app as Member. Needs the tenant."
    narration: >
      Four things happen in the tenant. An Entra app with a secret and no A P I permissions, because Learn says they are
      never used. A security group. Two tenant settings in the Power BI admin portal, turned on for that group. And the
      service principal as a member of the workspace. A script does the first, second and fourth. The settings are a
      click.

  - id: config
    type: code
    heading: "Secrets in the environment, errors all at once"
    lang: typescript
    code: |
      const cfg: Config = {
        tenantId: guid("PBI_TENANT_ID"),
        clientId: guid("PBI_CLIENT_ID"),
        clientSecret: need("PBI_CLIENT_SECRET"),
        workspaceId: guid("PBI_WORKSPACE_ID"),
        reportId: guid("PBI_REPORT_ID"),
        upnDomain: need("PBI_UPN_DOMAIN").replace(/^@/, ""),
        port: Number(env["PORT"] ?? "5173"),
        tokenLifetimeMinutes: Number(env["EMBED_LIFETIME_MINUTES"] ?? "15"),
      };
    narration: >
      Nothing secret is in the repository. The server reads the tenant, the app, the secret, the workspace and the report
      from environment variables, and when something is missing it lists every problem at once, without ever printing the
      secret. The lifetime defaults to fifteen minutes, so the refresh is easy to watch.

  - id: identity
    type: code
    heading: "The server picks the identity"
    lang: typescript
    code: |
      const user = findUser(alias);
      if (!user) throw new UnknownUserError(alias);
      const report = await this.getReport();
      const identity = buildIdentity(upnFor(user.alias, this.cfg.upnDomain), user.roles, report.datasetId);
      const token = await this.client.generateEmbedToken({
        reports: [{ id: report.id }],
        datasets: [{ id: report.datasetId }],
        identities: [identity],
        lifetimeInMinutes: this.cfg.tokenLifetimeMinutes,
      });
    narration: >
      The browser sends an alias, and nothing else. The server looks the person up, takes the roles from its own table,
      builds the effective identity with the user's principal name, and asks for an embed token. A test sends an extra
      roles parameter asking to be head office, and checks that it is ignored.

  - id: token
    type: code
    heading: "One call: Generate Token"
    lang: typescript
    code: |
      export interface GenerateTokenRequest {
        reports: { id: string }[];
        datasets: { id: string }[];
        identities: EffectiveIdentity[];
        lifetimeInMinutes?: number;
      }

      generateEmbedToken(request: GenerateTokenRequest): Promise<EmbedToken> {
        return this.call<EmbedToken>("Generate Token", "POST", "/v1.0/myorg/GenerateToken", request);
      }
    short: token
    narration: >
      The call is Generate Token, the version two A P I. It takes the report, the semantic model, and a list of identities
      with a username, the roles, and the models they apply to. The lifetime can only shorten the token's life, never
      extend it. The service principal's own Entra token is only used for this call. The browser gets the embed token.

  - id: page
    type: code
    heading: "The page: powerbi.embed"
    lang: typescript
    code: |
      const report = powerbi.embed(container, {
        type: "report",
        id: info.reportId,
        embedUrl: info.embedUrl,
        accessToken: info.accessToken,
        tokenType: models.TokenType.Embed, // an embed token, not an Entra access token
        permissions: models.Permissions.Read,
        settings: { panes: { filters: { visible: false } } },
      }) as Report;
    narration: >
      On the page it is the power b i client library. The token type is embed, because this is an embed token and not an
      Entra access token, and the permission is read. Nothing else on this page knows who the user is.

  - id: alex
    type: screen
    heading: "Alex sees one store"
    image: screens/app-alex.jpg
    video: screens/app-alex.mp4
    bar: "Contoso Bikes partner portal · localhost · signed in as Alex Demo"
    demo: "Browser on the laptop, http://localhost:5173/ (address bar visible, nothing else about the tenant). Header: 'Signed in to this app as Alex Demo'. Status line: 'loaded as alex.demo (roles: Store Managers)'. Report page 'Store security': Visible stores 1, Visible customers 247, Sales amount 389,707.34, table with Contoso Lisboa; 'Who Am I' card blurred (it holds the UPN with the tenant domain). Needs the tenant."
    narration: >
      Here is the partner portal on the laptop. Alex Demo has no Power BI licence and has never opened Power BI. The report
      shows one store, Contoso Lisboa, with three hundred eighty nine thousand seven hundred seven in sales, the same number
      the episode five test expects for Alex.

  - id: switch
    type: screen
    heading: "Switch the user, change the data"
    image: screens/app-switch.jpg
    video: screens/app-switch.mp4
    bar: "Contoso Bikes partner portal · localhost · Riley, Jordan, Nobody"
    demo: "Same page, use the dropdown: Riley Demo (Visible stores 3, Sales amount 1,111,159.04, Lisboa, Online, Porto), Jordan Demo (Head Office: 5 stores, 1,862,401.98), Nobody Demo (Store Managers but not in the mapping: Visible stores 0, empty). Cut between the three. Needs the tenant."
    narration: >
      Switching user asks the server for a new token. Riley manages three stores. Jordan is head office and sees all five,
      one million eight hundred sixty two thousand. And Nobody has the store managers role but no row in the mapping table,
      so there is simply nothing to see. The roles in the token are what counts. Who is a member of a role in the service does not matter here.

  - id: refresh
    type: code
    heading: "Replace the token before it expires"
    lang: typescript
    code: |
      refreshTimer = window.setTimeout(async () => {
        const next = await getEmbedInfo(user);
        await report.setAccessToken(next.accessToken); // same report, new token, no reload
        scheduleRefresh(report, user, next);
      }, msUntilRefresh(info.expiration, Date.now()));
    narration: >
      An embed token expires. The page asks the server for a new one five minutes before that, and hands it to the
      report with set access token. The viewer keeps their place, and nobody sees an error.

  - id: gotcha
    type: screen
    heading: "Gotcha: no identity, no token"
    image: screens/probe.jpg
    video: screens/probe.mp4
    bar: "Terminal · node dist/server/probe.js"
    demo: "Windows Terminal in the app folder, env variables already set off camera. Run 'node dist/server/probe.js'. Show the real output: Learn says a service principal gets a refusal when no username and role are sent. Record exactly what is printed (HTTP status and error code) and adjust the narration if it differs. Then show the same console with the app running normally. Needs the tenant."
    short: gotcha
    narration: >
      Now the honest part. Row level security only protects the people you tell the service about. Learn says that with a
      service principal, a token request without a username and a role is refused. With a master user account it
      succeeds, and the report shows every row. We send exactly that request. And Learn also says a free trial token is for
      development only. In production you need a capacity, or the free trial banner stays.

  - id: limits
    type: bullets
    heading: "Before you ship it"
    bullets:
      - "Move to production: buy a capacity"
      - "Secret now, certificate later"
      - "Many customers: workspaces per customer, not only RLS"
      - "Generate Token: V2 workspaces, 50 items"
    narration: >
      Before shipping, a capacity is needed, and a certificate is better than a secret. If you have many customers,
      Learn recommends separating them by workspace, not only by row level security. And the generate token call needs
      version two workspaces and takes at most fifty reports and fifty semantic models.

  - id: outro
    type: outro
    heading: "Code on GitHub, guides on devladlog.com"
    sub: "github.com/devladlog/mg-lab"
    narration: >
      The server, the page and the setup scripts are on GitHub, and the complete guide to embedded analytics is on dev lad
      log dot com. Links in the description. This was DEVLADLOG Power BI, by Momento Galático.
