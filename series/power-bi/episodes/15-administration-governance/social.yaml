linkedin_company:
  text: |
    Every Monday someone should be able to answer three questions about the Power BI tenant. Did a setting change? Is there a workspace nobody owns? What happened yesterday?

    Episode 15 of DEVLADLOG Power BI answers them with a PowerShell module that only reads, has 59 tests that run without a tenant, and never prints an email address:
    - tenant settings compared with a baseline you keep in source control, as a comparison of on or off and the security groups, not a text diff
    - the metadata scanner in three calls (ask, poll, collect), with nine rules and a severity each
    - orphaned workspaces, found with the admin APIs
    - the activity log with continuation tokens, within Learn's one-UTC-day-per-request limit

    The gotcha: tenant settings can take up to 15 minutes to apply and activity events can arrive 30 to 60 minutes late, so a check that runs right after a change reports nothing. That is not good news.

    Watch: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.
    #PowerBI #Governance #PowerShell #MicrosoftFabric #PowerPlatform
linkedin_personal:
  text: |
    My first test run found a governance bug: a workspace with no users at all has an empty users list, and PowerShell turns an empty list into nothing. So the orphaned-workspace rule never fired for the worst case.

    The fix checks that the property exists. And when a scan runs without artifact users, the rule stays silent and the report says "not run", because silence is not the same as all clear.

    That is the design rule for the whole Monday check: a section that was not run says not run. It never says all clear.

    Episode 15: {YOUTUBE_URL}

    #PowerBI #Governance #PowerShell

    Narration uses an AI voice.
