linkedin_company:
  text: |
    The dashboard says the shop is quiet. The shop has been busy for five minutes.

    DEVLADLOG Power BI episode 17 streams Contoso Bikes till sales into Microsoft Fabric and reads them in Power BI, with a Python till that misbehaves on purpose: duplicate sends, late events and a flash sale.
    - Sender: Python and the Azure Event Hubs library, into an eventstream custom endpoint
    - Eventhouse: a materialized view that deduplicates by event id. Learn is explicit that it only deduplicates within its lookback window
    - Power BI: DirectQuery with automatic page refresh set to change detection on one measure, instead of one-second polling
    - The old way, for comparison: Learn says creation of push and streaming semantic models ends on 31 October 2027, and existing ones keep working. A script lists the models you still run

    The code is tested offline and the KQL is parsed, not executed. Nothing in the repo has run against the Fabric services yet.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Full guide: {BLOG_URL}

    Narration uses an AI voice.

    #PowerBI #MicrosoftFabric #KQL #RealTimeIntelligence
linkedin_personal:
  text: |
    A live Power BI report that looks fine in Desktop can behave differently once published. Desktop has no minimum page refresh interval. The service does: Learn says shared workspaces have a 30 minute minimum and no change detection, and on a Fabric capacity the admin sets it.

    The other lesson: a duplicate that arrives after the materialized view's lookback window gets through, so deduplicate by event id in the view, not in the report.

    Episode 17 of DEVLADLOG Power BI: {YOUTUBE_URL}

    Narration uses an AI voice.

    #PowerBI #MicrosoftFabric
