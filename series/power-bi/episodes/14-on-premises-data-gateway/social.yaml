linkedin_company:
  text: |
    It works on my laptop. The refresh fails. The data is in a SQL Server on a private network, and the Power BI service cannot see it.

    Episode 14 of DEVLADLOG Power BI puts an on-premises data gateway in between, on fictional Contoso Bikes data, and checks the three places where it usually goes wrong:
    - a read-only SQL login for the gateway, with the password typed on the day and never kept in a file
    - where the gateway can live: not Server Core, not a domain controller, not a laptop that sleeps
    - a network check before installing, because the gateway only makes outbound connections and has to reach both the service and the SQL Server
    - the data source created in the portal and through the Create Datasource API, with credentials encrypted for the gateway
    - a check that reads the query and the gateway data sources and says whether the names match

    The mistake everyone makes once: server and database names must match exactly, and matching is case sensitive.

    Watch: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.
    #PowerBI #DataGateway #SQLServer #PowerShell #PowerPlatform
linkedin_personal:
  text: |
    The link between a Power BI model and a gateway data source is the server name and the database name. Nothing else.

    Microsoft Learn says they must match exactly, and matching is case sensitive. If Desktop uses the IP address, the gateway data source must use the IP address. If the query says the server name and the gateway has the address, the gateway never shows up for the refresh.

    So I wrote a small check that reads the query and the gateway data sources and says exactly which case it is. Cheaper than finding out from a failed refresh.

    Episode 14: {YOUTUBE_URL}

    #PowerBI #DataGateway #SQLServer

    Narration uses an AI voice.
