linkedin_company:
  text: |
    24 monthly files combined in Power Query. The total says 2,020,000. The real number is 1,862,401.98. Nothing failed, no errors, just duplicates.

    Episode 3 of DEVLADLOG Power BI turns a folder of messy ERP exports into a star schema in M:
    - semicolons, decimal commas and day-month-year dates handled with an explicit culture
    - two custom functions, one for reading an export and one for building a dimension
    - a combine step that keeps the newest copy of every order line, with Table.Buffer so the choice is predictable
    - pq-lint, built on Microsoft's open source Power Query parser, plus a Python mirror of every step

    All data is fictional Contoso Bikes data.

    Watch: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.
    #PowerBI #PowerQuery #MLanguage #DataEngineering #PowerPlatform
linkedin_personal:
  text: |
    Sort then remove duplicates looks like "keep the first row". The Table.Distinct documentation says there is no guarantee which duplicate survives, and to buffer the table first if you need it predictable.

    In my folder-of-exports demo that matters: no de-duplication gives 2,020,000, keeping the older copy gives 1,900,000, and only the newest copy gives the correct 1,862,401.98.

    The lesson: when a refresh does not error, check the total against something you computed outside Power BI. I used a Python mirror of the M steps and a linter built on Microsoft's Power Query parser.

    Episode 3: {YOUTUBE_URL}

    #PowerQuery #PowerBI #MLanguage

    Narration uses an AI voice.
