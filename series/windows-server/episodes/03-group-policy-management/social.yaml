linkedin_company:
  text: |
    Somebody tightened the security filter on a policy. Now it applies to nobody, and nothing tells you. Group Policy fails quietly.

    Episode 3 of DEVLADLOG Windows Server deploys GPOs from a file, proves they applied on a server, and audits the domain for the quiet failures. The lab is a fictional Contoso domain.

    - Two GPOs described in one JSON file, deployed by a function that reads before it writes and supports WhatIf
    - Proof on the server: gpresult, the registry value and the PowerShell operational log
    - A snapshot of every GPO and link, with checks for settings in a disabled half, AD and SYSVOL version mismatches and unlinked or empty GPOs
    - Backups that also record where each GPO was linked
    - 27 Pester tests, no domain needed

    The gotcha: remove Authenticated Users to narrow a filter and user policy stops applying, because the computer needs read access to the GPO.

    Watch the episode: {YOUTUBE_URL}
    Code and tests: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.
    #GroupPolicy #WindowsServer #PowerShell #ActiveDirectory
linkedin_personal:
  text: |
    The classic Group Policy mistake: you narrow a security filter by removing Authenticated Users, and the policy quietly stops applying to the very users you targeted. Since the June 2016 update MS16-072, Windows reads user policy using the computer account, so the computer needs read on the GPO.

    In the third DEVLADLOG Windows Server episode the deployment replaces Authenticated Users with read-only instead of removing it. One switch, and the filter works. The lesson: filter who applies the policy, never who can read it.

    {YOUTUBE_URL}

    #GroupPolicy #WindowsServer
    Narration uses an AI voice.
facebook:
  text: |
    A GPO in the console proves nothing. Ask the server.

    In this DEVLADLOG episode we describe GPOs in one JSON file, deploy them with a PowerShell function that is safe to run twice, and prove on a real server that the settings arrived. Then we audit the whole domain for the quiet failures, including the security filter that makes a policy apply to nobody.

    Watch it here: {YOUTUBE_URL}

    #GroupPolicy #WindowsServer
    Narration uses an AI voice.
