# DEVLADLOG Windows Server - episode 11 (draft: the screen scenes need the lab recording, see demo.md)
episode: 11
slug: remote-desktop-services
series_label: "WINDOWS SERVER"
series_name: "DEVLADLOG Windows Server"
file_prefix: "windows-server"
title: "Remote Desktop Services"
subtitle: "Check the deployment, read the plan, then change it. Licensing, collections and stale sessions"
voice: am_michael
thumbnail_text: "120 DAYS\nTHEN WHAT?\nCHECK FIRST"
youtube:
  title: "Remote Desktop Services on Windows Server 2025: Deploy, License, Clean Up Sessions | DEVLADLOG Windows Server #11"
  tags: [Remote Desktop Services, RDS, Windows Server 2025, RD Connection Broker, RD Session Host, RDS CAL, PowerShell, session collection, sysadmin, Pester]
sources:
  - https://www.devladlog.com/articles/windows-server/2025-09-24-remote-desktop-services-complete-guide-2025/

scenes:
  - id: hook
    type: title
    heading: "A server that stops letting people in"
    sub: "Remote Desktop Services has a clock you did not set"
    short: hook
    narration: >
      Install Remote Desktop Services and everything works. For a hundred and twenty days. Then people stop being able
      to sign in, and nobody remembers a clock was running. Today we check a Remote Desktop deployment before it
      bites. A script reads it, writes the plan as a table, and only then changes anything. Then we clean up stale
      sessions without logging off the wrong person.

  - id: roles
    type: bullets
    heading: "One server, four role services"
    bullets:
      - "Connection Broker: who is on which session"
      - "Session Host: where the desktops run"
      - "Web Access: the portal"
      - "Licensing: the CAL server"
    narration: >
      A small deployment is one server with four role services. The Connection Broker keeps track of who is on which
      session. The Session Host is where the desktops actually run. Web Access is the portal, and Licensing hands out
      client access licenses. In production you would spread them over several servers, and a second broker is a
      supported design. Our lab uses one extra Desktop Experience machine for all four, which is enough to see every
      moving part.

  - id: before
    type: screen
    heading: "A broker with nothing behind it"
    image: screens/check-before.jpg
    bar: "Lab · CON-RDS01 · Invoke-RdsCheck.ps1"
    demo: >
      On CON-RDS01, elevated Windows PowerShell in C:\lab\ep11\src: .\Invoke-RdsCheck.ps1 -FactsFile .\facts-before.json
      -OutFile .\check-before.md -PlanOnly. Show the findings table, the plan table (Order, Id, Cmdlet, Disruptive)
      and the last line "N finding(s), N high.".
    narration: >
      On the real lab. Rewrite this to what the check really found on the empty server. The collector asks the broker
      for its servers, its license settings, its certificates and its sessions, and it asks each session host for its
      own grace period. It only reads, and the plan is a table, nothing more.

  - id: rules
    type: code
    heading: "The clock, as a rule"
    lang: powershell
    code: |
      if (-not $licServers.Count) {
          if ([int]$g -le 0) {
              Add-F $hn High 'GracePeriodOver' 'The licensing grace period is over ... clients now need an RDS CAL ...'
          }
          elseif ([int]$g -le $warnDays) {
              Add-F $hn Medium 'GracePeriodEnding' "$g day(s) left of the licensing grace period ..."
          }
          else {
              Add-F $hn Info 'OnGracePeriod' "Running on the licensing grace period: $g day(s) left ..."
          }
      }
    narration: >
      The rule reads the real number of days left from each session host. Without a license server, zero days is high,
      thirty or fewer is medium, and anything more is information. The hundred and twenty days comes from Microsoft
      Learn, and the thirty is our own policy.

  - id: plan
    type: code
    heading: "The plan, with the value it found"
    lang: text
    code: |
      Order Id                Cmdlet                               Disruptive
          1 InstallDeployment New-RDSessionDeployment                    True
          2 AddLicensing      Add-RDServer                              False
          3 LicenseConfig     Set-RDLicenseConfiguration                False
          4 NewCollection     New-RDSessionCollection                   False
          5 CollectionConfig  Set-RDSessionCollectionConfiguration      False
      # only differences become steps; the role install needs -AllowDeployment
    short: plan
    narration: >
      Here is the plan, from sample data. Only differences become steps, so a server that is already right gets no
      steps at all. Installing the role services is marked disruptive, and the script will not run it unless you add a
      switch that says so. And only five Remote Desktop cmdlets are allowed to run at all, whatever the plan says.

  - id: apply
    type: screen
    heading: "What if first, then for real"
    image: screens/apply.jpg
    bar: "Lab · CON-RDS01 · Deploy-RdsLab.ps1 -Step Apply"
    demo: >
      .\Deploy-RdsLab.ps1 -Step Apply -WhatIf (five What if lines), then .\Deploy-RdsLab.ps1 -Step Apply
      -AllowDeployment. If the server restarts during the role install, sign in again and re-run the same command: the
      plan is recomputed from the facts, so finished steps drop out. Show the final "Nothing to change" or the one
      manual certificate step.
    narration: >
      What If first, then the real run. Rewrite this to what happened: whether the server restarted, how many times we
      re-ran it, and how the plan shrank until only the certificate step was left. Because the plan is recomputed from
      the facts every time, running it again is always safe.

  - id: collection
    type: code
    heading: "Our policy, one cmdlet"
    lang: powershell
    code: |
      Set-RDSessionCollectionConfiguration `
          -CollectionName 'MG Lab Desktops' `
          -SecurityLayer SSL -EncryptionLevel High `
          -IdleSessionLimitMin 30 -DisconnectedSessionLimitMin 60 `
          -UserGroup 'CONTOSO\RDS Demo Users'
      # found before (sample data):
      #   SecurityLayer=Negotiate   IdleSessionLimitMin=0
      #   DisconnectedSessionLimitMin=0   UserGroup=CONTOSO\Domain Users
    narration: >
      The collection step shows the values it found and the ones it wants. The defaults left disconnected sessions
      running forever, and let every domain account in. Our policy says thirty idle minutes, sixty disconnected, a
      dedicated group, and the S S L security layer.

  - id: after
    type: screen
    heading: "Check again"
    image: screens/check-after.jpg
    bar: "Lab · CON-RDS01 · Invoke-RdsCheck.ps1"
    demo: >
      .\Invoke-RdsCheck.ps1 -OutFile .\check-after.md. Show that the Medium and Low collection findings are gone and
      that the self-signed certificate findings remain. Optionally open https://con-rds01.lab.contoso.com/RDWeb from
      CON-SRV02 to show the real certificate warning.
    narration: >
      Rewrite this to the real result. The collection findings should be gone. The self signed certificate findings
      stay, on purpose: the script never picks a certificate for you.

  - id: licensing
    type: bullets
    heading: "Licensing, in four facts"
    bullets:
      - "120 days of grace, no license server needed"
      - "Per user or per device, you choose the mode"
      - "Per user CALs are not enforced: you count them"
      - "A 2025 session host needs 2025 CALs"
    narration: >
      Four licensing facts, all from Learn. Hundred and twenty days of grace. Per user or per device. Per user licenses
      are not enforced by the server, so counting them is your job. And licenses for an older version cannot be used on
      a Windows Server twenty twenty five session host.

  - id: sessions
    type: screen
    heading: "Who is on the server?"
    image: screens/sessions.jpg
    bar: "Lab · CON-RDS01 · session table"
    demo: >
      From CON-SRV02 connect with mstsc to con-rds01.lab.contoso.com as CONTOSO\alex.demo (password typed off camera),
      then disconnect without logging off. On CON-RDS01: .\Invoke-RdsCheck.ps1 and show the Sessions table with
      alex.demo Disconnected, or Get-RDUserSession | Format-Table.
    narration: >
      A real person, signed in and then disconnected. Closing the window does not log anyone off: the session keeps
      running, and keeps its memory, until a limit ends it. The session table shows that one disconnected session.
      Rewrite this to the real state names the broker returned.

  - id: logoff
    type: code
    heading: "Safe by construction"
    lang: powershell
    code: |
      param([Parameter(Mandatory)] [string] $UserName, ...)   # no default: no accidental "everyone"
      foreach ($s in @(Get-RDUserSession @a)) {
          if ([string]$s.SessionState -notmatch 'DISCONNECT') { continue }   # never an active session
          if ([string]$s.UserName -notlike $UserName) { continue }
          if ($PSCmdlet.ShouldProcess("$($s.UserName) on $($s.HostServer)", 'Log off the disconnected session')) {
              Invoke-RDUserLogoff -HostServer ([string]$s.HostServer) -UnifiedSessionID ([int]$s.UnifiedSessionId) -Force
          }
      }
    narration: >
      Logging a user off closes their applications, so the function has three guards. The user pattern has no default.
      Only disconnected sessions are ever touched. And What If shows every session before anything happens.

  - id: logoffrun
    type: screen
    heading: "Log off the stale one"
    image: screens/logoff.jpg
    bar: "Lab · CON-RDS01 · Deploy-RdsLab.ps1 -Step Logoff"
    demo: >
      .\Deploy-RdsLab.ps1 -Step Logoff -UserName alex.demo -WhatIf, then without -WhatIf, then Get-RDUserSession to
      show the session is gone.
    narration: >
      What If shows the one session it would end. Then the real run, and the session table is empty again. Rewrite
      this to what the broker really returned.

  - id: gotcha
    type: code
    heading: "Gotcha: not on Server Core"
    lang: text
    code: |
      Learn, Server Core: some Remote Desktop role services are included
      (Connection Broker, Licensing, Virtualization Host),
      but others are NOT:
        RDS-RD-Server   (RD Session Host)
        RDS-Web-Access  (RD Web Access)
        RDS-Gateway     (RD Gateway)
      -> a Core VM in the lab cannot be a session host.
         The check flags it: SessionHostOnServerCore (High).
    short: gotcha
    narration: >
      The gotcha. Every other server in this lab is Server Core, and that is exactly why none of them can be the
      session host. Learn says the RD Session Host, RD Web Access and RD Gateway role services are not in Server Core.
      So this episode needed one more Desktop Experience machine, and the check flags a Core session host as high. It
      is cheap to find out on a screen, and expensive to find out after you have built the lab.

  - id: tests
    type: code
    heading: "Forty-six tests, no servers"
    lang: text
    code: |
      Describing Get-RdsDeploymentPlan
        [+] plans only the differences for a defaults deployment, with the value found
        [+] plans nothing but the manual certificate step after the plan ran
      Describing Invoke-RdsDeploymentPlan
        [+] skips the disruptive step without -AllowDeployment and runs the rest
        [+] refuses a plan that names a cmdlet outside the allow-list
      Describing Invoke-RdsDisconnectedLogoff
        [+] never touches an active session even if the name matches

      Tests Passed: 46, Failed: 0
    narration: >
      Forty six Pester tests run on Linux, with the Remote Desktop cmdlets mocked. They check that the plan only holds
      differences, that the install needs its switch, that only allowed cmdlets can run, and that an active session is
      never logged off.

  - id: recap
    type: bullets
    heading: "Five rules for Remote Desktop"
    bullets:
      - "Know your clock: the grace period"
      - "Plan as a table, with the old values"
      - "Disruptive steps need a switch"
      - "Never pick a certificate for people"
      - "Log off only what you can name"
    narration: >
      Five rules. Know your clock, because the grace period ends whether you noticed or not. Show the plan as a table
      with the old values. Put disruptive steps behind a switch. Never pick a certificate for people. And log off only
      what you can name. A plan you can read, a switch you can refuse, and a check you can run again tomorrow.

  - id: outro
    type: outro
    heading: "Code on GitHub, guides on devladlog.com"
    sub: "github.com/devladlog/mg-lab"
    narration: >
      The module, the check, the deploy script and the tests are on GitHub, and the complete guide to Remote Desktop
      Services is on devladlog dot com. Subscribe so you don't miss the next episode.
