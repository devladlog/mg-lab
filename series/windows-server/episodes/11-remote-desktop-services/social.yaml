linkedin_company:
  text: |
    Install Remote Desktop Services and everything works. For 120 days. Then people stop being able to sign in, and nobody remembers a clock was running.

    Episode 11 of DEVLADLOG Windows Server checks a Remote Desktop deployment before it bites, in a fictional Contoso lab. A script reads it, writes the plan as a table, and only then changes anything.

    - The grace period as a rule: no license server and zero days left is High, 30 or fewer is Medium
    - A plan that holds only differences, so a server that is already right gets no steps
    - Disruptive steps refused without a switch, and only five Remote Desktop cmdlets allowed to run at all
    - Collection policy in one cmdlet: idle and disconnected limits, a dedicated group, SSL security layer
    - Stale session cleanup with three guards: no default user pattern, disconnected sessions only, WhatIf first
    - 46 Pester tests with the Remote Desktop cmdlets mocked

    The gotcha: the RD Session Host, Web Access and Gateway role services are not available on Server Core, so the lab needed one more Desktop Experience machine.

    Watch the episode: {YOUTUBE_URL}
    Code and tests: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.
    #RemoteDesktop #WindowsServer #RDS #PowerShell
linkedin_personal:
  text: |
    Every other server in my lab is Server Core, and that is exactly why none of them could be the Remote Desktop session host. Learn says the RD Session Host, RD Web Access and RD Gateway role services are not available on Server Core.

    In the eleventh DEVLADLOG Windows Server episode the check flags a Core session host as High, and the lab got one more Desktop Experience machine. The lesson: it is cheap to find out on a screen and expensive to find out after you have built the lab.

    {YOUTUBE_URL}

    #RemoteDesktop #WindowsServer
    Narration uses an AI voice.
