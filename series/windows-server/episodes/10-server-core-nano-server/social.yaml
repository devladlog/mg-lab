linkedin_company:
  text: |
    Server Core is the install option Microsoft recommends, and most labs still have a few servers with a desktop they never needed. And Nano Server? You cannot install it on a server at all any more.

    Episode 10 of DEVLADLOG Windows Server checks which lab servers are really Server Core, what the desktop costs, and what breaks when a container image assumes PowerShell.

    - A read-only collector over WinRM: Core or Desktop Experience, disk, memory, services, features and remote management
    - Core versus Desktop detected from the server levels registry key documented on Learn
    - A plan for what can be fixed from here, with restarts behind their own switch and a manual step for servers that do not answer
    - A Nano Server check that reads Dockerfiles and flags Windows PowerShell in a nanoserver stage, with the line number
    - 56 Pester tests, no server and no Docker

    The gotcha: you cannot convert between Core and Desktop Experience after installation. A clean install is the only way, so the plan has a manual rebuild step and no conversion.

    Watch the episode: {YOUTUBE_URL}
    Code and tests: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.
    #ServerCore #NanoServer #WindowsServer #PowerShell
linkedin_personal:
  text: |
    If you remember converting a Windows Server between Core and Desktop Experience, forget it. Learn says you cannot convert after installation. A clean install is the only way.

    So in the tenth DEVLADLOG Windows Server episode, when the check finds a Desktop Experience server that should be Core, the plan has no conversion step. It has a manual rebuild step, and it says so. The lesson: write down why a server has a desktop before you build it, because you will not get to undo it cheaply.

    {YOUTUBE_URL}

    #ServerCore #WindowsServer
    Narration uses an AI voice.
