linkedin_company:
  text: |
    An admin account nobody has used since July, with a password that never expires. A recycle bin that was never switched on. A former admin who still does not inherit permissions. Active Directory never complains about any of it.

    Episode 2 of DEVLADLOG Windows Server builds a new forest on Windows Server 2025 and writes a hygiene report that does complain, on a fictional Contoso lab.

    - Promote the forest with PowerShell, after asking the cmdlet which functional levels it accepts
    - OUs, groups and users from an HR CSV, matched on EmployeeID so the script is safe to run twice
    - A JSON snapshot of the domain, with protected groups found by well-known SID
    - Checks for stale accounts, privileged accounts and orphaned admins (adminCount left at 1)
    - 42 Pester tests with the AD cmdlets mocked

    The gotcha: lastLogonTimestamp is not a stopwatch. It only updates when it is 9 to 14 days old.

    Watch the episode: {YOUTUBE_URL}
    Code and tests: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.
    #ActiveDirectory #WindowsServer #PowerShell #SysAdmin
linkedin_personal:
  text: |
    I used to read lastLogonTimestamp as "when did this user last sign in". It is not. It is replicated, and Active Directory only updates it when the value is 9 to 14 days old. For finding stale accounts it is fine. As a stopwatch it is wrong by up to two weeks.

    In the second DEVLADLOG Windows Server episode I sign in twice a few minutes apart and compare it with lastLogon, which lives on a single domain controller. The lesson: know what each attribute cannot tell you.

    {YOUTUBE_URL}

    #ActiveDirectory #WindowsServer
    Narration uses an AI voice.
