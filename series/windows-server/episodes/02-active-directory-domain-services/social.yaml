  - id: gotcha
    youtube_short_title: "lastLogonTimestamp is not a stopwatch #Shorts"
    instagram_reel:
      caption: |
        We signed in twice, minutes apart. lastLogon, which lives on this domain controller only, shows the second sign-in. lastLogonTimestamp, the replicated one, still shows the first. It is only updated when it is 9 to 14 days old. Great for finding stale accounts, useless as a stopwatch, so the report says it can lag by up to fourteen days.

