linkedin_company:
  text: |
    A certificate authority fails in two quiet ways. A certificate expires and a service stops. Or a template lets anyone ask for a certificate with somebody else's name on it.

    Episode 9 of DEVLADLOG Windows Server builds an enterprise CA in a fictional Contoso lab and writes the check that looks for both, read-only, from the admin server over WinRM.

    - A collector for machine certificates, the CA service, its certificate, the CRL and distribution points, and every published template with its enrollment permissions
    - Template rule: requester supplies the subject, can sign someone in, no approval, and a broad group can enroll is a High finding
    - The CA built from a plan, with the irreversible step refused without a switch
    - An HTTP revocation location added only if it is not already there
    - 46 Pester tests, using real X.509 certificates instead of mocks

    The gotcha: Learn's example for installing an enterprise root CA writes the values without quotes, and in PowerShell it stops with an error as printed. Our plan quotes the values and a test parses every generated script.

    Watch the episode: {YOUTUBE_URL}
    Code and tests: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.
    #ADCS #WindowsServer #PKI #PowerShell
linkedin_personal:
  text: |
    One rule I now check in every certificate template: who chooses the name? If the requester can supply the subject or alternative name, the certificate can sign someone in, nobody approves the request, and a broad group like Domain Users can enroll, anyone in that group can ask for a certificate naming someone else.

    In the ninth DEVLADLOG Windows Server episode that combination is a High finding. Approval or a named group lowers it to a note. The lesson: read the template permissions, not just the expiry dates.

    {YOUTUBE_URL}

    #ADCS #PKI
    Narration uses an AI voice.
