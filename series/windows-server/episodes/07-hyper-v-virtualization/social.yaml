  - id: checkpoints
    youtube_short_title: "Hyper-V Production vs Standard checkpoints #Shorts"
    instagram_reel:
      caption: |
        Two kinds of checkpoint. Production uses the Volume Shadow Copy Service inside the guest and takes no memory state. Standard captures memory and device state and is not application consistent. The trap: with the type set to Production, a failed production checkpoint quietly becomes a Standard one. ProductionOnly fails instead. Either way, it is not a backup.

        Full episode: link in bio

        #HyperV #WindowsServer #SysAdmin
      cover_text: "PRODUCTION OR STANDARD?"
