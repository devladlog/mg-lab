linkedin_company:
  text: |
    Every server in this series is a virtual machine, and so far we only looked at what runs inside them. Episode 7 of DEVLADLOG Windows Server looks underneath, at the Hyper-V host.

    - A read-only audit of the host: a collector gathers facts as JSON and pure rules turn them into findings
    - A VM built from a JSON spec, validated into an ordered plan with WhatIf support, so running it twice is safe
    - A virtual TPM step that comes after the key protector it needs
    - Rules with a reason: limits from Microsoft live in code, our own policy lives in the config file
    - 40 Pester tests with every Hyper-V cmdlet mocked, using an invented host full of mistakes

    The gotcha: removing a checkpoint returns quickly, but the real work, merging the differencing disk into its parent, goes on in the background. The cleanup waits, watches the live disk chain and warns if it is still deep after the timeout.

    Also covered: with the type set to Production, a failed production checkpoint quietly becomes a Standard one.

    Watch the episode: {YOUTUBE_URL}
    Code and tests: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.
    #HyperV #WindowsServer #PowerShell #Virtualization
linkedin_personal:
  text: |
    A checkpoint is really a disk that never stops growing. Each one is another differencing disk stacked on the last. And deleting one in Hyper-V returns quickly, but the merge into the parent disk keeps going in the background, so the disk is not small again yet.

    In the seventh DEVLADLOG Windows Server episode the cleanup script waits and watches the live disk chain, and never deletes disk files by hand. The lesson: wait for the merge, then measure.

    {YOUTUBE_URL}

    #HyperV #WindowsServer
    Narration uses an AI voice.
