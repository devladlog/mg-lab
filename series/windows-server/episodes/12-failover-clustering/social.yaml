linkedin_company:
  text: |
    Two servers do not make a failover cluster that survives a server dying. Count the votes and you find out why.

    Episode 12 of DEVLADLOG Windows Server checks two nodes before building anything, reads the plan, builds a cluster with a witness, then pauses a node while a small prober measures how long the website really went away. The lab is fictional Contoso.

    - Quorum arithmetic printed before the build: two nodes with no witness need both votes, a file share witness makes three votes and lets one node go
    - A read-only node check, including clock spread, because Kerberos tolerates five minutes by default
    - A plan in order: validate, create the cluster, witness share, quorum, role
    - A witness config that is refused if the share sits on a cluster node
    - 52 Pester tests with the cluster cmdlets mocked, and a prober tested against a throwaway local web server

    The gotcha: cluster creation, role creation and removal cannot run remotely without CredSSP, and CredSSP hands out your credentials. So the script runs those steps on a node.

    Watch the episode: {YOUTUBE_URL}
    Code and tests: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.
    #FailoverClustering #WindowsServer #HighAvailability #PowerShell
linkedin_personal:
  text: |
    A planned failover is not zero downtime. It is short, and it deserves a number. In the twelfth DEVLADLOG Windows Server episode a small prober asks the clustered website every half second, records who answered, and calculates the outage from the first failed request to the next good one.

    The other lesson came before the build: two nodes and no witness is two votes, quorum needs both, so losing one node stops the cluster. Count the votes first. Check, plan, build, measure.

    {YOUTUBE_URL}

    #FailoverClustering #WindowsServer
    Narration uses an AI voice.
