    instagram_reel:
      caption: |
        The honest gotcha: JEA sessions run in No Language mode. You cannot use variables to store data or inspect object properties, so the obvious Invoke-Command with a variable inside fails. That is why the runbook uses implicit remoting. Import-PSSession brings in proxy commands, and the script keeps full language locally.

