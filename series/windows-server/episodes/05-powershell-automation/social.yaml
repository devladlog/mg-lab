linkedin_company:
  text: |
    The scheduled task that restarts the web server at 3 AM runs as a domain admin, and the password sits in the task, or worse, in the script.

    Episode 5 of DEVLADLOG Windows Server rebuilds that job so it holds no password, and the only things it can do on the server are the three it needs. The lab is a fictional Contoso domain.

    - A JEA endpoint generated from one JSON file, with a lint that checks the merged roles before anything is registered
    - A runbook that decides, acts, logs and re-checks, with a circuit breaker after three restarts in 24 hours
    - A group managed service account that runs it from Task Scheduler, so there is no password to store
    - JEA transcripts as the audit trail
    - 47 Pester tests, no servers needed

    The gotcha: JEA sessions run in No Language mode, so the script uses implicit remoting and keeps full language locally.

    Watch the episode: {YOUTUBE_URL}
    Code and tests: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.
    #PowerShell #JEA #WindowsServer #SysAdmin
linkedin_personal:
  text: |
    A JEA trap that looks harmless: helpdesk asks to restart the print spooler, so someone adds Restart-Service to the readers role with no constraints. Operators are in both roles, and JEA merges roles to the most permissive set. Now operators can restart any service.

    In the fifth DEVLADLOG Windows Server episode a lint applies the merge rules from Microsoft Learn per group and fails the build. The lesson: check what each group gets after the merge, not each role on its own.

    {YOUTUBE_URL}

    #JEA #PowerShell
    Narration uses an AI voice.
facebook:
  text: |
    Your 3 AM script is a Domain Admin. Does it have to be?

    In this DEVLADLOG episode we rebuild a nightly restart job with no password at all. A group managed service account runs it, a JEA endpoint limits it to the few commands it needs, and every session leaves a transcript. We also show the role-merging trap that quietly gives operators far too much.

    Watch it here: {YOUTUBE_URL}

    #PowerShell #WindowsServer
    Narration uses an AI voice.
