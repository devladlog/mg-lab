  - id: report
    type: screen
    heading: "Worst first"
    image: screens/report.jpg
    bar: "Lab · report.md"
    short: report
    demo: >
      report.md opened in VS Code preview (or the console table). Summary table per server on top, then the findings
      with High rows first. Expect on CON-FS01: FS-SMB1 installed, Public firewall profile off, RDP enabled, and the
      Desktop Experience Low finding. Zoom on the High rows.
    narration: >
      The report puts a summary row per server on top, then every finding, worst first. The file server is the
      problem child, exactly as we set it up: SMB one installed, the public firewall profile off, and Remote Desktop
      enabled on a server the baseline only manages remotely. Rewrite this to match the real rows.

  - id: fix
    type: screen
    heading: "Fix it, run it again"
    image: screens/fixed.jpg
    bar: "Lab · CON-FS01 fixed, second run"
    demo: >
      Split or two takes. First: Invoke-Command -ComputerName CON-FS01 { Uninstall-WindowsFeature FS-SMB1;
      Set-NetFirewallProfile -Profile Public -Enabled True }. Second: run Invoke-ServerBaseline.ps1 again and show
      that the ForbiddenFeature and Firewall rows are gone (a pending reboot finding may appear after removing SMB1:
      keep it on screen if it does).
    narration: >
      Fixing is remoting too: remove the SMB one feature and turn the public profile back on, from the same console.
      Run the baseline again and those findings are gone. If removing the feature leaves a pending reboot, the
      baseline says so, which is exactly its job.

  - id: hotfix
    type: screen
    heading: "Gotcha: Get-HotFix doesn't list every update"
    image: screens/hotfix.jpg
    bar: "Lab · CON-FS01 · Get-HotFix vs Windows Update history"
    short: gotcha
    demo: >
      On CON-FS01 (Desktop Experience, so the Settings app exists): left, a PowerShell window with
      Get-HotFix | Sort-Object InstalledOn -Descending | Select-Object -First 5. Right, Settings > Windows Update >
      Update history. Show at least one entry in the history that Get-HotFix doesn't list (for example a Defender
      definition update). If none differs on the day, show the Notes section of the Get-HotFix page on Learn instead
      and adjust the narration.
    narration: >
      The honest gotcha. Our update check uses Get-HotFix, which reads the Win32 Quick Fix Engineering class. That
      class only returns updates from Component Based Servicing. Updates delivered by Windows Installer or the Windows
      Update site aren't in it. So the check is good for cumulative updates, and when it finds nothing dated, the
      finding tells you to look at the Windows Update history instead.

  - id: tune
    type: bullets
    heading: "Tune the baseline to your reality"
    bullets:
      - "Fill the ignore list from your first run, not from a blog"
      - "Pin the patch level: MinimumUbr from the release info page"
      - "Hotpatch servers reboot quarterly: raise MaxUptimeDays"
      - "Unreachable servers stay in the report as High"
    narration: >
      Make it yours. Fill the services ignore list from your own first run; it starts empty on purpose. Pin the patch
      level with minimum U B R, from the Windows Server release information page. With Hotpatch, servers only restart
      for the quarterly baseline, so raise the uptime limit. And a server that doesn't answer shows up as High.

  - id: recap
    type: bullets
    heading: "Five rules"
    bullets:
      - "Collect facts remotely, judge them locally"
      - "Rules in a file, not in the script"
      - "The remote side is Windows PowerShell 5.1: test for it"
      - "Know what each data source can't see"
      - "Run it on a schedule, fail on High"
    narration: >
      Five rules. Collect facts remotely and judge them locally. Keep the rules in a file. Remember the remote side
      is Windows PowerShell five point one, and test for it. Know what each data source can't see. And run it on a
      schedule with fail on High, so a red report becomes a ticket instead of a surprise.

