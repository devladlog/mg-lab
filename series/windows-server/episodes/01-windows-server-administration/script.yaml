  - id: hook
    type: title
    heading: "Is every server where you think it is?"
    sub: "One baseline file, three lab servers, one command"
    short: hook
    narration: >
      A pending reboot nobody noticed. A firewall profile switched off during a test. A file server that stopped
      patching in July. In this episode we write one baseline file, check every Windows Server against it with a
      single command, and fix what it finds, in a real lab. Welcome to the DEVLADLOG Windows Server series.

  - id: plan
    type: bullets
    heading: "What we're building"
    bullets:
      - "A collector that runs on each server over PowerShell remoting"
      - "A baseline in JSON: build, patches, disks, services, features"
      - "Pure checks: snapshot in, findings out"
      - "A markdown report, worst findings first"
      - "Thirty-two Pester tests that run on Linux"
    narration: >
      The plan. A collector that runs on each server over PowerShell remoting and returns a snapshot. A baseline in
      JSON with the rules. Pure functions that compare the two and return findings. A markdown report, worst first.
      And thirty two Pester tests that run on Linux without a single server.

  - id: lab
    type: bullets
    heading: "The lab"
    bullets:
      - "Windows Server 2025, 180-day evaluation VMs"
      - "CON-DC01 and CON-APP01: Server Core"
      - "CON-FS01: Desktop Experience, on purpose"
      - "Isolated lab network, no production anything"
      - "Mainstream support until November 2029"
    narration: >
      The lab is three Windows Server 2025 virtual machines on the free one hundred and eighty day evaluation. A domain
      controller and an application server on Server Core, and a file server with the Desktop Experience, on purpose,
      so the baseline has something to say. All on an isolated network. Windows Server 2025 has mainstream support
      until November 2029.

  - id: remoting
    type: code
    heading: "Fan out with Invoke-Command"
    lang: powershell
    code: |
      function Get-SbSnapshot {
          param([string[]] $ComputerName, [pscredential] $Credential, [int] $ThrottleLimit = 32)

          if (-not $ComputerName) {
              return (& $script:Collector | ConvertTo-SbSnapshot)
          }
          $params = @{ ComputerName = $ComputerName; ScriptBlock = $script:Collector
                       ThrottleLimit = $ThrottleLimit }
          if ($Credential) { $params.Credential = $Credential }
          Invoke-Command @params | ConvertTo-SbSnapshot
      }
    narration: >
      Collection is one Invoke-Command. PowerShell remoting is enabled by default on Windows Server, so there's
      nothing to install on the targets. Give it a list of computer names and it runs the collector on all of them in
      parallel, up to the throttle limit, and streams the results back. Without computer names, it runs locally.

  - id: collector
    type: code
    heading: "The collector: facts, not opinions"
    lang: powershell
    code: |
      $pending = [pscustomobject]@{
          ComponentBasedServicing = Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Component Based Servicing\RebootPending'
          WindowsUpdate           = Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Auto Update\RebootRequired'
          PendingFileRename       = ($null -ne $pfro)
          ComputerRename          = ($activeName -ne $pendingName)
      }
      $timeSource = ((& w32tm.exe /query /source) | Out-String).Trim()

      # Domain controllers have no local SAM (DomainRole 4 and 5)
      if ($cs.DomainRole -lt 4) {
          # By SID, so it also works on non-English installs
          $localAdmins = @(Get-LocalGroupMember -SID 'S-1-5-32-544' | ForEach-Object { [string]$_.Name })
      }
    narration: >
      The collector only gathers facts: build and patch level, disks, stopped automatic services, features,
      hotfixes, four pending reboot signals, the time source, firewall profiles, and the local Administrators group,
      read by its well known S I D so it works in any language. A domain controller has no local users and groups
      to manage, so we skip that part there.

  - id: ps51
    type: code
    heading: "The remote side is Windows PowerShell 5.1"
    lang: powershell
    code: |
      using namespace System.Management.Automation.Language

      It 'has no PowerShell 7-only syntax (remote sessions run Windows PowerShell 5.1 by default)' {
          $ternary  = & $script:Find { param($n) $n -is [TernaryExpressionAst] }
          $chain    = & $script:Find { param($n) $n -is [PipelineChainAst] }
          $coalesce = & $script:Find {
              param($n)
              ($n -is [BinaryExpressionAst] -and "$($n.Operator)" -eq 'QuestionQuestion') -or
              ($n -is [AssignmentStatementAst] -and "$($n.Operator)" -eq 'QuestionQuestionEquals')
          }
          # ... plus null-conditional member access
          $ternary.Count + $chain.Count + $coalesce.Count + $nullConditional.Count | Should -Be 0
      }
    narration: >
      Here's a detail that bites people. We run PowerShell seven locally, but on the server the session lands in the
      default endpoint, which is Windows PowerShell five point one. So the collector can't use the null coalescing
      operator, the ternary or pipeline chains. Instead of hoping, a Pester test parses the collector and fails the
      build if one of them sneaks in.

  - id: baseline
    type: code
    heading: "The baseline is data"
    lang: json
    code: |
      {
        "MinimumBuild": 26100,
        "PreferServerCore": true,
        "MaxUptimeDays": 35,
        "MaxDaysSinceLastUpdate": 45,
        "MinFreePercent": 20,
        "CriticalFreePercent": 10,
        "ForbiddenFeatures": ["FS-SMB1", "Telnet-Client"],
        "RequiredFeatures": [ { "Server": "CON-DC*", "Features": ["AD-Domain-Services", "DNS"] } ],
        "BadTimeSources": ["Local CMOS Clock", "Free-running System Clock"],
        "AllowedLocalAdmins": ["Administrator", "Domain Admins", "GG-Server-Admins"]
      }
    narration: >
      The rules live in a JSON file. Build twenty six one hundred is Windows Server 2025. Thirty five days of uptime,
      forty five days since the last update, twenty percent free disk. SMB one and the Telnet client are forbidden.
      Domain controllers need A D D S and DNS. Change the file, not the script.

  - id: checks
    type: code
    heading: "Snapshot in, findings out"
    lang: powershell
    code: |
      $reasons = @()
      if ($s.PendingReboot.ComponentBasedServicing) { $reasons += 'Component Based Servicing' }
      if ($s.PendingReboot.WindowsUpdate)           { $reasons += 'Windows Update' }
      if ($s.PendingReboot.ComputerRename)          { $reasons += 'computer rename' }
      if ($reasons) {
          $out.Add((New-SbFinding $name High 'PendingReboot' "Reboot pending: $($reasons -join ', ')."))
      }
      elseif ($s.PendingReboot.PendingFileRename) {
          # Applications queue file renames too: not a reason to block maintenance
          $out.Add((New-SbFinding $name Info 'PendingFileRename' '...'))
      }
    narration: >
      Test S B baseline takes a snapshot, the baseline and the current time, so tests are repeatable. Each rule adds
      a finding with a severity. Servicing, Windows Update or a computer rename means a real pending reboot: High.
      Pending file renames on their own are only Info, because applications queue them too.

  - id: tests
    type: code
    heading: "Thirty-two tests, no servers"
    lang: text
    code: |
      PS> Invoke-Pester ./tests -Output Detailed
      Describing Collector script
        [+] has no PowerShell 7-only syntax (remote sessions run Windows PowerShell 5.1 by default)
        [+] calls no ServerBaseline function (it must be self-contained to run remotely)
      Describing Test-SbBaseline: individual checks
        [+] treats a Windows Update reboot as High
        [+] flags a domain controller running on its own CMOS clock
        [+] grades disk space: 5 GB free of 100 is High
        ...
      Describing Invoke-ServerBaseline.ps1 (offline, end to end)
        [+] writes the report and exits 1 with -FailOnHigh

      Tests Passed: 32, Failed: 0, Skipped: 0
    narration: >
      The tests use three saved snapshots of fictional servers. Thirty two Pester tests cover every rule, the report,
      the script's exit code, and the collector itself: no PowerShell seven syntax, and no calls back into the module,
      because only the script block travels to the server.

  - id: live-run
    type: screen
    heading: "Three servers, one command"
    image: screens/live-run.jpg
    bar: "Lab · PowerShell 7 on the admin VM"
    demo: >
      Terminal on the lab admin machine. Run:
      ./Invoke-ServerBaseline.ps1 -ComputerName CON-DC01, CON-FS01, CON-APP01 -SnapshotDir ./snapshots -OutFile ./report.md
      Show the full findings table and the summary line "3 server(s), N finding(s), N high."
    narration: >
      Now the real lab. From the admin machine, one command against all three servers. The snapshots are saved as
      JSON, so we can re-check them later without touching the servers. Rewrite this line to the real result on
