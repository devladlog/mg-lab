    youtube_short_title: "Get-HotFix does not list every Windows update #Shorts"
    instagram_reel:
      caption: |
        The gotcha in our update check: Get-HotFix reads the Win32 Quick Fix Engineering class, and that class only returns updates from Component Based Servicing. Updates delivered by Windows Installer or the Windows Update site are not in it. Good for cumulative updates, so when it finds nothing dated, look at the update history instead.

        Full episode: link in bio

