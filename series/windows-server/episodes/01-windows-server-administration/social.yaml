linkedin_company:
  text: |
    A pending reboot nobody noticed. A firewall profile switched off during a test. A file server that stopped patching months ago. Is every server where you think it is?

    Episode 1 of DEVLADLOG Windows Server checks every server against one baseline file with a single PowerShell remoting command, on a fictional Contoso lab.

    - A collector runs over Invoke-Command, in parallel, with nothing to install on the targets
    - The rules live in a JSON baseline: build, patch age, disk space, forbidden and required features
    - Pure checks turn a snapshot into findings, worst first, in a markdown report
    - 32 Pester tests run on Linux, with no servers

    The gotcha: the remote side is Windows PowerShell 5.1, so a collector that uses the ternary operator or ?? works locally and fails on every server. A test parses the collector and fails the build if one sneaks in.

    Watch the episode: {YOUTUBE_URL}
    Code, baseline and tests: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.
    #WindowsServer #PowerShell #Pester #SysAdmin
linkedin_personal:
  text: |
    The bug that taught me most this month: a PowerShell collector that worked perfectly on my machine and failed on every server. I run PowerShell 7 locally, but the remote session lands in the default endpoint, which is Windows PowerShell 5.1. No ??, no ternary, no pipeline chains there.

    So in the first DEVLADLOG Windows Server episode a Pester test parses the collector and fails the build if any of that syntax appears. The lesson: test for the runtime your code will really run on, not the one on your laptop.

    {YOUTUBE_URL}

    #WindowsServer #PowerShell
    Narration uses an AI voice.
