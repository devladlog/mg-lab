  - id: aging
    youtube_short_title: "DNS scavenging: why stale records stay and live ones vanish #Shorts"
    instagram_reel:
      caption: |
        Aging and scavenging are two switches, and you need both: scavenging on the server, aging on the zone. A record is stale after the no-refresh plus the refresh interval, 14 days by default. Static records have a zero timestamp and are never scavenged. And if both intervals add up to less than a day, records of live machines get deleted.

        Full episode: link in bio

        #DNS #WindowsServer #SysAdmin
      cover_text: "TWO SWITCHES, NOT ONE"
