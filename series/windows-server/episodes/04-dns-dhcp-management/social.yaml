linkedin_company:
  text: |
    You add a reservation on one DHCP server. Its failover partner never hears about it. If the partner answers that printer, it does not know the reservation.

    Episode 4 of DEVLADLOG Windows Server builds DNS and DHCP from one file on a fictional Contoso lab and checks them against each other.

    - An isolated Hyper-V private switch, so a test DHCP server can never hand out addresses where it should not
    - DNS: a computed reverse zone, A and PTR records, aging and scavenging set up properly
    - DHCP: both servers authorized, a scope, a reservation and a load balanced failover relationship
    - One snapshot of DNS and DHCP, and a report that flags a static DNS record inside a DHCP pool
    - 42 Pester tests, no servers needed

    The gotcha: creating a failover relationship copies the scope once. Later changes stay on the server where you made them until you run replication from the primary.

    Watch the episode: {YOUTUBE_URL}
    Code and tests: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.
    #DHCP #DNS #WindowsServer #PowerShell
linkedin_personal:
  text: |
    A fact about DHCP failover that surprised me: creating the relationship copies the scope to the partner once. After that, a new reservation or option stays on the server where you added it. The partner has no idea, so one server shows one reservation and the other shows two.

    In the fourth DEVLADLOG Windows Server episode the deployment calls Invoke-DhcpServerv4FailoverReplication from the primary whenever it changes a failover scope, and the report flags the drift as High. The lesson: failover syncs leases, not your edits.

    {YOUTUBE_URL}

    #DHCP #WindowsServer
    Narration uses an AI voice.
