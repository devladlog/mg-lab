linkedin_company:
  text: |
    Four of our five lab servers have no desktop at all. They all get one browser tab: Windows Admin Center, installed as a gateway with a script.

    Episode 6 of DEVLADLOG Windows Server covers the gateway end to end on a fictional Contoso lab.

    - Where to install it: not on a domain controller, which Microsoft does not support, and not on a machine outside the domain
    - A preflight that checks the domain role, port 443, the certificate and WinRM to every node before anything is installed
    - Connections kept as a JSON file, validated, then imported and shared with Import-WACConnection
    - Single sign-on through Kerberos delegation
    - Read-only helpdesk access through role-based access control
    - 41 Pester tests, no gateway needed

    The gotcha: the one-liner in the docs, Set-ADComputer with PrincipalsAllowedToDelegateToAccount, replaces the whole list and can silently remove another gateway.

    Watch the episode: {YOUTUBE_URL}
    Code and tests: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.
    #WindowsAdminCenter #WindowsServer #PowerShell #SysAdmin
linkedin_personal:
  text: |
    A one-liner from the docs that I will not paste blindly again. Single sign-on from a Windows Admin Center gateway needs Kerberos delegation, and the documented command uses Set-ADComputer with PrincipalsAllowedToDelegateToAccount. That parameter sets the attribute. If another gateway was already allowed, it is silently removed.

    In the sixth DEVLADLOG Windows Server episode the script reads the current list, adds our gateway and writes the whole list back. The lesson: when a cmdlet sets instead of adds, read first.

    {YOUTUBE_URL}

    #WindowsAdminCenter #PowerShell
    Narration uses an AI voice.
