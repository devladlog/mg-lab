episode: 8
series: "DEVLADLOG Windows Server"
status: draft-hold-for-review
ai_label: true
youtube_url: "{YOUTUBE_URL}"
linkedin_company:
  text: |
    Most security guides give you a long list of settings and a dare. Episode 8 of DEVLADLOG Windows Server does it the other way round: a script reads the lab, writes the plan as a table, and remembers every value it is about to replace, so you can put it all back.

    - A read-only check over WinRM: SMB signing and SMB 1, NTLM level, WDigest, Credential Guard, LDAP signing, process creation auditing, Defender and Windows LAPS policy
    - Rules that say what they know: a missing LDAP signing value is not a finding, only an explicit zero is High
    - A rollback file that is the plan reversed, with manual steps where the old value is unknown
    - Windows LAPS in Active Directory, with the schema update marked irreversible and refused without a switch
    - 39 Pester tests with remoting, Group Policy and LAPS commands mocked

    The gotcha: two Learn pages disagree about SMB signing defaults on Windows Server 2025, so the check reads the real values on every server instead of assuming.

    Watch the episode: {YOUTUBE_URL}
    Code and tests: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.
    #WindowsServer #WindowsLAPS #Security #PowerShell
linkedin_personal:
  text: |
    Two Microsoft Learn pages disagree about SMB signing on Windows Server 2025. One says it requires outbound signing only. The other says outbound and inbound are both required by default. I could pick one and hope.

    In the eighth DEVLADLOG Windows Server episode the check does not assume either. It reads the real values on every server. Requiring signing also turns off guest access, which can break third-party shares. The lesson: never trust a default, read the actual value.

    {YOUTUBE_URL}

    #WindowsServer #Security
    Narration uses an AI voice.
