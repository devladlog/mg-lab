linkedin_company:
  text: |
    Copilot knows Microsoft 365. It does not know your vendor register. A declarative agent fixes that: your instructions, your API, and Copilot's own model and orchestrator. The only thing you host is one small API.

    Episode 17 of DEVLADLOG Copilot & AI builds the Contoso Vendor Desk the pro-code way:
    - Four files that matter: the app manifest, the agent manifest, the plugin manifest and the OpenAPI description
    - A validator that uses Microsoft's published schemas, plus Learn's OpenAPI rules: no nested objects, no oneOf, https only, a description on everything
    - A contract test that checks every API response against the schema Copilot reads
    - The write function asks for confirmation first, and the key never goes in the manifest
    - 78 tests, run before the package ever touches a tenant

    Learn now recommends Work IQ Dev Tools for supported pro-code agents. We wrote the files by hand once, to see what the tools generate.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}

    Narration uses an AI voice.

    #Microsoft365 #MicrosoftCopilot #DeclarativeAgents #OpenAPI
linkedin_personal:
  text: |
    In a Copilot declarative agent, the API description is a prompt. Copilot reads it to decide which function to call.

    So I added a contract test that calls the real API code and checks every response against the schema in that description. If the two drift apart, the test fails before Copilot ever sees the difference.

    Two more habits: every write asks for confirmation, and the API key lives in the Teams developer portal, never in the manifest.

    Episode 17 of DEVLADLOG Copilot & AI: {YOUTUBE_URL}

    Narration uses an AI voice.

    #Microsoft365 #MicrosoftCopilot
