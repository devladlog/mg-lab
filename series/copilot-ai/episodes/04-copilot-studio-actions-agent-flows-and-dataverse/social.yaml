linkedin_company:
  text: |
    Last time the agent answered questions. Now Contoso wants it to file the vendor request itself, and some rules must never be left to a language model.

    Episode 4 of DEVLADLOG Copilot & AI splits the work:
    - The model understands the request and asks for missing values
    - Power Fx in the topic holds the exact rules: 25,000 euros and above needs the finance director and a security review, 5,000 and above the procurement manager, anything else the team lead
    - An agent flow writes the row, and Dataverse owns the request number through an autonumber column
    - The Power Fx formulas run in unit tests, including the exact boundaries

    A flow only appears as a tool if it has the agent trigger and a respond action, is published, is not asynchronous, and answers within 100 seconds.

    We also estimate the cost: about 5.4 Copilot Credits per request.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}

    Narration uses an AI voice.

    #CopilotStudio #Dataverse #PowerFx #PowerPlatform
linkedin_personal:
  text: |
    If a rule must be exact, do not leave it to the language model.

    In this Copilot Studio build, the approval tier is a Power Fx formula with unit tests on the boundaries (exactly 5,000 and exactly 25,000 euros). The request number comes from a Dataverse autonumber column. The model only understands the request and asks for what is missing.

    A wrong approver is a business problem, not a typo.

    Episode 4 of DEVLADLOG Copilot & AI: {YOUTUBE_URL}

    Narration uses an AI voice.

    #CopilotStudio #PowerFx #Dataverse
