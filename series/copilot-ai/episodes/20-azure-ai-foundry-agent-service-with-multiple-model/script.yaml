    type: outro
    heading: "Code on GitHub, guides on devladlog.com"
    sub: "github.com/devladlog/mg-lab"
    narration: >
      The Bicep, the runner and the tests are on GitHub. Next time, Claude in the Microsoft ecosystem, including in
      Foundry. See you there.
