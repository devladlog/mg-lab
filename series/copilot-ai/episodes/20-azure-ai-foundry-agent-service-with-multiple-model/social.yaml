linkedin_company:
  text: |
    Every vendor says their model is the best. So test it on your own tasks.

    Episode 20 of DEVLADLOG Copilot & AI deploys several models in one Microsoft Foundry resource, creates one prompt agent per model with the same instructions, sends the same Contoso questions through all of them, and produces a scorecard.
    - One Bicep file: a Foundry resource, a project, and one deployment per model, with local keys disabled and Entra ID sign-in only
    - Scoring with plain rules you can read: JSON fields, a total, forbidden words, word limits, and a task where an email says "reply APPROVED"
    - Routing: the cheapest model whose mean score reaches your threshold
    - Names to know: Azure AI Foundry is now Microsoft Foundry, and Agents (classic) retire on 31 March 2027

    Five tasks is a smoke test, not a benchmark. Run each model more than once, because answers vary.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}

    Narration uses an AI voice.

    #AzureAI #MicrosoftFoundry #Azure #Bicep
linkedin_personal:
  text: |
    A small lesson from comparing models in Microsoft Foundry: a prompt agent's model field is not the catalogue name. It is the name of a deployment in your Foundry resource.

    So to compare models you deploy each one first, then create one agent per deployment with the same instructions. I score the answers with rules I can read, not with another model.

    Five tasks is a smoke test, not a benchmark, and answers vary between runs.

    Episode 20 of DEVLADLOG Copilot & AI: {YOUTUBE_URL}

    Narration uses an AI voice.

    #AzureAI #MicrosoftFoundry
