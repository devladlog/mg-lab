linkedin_company:
  text: |
    Copilot can build Dataverse tables and a canvas app for an equipment loan app in minutes, and then write formulas that look right. Looking right is not the same as being right.

    Episode 5 of DEVLADLOG Copilot & AI uses Copilot in Power Apps, then checks what it wrote:
    - What Copilot does for a maker: tables from a description, a canvas app, explain a formula, write one from a comment
    - A small tool, Power Fx Review, built on Microsoft's Power Fx engine: it reads formulas from the app source files, checks syntax, names and result type, and runs a formula on sample rows
    - Rules for hard-coded addresses, Patch calls with no IfError, and delegation
    - 40 passing tests, and a clear list of where the standalone engine differs from Studio

    Delegation is the trap: Learn says a nondelegable query sees only the first 500 rows by default, and Studio does not warn in every case.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}

    Narration uses an AI voice.

    #PowerApps #PowerFx #PowerPlatform #MicrosoftCopilot
linkedin_personal:
  text: |
    Copilot in Power Apps will happily write you a formula. I wanted to know if it was right before the app ships.

    So I built a small checker on Microsoft's Power Fx engine. It reads the formulas from the app source files, checks syntax, names and result type, and can run a formula on sample rows.

    The honest part: it is not Studio. The engine refuses a Filter with several predicates that Learn says canvas apps accept, and delegation warnings in Studio still get the last word.

    Episode 5 of DEVLADLOG Copilot & AI: {YOUTUBE_URL}

    Narration uses an AI voice.

    #PowerApps #PowerFx
