linkedin_company:
  text: |
    Type one sentence and Copilot in Power Automate builds the trigger and the actions of a cloud flow. At Contoso the sentence is: remind every borrower of an overdue equipment loan. The flow it builds is a draft, so we review it with code.

    Episode 6 of DEVLADLOG Copilot & AI covers:
    - What Copilot does in cloud flows: create from a prompt, edit in the designer pane, explain a flow, troubleshoot a failed run
    - Prompts that work, per Learn: name the connector, one request per message, give field names
    - A reviewer that reads an exported flow definition: no time zone on a recurrence, a typed copy address, no path for failure, and a date format that looks fine and is not
    - 43 tests

    Learn also lists what Copilot cannot do yet: debug runtime errors from the designer, read your lists, or fix an expired connection.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}

    Narration uses an AI voice.

    #PowerAutomate #PowerPlatform #MicrosoftCopilot #CopilotStudio
linkedin_personal:
  text: |
    Copilot builds the flow. It does not run it, and it does not review it for you.

    A first draft from a prompt tends to have the habits of a draft: a recurrence with no time zone, a hard-coded email address, no path when an action fails. So I wrote a reviewer that reads the exported flow definition and checks those.

    One I like: formatDateTime takes .NET patterns, and a capital D is not a date specifier.

    Episode 6 of DEVLADLOG Copilot & AI: {YOUTUBE_URL}

    Narration uses an AI voice.

    #PowerAutomate #PowerPlatform
