  - id: gotcha
    youtube_short_title: "Power Automate expressions: a capital D is not a date format #Shorts"
    instagram_reel:
      caption: |
        Learn's own sample prompt for the expression assistant is: format trigger date to DD-MM. But the format argument of formatDateTime is a .NET pattern, and in those patterns a capital D is not a specifier.

        Our checker only warns. The only real evaluation is to run the flow and open the output of the Compose action.

        Full episode: link in bio
        #PowerAutomate #PowerPlatform #DotNet
      cover_text: "D is not a date format"
    tiktok:
