linkedin_company:
  text: |
    Before anyone in your tenant uses Claude through Microsoft, someone has to read the fine print on the admin switch. In the EU, EFTA and the UK it is off by default, and Claude in these offerings is currently excluded from the EU Data Boundary.

    Episode 21 of DEVLADLOG Copilot & AI follows Claude through the Microsoft stack, on Contoso's vendor renewal data:
    - The Microsoft 365 admin center setting that makes Anthropic a Microsoft subprocessor, and why Copilot Studio needs a second switch in the Power Platform admin center
    - A Claude deployment in Microsoft Foundry, written in Bicep, including the model provider data that accepts the Marketplace terms on your behalf
    - Python with the Anthropic SDK and Entra ID: a tool, the loop that runs it, and an injected supplier note in the data
    - Claude Code pointed at your Foundry deployment with four environment variables

    The gotchas are covered too: no built-in content filter for Claude on Foundry, no Batches API, and a default quota that can be zero.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}

    Narration uses an AI voice.

    #Azure #AzureAI #MicrosoftCopilot #Claude #Bicep
linkedin_personal:
  text: |
    Turning on Claude in a Microsoft 365 tenant is a data protection decision, not just a toggle. In the EU, EFTA and the UK the setting is off by default, because Claude in these offerings sits outside the EU Data Boundary.

    For episode 21 of DEVLADLOG Copilot & AI I walked through the admin switch, then deployed Claude in Foundry with Bicep and called it from Python with Entra ID. One thing to remember: Foundry adds no content filter for Claude, so you add your own.

