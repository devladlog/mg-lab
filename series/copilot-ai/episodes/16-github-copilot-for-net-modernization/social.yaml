linkedin_company:
  text: |
    A dealer quote service still runs on .NET Framework 4.7.2. Everyone agrees it should move, and nobody wants to touch it. Episode 16 of DEVLADLOG Copilot & AI uses GitHub Copilot upgrade to move it to .NET 10, with tests as the safety net.

    What the episode covers:
    - The three stages, saved in your repo under .github/upgrades: assessment, plan, then tasks with a build and test after each task
    - The names: Learn now says GitHub Copilot upgrade (formerly app modernization), and the .NET Upgrade Assistant is deprecated in its favour
    - Characterization tests run against three implementations. The reference upgrade passes; a naive find-and-replace of Newtonsoft with System.Text.Json compiles and fails five tests
    - A scanner, an upgrade folder checker and an instruction linter, with 40 tests

    Whoever does the upgrade, human or agent, needs tests that know where the behaviour differs.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}

    Narration uses an AI voice.

    #DotNet #GitHubCopilot #Modernization #VisualStudio
linkedin_personal:
  text: |
    Swapping JsonConvert for JsonSerializer compiles. It also breaks things.

    In this episode's legacy app, a naive find-and-replace passes the build and fails five characterization tests. Default System.Text.Json is case sensitive, does not read numbers from strings, and throws on empty input where Newtonsoft returned null.

    Whether a human or an agent does the upgrade, write the tests against the legacy code first.

    Episode 16 of DEVLADLOG Copilot & AI: {YOUTUBE_URL}

    Narration uses an AI voice.

    #DotNet #GitHubCopilot
