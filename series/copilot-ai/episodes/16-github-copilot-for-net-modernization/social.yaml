    instagram_reel:
      caption: |
        The gotcha. After the upgrade the app uses Microsoft.Data.SqlClient, which encrypts by default since version 4. A SQL Server with only its self-signed certificate fails with a certificate chain error.

        For a lab you can trust the certificate. In production, install a certificate the client trusts. Learn says not to use that setting as a general migration fix.

