linkedin_company:
  text: |
    Microsoft says SharePoint .agent files stop responding after the end of March 2027, and it does not upgrade them for you. If your vendor office or HR team built one, you need a plan.

    Episode 9 of DEVLADLOG Copilot & AI sorts out three things that all get called "agent" in SharePoint, and builds a tool to prioritise the upgrade:
    - Copilot in SharePoint, the chat on the site, versus .agent files versus Copilot Agent Builder agents
    - The four upgrade paths Learn gives: use Copilot in SharePoint, convert to a skill, upgrade with Agent Builder, or publish a Copilot Studio agent to the Copilot app
    - A read-only PnP script that inventories .agent files and a planner that ranks agents against Learn's seven priority factors
    - A linter for a site skill (a Markdown file), with every rule naming its source

    Our lab has no Microsoft 365 Copilot licence, so we say which screens that affects.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}

    Narration uses an AI voice.

    #SharePoint #Microsoft365 #MicrosoftCopilot #PnPPowerShell
linkedin_personal:
  text: |
    A date worth putting in a calendar: end of March 2027. Per Microsoft Learn, SharePoint .agent files stop responding then, and Microsoft does not upgrade them for you.

    Learn says to start with an inventory, so I wrote a read-only script that searches for the agent extension. One limit worth knowing: search returns only the agents you have permission to see, so it is not an admin-wide report.

    Episode 9 of DEVLADLOG Copilot & AI: {YOUTUBE_URL}

    Narration uses an AI voice.

