    type: bullets
    heading: "Where this fits in the series"
    bullets:
      - "Episode 20: several cloud models, one scorecard"
      - "Episode 24: Copilot, Claude, GPT, Gemini and this local model"
      - "Local for sensitive text, cloud for the hard tasks"
    narration: >
      Local is not a replacement for the cloud. It is another tool: sensitive text and cheap bulk work here, the hard
      tasks in the cloud. Episode twenty compared cloud models. Next, episode twenty four puts a local model in the same
      contest as Copilot, Claude, G P T and Gemini.

