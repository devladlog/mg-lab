linkedin_company:
  text: |
    Contoso's accounts payable gets vendor emails with amounts and bank details. Legal asks one question: can an AI read them without the text leaving the building?

    Episode 23 of DEVLADLOG Copilot & AI answers it with a model on your own graphics card, and a small Python toolkit that makes the answer measurable:
    - Sizing: weights plus the KV cache, which grows with context, checked against free video memory
    - Benchmark: tokens per second from the server's own timings, with the warm-up run left out and the placement (GPU or CPU) shown next to the speed
    - Extraction: a JSON schema in the request on an invoice email that carries a prompt-injection line and a bank-detail change, plus a guard that refuses non-local hosts
    - Probe: which local servers answer (Ollama, LM Studio, Microsoft Foundry Local)

    Gotchas we cover: Ollama's default context is 4096 tokens, so a long email can be cut silently, and Foundry Local is built for one user at a time, not as a server.

    Watch the episode: {YOUTUBE_URL}
    Code and tests: {REPO_URL}

    Narration uses an AI voice.

    #AzureAI #Ollama #LocalLLM #FoundryLocal
linkedin_personal:
  text: |
    The part of running a model locally that surprised me is not the weights, it is the KV cache. It grows with the context length, so a model that fits at 4096 tokens can spill into system memory at a bigger context, and it still runs, only much slower.

    So I stopped trusting the size on disk. The toolkit in this episode estimates the fit, then asks Ollama where the model really sits, and I read that placement next to the tokens per second.

    Episode 23 of DEVLADLOG Copilot & AI: {YOUTUBE_URL}

    Narration uses an AI voice.

    #Ollama #AzureAI
