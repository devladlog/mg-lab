linkedin_company:
  text: |
    Copilot in Power BI does not need a per-user licence. It needs a paid capacity, and a free Fabric trial cannot run it.

    Episode 7 of DEVLADLOG Copilot & AI works with the smallest paid option and a model nobody prepared:
    - What it needs: Fabric F2 or higher, or Premium P1 or higher; per Learn, trial capacities are not supported and Pro or PPU alone is not enough
    - What it costs: tokens, not seats. Learn publishes the rates in capacity unit seconds per 1,000 tokens, and a test reproduces Learn's own example
    - A linter for the semantic model: measures with no description, and Country defined twice
    - AI instructions, Prep data for AI, descriptions as code in TMDL, and golden questions computed independently of Power BI

    One Learn page contradicts the others on trial support. We followed the majority and say so.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}

    Narration uses an AI voice.

    #PowerBI #MicrosoftFabric #MicrosoftCopilot #TMDL
linkedin_personal:
  text: |
    Before you plan a Copilot in Power BI demo, read the requirements. I almost did not.

    Learn says Copilot needs a paid capacity, F2 or Premium P1 and up. Trial capacities are not supported, and our lab only had the Fabric trial. So that episode costs real money, and we say so at the start.

    What you control is the model: descriptions, AI instructions, and a few golden questions with answers computed outside Power BI.

    Episode 7 of DEVLADLOG Copilot & AI: {YOUTUBE_URL}

    Narration uses an AI voice.

    #PowerBI #MicrosoftFabric
