linkedin_company:
  text: |
    Everyone at Contoso already has Copilot Chat and nobody bought anything. So what can it do, what can it not do, and what can the admin see and control?

    Episode 2 of DEVLADLOG Copilot & AI covers both sides:
    - Users: Copilot Chat (Basic) answers from the web under enterprise data protection, and sees your files only if you upload them or open them in Outlook or Teams
    - The trap: without the paid add-on it has no Microsoft Graph grounding, so it does not read your mailbox on its own
    - Admins: the "Allow web search in Copilot" policy, pinning, blocking through Integrated Apps (tenant-wide, licensed users included), and tenant restrictions for personal accounts
    - Audit: a script and a Python analyzer for Copilot Interaction records, with 18 tests

    Audit records are metadata. Prompt text belongs to eDiscovery or Purview DSPM for AI.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}

    Narration uses an AI voice.

    #MicrosoftCopilot #Microsoft365 #CopilotChat #Purview
linkedin_personal:
  text: |
    A question every Microsoft 365 admin gets now: "Can Copilot Chat see my email?"

    Without the add-on, Learn says no: Copilot Chat (Basic) cannot use Microsoft Graph. It works from the web, plus files you upload or open in Outlook or Teams. The fix is the Premium licence or pasting the text, not a setting.

    I also learned that the audit log gives you who, when, which app and which files, but not the prompt text.

    Episode 2 of DEVLADLOG Copilot & AI: {YOUTUBE_URL}

    Narration uses an AI voice.

    #MicrosoftCopilot #Microsoft365
