linkedin_company:
  text: |
    Copilot can write T-SQL inside SSMS and inside the Azure portal. But who is it running as, what can it change, and who reads the code before you press Execute?

    Episode 11 of DEVLADLOG Copilot & AI looks at GitHub Copilot in SSMS 22, Azure Copilot on Azure SQL, and the controls that really protect your data:
    - Ask mode gives one answer; agent mode works in steps and asks before each query, and it does not inherit your editor connection, so name the server and database
    - Per Learn, the approval prompt is not a security boundary. SQL Server permissions are
    - A database constitution can make SSMS run Copilot queries as a least-privilege user with EXECUTE AS, which needs IMPERSONATE
    - A Python review gate that blocks writes in read-only mode, UPDATE or DELETE without WHERE, and xp_cmdshell, with 61 tests

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}

    Narration uses an AI voice.

    #SQLServer #SSMS #AzureSQL #GitHubCopilot
linkedin_personal:
  text: |
    Microsoft Learn says it three times: in SSMS, Copilot's approval prompt is not the security boundary. SQL Server's permission enforcement is.

    By default Copilot queries run as the login you connected with. A database constitution can name a least-privilege user, and SSMS then runs Copilot queries as that user. Grant select, nothing else, and add rights one by one.

    I also wrote a small review gate for any T-SQL that travels into tickets and pipelines. It is a second pair of eyes, not a boundary.

    Episode 11 of DEVLADLOG Copilot & AI: {YOUTUBE_URL}

    Narration uses an AI voice.

    #SQLServer #GitHubCopilot
