linkedin_company:
  text: |
    "Which Copilots do we already pay for, and which ones are free?" Sounds simple. There are more than a dozen products with that name, and the answers sit in a dozen different documentation sets.

    In episode 1 of DEVLADLOG Copilot & AI we sort them out:
    - Five families share the name, from Copilot Chat to GitHub Copilot to Copilot inside SQL Server Management Studio
    - What is genuinely free: Copilot Chat with a work account, Azure Copilot (apart from one agent that bills by usage), GitHub Copilot Free
    - What costs money, and what is metered instead of per user, such as Copilot Credits and Security Copilot compute units
    - A verified catalog in code: a test fails if a price has no official Microsoft or GitHub source

    One gotcha to plan around: Copilot in Power BI and Fabric needs a paid capacity, and Microsoft Learn says trial capacities are not supported.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}

    Narration uses an AI voice.

    #MicrosoftCopilot #Microsoft365 #CopilotLicensing #GitHubCopilot
linkedin_personal:
  text: |
    I started this series with a boring question that turned out not to be boring: which Copilots does a company already pay for?

    The name covers more than a dozen products, and each one has its own licence story. So I put them in one catalog file where every price must carry an official source, and a test fails if one does not.

    The lesson I took from it: name the Copilot before you price it, and check the tenant, not the brochure.

    Episode 1 of DEVLADLOG Copilot & AI: {YOUTUBE_URL}

    Narration uses an AI voice.

    #MicrosoftCopilot #Microsoft365
