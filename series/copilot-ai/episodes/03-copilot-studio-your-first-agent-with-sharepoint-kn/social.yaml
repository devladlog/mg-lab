linkedin_company:
  text: |
    A Copilot Studio agent that answers from your SharePoint documents is quick to build. The hard part is understanding why it sometimes says nothing at all.

    Episode 3 of DEVLADLOG Copilot & AI builds the Contoso Vendor Desk, an agent grounded in five policy documents across two libraries, one of them restricted.
    - A checker that flags files before upload: a PDF over the 7 MB limit, classic aspx pages, videos, password-protected files
    - Why silence usually means permissions, index, or protection: a user without Read access gets no result and no error
    - Web search and general knowledge turned off, so answers come only from the documents
    - A test set generated from the same source files, imported into Copilot Studio as an evaluation, and 33 tests in the repo

    Build, break, test.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}

    Narration uses an AI voice.

    #CopilotStudio #PowerPlatform #SharePoint #MicrosoftCopilot
linkedin_personal:
  text: |
    The most confusing support call for a Copilot Studio agent: "it just says nothing."

    Microsoft Learn documents why. If the signed-in user has no access to a file, the agent gets no results and raises no error. It behaves as if the document does not exist. Good for security, confusing for support.

    So in this episode I check files before upload, turn off web and general knowledge, and keep a test set next to the content.

    Episode 3 of DEVLADLOG Copilot & AI: {YOUTUBE_URL}

    Narration uses an AI voice.

    #CopilotStudio #SharePoint
