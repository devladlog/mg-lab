linkedin_company:
  text: |
    Copilot respects permissions. That sounds safe until you remember how many files are open to everyone. Copilot does not create oversharing. It finds it, in seconds.

    Episode 19 of DEVLADLOG Copilot & AI measures it, puts Purview guardrails around it, and writes the checks as code. Three layers:
    - Reach: permissions, sharing links and discovery
    - Protection: sensitivity labels and DLP for the Copilot location
    - Proof: audit, retention and activity explorer
    - Data Security Posture Management in Purview is the front door. The older DSPM for AI is now labelled classic, and Microsoft says new features go to the current version only

    We also snapshot the settings with a read-only script, so you can diff a posture between rollout waves. Several features sit behind a Copilot licence or SharePoint Advanced Management, and the lab has neither, so we say where that applies.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}

    Narration uses an AI voice.

    #Purview #Microsoft365 #MicrosoftCopilot #DLP
linkedin_personal:
  text: |
    Copilot does not create oversharing. It finds what was already open to everyone, in seconds.

    So before a Copilot rollout I want a snapshot I can diff: audit setting, labels, DLP policies, SharePoint sharing settings and each site, in one JSON file. If a section cannot be read, the error is recorded. It is never silently counted as a pass.

    Run it before each wave and keep the JSON in version control.

    Episode 19 of DEVLADLOG Copilot & AI: {YOUTUBE_URL}

    Narration uses an AI voice.

    #Purview #Microsoft365
