      caption: |
        The honest limits. A labelled file is not processed, but it can still appear as a citation, so the user gets a link, not a summary. Files uploaded into a prompt are not scanned by DLP, only the typed text.

        In Word, Excel and PowerPoint the policy is evaluated when the file opens. And the Copilot location lives only in the Custom policy template.

