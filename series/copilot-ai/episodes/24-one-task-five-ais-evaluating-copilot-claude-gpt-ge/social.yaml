linkedin_company:
  text: |
    Every vendor says theirs is the best AI. Contoso's procurement team asked a better question: which AI should we use for what?

    Episode 24 of DEVLADLOG Copilot & AI builds a small evaluation harness in Python and runs the same seven tasks, with the same words, through five AIs: Copilot Chat, Claude, GPT, Gemini and a local model.
    - Tasks: a policy question, one the policy does not answer, an invoice email with an injected instruction, a Python function run against test cases, a Graph PowerShell cmdlet name, a word-limited summary, and a discount-then-VAT sum
    - Scoring: plain rules, not another model, then a blind review with shuffled labels
    - Copilot Chat is collected by hand: Learn lists the Chat API as preview and for users with the Copilot add-on licence

    We do not crown a winner. We route by task and re-run when a vendor changes a model.

    Watch the episode: {YOUTUBE_URL}
    Code and tests: {REPO_URL}

    Narration uses an AI voice.

    #MicrosoftCopilot #AzureAI #LLM #AIEvaluation
linkedin_personal:
  text: |
    Seven tasks is a smoke test, not a benchmark. That is the lesson I keep relearning when comparing AI models.

    In this episode I run the same seven Contoso tasks through Copilot Chat, Claude, GPT, Gemini and a local model, score them with plain rules, then review the answers blind. Copilot Chat is not a controlled experiment: no model choice, no system prompt, no seed. So I do not crown a winner. I add tasks from real work, repeat the API runs, and read the failed checks, not just the average.

    Episode 24 of DEVLADLOG Copilot & AI: {YOUTUBE_URL}

    Narration uses an AI voice.

    #MicrosoftCopilot #AIEvaluation
