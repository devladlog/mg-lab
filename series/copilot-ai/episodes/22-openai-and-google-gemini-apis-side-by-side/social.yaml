linkedin_company:
  text: |
    Everyone says the OpenAI and Gemini APIs are basically the same. Then your strict schema is rejected, your token limit returns half a sentence, and the bill has a number you did not expect.

    Episode 22 of DEVLADLOG Copilot & AI runs the same three Contoso tasks against the OpenAI Responses API and the Gemini Interactions API:
    - Extract four vendors into a JSON schema. OpenAI strict mode rewrites optional fields to nullable. Gemini accepts keywords like minLength and uniqueItems but does not enforce them
    - A tool call the model asks for and we run, resent statelessly
    - A 16 token limit, to see what a cut-off looks like when thinking tokens count against it
    - A cost count: OpenAI includes reasoning in output tokens, Gemini reports thought tokens separately

    One neutral contract, two small adapters, no framework. We also show why the Gemini free tier is not a place for company data.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}

    Narration uses an AI voice.

    #AzureAI #OpenAI #Gemini #Python #DevTools
linkedin_personal:
  text: |
    A schema guarantees shape, not truth. I compared the OpenAI and Gemini APIs on the same Contoso vendor task, and both can return a well-formed answer with the wrong total. So I validate the arithmetic and the earliest date after the call.

    Another surprise: OpenAI counts reasoning tokens inside output tokens, while Gemini reports them separately. Add them yourself, or Gemini looks cheaper than it is.

    Episode 22 of DEVLADLOG Copilot & AI: {YOUTUBE_URL}

    Narration uses an AI voice.

    #OpenAI #Gemini #Python
