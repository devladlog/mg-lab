linkedin_company:
  text: |
    Security Copilot lives in the Defender portal, in Entra, in its own portal, and as agents that work on their own. It also has a meter: security compute units (SCUs), billed by the hour.

    Episode 18 of DEVLADLOG Copilot & AI looks at what is embedded, builds our own KQL skills, and does the cost sums before the invoice does:
    - Where it shows up: incident summaries and guided response in Defender, risky user summaries in Entra, and two agents with different prerequisites
    - A custom plugin in YAML, checked offline by a tool that parses every KQL query with the Kusto language library against the real advanced hunting columns, with 115 tests
    - One rule worth a minute: keep every placeholder inside quotes, because Learn does not say how inputs are escaped
    - The SCU maths: a provisioned SCU is billed per started hour, and E5 and E7 include 400 SCUs a month per 1,000 licences

    Prices change, so read the page before you quote one.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}

    Narration uses an AI voice.

    #SecurityCopilot #MicrosoftDefender #MicrosoftEntra #KQL
linkedin_personal:
  text: |
    Before you let Security Copilot run a query you wrote, check where its inputs go.

    Learn does not say how Security Copilot escapes an input, so I assume it does not. Every placeholder in my KQL skills sits inside a quoted string. The tests show why: a hostile value adds operators to an unquoted query, and stays one harmless string when escaped.

    Also: one SCU is the minimum, and it is billed every hour.

    Episode 18 of DEVLADLOG Copilot & AI: {YOUTUBE_URL}

    Narration uses an AI voice.

    #SecurityCopilot #KQL
