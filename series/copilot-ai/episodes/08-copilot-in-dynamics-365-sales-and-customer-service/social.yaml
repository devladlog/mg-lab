  - id: case
    youtube_short_title: "Dynamics 365 case summary: the 38 word rule #Shorts"
    instagram_reel:
      caption: |
        Customer Service has a hard rule. Microsoft Learn says a case summary is not generated if the source fields hold fewer than 38 words in English.

        Our check counts generously: title, description, notes, and the text of linked emails with the markup stripped. A case that fails our check should fail in Copilot too. A case that says "Battery does not charge" is the example.

        Full episode: link in bio
        #Dynamics365 #CustomerService #MicrosoftCopilot
      cover_text: "The 38 word rule"
    tiktok:
      caption: "Learn: no case summary is generated under 38 words in English. A one-line case gets no Copilot summary. #Dynamics365 #CustomerService"
  - id: gotcha
    youtube_short_title: "Copilot knowledge answers in Dynamics 365: what it cannot read #Shorts"
    instagram_reel:
      caption: |
        Four gotchas, all from Learn. Copilot cannot read tables or images in knowledge articles, so a table of torque values is invisible. It reads the content column only, not title or keywords.

        If the interface is Spanish and the articles are English only, no response is generated. And the same question can give different answers, so test with a checklist, not a single try.

        Full episode: link in bio
        #Dynamics365 #Dataverse #CustomerService
      cover_text: "What Copilot cannot read"
    tiktok:
      caption: "Dynamics 365 Copilot cannot read tables or images in knowledge articles, only the content column, in the UI language. Same question, different answer is normal. #Dynamics365"
