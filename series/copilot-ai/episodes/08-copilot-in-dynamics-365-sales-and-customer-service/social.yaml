linkedin_company:
  text: |
    Copilot in Dynamics 365 writes summaries of your records. If the records are thin, the summary is thin, or it does not appear at all.

    Episode 8 of DEVLADLOG Copilot & AI checks the data first, in code, then watches Sales and Customer Service Copilot work on the same records:
    - A checker that reads opportunities, accounts, cases and knowledge articles from the Dataverse Web API and applies rules taken from Learn
    - The case rule: Learn says no summary is generated if the source fields hold fewer than 38 words in English
    - Knowledge: only the content column of published, latest-version articles in the user's language is used; tables and images are not read
    - Paging done properly: page size, follow the next link, never skip

    The fix list is plain: a parent account on every opportunity, real case descriptions, articles published as text.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}

    Narration uses an AI voice.

    #Dynamics365 #Dataverse #MicrosoftCopilot #CustomerService
linkedin_personal:
  text: |
    A Copilot summary is only as good as the record behind it.

    For Customer Service, Microsoft Learn says a case summary is not generated if the source fields hold fewer than 38 words in English. For knowledge, Copilot reads only the content column, and cannot read tables or images in articles.

    So I wrote a checker that reads the records from Dataverse and flags what Copilot will skip, before anyone blames the AI.

    Episode 8 of DEVLADLOG Copilot & AI: {YOUTUBE_URL}

    Narration uses an AI voice.

    #Dynamics365 #Dataverse
