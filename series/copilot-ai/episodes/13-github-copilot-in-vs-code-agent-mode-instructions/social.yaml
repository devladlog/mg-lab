linkedin_company:
  text: |
    A small Python tool, and a Copilot that keeps forgetting the team's rules: dates in the wrong format, tests with the wrong names, no test run at the end.

    Episode 13 of DEVLADLOG Copilot & AI writes the rules once and checks the result:
    - New vocabulary in VS Code: a harness runs the agent, and in the Copilot harness the built-in agents are Ask, Agent and Plan
    - Project instructions, targeted instructions with applyTo (relative to the workspace root, not the instructions folder), a skill, and a read-only reviewer agent
    - customcheck, a small linter for the documented rules, with 32 tests
    - A hidden acceptance test written before the agent runs, because instructions guide the model and do not guarantee compliance

    The title carries a warning: prompt files only run in Local harness sessions, and per the VS Code docs the Local harness is removed by February 2027. Convert recurring prompts to skills.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}

    Narration uses an AI voice.

    #GitHubCopilot #VSCode #DevTools #Python
linkedin_personal:
  text: |
    If you use prompt files with GitHub Copilot in VS Code, check which harness your session runs in.

    Per the VS Code docs, prompt files only run in Local harness sessions, and the Local harness is removed by February 2027. The Copilot harness does not load them, and there is no error on the old file. It simply does nothing. The advice is to convert recurring prompts to skills.

    I wrote a converter that lists what a skill does not keep: the agent, the model and the tool list.

    Episode 13 of DEVLADLOG Copilot & AI: {YOUTUBE_URL}

    Narration uses an AI voice.

    #GitHubCopilot #VSCode
