linkedin_company:
  text: |
    Ask a model for a notice deadline and it will happily invent one. Ask it with a tool that reads the real vendor list and it can quote the answer.

    Episode 14 of DEVLADLOG Copilot & AI connects GitHub Copilot in VS Code to three official MCP servers and one of our own:
    - Microsoft Learn: remote, no sign-in, free, with three read-only tools
    - Azure: a local process that uses your own Azure credentials and RBAC roles
    - GitHub: remote, with OAuth sign-in or a token
    - Our own, in Python over stdio, tested by starting it as a process and talking MCP to it

    Two traps: the Learn and Azure quick starts still show the older mcp.json format, while new Copilot configuration uses a workspace-root .mcp.json with a top-level mcpServers key. And read-only is a line in the configuration, not a property of the agent.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}

    Narration uses an AI voice.

    #MCP #GitHubCopilot #Azure #VSCode
linkedin_personal:
  text: |
    A tool call you can see beats a plausible answer.

    When I connected GitHub Copilot to the Microsoft Learn MCP server, I expanded the tool call each time, because an answer without one proves nothing.

    Another lesson: read-only is not a property of the agent. It is a line in the config. The remote GitHub server has a read-only address, the Azure server has a read-only flag, and the default for both is write capable.

    Episode 14 of DEVLADLOG Copilot & AI: {YOUTUBE_URL}

    Narration uses an AI voice.

    #MCP #GitHubCopilot
