linkedin_company:
  text: |
    Ask Copilot for a PowerShell script to fix a server and you get one in seconds. Would you run it on production?

    Episode 12 of DEVLADLOG Copilot & AI looks at what Copilot really does for a Windows Server admin today:
    - Azure Copilot answers questions about Azure VMs and Azure Arc-enabled servers, and can write Resource Graph queries
    - GitHub Copilot writes PowerShell in VS Code, steered by an instructions file that guides but does not guarantee
    - What we did not find: no Copilot feature documented for Windows Admin Center on Microsoft Learn, and AI Shell is archived since January 2026
    - A PowerShell review gate that parses a script without running it, blocks destructive commands, Invoke-Expression and literal passwords, and has 67 Pester tests

    The rule that matters: dry run with -WhatIf on one server first, and let Azure RBAC, not Copilot, set the limits.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}

    Narration uses an AI voice.

    #WindowsServer #AzureArc #PowerShell #MicrosoftCopilot
linkedin_personal:
  text: |
    Copilot-generated PowerShell is a draft. For servers, the draft needs a reviewer before it runs.

    I wrote a small gate that parses the script with the PowerShell parser, never runs it, and walks the syntax tree. It blocks destructive commands, Invoke-Expression and literal passwords, and warns about fan-out to many servers and missing ShouldProcess.

    It is a second pair of eyes, not a boundary. Azure permissions are the boundary.

    Episode 12 of DEVLADLOG Copilot & AI: {YOUTUBE_URL}

    Narration uses an AI voice.

    #WindowsServer #PowerShell
