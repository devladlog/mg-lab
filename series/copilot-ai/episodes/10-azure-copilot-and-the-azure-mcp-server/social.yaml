linkedin_company:
  text: |
    There are two very different ways to ask an AI to do things in Azure. One lives in the portal and is called Azure Copilot. The other is a server your own tools connect to: the Azure MCP Server.

    Episode 10 of DEVLADLOG Copilot & AI covers both:
    - Azure Copilot: on by default for all users in the tenant, acts with your permissions, asks for confirmation before changes, and respects Azure policy, locks and RBAC
    - Azure MCP Server: open source, free, and in VS Code it needs a GitHub Copilot subscription
    - We started the real server (version 4.0.0-beta.9) and counted what it publishes: 451 tools in all mode, 74 in namespace mode, and far fewer with the read-only flag
    - An audit tool that predicts what a start line exposes, and a probe that checks the prediction against the real server

    Both act as you, so fix your role assignments first. Pin the version: the package is a beta.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}

    Narration uses an AI voice.

    #Azure #AzureCopilot #MCP #GitHubCopilot
linkedin_personal:
  text: |
    How many tools does the Azure MCP Server hand to your AI client? I stopped guessing and counted.

    I started the real server in each mode and read what it publishes over the protocol: 451 tools in all mode, 74 in namespace mode, and the read-only flag removes the writes. These are measurements of one beta version (4.0.0-beta.9), so they will change.

    My takeaway: start read-only, with a short namespace list, and pin the version.

    Episode 10 of DEVLADLOG Copilot & AI: {YOUTUBE_URL}

    Narration uses an AI voice.

    #Azure #MCP #GitHubCopilot
