name: "Copilot Setup Steps"

# Runs when this file changes, so a broken setup shows up as a failed check on the pull request.
# After the file is on the default branch it can also be started by hand from the Actions tab.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called copilot-setup-steps or Copilot will not pick it up.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore packages so the agent can build and test offline
        run: dotnet restore Contoso.Bikes.sln
