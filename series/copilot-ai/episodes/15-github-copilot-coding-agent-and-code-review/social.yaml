    instagram_reel:
      caption: |
        The honest gotcha. Copilot's review is a comment review, so it never counts toward required approvals. A re-review may repeat comments you already resolved.

        On the issue side, text hidden in an HTML comment is filtered before the agent sees it, so a hidden instruction does nothing. Treat both features as a fast first reader, not as the approver.

