linkedin_company:
  text: |
    A dealer pricing bug sits in the backlog at Contoso Bikes and nobody has time. So we assign the issue to GitHub Copilot and wait for a draft pull request.

    Episode 15 of DEVLADLOG Copilot & AI covers two features with two different jobs:
    - The cloud agent (formerly the coding agent) does the work, in an ephemeral GitHub Actions environment, with one pull request per task
    - Code review reads the pull request as a reviewer, using path-specific instructions
    - The guardrails GitHub documents: it pushes only to its own copilot/ branch, cannot mark ready, approve or merge, and workflows wait for a person to approve them
    - A preflight kit with 59 tests: it checks the setup steps file, lints instructions, rejects a vague issue like "make pricing better", and tells you if a pull request is ready for a human to merge

    The issue is the prompt, so write it like one: a concrete example, acceptance criteria, and the files to look at.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}

    Narration uses an AI voice.

    #GitHubCopilot #GitHubActions #CodeReview #DevTools
linkedin_personal:
  text: |
    If you assign an issue to the Copilot cloud agent, the issue is the prompt. It gets the title, description and comments, and does not react to comments you add after assigning.

    So I wrote a preflight linter: does the issue have a concrete example, acceptance criteria and the files to look at? "Make pricing better" does not pass.

    Also worth remembering: Copilot's code review is a comment, not an approval. It never counts toward required approvals.

    Episode 15 of DEVLADLOG Copilot & AI: {YOUTUBE_URL}

    Narration uses an AI voice.

    #GitHubCopilot #CodeReview
