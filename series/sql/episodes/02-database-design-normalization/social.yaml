linkedin_company:
  text: |
    The spreadsheet says Contoso is in Porto. It also says Oporto. The file cannot stop that, because the city is copied into every row.

    DEVLADLOG SQL #2 takes a flat export of sixteen bookings from a fictional training company and normalizes it to third normal form in SQL Server, with evidence at every step:
    - Split repeating lists into one row per booking line (sixteen bookings become twenty-three lines)
    - Check each dependency against the data, and print every conflict decision
    - Build five tables with keys, a unique constraint and foreign keys, plus an index behind the foreign key
    - Rebuild the original shape as a view, and watch six bad writes get rejected

    The data can suggest a key but cannot prove one. The business rule decides.

    Watch the full episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #SQLServer #DatabaseDesign #Normalization #DataModeling
linkedin_personal:
  text: |
    In a 23-row export, sixteen column pairs happened to be unique, including nonsense like customer name plus list price. Data can suggest a key. It cannot prove one. The key has to come from the business rule.

    That was the honest part of episode 2 of DEVLADLOG SQL, where I normalize a flat export to third normal form in SQL Server and check that joining the tables back gives the same rows.

    Also: a foreign key does not create an index. Add one.

    {YOUTUBE_URL}

    Narration uses an AI voice.

    #SQLServer #DatabaseDesign
