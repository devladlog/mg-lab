linkedin_company:
  text: |
    Last episode we failed over by hand. This time the server is allowed to die.

    DEVLADLOG SQL #10 builds an Always On availability group on two lab machines in one Windows cluster, synchronous commit with automatic failover, and the database seeded automatically:
    - Prerequisites checked by querying the instances: same version, same collation, cluster in quorum
    - Endpoints, the group, and the secondary joining with GRANT CREATE ANY DATABASE
    - A small report that turns the health rows into a yes or no verdict
    - The classic trap: error 976 on a secondary created with readable secondary set to no, and the one-line fix
    - A planned failover with nothing lost

    The limits are stated too: an availability group is not a backup, and a bad delete replicates to both copies.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #SQLServer #AlwaysOn #AvailabilityGroups #HighAvailability
linkedin_personal:
  text: |
    A colleague runs a report against the secondary replica to take load off the primary and gets error 976: the database is in an availability group and is not accessible for queries. Nothing is broken. The replica was created with readable secondary set to no.

    The fix in episode 10 of DEVLADLOG SQL is one statement per replica, with no restart and no new seeding. Do both replicas, because after a failover the other one becomes the secondary.

    Also: an availability group is not a backup.

    {YOUTUBE_URL}

    Narration uses an AI voice.

    #SQLServer #AlwaysOn
