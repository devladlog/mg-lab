  - id: gotcha
    youtube_short_title: "Always On error 976 and the one-line fix #Shorts"
    instagram_reel:
      caption: |
        Someone queries the secondary and gets error 976: the database is in an availability group and is not accessible for queries. Nothing is broken, data movement is fine. The replica was created with readable secondary set to no. The fix is one statement per replica, MODIFY REPLICA with allow connections ALL. No restart, no new seeding. Do both replicas.
        Full episode: link in bio
        #SQLServer #AlwaysOn #AvailabilityGroups
      cover_text: "Error 976, one-line fix"
    tiktok:
      caption: "Always On error 976: the secondary is not readable because allow connections is off. One MODIFY REPLICA per replica fixes it. #SQLServer #AlwaysOn #AvailabilityGroups"
  - id: failover
    youtube_short_title: "Always On planned failover: roles swapped, nothing lost #Shorts"
    instagram_reel:
      caption: |
        The planned failover is one statement, and you run it on the replica that should become the primary. It needs synchronous commit and a synchronized secondary, so nothing is lost. The second server is now the primary with all nine orders and accepts writes. The first becomes the secondary. Do not use the cluster manager to fail over an availability group.
        Full episode: link in bio
        #SQLServer #AlwaysOn #Failover
      cover_text: "Roles swapped"
    tiktok:
      caption: "Planned AG failover: run one statement on the new primary. Synchronous plus synchronized means no data lost. #SQLServer #AlwaysOn #Failover"
