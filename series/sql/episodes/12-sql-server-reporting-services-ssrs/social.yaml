linkedin_company:
  text: |
    Finance wants the same sales report every Monday, as a page they can open, filter by region and print. The quick way is to give the report server an account that can read every table.

    DEVLADLOG SQL #12 builds the paginated report the safer way, on SQL Server 2022 Reporting Services with the fictional Contoso Bikes data:
    - Two stored procedures are the whole data layer, one for the report and one for the region drop-down
    - A report definition with three parameters, generated by a Python script and validated against Microsoft's schema
    - A publish script you can run twice, with the password read from the environment
    - A SQL login that can execute the reporting schema and select from nothing

    The gotcha: with stored credentials the server connects as that one account for every viewer, so the account is your only permission boundary.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #SQLServer #SSRS #ReportingServices #PaginatedReports
linkedin_personal:
  text: |
    With stored credentials in SSRS, the report server connects as one account for every viewer. The database never sees who opened the report, so that account is your only permission boundary.

    In episode 12 of DEVLADLOG SQL the report account can execute two procedures in one schema and select from nothing. The consequence: if someone adds a procedure to that schema, they widen what the report server can run, so review the schema like a permission.

    {YOUTUBE_URL}

    Narration uses an AI voice.

    #SQLServer #SSRS
