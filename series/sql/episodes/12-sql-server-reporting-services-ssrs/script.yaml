scenes:
  - id: hook
    type: title
    heading: "Finance wants the sales report on a web page."
    sub: "SSRS on SQL Server 2022, without giving the report server your tables"
    short: hook
    narration: >
      Finance asked for the same sales report every Monday, as a page they can open, filter by region, and print.
      The quick way is to give the report server an account that can read every table. Today we build the
      paginated report the safer way, and the account behind it can run two procedures and nothing else.

  - id: plan
    type: bullets
    heading: "Two procedures, one report, one account"
    bullets:
      - "Contoso Bikes orders from the earlier episodes"
      - "Two stored procedures are the whole data layer"
      - "A paginated report with three parameters"
      - "Published with a script, run by a login that only executes"
    narration: >
      The scenario continues Contoso Bikes. We reuse the order tables from episode five and add a small schema
      for reporting, with two stored procedures. A report definition calls them, takes a date range and a region,
      and shows sales by product. A script publishes it to the report server, and a SQL login with execute
      permission on that schema is the only account the report server uses.

  - id: version
    type: bullets
    heading: "What SSRS 2022 is, and is not"
    bullets:
      - "SQL Server 2022 Reporting Services is the last SSRS version"
      - "Power BI Report Server is the successor"
      - "Support runs to January 2033"
      - "Not supported on Server Core"
    narration: >
      Reporting Services in SQL Server 2022 is the last version of the
      product. Microsoft points new work to Power BI Report Server, and support for the 2022 release runs to
      January 2033, so a report you build now has a long life. One practical limit: the report server is not
      supported on Server Core, so plan a full Windows installation for it.

  - id: procs
    type: code
    heading: "The data layer is a procedure"
    lang: sql
    code: |
      CREATE OR ALTER PROCEDURE Rpt.usp_SalesByProduct
          @From   date,
          @To     date,
          @Region nvarchar(20) = N'ALL'
      AS
      -- ...
          WHERE o.OrderDate BETWEEN @From AND @To
            AND o.Status <> N'Cancelled'
            AND (@Region = N'ALL' OR c.Region = @Region)
    short: procedure
    narration: >
      Here is the first procedure. A date range and a region, where the word ALL means every region. Cancelled
      orders are left out, and revenue is the line value after the line discount. Why a procedure and not a query
      pasted into the report? The report only needs permission to run it, and the logic can be tested in a query
      window.

  - id: login
    type: code
    heading: "The account that only executes"
    lang: sql
    code: |
      IF NOT EXISTS (SELECT 1 FROM sys.database_principals WHERE name = N'rs_reader')
          CREATE USER rs_reader FOR LOGIN rs_reader;
      GO
      GRANT EXECUTE ON SCHEMA::Rpt TO rs_reader;
    narration: >
      The login is called rs reader. In the database it gets one permission, execute on the Rpt schema. The
      password is not in the script. The lab runner reads it from an environment variable and sends it to the
      server, so nothing secret lands in a file or in source control.

  - id: rdl
    type: code
    heading: "The report calls the procedure"
    lang: xml
    code: |
      <QueryParameter Name="@From">
        <Value>=Parameters!From.Value</Value>
      </QueryParameter>
      <CommandType>StoredProcedure</CommandType>
      <CommandText>Rpt.usp_SalesByProduct</CommandText>
    narration: >
      Inside the report definition, the dataset has the command type StoredProcedure and the procedure name.
      Each report parameter is passed to a procedure parameter. A second dataset feeds the region drop-down.
      The file is generated by a short Python script and validated against Microsoft's report definition schema,
      so a typo does not wait for the server to find it.

  - id: builder-screen
    type: screen
    heading: "The report in Report Builder"
    image: screens/ssrs-report-builder.jpg
    bar: "Report Builder · SalesByProduct.rdl · Design view"
    demo: "Report Builder on the lab laptop with SalesByProduct.rdl open in Design view. Report Data pane: Parameters From, To, Region; Data Sources ContosoBikesRpt; Datasets SalesByProduct and Regions. Page body: the title Contoso Bikes: sales by product, the subtitle with the date range, and a table with Product, Units sold, Orders, Revenue and a Total row. Properties pane showing the SalesByProduct dataset query type Stored Procedure."
    narration: >
      Open the file in Report Builder and it looks like any report you drew by hand. Three parameters, one shared
      data source, two datasets. A table with product, units, orders and revenue, and a total row. Page numbers
      and the run time sit in the footer, which is what makes it a paginated report: it prints the way it reads.

  - id: deploy
    type: code
    heading: "Publish it with a script"
    lang: powershell
    code: |
      $def.CredentialRetrieval = [RS2010.CredentialRetrievalEnum]::Store
      $def.UserName            = 'rs_reader'
      $def.Password            = $Password
      $null = $Proxy.CreateDataSource($Name, $Parent, $true, $def, $null)
      $null = $Proxy.CreateCatalogItem('Report', $name, $Parent, $true, $bytes, $null, [ref]$warnings)
    narration: >
      Publishing uses the report server web service, the same one Report Builder talks to. The script creates a
      folder, a shared data source with stored credentials for rs reader, and then the report, and it points the
      report at that data source. Run it twice and nothing breaks, because the create calls overwrite. The
      password comes from the environment again.

  - id: portal-screen
    type: screen
    heading: "Run it in the web portal"
    image: screens/ssrs-portal-report.jpg
    bar: "Web portal · MGLab · SalesByProduct"
    demo: "Browser on the lab laptop at the report server web portal, folder MGLab, report SalesByProduct. The parameter bar shows From 2025-03-01, To 2025-04-30, Region (All regions), and the View Report button. Report below: City Bike 4 units 3 orders 2,531.10; Carbon Wheelset 1, 1, 1,019.15; Trail Helmet 6, 3, 521.42; LED Light Set 6, 3, 231.71; Bike Lock 7, 3, 171.50. Footer: Page 1 of 1."
    narration: >
      In the web portal, open the report. The default range is March and April, and the region says all regions.
      Five products, City Bike on top with two thousand five hundred thirty-one dollars and ten cents. Those
      numbers are the same as running the procedure in a query window, and that comparison is the first test you
      do when someone doubts the report.

  - id: north-screen
    type: screen
    heading: "Pick a region"
    image: screens/ssrs-portal-north.jpg
    bar: "Web portal · MGLab · SalesByProduct · Region North"
    demo: "Same report with the Region drop-down open showing (All regions), Centre, North, South, then North selected and View Report clicked. Report below: City Bike 3 units 2 orders 1,882.10; Trail Helmet 3, 2, 251.72; Bike Lock 6, 2, 147.00; LED Light Set 1, 1, 39.95. Subtitle reads From 2025-03-01 to 2025-04-30 | North."
    narration: >
      Now the drop-down, filled by the second procedure. Pick North and the report shows four products. The
      subtitle says which region you are looking at, so a printed page explains itself. The Carbon Wheelset sold
      only outside the north, so it disappears from this view instead of showing a row of zeros.

  - id: gotcha-screen
    type: screen
    heading: "Gotcha: stored credentials mean one identity for everyone"
    image: screens/ssrs-permissions.jpg
    bar: "SSMS · CON-SQL01 · ContosoBikesRpt · r06-permissions-check.sql"
    short: gotcha
    demo: "SSMS, query window with r06-permissions-check.sql after running. Result grid, four rows: EXECUTE on Rpt.usp_SalesByProduct Allowed 1; EXECUTE on Rpt.usp_Regions Allowed 1; SELECT on Sales.Orders Allowed 0; SELECT on Sales.Customers Allowed 0."
    narration: >
      Now the gotcha. With stored credentials, the server connects as rs reader for every viewer. The database
      never sees who opened the report. So the account is your only permission boundary, and that is why it can
      execute two procedures and select from nothing. Look at the grid: execute, yes. Select on orders, no. If
      someone later adds a procedure to that schema, they widen what the report server can run, so review the
      schema like a permission.

  - id: setup
    type: bullets
    heading: "Where the report server lives"
    bullets:
      - "Report server database: local or remote"
      - "Remote database: service account needs access on that server"
      - "Windows PowerShell 5.1 for the SOAP proxy"
    narration: >
      Two practical points from the setup. The report server keeps its own catalog database, and if that
      database lives on another server, the service account must be allowed to reach it. And the deploy script
      uses a SOAP proxy, which exists in Windows PowerShell five point one but not in PowerShell seven.

  - id: tests
    type: code
    heading: "Tested without a report server"
    lang: python
    code: |
      def local_query(eng: DuckDBEngine, proc: str, params: dict) -> tuple[list[str], list[tuple]]:
          sql = proc_query(proc)
          for name, value in params.items():
              sql = sql.replace(name, f"'{value}'")
          return eng.query(sql)
    narration: >
      None of this needs a report server to be tested. The procedures' queries run on a local engine and are
      compared with expected results. The report's fields must equal the columns they return, in order. The
      parameters in the report must match the procedure. The report definition is checked against Microsoft's
      schema and the T-SQL goes through Microsoft's parser.

  - id: recap
    type: bullets
    heading: "Five rules"
    bullets:
      - "Put the logic in a procedure, not in the report"
      - "Give the report account execute only"
      - "Keep passwords out of files"
      - "Compare the report with the procedure first"
      - "Publish with a script you can run twice"
    narration: >
      Five rules to take away. Put the logic in a procedure and let the report call it. Give the report account
      execute permission and nothing else. Keep passwords out of files. When a number looks wrong, run the
      procedure first and compare. And publish with a script you can run twice, so the report on the server is
      always the one in the repository.

  - id: outro
    type: outro
    heading: "Code on GitHub, guides on devladlog.com"
    sub: "github.com/devladlog/mg-lab"
    narration: >
      The code is on GitHub and the full guide is on devladlog dot com. See you in the next episode.
