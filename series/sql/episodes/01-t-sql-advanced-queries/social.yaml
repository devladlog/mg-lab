  - id: gotcha
    youtube_short_title: "The default window frame in SQL Server repeats totals #Shorts"
    instagram_reel:
      caption: |
        With ORDER BY and no frame, SQL Server uses RANGE UNBOUNDED PRECEDING to CURRENT ROW. RANGE includes every row with the same ORDER BY value, so two orders on the same date both show the same total. This is documented behavior, not an engine bug. The fix: say ROWS, and add a unique tie-breaker.
        Full episode: link in bio
        #SQLServer #TSQL #WindowFunctions
      cover_text: "The frame that lies"
