linkedin_company:
  text: |
    Your running total looks right, it runs, and on two days it is wrong.

    In DEVLADLOG SQL #1 we write ten advanced T-SQL queries against a small, fictional Contoso Bikes database and check every one against an independent calculation:
    - Window functions: running total and change versus the previous row
    - CROSS APPLY and OUTER APPLY for per-row subqueries
    - Gaps and islands, a recursive CTE, PIVOT and GROUPING SETS
    - The default window frame, which repeats a total on tied dates

    The tests run locally with no server, using a T-SQL parser and DuckDB. Then the same files run on SQL Server 2022 and the rows match.

    Full walkthrough, with the query that lies: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #SQLServer #TSQL #WindowFunctions #DataEngineering
linkedin_personal:
  text: |
    A running total in T-SQL can be wrong without any error. If you write SUM(...) OVER (ORDER BY OrderDate) with no frame, SQL Server uses RANGE, and RANGE counts every row with the same date. Two orders on the same day both show the same total.

    The fix is to say ROWS and add a unique tie-breaker to the ORDER BY.

    I put this in episode 1 of DEVLADLOG SQL, together with APPLY, gaps and islands, recursive CTEs, PIVOT and GROUPING SETS. Each query is checked against an independent calculation.

    {YOUTUBE_URL}

    Narration uses an AI voice.

    #SQLServer #TSQL
