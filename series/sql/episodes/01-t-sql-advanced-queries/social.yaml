  - id: islands
    youtube_short_title: "Gaps and islands in T-SQL: login streaks in one query #Shorts"
    instagram_reel:
      caption: |
        Gaps and islands: find streaks of consecutive login days. Subtract the row number from the date and each streak gets the same anchor, so it becomes one group. The catch: take distinct days first. Without DISTINCT, two logins on the same day shift every row number and the query invents a streak. A test proves it.
