linkedin_company:
  text: |
    A search procedure takes a customer name. Type a name, get one customer. Type a crafted name, get all of them.

    DEVLADLOG SQL #6 locks down the order database from the previous episode, and every claim is tested by impersonating each user with EXECUTE AS USER and recording what is allowed or denied:
    - Application roles that can execute procedures and have no table permissions
    - The injectable search, and the fix with sp_executesql and QUOTENAME
    - The gotcha: dynamic SQL breaks the ownership chain, and module signing fixes it without granting SELECT
    - Row-level security, and dynamic data masking with an honest look at what masking does not protect

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #SQLServer #SQLInjection #RowLevelSecurity #DatabaseSecurity
linkedin_personal:
  text: |
    I fixed the SQL injection in a search procedure and promptly broke the app. Dynamic SQL runs as a separate batch, so the ownership chain stops there and SQL Server checks the caller's own SELECT permission. Granting SELECT on the table would undo the whole point.

    The documented answer is module signing: sign the procedure with a certificate, and give the certificate's user the SELECT.

    Episode 6 of DEVLADLOG SQL also shows masking being guessed letter by letter. Masking stops accidents, not ad hoc queries.

    {YOUTUBE_URL}

    Narration uses an AI voice.

    #SQLServer #DatabaseSecurity
