linkedin_company:
  text: |
    The app is slow and everybody has a theory: add an index, add memory, restart the server. Most of those theories are guesses.

    DEVLADLOG SQL #8 measures instead. On the Contoso Bikes performance database we look at:
    - Configuration defaults: max server memory, MAXDOP and cost threshold for parallelism
    - Top statements ranked by total cost, not by execution count
    - A real blocking incident we cause on purpose, diagnosed from the requests view
    - Wait statistics read as the difference between two snapshots

    The gotcha: the blocker is not busy, it is idle with an open transaction. Then we try read committed snapshot as a server-side fix, with its costs stated: rows grow, the version store lives in tempdb.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #SQLServer #PerformanceTuning #WaitStatistics #Blocking
linkedin_personal:
  text: |
    When a query is stuck, the blocker is often not running anything. It is idle, with an open transaction, maybe waiting on a web service call. And the wait statistics view will show nothing yet, because the wait has not finished.

    In episode 8 of DEVLADLOG SQL I cause that blocking on purpose and diagnose it from the requests view. Then I turn on read committed snapshot and the same reader returns immediately. It is a trade: rows grow and the version store lives in tempdb.

    The better fix is a shorter transaction in the app.

    {YOUTUBE_URL}

    Narration uses an AI voice.

    #SQLServer #PerformanceTuning
