linkedin_company:
  text: |
    If your database died right now, how much data would you lose, and how long until the shop sells again? Most teams guess.

    DEVLADLOG SQL #9 measures it. We build log shipping by hand with a primary and a readable standby on one lab server, break the chain on purpose, then fail over with a stopwatch running:
    - An RPO query from the msdb backup history
    - A standby restored WITH STANDBY, and the error you get writing to it (3906)
    - Error 4305 after a colleague takes an extra log backup, and the repair
    - Tail-log backup, restore WITH RECOVERY, and a failover step that fails above sixty seconds, our own target

    The surprise at the end: after failover the promoted copy has no backup history, and the RPO report says so.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #SQLServer #DisasterRecovery #LogShipping #RPO
linkedin_personal:
  text: |
    One log backup chain, one owner. In episode 9 of DEVLADLOG SQL a colleague takes an extra log backup of the primary, to a file the shipping job never sees. The next cycle fails with error 4305 and the standby is stuck. Nothing is corrupt; the chain has a hole.

    The fix is boring: restore the missing log first, then the one that failed.

    I also time a failover with a stopwatch, and show that the promoted copy has no backup history afterwards. Failing over is not the end of the job.

    {YOUTUBE_URL}

    Narration uses an AI voice.

    #SQLServer #DisasterRecovery
