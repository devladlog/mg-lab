linkedin_company:
  text: |
    This stored procedure wraps everything in a transaction. A customer orders three wheels when stock is two. The procedure fails, and the order is saved anyway, with its lines, while the stock never moves.

    DEVLADLOG SQL #5 builds a small order system on SQL Server 2022 and tests every result:
    - Scalar functions that SQL Server can inline, and the built-in call that quietly switches inlining off
    - Inline table-valued functions versus multi-statement ones
    - A table-valued parameter that takes a whole order in one call
    - SET XACT_ABORT ON, TRY/CATCH, ROLLBACK and THROW, so an order is all or nothing

    The naive version is in the episode too, so you can see exactly why a transaction alone is not enough.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #SQLServer #StoredProcedures #TSQL #ErrorHandling
linkedin_personal:
  text: |
    A transaction does not make a stored procedure safe. With XACT_ABORT off, a constraint violation rolls back only the statement that failed, and the procedure carries on to the next line, which is COMMIT. I reproduce that in episode 5 of DEVLADLOG SQL: one new order and two order lines committed, stock unchanged.

    The fix is short: SET XACT_ABORT ON, a TRY block, ROLLBACK in CATCH, then THROW with no arguments. Let the check constraint guard the stock.

    {YOUTUBE_URL}

    Narration uses an AI voice.

    #SQLServer #TSQL
facebook:
  text: |
    A transaction that still half-saves an order? It happens when XACT_ABORT is off. In this DEVLADLOG SQL episode we build a small order procedure two ways, naive and safe, and show what each leaves behind after a failed order. We also look at when SQL Server can inline a scalar function. Watch: {YOUTUBE_URL}

    Narration uses an AI voice.

    #SQLServer #StoredProcedures
