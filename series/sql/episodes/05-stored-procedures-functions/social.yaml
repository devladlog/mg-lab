  - id: inlining
    youtube_short_title: "One built-in call turns off scalar UDF inlining #Shorts"
    instagram_reel:
      caption: |
        Since SQL Server 2019, at compatibility level 150 or higher, a simple scalar function can be inlined into the calling query. But a function that calls GETDATE is never inlineable, per Microsoft's documentation. It still works, it just runs once per row, and nothing warns you. The catalog does: sys.sql_modules has an is_inlineable column.
