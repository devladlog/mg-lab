linkedin_company:
  text: |
    The index is there, it is the right index, and SQL Server still reads the whole thing. Or it does sixty thousand key lookups to return one customer's orders.

    DEVLADLOG SQL #4 shows three ways a query keeps a good index from doing its job, each proven from the actual execution plan and then fixed:
    - A function on the column (YEAR on a date) versus a range on the bare column
    - A number passed for a varchar column, and the CONVERT_IMPLICIT warning on the SELECT
    - Parameter sniffing: whoever calls the procedure first decides the plan
    - Fixes: OPTION (RECOMPILE), and forcing a plan from Query Store

    We also cover what a forced plan costs you afterwards.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #SQLServer #QueryOptimization #QueryStore #ParameterSniffing
linkedin_personal:
  text: |
    Parameter sniffing is really about who calls first. If the customer with 60,000 orders runs the procedure first, the cached plan is a scan, and a customer with seven orders scans the whole table. Flip the order and the big customer gets one key lookup per order.

    Episode 4 of DEVLADLOG SQL reproduces this on purpose (I turn off parameter sensitive plan optimization for the lab), then fixes it with OPTION (RECOMPILE) and with a forced plan in Query Store. A forced plan is a decision you now own, so check the failure count.

    {YOUTUBE_URL}

    Narration uses an AI voice.

    #SQLServer #QueryStore
