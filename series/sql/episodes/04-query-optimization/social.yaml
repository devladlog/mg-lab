    youtube_short_title: "YEAR(OrderDate) = 2025 stops the index seek in SQL Server #Shorts"
    instagram_reel:
      caption: |
        A function on the column: YEAR(OrderDate) = 2025 reads nicely, but SQL Server has to compute the year for every row before it can compare, so the index can only be scanned. Write the same question as a range on the bare column, from the first of March up to the first of April. Same answer, and now the index can seek.
        Full episode: link in bio
        #SQLServer #SARGable #QueryOptimization
      cover_text: "Functions kill seeks"
