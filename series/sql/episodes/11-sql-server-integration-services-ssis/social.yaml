status: draft-hold-for-review
ai_label: true
youtube_url: "{YOUTUBE_URL}"
linkedin_company:
  text: |
    Every morning a bike dealer sends a file of yesterday's sales. This morning it arrived twice. If your load is not built for that, you now have duplicate sales, and nobody notices until the month end report.

    DEVLADLOG SQL #11 builds an Integration Services package for a fictional Contoso Bikes partner file with eight lines, three of them wrong:
    - Control flow: prepare, data flow, merge
    - A conditional split that sends bad rows to a rejects table, with the reason kept
    - The business rules in a stored procedure, so a rerun inserts nothing twice
    - Deployment to the SSIS catalog, run from T-SQL, with the server name in a catalog environment
    - The gotcha: Basic logging records no row counts for the data flow

    Three runs, each checked against an expected result: first load, repeat, correction.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #SQLServer #SSIS #ETL #DataEngineering
linkedin_personal:
  text: |
    Make the load safe to run twice. In episode 11 of DEVLADLOG SQL a partner file arrives twice, and the second run inserts nothing and updates nothing, because the merge procedure only inserts a line if its product exists and its key is not already there.

    A small lesson on debugging: at the default Basic logging level, the SSIS catalog records no row counts for the data flow. Set the logging level to Verbose before you start digging.

    {YOUTUBE_URL}

    Narration uses an AI voice.

    #SQLServer #SSIS
