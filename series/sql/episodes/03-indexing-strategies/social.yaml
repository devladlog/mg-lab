linkedin_company:
  text: |
    Two indexes on the same three columns. One finds a customer's orders with a single seek. The other makes SQL Server read the whole index. The only difference is column order.

    DEVLADLOG SQL #3 designs indexes for three real queries on a generated Contoso Bikes database of 20,000 customers and 200,000 orders, and measures every step from SQL Server's actual execution plan:
    - No index versus a narrow index with key lookups
    - A covering index in the wrong order versus the right order
    - A filtered index for open orders only
    - A columnstore index for a report that reads every row

    We also look at why missing index requests are hints, not designs, and what each index costs.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #SQLServer #Indexing #ExecutionPlan #PerformanceTuning
linkedin_personal:
  text: |
    Same three columns, same covering index, two different column orders. One seeks. The other scans its entire leaf level.

    Equality columns first, then the sort or range column. The order is the design.

    In episode 3 of DEVLADLOG SQL I measure four index steps from the actual plan, reading logical reads per operator, and check that the rows never change. I also go through why the green missing-index hint is a starting point, not a design.

    {YOUTUBE_URL}

    Narration uses an AI voice.

    #SQLServer #Indexing
