      caption: |
        Both indexes cover the query, so no lookups. But the first leads with the order date, so one customer's rows are scattered across the index and SQL Server can only scan it. The second puts the equality column first, then the sort column: one seek, rows already in order, no sort. Same columns. The order is the design.
