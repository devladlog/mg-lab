    youtube_short_title: "Missing index hints in SQL Server are not designs #Shorts"
    instagram_reel:
      caption: |
        The green missing index text in a plan is a hint. Per Microsoft's documentation, key columns come with no order, filtered and unique indexes are never suggested, INCLUDE lists have no size check, trivial plans get nothing, and the lists clear on restart. Review it, combine it, then design.
