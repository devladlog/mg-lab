linkedin_company:
  text: |
    Somebody ran an UPDATE without a WHERE clause and every product now costs zero. A good order arrived right after it. Can you get the prices back without losing that order?

    DEVLADLOG SQL #7 backs up a SQL Server database properly, breaks it on purpose, and restores it to the minute before the accident:
    - Full, differential and log backups, with checksum and compression
    - A point-in-time restore into a copy, never over production
    - A small Python planner that builds the restore sequence from the msdb history
    - RESTORE VERIFYONLY, DBCC CHECKDB on the copy, then a repair of the live prices from it

    The honest gotcha comes first: full recovery protects nothing until the first full backup exists.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #SQLServer #BackupAndRestore #DisasterRecovery #DBA
linkedin_personal:
  text: |
    A database in the FULL recovery model does not protect you yet. Until the first full backup, a log backup fails with error 4214: there is no current database backup.

    Episode 7 of DEVLADLOG SQL is a full backup, differential and log chain, an accident (an UPDATE with no WHERE), and a point-in-time restore into a copy. Then I repair the live prices from the copy, so the order that arrived after the mistake is kept.

    A backup you never restored is a hope.

    {YOUTUBE_URL}

    Narration uses an AI voice.

    #SQLServer #BackupAndRestore
