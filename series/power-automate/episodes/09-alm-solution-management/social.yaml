linkedin_company:
  text: |
    Our first export from DEV could not be packed as a managed solution. The error said the package type did not match, and the cause was one word in one file.

    Episode 9 of DEVLADLOG Power Automate moves a cloud flow from DEV to TEST without opening it.

    - Environment variables for the site, list and mailbox, and connection references for SharePoint and Outlook, so no DEV value ships in the solution.
    - Export both package types and unpack with Both, because the packager cannot convert unmanaged to managed.
    - A deployment settings file per environment, checked against the solution.
    - A diff between releases: version 1.1.0.0 removes a flow and a variable, so it must be imported as an Upgrade, not an Update.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #PowerAutomate #PowerPlatform #ALM #Azure
linkedin_personal:
  text: |
    If your release removes a flow, an Update will not remove it from the target.

    In episode 9 of DEVLADLOG Power Automate version 1.1.0.0 of a solution drops a flow and an environment variable. Microsoft Learn says an update cannot delete components and an upgrade removes what the new version no longer has. So a small diff script reads both releases and says the import mode: UPGRADE.

    It also caught my first export, unpacked as unmanaged only, which refused to pack as managed. Episode: {YOUTUBE_URL}

    #PowerAutomate #PowerPlatform

    Narration uses an AI voice.
