linkedin_company:
  text: |
    Our supplier sent 400 prices. The flow ran green, emailed a summary and imported 256. Nobody noticed for a month.

    Episode 7 of DEVLADLOG Power Automate imports a price list from an Excel table and keeps it honest.

    - List rows present in a table returns 256 rows by default. Turn pagination on, and fail the run past the threshold.
    - One Select checks every row and gives a reason for each rejection.
    - A price typed as 12,50 is rejected: in the invariant culture the comma is a thousands separator, so float() reads it as 1250.
    - One Office Script call writes the whole list. In our local count the row-by-row loop made 794 connector calls; the script made 3.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #PowerAutomate #Excel #OfficeScripts #Microsoft365
linkedin_personal:
  text: |
    A green run is not a correct run.

    In episode 7 of DEVLADLOG Power Automate a supplier sends 400 prices and the flow imports 256, because List rows present in a table returns 256 rows unless pagination is on. Nothing fails, so nobody notices.

    The fix is boring: pagination on, a failure past the threshold, and a reason for every rejected row. I also reject 12,50 typed as text. Learn's own examples show float('10,000.333') is 10000.333, so 12,50 becomes 1250.

    Episode: {YOUTUBE_URL}

    #PowerAutomate #Excel #Microsoft365

    Narration uses an AI voice.
