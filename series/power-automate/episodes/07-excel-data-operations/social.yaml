  - id: comma
    youtube_short_title: "Why a price with a comma gets rejected #Shorts"
    instagram_reel:
      caption: |
        In the invariant culture the comma is a thousands separator. Learn's examples: isFloat('10,000.00') is true and float('10,000.333') is 10000.333. So a price typed as text the Portuguese way, 12,50, is a valid number, and float makes it 1250. The flow asks for a number cell instead.

        Full episode: link in bio

        #PowerAutomate #Excel #Microsoft365
      cover_text: "12,50 becomes 1250"
    tiktok:
      caption: "float('12,50') = 1250 in the invariant culture: the comma is a thousands separator. One typo, a hundred times the price. #PowerAutomate #Excel #Microsoft365"
  - id: loop
    youtube_short_title: "The loop we threw away: 794 calls vs 3 #Shorts"
    instagram_reel:
      caption: |
        Our second draft looped: get a row, then update or add it. In the local count that was 794 Excel connector calls against a limit of 100 per connection per minute, and 1200 Power Platform requests. Update a row only changes the first match. The Office Script version made 3 connector calls.

        Full episode: link in bio

