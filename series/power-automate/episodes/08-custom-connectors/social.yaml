linkedin_company:
  text: |
    Our first flow created an IT request out of nothing. The title was just the word GitHub, and there was no issue behind it.

    Episode 8 of DEVLADLOG Power Automate builds a custom connector from three files and uses it to turn new GitHub issues into IT requests.

    - A webhook trigger needs the notification URL, a delete operation and the Location header from the create response, so the webhook goes away with the flow.
    - Internal fields get defaults, and Set HTTP header policies add the API version and Accept headers.
    - The ghost request: GitHub sends a ping when a webhook is created. A trigger condition on action = opened fixes it, and also stops edits creating duplicates.

    A local GitHub fake reproduces all of it.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #PowerAutomate #CustomConnectors #PowerPlatform #GitHub
linkedin_personal:
  text: |
    A ping is an event too.

    In episode 8 of DEVLADLOG Power Automate my webhook trigger created an IT request titled just "[GitHub] " with no issue behind it. GitHub sends a ping when you create a webhook, and without a trigger condition the ping ran the flow. Edited and labeled actions arrive on the same trigger, so editing an issue made a duplicate.

    One condition on the action field fixed both: action equals opened. The connector is built from three files kept in Git. Episode: {YOUTUBE_URL}

    #PowerAutomate #PowerPlatform

    Narration uses an AI voice.
