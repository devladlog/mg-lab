  - id: injection
    youtube_short_title: "Gotcha: percent variables are pasted into your script #Shorts"
    instagram_reel:
      caption: |
        In the Run PowerShell script action, a percent variable is replaced by its value before the script runs. So a supplier name with a quote and a semicolon becomes code. Our tests prove it, with a negative control that really executes the bad text. Write values to a file instead. The linter flags the unsafe pattern.

        Full episode: link in bio

        #PowerAutomate #RPA #PowerPlatform
      cover_text: "Input becomes code"
    tiktok:
      caption: "Percent variables are pasted into the PowerShell script before it runs, so a supplier name can become code. Use a file. #PowerAutomate #RPA #PowerPlatform"
  - id: loopguard
    youtube_short_title: "Gotcha: our own update triggers the flow again #Shorts"
    instagram_reel:
      caption: |
        The trigger fires when an item is modified, and our flow writes the order number back to the same item. That is a modification, so without a guard it loops. The trigger condition also requires the RPA status column to be empty, and the flow sets it when done. The tests run an item with the status filled in and it does not start.

        Full episode: link in bio

        #PowerAutomate #RPA #PowerPlatform
      cover_text: "The self-trigger loop"
    tiktok:
      caption: "Flow writes the order number back, which is a modification, which triggers it again. Guard: RPA status must be empty. #PowerAutomate #RPA #PowerPlatform"
