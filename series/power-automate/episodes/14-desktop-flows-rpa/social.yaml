linkedin_company:
  text: |
    Approved purchase requests still get typed by hand into an old Windows application. It has no connector and no API.

    Episode 14 of DEVLADLOG Power Automate starts a desktop flow from a cloud flow to enter the order, then spends most of its time on what goes wrong, because a robot that clicks Save and hopes is the most dangerous kind.

    - The Run PowerShell script action pastes percent variables into the script before it runs. A supplier name can become code, so values go through a file. A linter flags the unsafe pattern.
    - The trigger fires on modification and the flow writes back to the same item. A guard on the RPA status column stops the loop.
    - Checks and tests run without a tenant.

    The desktop flow itself has not yet been run on a Windows machine.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #PowerAutomate #PowerPlatform #RPA #Microsoft365
linkedin_personal:
  text: |
    In the Run PowerShell script action, a percent variable is replaced by its value before the script runs.

    So in episode 14 of DEVLADLOG Power Automate a supplier name with a quote and a semicolon becomes code. My tests prove it, with a negative control that really executes the bad text. The safe pattern is to write the value to a file and read the file. A linter flags the unsafe one.

    A robot that clicks Save and hopes is the most dangerous kind. Episode: {YOUTUBE_URL}

    #PowerAutomate #RPA #PowerPlatform

    Narration uses an AI voice.
