linkedin_company:
  text: |
    A purchase request lands in front of finance with no justification and no manager decision. Someone skipped three steps, and nobody noticed.

    Episode 13 of DEVLADLOG Power Automate builds a business process flow for purchase requests, tests its rules before the designer is opened and drives it from code.

    - Stages with required steps as gates: Submit, Manager review, Finance review, Order, Close.
    - A branch from 5,000 euros up that adds Finance review, and a flow step that asks finance and completes the process log.
    - A validator that checks the design files, and a script that moves instances one stage at a time with the Web API.

    Two gotchas: a branching rule only sees the steps of the stage before it, and a required Yes/No column only passes on Yes.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #PowerAutomate #PowerPlatform #Dataverse #BusinessProcessFlows
linkedin_personal:
  text: |
    A branching rule in a business process flow can only see the steps of the stage immediately before it.

    In episode 13 of DEVLADLOG Power Automate the amount is typed in the first stage, so the rule after Manager review cannot see it until you add the column there as an optional step. Microsoft Learn says so, and my validator now flags it before I open the designer.

    Another one I tested: a required Yes/No column only passes on Yes. Use a choice when No is a valid answer. Episode: {YOUTUBE_URL}

    #PowerAutomate #PowerPlatform #Dataverse

    Narration uses an AI voice.
