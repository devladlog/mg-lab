      caption: |
        The checker runs the flow in a dry run against a fake list and counts. With 40 percent of the items ready to archive, the slow version costs two actions per item in the list plus two per archived item. The tuned version costs one action per archived item. These are simulated counts, not measurements.

        Full episode: link in bio

