linkedin_company:
  text: |
    A nightly flow archives old, finished IT requests. Written the obvious way, with 4,000 items in the list, a dry run counts 11,206 actions. A trial licence allows 10,000 a day.

    Episode 10 of DEVLADLOG Power Automate tunes the same job to 1,606 actions, and counts the cost before it runs.

    - Get items with an OData filter on indexed columns instead of filtering after the fact.
    - Use what the item already gave you rather than Get item again.
    - Apply to each with concurrency 20 and no variables inside.
    - A checker lints the flow and compares both versions in a dry run.

    The counts come from a simulation, not the service, and the demo checks them against the real Analytics page.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #PowerAutomate #PowerPlatform #Performance #SharePoint
