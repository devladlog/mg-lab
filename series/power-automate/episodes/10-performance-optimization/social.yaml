  - id: gotcha
    youtube_short_title: "No pagination, no error, no items #Shorts"
    instagram_reel:
      caption: |
        On a list of more than 5,000 items, a filtered Get items with pagination off can return nothing when no match sits in the first 5,000. Learn calls it a known limitation. The flow succeeds and archives nothing, which looks like a quiet night. We reproduce it with a fake list, as a model of the documented behavior.

        Full episode: link in bio

        #PowerAutomate #SharePoint #PowerPlatform
      cover_text: "Green run, zero items"
    tiktok:
      caption: "Big list, filtered Get items, pagination off: it can return nothing and the flow still succeeds. Learn lists it as a known limitation. #PowerAutomate #SharePoint #PowerPlatform"
