  text: |
    Same job, 11,206 actions or 1,606.

    In episode 10 of DEVLADLOG Power Automate a nightly flow archives finished IT requests. The obvious version reads the whole list, loops sequentially and calls Get item again for every row. The tuned one asks SharePoint for only the work with a filter on indexed columns.

    I count both in a dry run before shipping. To be clear, these are simulated counts, and the demo checks them against the real Analytics page. Episode: {YOUTUBE_URL}

