title: "The nightly flow that costs eleven thousand actions"
subtitle: "Filter at the source, run items in parallel, count what a flow costs"
voice: am_michael
thumbnail_text: "FLOW TOO SLOW?\n11,206 ACTIONS\nTO 1,606"
youtube:
  title: "Power Automate Performance: Filter, Concurrency, Action Limits | DEVLADLOG Power Automate #10"
  tags: [Power Automate, performance, concurrency, apply to each, OData filter, SharePoint, throttling, action limits, Power Platform requests, Power Platform]
