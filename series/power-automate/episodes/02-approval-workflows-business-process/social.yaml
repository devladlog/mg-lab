linkedin_company:
  text: |
    A purchase request goes out for approval. The manager is on holiday. Nothing happens, and the requester never hears back.

    Episode 2 of DEVLADLOG Power Automate builds a purchase approval flow that always finishes: approved, rejected, or escalated to a person.

    - Under 500 euros is approved by policy. Otherwise the manager decides, and finance decides after the manager from 5,000 euros.
    - Every approval has a three-day timeout (P3D) and a step that handles it.
    - No manager in Entra? The approval goes to the purchasing team instead of failing.
    - A dry-run harness and 42 tests cover every path, with mocked approvals so nobody's inbox fills up.

    The bug we hit: a handled timeout still marked the run Failed until we joined the branches.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #PowerAutomate #PowerPlatform #Approvals #Microsoft365
linkedin_personal:
  text: |
    An approval with no timeout waits until the run hits its 30-day limit and times out with nobody told.

    In episode 2 of DEVLADLOG Power Automate every approval gets a timeout (P3D) and its own step for the timed-out case. The part that surprised me: even with that handler, the run was marked Failed, because a branch ending on a skipped action takes the status of the action before it. One Compose that joins the branches fixed it.

    I found it in a dry run, not in production. Episode: {YOUTUBE_URL}

    #PowerAutomate #Approvals #PowerPlatform

    Narration uses an AI voice.
