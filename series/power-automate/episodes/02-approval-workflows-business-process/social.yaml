  - id: outcome
    youtube_short_title: "Approve, not Approved: the Switch case that never matches #Shorts"
    instagram_reel:
      caption: |
        The outcome of an approve or reject approval is Approve or Reject, and the comparison is case sensitive. Not Approved with a D. Get it wrong and every request falls through. That is why the default case terminates the run as Failed instead of doing nothing quietly.

        Full episode: link in bio

        #PowerAutomate #Approvals #PowerPlatform
      cover_text: "Approve, not Approved"
    tiktok:
      caption: "Approval outcome is Approve or Reject, case sensitive. A Switch on Approved never matches. Make the default case fail loudly. #PowerAutomate #Approvals #PowerPlatform"
  - id: gotcha
    youtube_short_title: "A handled timeout still fails the run. Here is why #Shorts"
    instagram_reel:
      caption: |
        Finance times out, the timeout handler runs, and still the whole condition fails and nobody is told. A branch that ends with a skipped action takes the status of the action before it: the timed out approval. The fix is one Compose that joins the branches after both record steps.

        Full episode: link in bio

        #PowerAutomate #Approvals #PowerPlatform
      cover_text: "Handled, still failed"
    tiktok:
      caption: "Handled timeout, run still Failed. A branch ending on a skipped action inherits the previous status. Join branches with one Compose. #PowerAutomate #Approvals #PowerPlatform"
