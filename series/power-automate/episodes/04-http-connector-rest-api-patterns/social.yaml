episode: 4
series: "DEVLADLOG Power Automate"
status: draft-hold-for-review
ai_label: true
youtube_url: "{YOUTUBE_URL}"
linkedin_company:
  text: |
    Your flow calls an API and it works. Then the directory grows and the flow quietly reads page one of four.

    Episode 4 of DEVLADLOG Power Automate calls Microsoft Graph with the HTTP action and handles what goes wrong.

    - Entra ID OAuth with the client secret kept in Key Vault, and secure inputs and outputs on.
    - Paging: follow @odata.nextLink as an opaque URL, with a loop limit you chose.
    - An explicit retry policy: retry 429 and 5xx, honour Retry-After, fail fast on other 4xx.
    - A local stand-in API to test throttling, outages and a wrong secret, because you cannot make Graph throttle you on demand.

    The gotcha: the default retry policy can wait for hours before anyone hears about a dead API.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #PowerAutomate #PowerPlatform #MicrosoftGraph #Azure
linkedin_personal:
  text: |
    The default retry policy is patient. Very patient.

    Per Microsoft Learn, on premium or process licences Power Automate can send up to 12 retries with intervals growing to about an hour. A dead API keeps your run waiting for hours before anyone hears about it.

    In episode 4 of DEVLADLOG Power Automate I set the retry policy explicitly, retry 429 and 5xx, fail fast on other 4xx, and test it against a local API that throttles on page two. Episode: {YOUTUBE_URL}

    #PowerAutomate #MicrosoftGraph #PowerPlatform

    Narration uses an AI voice.
