linkedin_company:
  text: |
    Finance wants a Monday email: last week's approved purchases, the total, the total per cost centre, and the three biggest. Most flows do that with an Apply to each, a variable and a dozen steps.

    Episode 3 of DEVLADLOG Power Automate does it with no loops.

    - The week window in Lisbon time with convertFromUtc and convertToUtc, not UTC.
    - One Select shapes every row and parses the cost centre from the title.
    - The total comes from xpath, because xml() turns an array into repeated elements and XPath has a sum().
    - Group by and top three, again without a loop.

    The bug we wrote on purpose: formatting a local time with a Z looks like UTC. Tests pass in January and fail in July. 81 tests cover both seasons.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #PowerAutomate #PowerPlatform #Expressions #Microsoft365
linkedin_personal:
  text: |
    A literal Z on the end of a local time does not make it UTC.

    In episode 3 of DEVLADLOG Power Automate I build a weekly digest whose window starts Monday midnight in Lisbon. If you format that local time with a Z, every test passes in January, because Lisbon is on UTC. In July the window starts an hour late: one request drops out and next Monday's sneaks in. Always convertToUtc.

    The episode also sums rows with one xpath expression instead of a loop. Episode: {YOUTUBE_URL}

    #PowerAutomate #Expressions #PowerPlatform

    Narration uses an AI voice.
facebook:
  text: |
    Can you sum a list in Power Automate without a loop? Yes: wrap the rows in xml() and ask xpath for the sum.

    Episode 3 of DEVLADLOG Power Automate builds a Monday purchasing digest with time zones, text parsing, group by and a top three, all without Apply to each. Plus the daylight saving bug that only shows up in summer.

    Watch: {YOUTUBE_URL}

    #PowerAutomate #PowerPlatform

    Narration uses an AI voice.
