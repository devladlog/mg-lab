linkedin_company:
  text: |
    Ask anyone how long a purchase request takes and you get an answer. Ask the event log and you get another one.

    Episode 16 of DEVLADLOG Power Automate takes 300 fictional purchase requests and checks the event log before it goes anywhere near process mining. Most of the work happens before the upload.

    - A doctor script finds rows without a case id, non-ISO timestamps, duplicates, rows that end before they start and Manager review spelled three ways, which would show as three boxes on the map.
    - A clean step repairs it.
    - A local analysis you can compare against the dashboard: variants, rework, waits. Longest wait we own: finance review, about 65 hours on average.

    The Power Automate screens are not recorded or verified yet.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #PowerAutomate #ProcessMining #PowerPlatform #Microsoft365
linkedin_personal:
  text: |
    Most of the work in process mining happens before the upload.

    In episode 16 of DEVLADLOG Power Automate my raw event log has the problems real ones have: rows without a case id, dates written day first, and Manager review spelled three ways. Three spellings means three boxes on the map. Learn says the case id must be on every row and timestamps should be ISO 8601.

    So I check and clean the data first, then compute the numbers myself once. Episode: {YOUTUBE_URL}

    #PowerAutomate #ProcessMining #PowerPlatform

    Narration uses an AI voice.
