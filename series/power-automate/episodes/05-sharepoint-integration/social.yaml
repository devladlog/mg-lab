linkedin_company:
  text: |
    Our first draft created the folder, set the permissions, wrote the link back to the item and emailed Alex. Then it ran again. And again.

    Writing back to a SharePoint item is a change, and the flow triggers on changes. Episode 5 of DEVLADLOG Power Automate builds a purchase order folder flow that reacts to the right change and stops after one quiet run.

    - A trigger condition on Status = Approved, plus Get changes to see which columns changed.
    - Create new folder from the connector, then Send an HTTP request to SharePoint for what it cannot do: break permission inheritance and add the requester as a reader.
    - A check on every write to the trigger list, so the flow cannot start itself.

    A linter now flags the loop pattern, and a fake SharePoint reproduces it.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #PowerAutomate #SharePoint #PowerPlatform #Microsoft365
linkedin_personal:
  text: |
    A flow that edits the list it triggers on can trigger itself forever.

    In episode 5 of DEVLADLOG Power Automate my first version wrote the folder link back to the item. That write is a modification, the status was still Approved, so the next poll ran the flow again and emailed the requester again. Microsoft Learn calls it an infinite loop and says to stop it with a trigger condition or a check.

    I now lint for it. Episode: {YOUTUBE_URL}

    #PowerAutomate #SharePoint #PowerPlatform

    Narration uses an AI voice.
