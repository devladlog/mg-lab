series_label: "POWER AUTOMATE"
series_name: "DEVLADLOG Power Automate"
file_prefix: "power-automate"
title: "Your flow is fine. The policy says no."
subtitle: "Data policies for cloud flows: predict the verdict, keep the classification in Git"
