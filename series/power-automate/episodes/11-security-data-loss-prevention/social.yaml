linkedin_company:
  text: |
    The flow saves, and then it is marked suspended, although nothing in it is broken. The data policy says two of its connectors cannot meet.

    Episode 11 of DEVLADLOG Power Automate looks at data policies for cloud flows from the maker's side and the admin's side.

    - A checker reads the flow files and the policy and predicts the verdict before anyone saves: OK, or SUSPENDED with the groups that clash. It exits with a failure, so a pipeline can stop early.
    - The connector classification lives in a file in Git and is applied by a script.
    - A policy knows connectors, not destinations, so the checker also lists external email recipients.

    Honest limits: a policy change reaches existing flows through a background job, and our checker only reads the files you give it.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #PowerAutomate #PowerPlatform #DLP #Microsoft365
linkedin_personal:
  text: |
    Your flow is fine. The data policy says no.

    In episode 11 of DEVLADLOG Power Automate I check flow files against a policy file before anyone saves. Two of the four demo flows would be suspended: one mixes HTTP with SharePoint, one mixes MSN Weather with Outlook and SharePoint, because connectors from different groups cannot be used together.

    The lesson: a flow lives in one group, and the classification belongs in Git, applied by a script, not clicked together. Episode: {YOUTUBE_URL}

    #PowerAutomate #PowerPlatform #DLP

    Narration uses an AI voice.
