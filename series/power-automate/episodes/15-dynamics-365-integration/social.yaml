linkedin_company:
  text: |
    A salesperson closes a deal as won in Dynamics 365 Sales. Nobody books the kick-off call, and finance finds out a week later.

    A flow can fix that in an afternoon. Episode 15 of DEVLADLOG Power Automate is about the hard part: making it fire once, for the right row, without looping.

    - A Dataverse trigger with Select columns and Filter rows, plus a check that predicts whether a given change fires it.
    - Check before you create: the flow looks for an existing Kick-off call task, because triggers repeat.
    - Lookups bind with the entity set name and the id.
    - A linter flags lookup columns and the primary key in Select columns.

    Everything runs against fictional Fabrikam data, tested without a tenant.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #PowerAutomate #Dynamics365 #Dataverse #PowerPlatform
linkedin_personal:
  text: |
    Two things that look fine in the designer and are wrong.

    In episode 15 of DEVLADLOG Power Automate, Select columns on a Dataverse trigger cannot hold a lookup column, per Learn, so changes to the account silently never fire the flow. And putting the primary key in that list makes every update fire it.

    I would rather a linter tell me than a salesperson. The same episode checks whether a given change fires the trigger before I save it. Episode: {YOUTUBE_URL}

    #PowerAutomate #Dynamics365 #Dataverse

    Narration uses an AI voice.
