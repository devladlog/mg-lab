linkedin_company:
  text: |
    Your on-call card works in every test. Then someone raises a request titled Monitor 27" and the card never reaches the channel.

    Episode 6 of DEVLADLOG Power Automate posts a Teams adaptive card that waits for an answer, times out properly and survives whatever people type into a title.

    - Build the card as an object and send string() of it, so a quote or backslash cannot break the JSON.
    - Post and wait for a response with a 30-minute timeout, and handle the timeout.
    - Take it assigns the request; Need more info starts a chat with the requester.
    - The Flow bot gets 25 posts per 300 seconds per connection. Post follow-ups as User.

    A local Teams fake reproduces the quote failure and the throttling burst.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #PowerAutomate #MicrosoftTeams #PowerPlatform #Microsoft365
linkedin_personal:
  text: |
    One double quote broke my on-call card.

    In episode 6 of DEVLADLOG Power Automate my first draft pasted the adaptive card as JSON text with the request title inside. A quote in the title ended the string early, the JSON was invalid and the card was never posted. A backslash was worse: valid JSON, but a tab and a line break on screen. Building the card as an object and sending string() of it fixed both.

    Episode: {YOUTUBE_URL}

    #PowerAutomate #MicrosoftTeams #PowerPlatform

    Narration uses an AI voice.
