linkedin_company:
  text: |
    AI Builder reads an invoice in seconds and gives every field a confidence score. A score is not a verdict.

    Episode 12 of DEVLADLOG Power Automate extracts invoices with the prebuilt model, then lets a flow decide which ones post by themselves and which ones a person must see.

    - A preflight check on the file before you spend credits, against the limits Learn lists.
    - The Pages parameter aimed at one invoice, because a range covering two invoices returns partial data from both.
    - Triage rules on more than the score: missing fields, arithmetic, amount limit, dates and duplicates.
    - The decision lives in its own flow, tested in a harness against the same Python rules.

    The thresholds are ours. Tune them on your own invoices.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #PowerAutomate #AIBuilder #PowerPlatform #AzureAI
linkedin_personal:
  text: |
    A high confidence score does not mean a correct invoice.

    In episode 12 of DEVLADLOG Power Automate the model can read a wrong total with high confidence, so the arithmetic rule (subtotal plus tax against total) matters more than the score. My duplicate check also compares exact invoice numbers, so a different spelling of the same number slips through. I say so in the episode.

    The decision logic sits in its own flow so I can test it on a laptop. Episode: {YOUTUBE_URL}

    #PowerAutomate #AIBuilder #PowerPlatform

    Narration uses an AI voice.
