  - id: trigger
    youtube_short_title: "Trigger condition: the flow does not run at all #Shorts"
    instagram_reel:
      caption: |
        Put the filter in the trigger condition, not in the first action. If the title starts with [test], the flow is not triggered: no run is logged and no actions are consumed. A condition inside the flow would still start a run every time. And startsWith ignores case, so capitals do not matter.

        Full episode: link in bio

        #PowerAutomate #SharePoint #CloudFlows
      cover_text: "No run at all"
    tiktok:
      caption: "Trigger condition = no run, no actions used. A condition inside the flow still starts a run every time. startsWith ignores case. #PowerAutomate #SharePoint #CloudFlows"
  - id: gotcha
    youtube_short_title: "Flow did not fire? Check the trigger conditions first #Shorts"
    instagram_reel:
      caption: |
        The [TEST] item has no run, only a skipped trigger check under All runs. That is the gotcha: when a flow does not fire, check the trigger conditions first. One more: an expression in a trigger's inputs, like utcNow, is calculated once when you save, not on every run.

        Full episode: link in bio

        #PowerAutomate #PowerPlatform #Troubleshooting
      cover_text: "Flow not firing?"
    tiktok:
      caption: "Flow did not fire? Look under All runs for a skipped trigger check. And utcNow in trigger inputs is evaluated once, at save. #PowerAutomate #PowerPlatform"
