linkedin_company:
  text: |
    Your cloud flow ran again for the test item. And nobody can say why.

    Episode 1 of DEVLADLOG Power Automate builds two cloud flows for an IT Requests list in SharePoint and tests them on a laptop before they touch a tenant.

    - An automated flow triages each new request: High priority alerts on-call and gets a four-hour target, everything else gets 24 hours.
    - A trigger condition skips items titled [TEST], so no run is logged at all.
    - A scheduled digest for the service desk, weekdays at eight.
    - Both flows live in a solution, are unpacked with the Power Platform CLI and are checked by 47 tests.

    The gotcha: when a trigger condition is false, you only see a skipped trigger check under All runs.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #PowerAutomate #PowerPlatform #SharePoint #CloudFlows
linkedin_personal:
  text: |
    Most cloud flow bugs I see start the same way: the flow ran when it should not have.

    In episode 1 of DEVLADLOG Power Automate I put the filter in the trigger condition, not in the first action. A title starting with [TEST] never starts a run. No run history, no actions used. A condition inside the flow would still start a run for every item.

    I also run both flows through a small Python harness and 47 tests before the tenant sees them.

    Episode: {YOUTUBE_URL}

    #PowerAutomate #SharePoint

    Narration uses an AI voice.
