linkedin_company:
  text: |
    Finance is the back end of the Contoso story: customers, invoices, who owes what. One thing first, honestly: we have no Dynamics 365 Finance trial.

    So episode 12 of DEVLADLOG Dynamics 365 uses Business Central instead, in a developer container, and checks its customers against Dataverse with code. A note on architecture so nobody is misled: Finance and Operations apps and Business Central are different products with different APIs.
    - a script builds the container from Microsoft's BcContainerHelper, using the Cronus demonstration company, with the admin password kept out of the repository
    - the Business Central API: list companies first, then follow the next link
    - a reconcile command: a company customer with no matching Dataverse account number is an error, the same number under another name is a warning
    - a failing exit code, so it can run later as a drift check

    Watch the episode: {YOUTUBE_URL}
    Code and setup script: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.

    #BusinessCentral #Dynamics365 #Dataverse #PowerPlatform
linkedin_personal:
  text: |
    In Business Central's API, no company id means no data. Every resource lives under companies(id), so the first call lists companies and every other call carries the id.

    A related one: a customer number is only unique inside one company. When you compare Business Central customers with Dataverse accounts by number, scope the check to the company you mean.

    Episode 12 of my Dynamics 365 series runs Business Central in a developer container and reconciles its customers with Dataverse from code: {YOUTUBE_URL}

    Narration uses an AI voice.

    #BusinessCentral #Dynamics365 #Dataverse
