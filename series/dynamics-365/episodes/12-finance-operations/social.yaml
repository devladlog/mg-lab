    instagram_reel:
      caption: |
        Gotchas for a Business Central developer container.

        Docker must be in Windows containers mode. Learn says a container needs at least 6 GB of memory and about 15 GB of disk. For version 28 containers, use Windows PowerShell 5.1, because 7 has a known problem loading the admin modules.

        And in the API: no company id, no data. A customer number is only unique inside one company.

