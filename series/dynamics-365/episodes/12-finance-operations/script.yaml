scenes:
  - id: hook
    type: title
    heading: "Same customer, two systems"
    sub: "Business Central meets Dataverse"
    short: hook
    narration: >
      Finance is the back end of the Contoso story: customers, invoices, who owes what. One thing first, honestly. We have
      no Dynamics 365 Finance trial, and Microsoft's self service Business Central trial is not available to us in
      Portugal. So this episode runs the real Business Central, in a developer container on this laptop, and checks its
      customers against Dataverse with code.

  - id: architecture
    type: bullets
    heading: "Architecture: Finance and Operations vs Business Central"
    bullets:
      - "Finance and Operations: OData on data entities, app registered in Entra and in the app"
      - "It needs cross-company=true, pages up to 10,000, 429 throttling"
      - "Business Central: API v2.0, everything under companies(id), pages up to 20,000"
      - "This demo runs Business Central, not Finance and Operations"
    narration: >
      A quick architecture note, so nobody is misled. Finance and Operations apps expose data entities over O Data. The
      Entra app is registered inside the app too, you add cross company equals true to leave your default company,
      pages come in chunks of up to ten thousand rows, and throttling answers four twenty nine. Business Central is a
      different product, for small and mid sized organizations. Its A P I version two puts every resource under a company
      i d, with pages of up to twenty thousand rows. Same idea, different calls. What we run today is Business Central.

  - id: setup-code
    type: code
    heading: "One script builds the container"
    lang: powershell
    code: |
      $p = @{ type = 'Sandbox'; country = $Country; select = 'Latest' }
      if ($Version) { $p.version = $Version }
      $url = Get-BcArtifactUrl @p
      # ... generate the password, encrypt it with DPAPI ...
      Save-LabSecret -Path $SecretPath -Secret $secure
      New-BcContainer -accept_eula -containerName $Name -artifactUrl $artifactUrl `
          -auth NavUserPassword -Credential $credential `
          -memoryLimit $Memory -updateHosts -assignPremiumPlan -shortcuts None @extra | Out-Null
    narration: >
      The container comes from Microsoft's Bc Container Helper module. We ask it for the latest sandbox artifact of the
      U S version, which has the Cronus demonstration company. The script generates the admin password, encrypts it with
      the Windows data protection A P I, and only then creates the container, with user name and password
      authentication and an eight gigabyte limit. The module switches the A P I services on, and the script proves it
      with a real call.

  - id: container
    type: screen
    heading: "A real container on the laptop"
    image: screens/bc-container.jpg
    video: screens/bc-container.mp4
    bar: "PowerShell (admin) · New-LabBusinessCentral.ps1 · docker ps · Business Central web client"
    demo: >
      Elevated Windows PowerShell on the recording laptop: the script's Docker check line (Windows containers mode), then its
      final lines (the API ok line with the company names; the password is never shown), then docker ps with mglab-bc
      running, then the Business Central web client open on the Cronus company. The first run (about 15 GB download) is
      recorded beforehand; show the idempotent second run. Mask nothing secret: no password appears.
    narration: >
      On the recording laptop, Docker Desktop is in Windows containers mode. The script checks that first, and says how to
      switch if it is not. The first run downloads about fifteen gigabytes, so we start from a finished container. Docker
      p s shows it running, the script's second run changes nothing, and the web client opens on Cronus.

  - id: auth
    type: bullets
    heading: "Basic authentication: the container only"
    bullets:
      - "User admin, password generated, stored DPAPI-encrypted"
      - "Learn: on-premises basic auth takes the web service access key"
      - "Basic auth with access keys is deprecated in Business Central online"
      - "Online: OAuth"
    narration: >
      Authentication is basic here: the admin user, and the password the script generated. Learn says that on premises,
      basic authentication takes the web service access key as the password, so if the password is ever refused, the
      doctor command tells you what to do. And access keys are deprecated in Business Central online, where you use OAuth.
      So this login is for the container only.

  - id: api-code
    type: code
    heading: "Companies first, then follow the next link"
    lang: python
    code: |
      return f"{self.root}/companies({company_id})/{entity}" + ("?" + "&".join(parts) if parts else "")
      # ...
      if page_size:
          headers["Prefer"] = f"odata.maxpagesize={page_size}"
      retry_on = {429, 503} if method == "GET" else {429}
      # ...
      page = self.request("GET", nxt, page_size=page_size) or {}
      yield from page.get("value", [])
      nxt = page.get("@odata.nextLink")
    narration: >
      Every resource lives under a company, so the first call lists companies, and every other call carries the company
      i d. We ask for pages with the prefer header and follow the next link until it is gone. Four twenty nine and five
      oh three are the throttling answers: we wait and try again. But a post is never retried on a five oh three, so a
      customer is never created twice.

  - id: doctor
    type: screen
    heading: "The first real call"
    image: screens/bckit-customers.jpg
    video: screens/bckit-customers.mp4
    bar: "Terminal · bckit doctor · companies · customers"
    demo: >
      Terminal after New-LabBusinessCentral.ps1 -SetEnv: python -m bckit doctor (the root URL it calls, the ok lines with
      the company names), then python -m bckit seed --company "CRONUS USA, Inc." (created or exists lines with the numbers
      Business Central assigned), then python -m bckit customers --company "CRONUS USA, Inc." --limit 12. If the first run
      fails, show the real error line and what fixed it. The password is never on screen.
    narration: >
      First real call. The doctor command reads the A P I root and the companies list, and says whether the container,
      the endpoint and the login all work. Then we create three fictional Contoso customers and one person in the Cronus
      company, and list the customers. A failed login shows as an error line with the Learn hint, not a stack trace.

  - id: invoices
    type: screen
    heading: "The money side"
    image: screens/bckit-invoices.jpg
    video: screens/bckit-invoices.mp4
    bar: "Business Central web client · Sales Invoice · Terminal · bckit invoices"
    demo: >
      Business Central web client: create a sales invoice for Contoso Retail with any item from the item list, post it. Then in
      the terminal python -m bckit invoices --company "CRONUS USA, Inc." --customer <the number of Contoso Retail> and the
      same with --status Open. Keep whatever it really prints.
    narration: >
      Now the money side. We post one sales invoice for Contoso Retail in the web client, and read it back through the
      A P I. The invoices command filters by status and customer, and adds up what is still remaining. The status column
      tells draft from open and paid.

  - id: reconcile-code
    type: code
    heading: "Is it the same customer?"
    lang: python
    code: |
      def norm(s: str) -> str:
          return " ".join(s.casefold().split())

      match = dv_by_number.get(number)
      if not match:
          out.append(Finding("error", "R001", number, f"{first.name!r} ({where}) has no Dataverse account with this "
                             "account number"))
          continue
      if all(norm(a.name) != norm(first.name) for a in match):
          out.append(Finding("warning", "R003", number, f"name differs: Business Central {first.name!r}, "
    narration: >
      The key is the customer number in Business Central, against the account number in Dataverse. A company customer with
      no Dataverse account carrying that number is an error. Same number but another name is a warning. We also flag a
      number that exists in several companies, a Dataverse account Business Central doesn't know, and people, which are
      contacts, not accounts.

  - id: reconcile
    type: screen
    heading: "Two systems, one answer"
    image: screens/bckit-reconcile.jpg
    video: screens/bckit-reconcile.mp4
    bar: "Terminal · bckit reconcile · Business Central customer · Dataverse account"
    demo: >
      Terminal: python -m bckit reconcile --name-contains Contoso against the container and the Dataverse environment chosen in
      demo.md, with its summary, findings and exit code (echo the exit code), then the unscoped run. Then the Business Central
      customer card and the Dataverse Account for Contoso Retail side by side, the number on both. Keep what it really prints;
      mask the Dataverse URL.
    narration: >
      The result for our lab, from the real services. Counts on both sides, a finding per mismatch, and a failing exit code
      when something is missing. Scoped to Contoso, so the Cronus sample customers don't bury it. Run it before you couple
      anything, and later as a drift check.
    short: reconcile

  - id: sync
    type: bullets
    heading: "How it connects in real life"
    bullets:
      - "Business Central: Dataverse data sync, Customer to Account, coupled records"
      - "Business Central: virtual tables read the API, no copy"
      - "Finance and Operations: dual-write"
      - "None of them is set up in this lab"
    narration: >
      How would this connect for real? Business Central has its own synchronization with Dataverse: customers map to
      accounts, you couple the records, and blocked customers are filtered out. It also has virtual tables, which read
      Business Central through its A P I without copying. Finance and Operations has dual write. We did not set up any of
      them here. The reconcile command is the check before you do, and the drift check after.

  - id: gotcha
    type: bullets
    heading: "Gotchas"
    bullets:
      - "Docker must be in Windows containers mode"
      - "At least 6 GB of memory, about 15 GB of disk"
      - "Version 28 containers: use Windows PowerShell 5.1"
      - "No company id, no data: everything is under companies(id)"
      - "A customer number is only unique inside one company"
    short: gotcha
    narration: >
      The gotchas. Docker must be in Windows containers mode, and Learn says a container needs at least six gigabytes of
      memory and about fifteen of disk. For version twenty eight containers, Learn says to use Windows PowerShell five
      point one, because seven has a known problem loading the admin modules. No company i d, no data. And a customer
      number is only unique inside one company.

  - id: recap
    type: bullets
    heading: "Four rules"
    bullets:
      - "Say which company: the id is in every URL"
      - "Follow nextLink, honour Retry-After"
      - "Keep the password out of the repo"
      - "Check drift with code, not by eye"
    narration: >
      Four rules. Say which company: the i d is in every U R L. Follow the next link and honour retry after. Keep the
      password out of the repository. And check for drift with code, not by eye.

  - id: outro
    type: outro
    heading: "Code on GitHub, guides on devladlog.com"
    sub: "github.com/devladlog/mg-lab"
    narration: >
      The setup script, the tool, the sample data and all the tests are on GitHub, and the complete guide to Finance and
      Operations is on devladlog dot com. Thanks for following the series.
