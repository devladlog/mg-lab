    narration: >
      Every call carries the solution unique name header, so the table, columns and key land in our solution,
      not the default one. And look at the end: the key isn't usable yet. Its index is built by a background job,
      so the script polls until the status says active.

  - id: maker
    type: screen
    heading: "Same table in the maker portal"
    image: screens/maker-keys.jpg
    bar: "Power Apps · Solutions · MG Lab Dataverse · Project Request · Keys"
    demo: >
      make.powerapps.com, Solutions, MGLabDataverse, Project Request table, Keys page showing "Request Code"
      on mgl_requestcode, status Active. Optional second capture: the Columns page with Budget, Due Date,
