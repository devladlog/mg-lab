    narration: >
      In the maker portal it's an ordinary table with an ordinary key. The difference is that we can recreate
      it in any environment from code, review it in a pull request, and never click through the designer twice.

  - id: upsert
    type: code
    heading: "Upsert by alternate key"
    lang: python
    code: |
      def upsert(self, entity_set, key, data, *, mode="upsert"):
          headers = {}
          if mode == "create-only":
              headers["If-None-Match"] = "*"   # 412 if it already exists
          elif mode == "update-only":
              headers["If-Match"] = "*"        # 404 if it doesn't
          body = {k: v for k, v in data.items() if k not in key}
          url = f"{entity_set}{key_segment(key)}"
          return self.request("PATCH", url, json=body, headers=headers)

      key_segment({"mgl_requestcode": "PR-0001"})  # (mgl_requestcode='PR-0001')
      key_segment({"mgl_requestcode": "PR/0019"})  # KeyValueError: contains /
    narration: >
      Upsert is a patch to a URL that names the record by its key. No header means create or update. If match
      star means update only, and if none match star means create only. Key columns stay out of the body.
      And one detail from the docs: key values containing a slash, a percent, an ampersand and a few others
      break get and patch by key, so we refuse them before sending anything.

  - id: gotcha
    type: bullets
    heading: "Gotcha: the key exists before it works"
    bullets:
      - "Creating the key returns at once; the index builds in the background"
      - "Status: Pending, In Progress, Active, or Failed"
      - "Upsert by key before Active: don't"
      - "Failed? Fix duplicate data, then ReactivateEntityKey"
      - "Same in solution imports: check the key after deploy"
    short: gotcha
    narration: >
      Here's the gotcha. Creating an alternate key returns immediately, but the key isn't ready. Dataverse
      builds a database index in the background, and the status goes from pending to in progress to active,
      or to failed if existing rows already break the uniqueness. So poll before you upsert, and after
      every deployment too. If it failed, fix the duplicates and reactivate the key.

  - id: batch
    type: code
    heading: "Batches: one bad row doesn't block the rest"
    lang: python
    code: |
      for row in rows:
          try:
              url = f"mgl_projectrequests{key_segment({'mgl_requestcode': row['request_code']})}"
          except KeyValueError as e:
              out(f"  SKIPPED {row['request_code']!r}: {e}")
              continue
          items.append(BatchItem("PATCH", url, _row_to_body(row)))
          if len(items) == batch_size:
              flush()   # POST $batch, no change set, Prefer: odata.continue-on-error

      # A batch holds up to 1,000 requests. A change set inside it is one transaction.
    narration: >
      The import groups upserts into dollar batch requests. A batch holds up to a thousand requests. We don't
      use a change set here, because a change set is all or nothing, and with continue on error one bad row
      doesn't block the other ninety-nine. The tests cover both behaviours.

  - id: import
    type: screen
    heading: "Run it twice: still eighteen records"
    image: screens/import.jpg
    bar: "Terminal · python -m dvlab import (run twice)"
    demo: >
      Same terminal, `python -m dvlab import --env-url <lab env>` run twice in a row. First run shows SKIPPED
      'PR/0019', FAILED PR-0018 with the real server message for a budget below the minimum, and
      "19/21 rows upserted into 18 records". Second run: same summary line. Then the Project Requests view in
      the model-driven app (or `report`) showing 18 rows, no duplicates. Rewrite the narration if the real error
      text differs. Mask the environment URL.
    narration: >
      In the lab, the first run skips the code with a slash, the server rejects the negative budget, and
      eighteen records arrive, because one code appears twice in the file and simply updates. Run it again, and
      we still have eighteen. That's what an alternate key buys you.

  - id: paging
    type: code
    heading: "Paging: follow the next link, don't build it"
    lang: python
    code: |
      prefer = f"odata.maxpagesize={page_size}"     # 5,000 is the maximum
      url = f"{entity_set}?$select=...&$filter=mgl_budget ge 50000&$orderby=mgl_requestcode asc"
      while url:
          r = self.request("GET", url, headers={"Prefer": prefer})
          payload = r.json()
          yield payload.get("value", [])
          url = payload.get("@odata.nextLink")      # use it as-is, same page size

      # $skip isn't supported. Order by something unique, or pages can overlap.
    narration: >
      Reading is just as careful. Ask for a page size with the prefer header, up to five thousand rows. Then
      follow the next link exactly as returned, with the same page size, until there isn't one. Dollar skip
      isn't supported, and you should order by something unique, or the same row can show up on two pages.

  - id: limits
    type: code
    heading: "Service protection limits, per user"
    lang: text
    code: |
      Requests             6,000 in a 5-minute sliding window
      Execution time       20 minutes combined in that window
      Concurrent requests  52 or higher

      HTTP 429 Too Many Requests
      Retry-After: <seconds>

      wait = float(retry_after) if retry_after else float(2 ** attempt)
      self._sleep(wait)        # then send the same request again
    short: limits
    narration: >
      Every API user has limits, evaluated per web server. By default, six thousand requests in a five minute
      sliding window, twenty minutes of combined execution time, and fifty-two concurrent requests or more.
      Go over and you get a four twenty-nine with a retry after header in seconds. Don't show that to users and
      don't give up: wait exactly that long and retry. Batching doesn't dodge this, it moves you to the
      execution time limit.

  - id: report
    type: screen
    heading: "The paged report against the lab"
    image: screens/report.jpg
    bar: "Terminal · python -m dvlab report --page-size 5"
    demo: >
      `python -m dvlab report --env-url <lab env> --page-size 5`: "page 1: 5 rows", "page 2: 5 rows", priority
      shown as the formatted label (High / Normal) coming from the
      OData.Community.Display.V1.FormattedValue annotation, total "10 requests with budget >= 50,000".
      Mask the environment URL.
    narration: >
      Against the lab, ten requests above fifty thousand, five per page, and the priority label comes from the
      formatted value annotation, so we never hard code the choice labels in the report.

  - id: tests
    type: code
    heading: "Forty-three tests, no tenant needed"
    lang: text
    code: |
      $ python -m pytest -q tests
      ...........................................                     [100%]
      43 passed in 0.15s

      test_upsert_before_the_key_is_active_fails
      test_create_only_and_update_only
      test_paging_follows_next_link_verbatim_with_the_same_page_size
      test_429_waits_for_retry_after_then_succeeds
      test_changeset_is_all_or_nothing
      test_import_is_idempotent_and_reports_bad_rows
    narration: >
      All of this is tested without a tenant. The client talks to an in-memory stand-in plugged into the HTTP
      layer, so the same code path runs in CI. It's not Dataverse, and the demo in the lab is what proves the
      real behaviour. But it catches regressions in seconds.

  - id: recap
    type: bullets
    heading: "Five rules"
    bullets:
      - "Tables, columns and keys as code, inside a solution"
      - "Upsert by alternate key, and wait until the key is Active"
      - "Batches for throughput; change sets only when it must be atomic"
      - "Follow nextLink as returned; order by something unique"
      - "Honour Retry-After; never surface a 429 to users"
    narration: >
      Five rules. Define tables, columns and keys as code, inside a solution. Upsert by alternate key, and wait
      until the key is active. Use batches for throughput, and change sets only when it really must be atomic.
      Follow the next link as returned. And honour retry after.

