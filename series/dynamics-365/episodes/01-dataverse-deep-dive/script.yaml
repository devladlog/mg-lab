scenes:
  - id: hook
    type: title
    heading: "Dataverse Deep Dive"
    sub: "Tables as code, upsert by key, batches and API limits"
    short: hook
    narration: >
      Most Dataverse imports work fine on day one. On day two someone runs them again, and now every record
      exists twice. In this episode we build a Dataverse table as code, load it with an import you can run a hundred
      times, and handle the limits the platform puts on every API user. Everything runs locally with tests,
      and then for real in our lab environment.

  - id: plan
    type: bullets
    heading: "What we're building"
    bullets:
      - "Project Request table: columns, choice, lookup to Account"
      - "An alternate key on the business code from the intake system"
      - "An import that upserts by that key, in batches"
      - "A paged report and a client that respects throttling"
      - "43 pytest tests against an in-memory stand-in"
    narration: >
      Here's the plan. A Project Request table with a money column, a choice, a date and a lookup to Account.
      An alternate key on the request code that comes from the intake system. An import that upserts by that key,
      in batches. A paged report. And a small Python client that handles throttling, covered by forty-one tests.

  - id: table
    type: code
    heading: "The table is a JSON document"
    lang: python
    code: |
      def project_request_table():
          return {
              "@odata.type": ODATA + "EntityMetadata",
              "SchemaName": "mgl_ProjectRequest",
              "DisplayName": label("Project Request"),
              "DisplayCollectionName": label("Project Requests"),
              "OwnershipType": "UserOwned",   # can't be changed later
              "IsActivity": False, "HasActivities": False, "HasNotes": True,
              "ChangeTrackingEnabled": True,
              "Attributes": [
                  string_column("mgl_Name", "Name", 200, primary=True,
                                required="ApplicationRequired"),
              ],
          }
    narration: >
      In the Web API, a table is a JSON document you post to entity definitions. The schema name carries the
      publisher prefix, and the primary name column has to be in the same request. Two choices matter forever.
      Ownership type can't be changed later, and user owned is what gives you security by owner and business unit.
      And change tracking lets integrations ask what changed since their last sync.

  - id: keys
    type: code
    heading: "A lookup and an alternate key"
    lang: python
    code: |
      def account_relationship():
          return {
              "@odata.type": ODATA + "OneToManyRelationshipMetadata",
              "SchemaName": "mgl_account_projectrequest",
              "ReferencedEntity": "account", "ReferencedAttribute": "accountid",
              "ReferencingEntity": "mgl_projectrequest",
              "CascadeConfiguration": {"Delete": "RemoveLink", ...},
              "Lookup": {"@odata.type": ODATA + "LookupAttributeMetadata",
                         "SchemaName": "mgl_CustomerAccountId", ...},
          }

      def request_code_key():
          return {"SchemaName": "mgl_RequestCodeKey",
                  "KeyAttributes": ["mgl_requestcode"]}
    narration: >
      The lookup to Account is a one to many relationship, and the lookup column is created in the same call.
      Delete is set to remove link, so deleting an account clears the lookup instead of deleting requests.
      Then the alternate key: one column, the request code. A table can have up to ten of these.

  - id: provision
    type: screen
    heading: "Provisioned in the lab, inside a solution"
    image: screens/provision.jpg
    bar: "Terminal · python -m dvlab provision"
    demo: >
      Terminal (dark, font 18+) running `python -m dvlab provision --env-url <lab env>` against the lab DEV
