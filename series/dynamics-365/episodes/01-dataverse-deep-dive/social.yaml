        #Dataverse #Dynamics365 #PowerPlatform
      cover_text: "Import twice, duplicates?"
    tiktok:
      caption: "Dataverse imports break on day two, when someone runs them again and every record doubles. An alternate key plus upsert fixes it. #Dataverse #Dynamics365 #PowerPlatform"
  - id: gotcha
    youtube_short_title: "Dataverse alternate key: it exists before it works #Shorts"
    instagram_reel:
      caption: |
        Creating a Dataverse alternate key returns immediately. The key is not ready.

        Dataverse builds a database index in the background, and the status goes Pending, In Progress, then Active. Or Failed, if existing rows already break the uniqueness.

        So poll the status before you upsert, and again after every deployment. If it failed, fix the duplicates and reactivate the key.

        Full episode: link in bio.

        #Dataverse #Dynamics365 #PowerPlatform
      cover_text: "The key isn't ready yet"
    tiktok:
      caption: "Dataverse alternate key: creating it returns at once, but the index builds in the background. Wait for Active before you upsert. #Dataverse #Dynamics365 #PowerPlatform"
  - id: limits
    youtube_short_title: "Dataverse 429: wait for Retry-After, then send it again #Shorts"
    instagram_reel:
      caption: |
        Every Dataverse API user has service protection limits. By default: 6,000 requests in a 5-minute sliding window, 20 minutes of combined execution time, and 52 or more concurrent requests.

        Go over and you get HTTP 429 with a Retry-After header in seconds. Do not show that to users, and do not give up. Wait exactly that long and retry.

        Batching does not dodge the limits. It moves you to the execution time limit.

        Full episode: link in bio.

        #Dataverse #Dynamics365 #PowerPlatform
      cover_text: "Handling Dataverse 429"
    tiktok:
      caption: "Dataverse API limits: 6,000 requests per 5 minutes per user. On HTTP 429, wait Retry-After seconds and retry. Batching moves the limit, it does not remove it. #Dataverse #Dynamics365"
