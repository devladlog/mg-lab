linkedin_company:
  text: |
    Open the pipeline total in a chart, in a query and in Power BI, and you will sometimes get three different numbers.

    Episode 10 of DEVLADLOG Dynamics 365 totals the open pipeline more than one way and reconciles the results from code:
    - a FetchXML aggregate, with an alias on every attribute and an order on the group alias
    - the same question with OData $apply
    - the rows themselves as the reference, compared group by group, with a failing exit code when they differ
    - a Dynamics 365 chart built from a definition we can test before sending it
    - the same total in Power BI

    The limits to know, all from Learn: aggregate queries stop at 50,000 records, OData cannot group by a datetime or order by an aggregate, date grouping uses the user's time zone by default, sums skip null values, and the Power BI Dataverse connector has an 80 MB result limit and a 5 minute timeout per query.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.

    #Dynamics365 #Dataverse #PowerBI #FetchXML
linkedin_personal:
  text: |
    One rule for any report number: ask the question once, compute it two ways, and compare.

    In episode 10 I total the open pipeline with a FetchXML aggregate and with OData $apply, then check both against the raw rows, group by group. If they differ, the command fails. It also forced me to read the limits properly: aggregates stop at 50,000 records, OData cannot group by a date, and date grouping uses the user's time zone unless you turn that off.

    {YOUTUBE_URL}

    Narration uses an AI voice.

    #Dynamics365 #Dataverse #PowerBI
