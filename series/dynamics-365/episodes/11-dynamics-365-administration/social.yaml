linkedin_company:
  text: |
    Three questions every Dynamics 365 admin gets asked. Is auditing actually on? Did anything fail in the background last night? Who can do anything in this environment?

    Episode 11 of DEVLADLOG Dynamics 365 answers them in the admin center, then writes them down as rules a schedule can run:
    - environment settings read from the organization row: auditing, retention, plug-in trace log, session timeouts
    - turning auditing on with a single update, as a dry run until you say apply
    - failed system jobs from the last seven days, and jobs still open after 24 hours
    - who holds System Administrator, with people and application users counted apart and a failing exit code over the limit

    From Learn: auditing is off by default and has three levels, a new retention period applies only to records written afterwards, tenant admins have to elevate themselves to System Administrator, and trial environments are not backed up.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.

    #Dynamics365 #PowerPlatform #Dataverse #PowerPlatformAdmin
linkedin_personal:
  text: |
    A detail about Dataverse auditing that is easy to miss: when you change the retention period, it applies only to audit records written afterwards. Each record keeps the retention that was in force when it was written.

    Also, auditing is off by default and has three levels: the environment, the table and the column. Turning on the first does not audit anything on its own.

    Episode 11 of my Dynamics 365 series turns the weekly admin check into code: auditing, failed system jobs, and who holds System Administrator. {YOUTUBE_URL}

    Narration uses an AI voice.

    #Dynamics365 #Dataverse #PowerPlatform
