linkedin_company:
  text: |
    A store manager has a broken till and no way to tell support except email. A Power Pages support page can read and create cases straight from Dataverse through the portal Web API.

    Episode 9 of DEVLADLOG Dynamics 365 builds that page, then spends the time on the part that keeps it safe: the configuration behind it.
    - two site settings per table: one enables the Web API, one lists the columns it may return
    - table permissions through web roles, which decide what each call can touch
    - a CSRF token sent with every call from the page
    - a small linter that reads the downloaded site configuration and applies rules taken from Microsoft Learn, with an exit code you can use as a pipeline gate
    - a check that the columns in the settings really exist in Dataverse

    Good to know from Learn: the wildcard in the columns setting is deprecated and requests fail, site settings use the table's logical name while code uses the entity set name, and this API is not meant for third-party integration.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.

    #PowerPages #Dataverse #Dynamics365 #PowerPlatform
linkedin_personal:
  text: |
    With the Power Pages Web API, nothing is exposed until you say so, and that is where mistakes hide. A wildcard in the columns setting is deprecated and requests fail. A table enabled with no table permission means every call is denied. Global scope for anonymous users is worse.

    So I wrote a linter that reads the downloaded site configuration and applies those rules from Learn, before a customer finds the problem. The exit code makes it a pipeline gate.

    Episode 9 of my Dynamics 365 series builds a support page and then reviews its configuration: {YOUTUBE_URL}

    Narration uses an AI voice.

    #PowerPages #Dataverse #Dynamics365
