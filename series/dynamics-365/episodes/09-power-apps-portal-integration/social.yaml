    youtube_short_title: "Power Pages Web API gotchas from Microsoft Learn #Shorts"
    instagram_reel:
      caption: |
        Gotchas for the Power Pages Web API, all from Learn.

        The wildcard in the columns setting is deprecated and requests fail. Table permissions always apply, even to the Web API. Site settings use the table's logical name, but your code uses the entity set name, the plural. Operations are case sensitive.

        And it is not for third-party integration. Use the Dataverse Web API with a proper application identity.

