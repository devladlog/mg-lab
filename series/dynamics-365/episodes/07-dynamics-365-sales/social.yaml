linkedin_company:
  text: |
    Every sales forecast is only as good as the opportunities behind it. One with no close date, one with no revenue, one that was due last month.

    Episode 7 of DEVLADLOG Dynamics 365 takes a lead through Dynamics 365 Sales and checks the pipeline from code:
    - qualify a lead with the QualifyLead action, as a dry run until you say apply, then read the result back
    - an open pipeline by close month and forecast category, with weighted value as estimated revenue times probability
    - hygiene rules: a past or missing close date and missing revenue are errors, and errors make the exit code 1
    - close the opportunity as won with the close action

    Some things Learn documents are easy to miss: repeating a qualification is not a safe no-op, you can disqualify only a lead with no opportunity, and closing creates an Opportunity Close activity rather than just changing a field.

    This does not replace the Sales Hub app. It is the part you can test and run every Monday without a browser.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.

    #Dynamics365Sales #Dynamics365 #Dataverse #PowerPlatform
linkedin_personal:
  text: |
    Before anyone trusts a pipeline number, ask which opportunities have no close date, no revenue, or a close date in the past. Those records make the forecast lie.

    In episode 7 I wrote a check for exactly that. Errors make the exit code 1, so a scheduled pipeline turns red before the forecast meeting. The weighted value is plain arithmetic, estimated revenue times probability, not the forecasting in Sales Premium.

    It also wraps QualifyLead as a dry run first, with a read-back afterwards, because repeating a qualification is not safe.

    {YOUTUBE_URL}

    Narration uses an AI voice.

    #Dynamics365Sales #Dynamics365 #Dataverse
