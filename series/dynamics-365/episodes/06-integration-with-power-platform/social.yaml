linkedin_company:
  text: |
    A project request becomes high risk, and the finance team should hear about it in Teams without anyone writing integration code.

    Episode 6 of DEVLADLOG Dynamics 365 connects the pieces through Dataverse:
    - a Power Automate flow that triggers on one column, the risk score, and only for rows at 70 or more
    - the flow calls the custom API from episode 5 and posts to a Teams channel
    - environment variables whose definitions ship in the solution while the values stay per environment
    - a tool that pulls the flow's JSON, lints it like code, and reads its run history from Dataverse
    - a deployment settings file checked for empty values before a pipeline sees it

    The gotcha: a trigger with Select columns runs whenever a listed column is part of the update, even if the value did not change. That is why the plugin from episode 5 writes the score only when it moves. Otherwise finance gets the same message again and again.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.

    #PowerAutomate #Dataverse #Dynamics365 #PowerPlatform
linkedin_personal:
  text: |
    A Dataverse flow trigger with Select columns does not check whether the value changed. Per Microsoft Learn, it runs when any listed column is part of the update, even with the same value.

    If something rewrites that column on every save, your Teams channel gets the same message every time. In my case the fix lives in the plugin: compare with the post image and write the score only when it moves. Also, lookup columns in Select columns never trigger, and never list the primary key.

    Episode 6 of my Dynamics 365 series builds the flow and lints it like code: {YOUTUBE_URL}

    Narration uses an AI voice.

    #PowerAutomate #Dataverse #Dynamics365
