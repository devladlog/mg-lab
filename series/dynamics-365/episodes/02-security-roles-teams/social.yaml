linkedin_company:
  text: |
    "I can't see a record that was shared with me." "He can read records in a business unit he isn't even in." Both can be correct, and Dataverse can tell you why.

    Episode 2 of DEVLADLOG Dynamics 365 turns Microsoft's documented access rules into a small tool that explains every decision:
    - a privilege check first, then ownership, role access by level, or sharing
    - team roles measured from the team's business unit, not the member's
    - the Member's privilege inheritance setting on team roles
    - a least-privilege audit that exits with code 1 on a high finding, so a pipeline can run it after every solution change
    - an export from an environment, verified against RetrievePrincipalAccess

    The classic ticket: a record is shared with an access team, the user is in that team, and she still cannot open it. Sharing only counts after the privilege check. Without a role that grants Read on the table, the share does nothing.

    Watch the episode: {YOUTUBE_URL}
    Code and the fictional Contoso model: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.

    #Dataverse #Dynamics365 #PowerPlatform #SecurityRoles
linkedin_personal:
  text: |
    The classic Dataverse security support ticket: "the record is shared with the team, I'm in the team, I still can't open it."

    Sharing is checked after the privilege check. If none of your roles grants Read on that table, the share cannot help you. Access teams hold no roles, so being in one fixes nothing on its own.

    I wrote a small tool that follows Microsoft's documented algorithm and prints every reason behind an allow or a deny. Episode 2 of my Dynamics 365 series walks through it: {YOUTUBE_URL}

    Narration uses an AI voice.

    #Dataverse #Dynamics365 #PowerPlatform
