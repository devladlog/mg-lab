  - id: apitrap
    youtube_short_title: "RetrieveUserPrivileges only reports Basic depth for team roles #Shorts"
    instagram_reel:
      caption: |
        To export a real security model from Dataverse, there is a trap in the API.

        RetrieveUserPrivileges looks perfect, but the docs warn that for privileges inherited through a team it only reports the Basic depth, whatever the team's role really grants.

        So the exporter reads every role's privileges with their real depth, and the team memberships separately.

        Full episode: link in bio.

