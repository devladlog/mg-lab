linkedin_company:
  text: |
    Classic workflows still run in plenty of Dynamics 365 environments, and new ones still get built. Microsoft's own guidance says build flows instead. So where does server-side logic go now?

    Episode 5 of DEVLADLOG Dynamics 365 builds the replacement pieces on the Project Request table:
    - a custom API with a plugin behind it, returning a risk score from 0 to 100 and the reasons
    - an asynchronous plugin that keeps a score column fresh, the job a background workflow used to do
    - a deploy tool that creates the API as one deep insert and can be run twice
    - a command that lists the classic workflows you still have and suggests a target for each

    The trap: binding type, function or action, and the allowed custom processing step type cannot be changed after you save. The Dataverse connector in Power Automate only performs actions, so a function is invisible to flows. Decide before the first save.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.

    #Dynamics365 #Dataverse #PowerPlatform #DataversePlugins
linkedin_personal:
  text: |
    Some custom API choices in Dataverse are permanent. Binding type, bound table, Is Function and the allowed custom processing step type cannot be changed once saved.

    That matters more than it looks. The Dataverse connector in Power Automate only performs actions, so if a flow will ever call your API, it has to be an action from day one. I made the deploy tool compare what is deployed with the config and refuse, rather than pretend a PATCH worked.

    Episode 5 of my Dynamics 365 series builds a custom API, an async plugin and a classic workflow finder: {YOUTUBE_URL}

    Narration uses an AI voice.

    #Dynamics365 #Dataverse #PowerPlatform
