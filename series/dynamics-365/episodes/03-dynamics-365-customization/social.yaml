  - id: gotcha
    youtube_short_title: "Business rules: required is a form-only action #Shorts"
    instagram_reel:
      caption: |
        Scope Entity means a business rule runs on forms and on the server. But only some actions run on the server: set or clear a value, set a default, show an error message.

        Business required, show or hide, and lock are form-only. So an import through the API never sees required.

        Two more traps: a rule does not fire on a form missing one of its columns, and rules run before your OnLoad script.

        Full episode: link in bio.

        #Dynamics365 #PowerPlatform #Dataverse
      cover_text: "Required is form-only"
    tiktok:
      caption: "Business rule, scope Entity: server runs set value, default and show error message. Required, show/hide and lock are form-only. Add an error message action. #Dynamics365 #PowerPlatform"
  - id: viewtrap
    youtube_short_title: "Dataverse view layoutxml: the object type code trap #Shorts"
    instagram_reel:
      caption: |
        Views are saved query rows: FetchXML for the data, layout XML for the grid.

        The trap is the object attribute in the layout. It is the table's object type code, and for custom tables that number differs between environments. Copy a view definition from dev to test with the number baked in, and it breaks.

        So read it from table metadata every time you deploy.

        Full episode: link in bio.

        #Dynamics365 #Dataverse #PowerPlatform
      cover_text: "The view object code trap"
    tiktok:
      caption: "Dataverse view layoutxml has an object attribute: the table's object type code. For custom tables it differs per environment. Read it from metadata, never copy it. #Dynamics365 #Dataverse"
