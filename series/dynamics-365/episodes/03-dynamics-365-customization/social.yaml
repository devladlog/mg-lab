linkedin_company:
  text: |
    A business rule marks a field as required, and an API import still saves the record without it.

    That is the gotcha in episode 3 of DEVLADLOG Dynamics 365. A rule with scope Entity runs on forms and on the server, but only set value, clear value, set default and show error message run on the server. Business required, show or hide and lock are form-only.

    In the episode we customize the Project Request table with the lightest tool for each job, all in one unmanaged solution:
    - layout in the form designer, no code
    - a business rule that pairs the required action with a show error message action
    - a small form script for what a rule cannot do: lock the request code, check the account's other open requests
    - a view created from code, reading the table's object type code from metadata instead of copying it between environments
    - a deploy script you can run twice

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.

    #Dynamics365 #PowerPlatform #Dataverse #BusinessRules
linkedin_personal:
  text: |
    "Set Business Required" in a business rule does not protect the server. It is an easy one to get wrong.

    With scope Entity the rule runs on the server too, but only for set value, clear value, set default and show error message. Required, show or hide and lock are form-only, so an API import never sees them. Pair the required action with a show error message action if the server must refuse the save.

    Episode 3 of my Dynamics 365 series covers this and the other small ways customization goes wrong: {YOUTUBE_URL}

    Narration uses an AI voice.

    #Dynamics365 #Dataverse #PowerPlatform
