  - id: gotcha
    youtube_short_title: "Customer Service SLA: no default SLA means no SLA applied #Shorts"
    instagram_reel:
      caption: |
        Gotchas from Microsoft Learn on Customer Service SLAs.

        No default SLA, no SLA on the case. The First Response By and Resolve By columns are not filled by default. Pausing and resuming a KPI cancels the instance and creates a new one, so a case can have several. The case number cannot be modified.

        And CloseIncident needs Customer Service installed.

        Full episode: link in bio.

        #Dynamics365CustomerService #Dynamics365 #Dataverse
      cover_text: "SLA gotchas from Learn"
    tiktok:
