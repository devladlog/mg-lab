linkedin_company:
  text: |
    A customer has been waiting four hours for a first answer and nobody has noticed.

    Episode 8 of DEVLADLOG Dynamics 365 sets up an SLA in Customer Service and checks the case queue from code, two ways:
    - our own simple rules: priority gives a target in hours, no first response after the target is an error, 80 percent of the resolve target used is a warning
    - what the platform's SLA engine actually decided, read from the SLA KPI instance
    - a doctor command that asks the environment which tables, actions and SLA lookups exist before querying
    - resolving a case with the real CloseIncident action, as a dry run until you say apply

    The trap: in Unified Interface SLAs, the case's First Response By and Resolve By columns are not filled by default, because a case can have several KPIs. Read the KPI instance instead. And with no default SLA set, no SLA is applied at all.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.

    #Dynamics365CustomerService #Dynamics365 #Dataverse #PowerPlatform
linkedin_personal:
  text: |
    If your Customer Service case form shows no First Response By date, the SLA is not necessarily broken. In Unified Interface SLAs those columns are not filled by default, because a case can have several KPI instances. The real deadline lives in the SLA KPI instance the case points to.

    Also: with no default SLA set, nothing is applied to new cases. That is the usual reason for "no SLA on this case".

    Episode 8 of my Dynamics 365 series checks late cases from code, with a simple rule next to what the platform decided: {YOUTUBE_URL}

    Narration uses an AI voice.

    #Dynamics365CustomerService #Dynamics365 #Dataverse
