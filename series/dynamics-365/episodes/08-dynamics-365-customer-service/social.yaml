  - id: resolve
    youtube_short_title: "Resolve a Dynamics 365 case with CloseIncident #Shorts"
    instagram_reel:
      caption: |
        Resolving a case is the CloseIncident action: a resolution record with a subject and the case, and a status of 5, problem solved, or 1000, information provided.

        The wrapper is a dry run until you say apply, and it checks the case is still active. In the app it shows as closed with a resolution activity on the timeline, like the resolve button.

        Running it twice is harmless.

