linkedin_company:
  text: |
    A request goes in, and two weeks later nobody knows whether it is waiting for finance or for approval. A business process flow answers that on the form.

    Episode 4 of DEVLADLOG Dynamics 365 designs an approval flow with one branch, then drives it from code:
    - a Project Approval flow where a budget of 50,000 or more goes through finance review
    - the flow's own table, found from metadata instead of guessed names
    - moving a record one stage at a time, with the traversed path
    - a backfill for records that existed before activation and never got an instance
    - a report of how many days each request has sat in its stage

    Two traps worth knowing. The process stage rows come back in no guaranteed order, so the real path comes from RetrieveActivePath. And the flow's table has its own security: until you grant privileges on it, only System Administrator and System Customizer see the process bar.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.

    #Dynamics365 #PowerPlatform #Dataverse #BusinessProcessFlow
linkedin_personal:
  text: |
    If your users report that the business process flow bar is missing, check security on the flow's own table before anything else.

    Activating a flow creates a table with one row per record. It is organization-scoped, and at first only System Administrator and System Customizer can use it. Give your own roles privileges on it, or users see no process bar at all. Records that existed before activation also have no instance until you backfill them.

    Episode 4 of my Dynamics 365 series designs a flow, then drives and reports on it with the Web API: {YOUTUBE_URL}

    Narration uses an AI voice.

    #Dynamics365 #Dataverse #PowerPlatform
