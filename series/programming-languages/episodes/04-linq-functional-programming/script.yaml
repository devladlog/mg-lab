scenes:
  - id: hook
    type: title
    heading: "LINQ, without the surprises"
    sub: "Same answer, twelve rows instead of five"
    short: hook
    narration: >
      LINQ looks like it simply reads data. Then a query quietly runs three times. A variable you changed later
      changes the answer. And one parameter type makes your app download the whole table, with the right result and
      no warning. In this episode we write functional C# with LINQ, and we look at what really runs. Welcome to
      DEVLADLOG Code.

  - id: plan
    type: bullets
    heading: "What we're building"
    bullets:
      - "A portfolio report over the Contoso project requests"
      - "Pure functions and immutable records"
      - "New operators: CountBy, AggregateBy, Index (.NET 9), LeftJoin (.NET 10)"
      - "A CSV import where errors are values"
      - "The same queries on a real SQLite database with EF Core 10"
    narration: >
      Same Contoso project requests as the rest of the series. We build a portfolio report from pure functions and
      immutable records, using the newest LINQ operators from dot net nine and ten. A CSV import where errors are
      values, not exceptions. And the same queries against a real SQLite database with Entity Framework Core ten.
      Thirty-four tests.

  - id: core
    type: code
    heading: "A pure function is a pipeline"
    lang: csharp
    code: |
      /// .NET 9 AggregateBy: one pass, one accumulator per key, no intermediate groups.
      public static IReadOnlyList<DepartmentTotal> TotalsByDepartment(IEnumerable<ProjectRequest> requests) =>
      [
          .. requests
              .AggregateBy(r => r.DepartmentCode, _ => (Count: 0, Total: 0m),
                  (acc, r) => (acc.Count + 1, acc.Total + r.Budget))
              .Select(kv => new DepartmentTotal(kv.Key, kv.Value.Count, kv.Value.Total))
              .OrderByDescending(t => t.Total),
      ];

      /// .NET 9 CountBy.
      public static IReadOnlyDictionary<RequestStatus, int> CountByStatus(IEnumerable<ProjectRequest> requests) =>
          requests.CountBy(r => r.Status).ToDictionary();
    narration: >
      The functional core is a set of static, pure functions. Data in, data out. No database, no clock, and the input
      is never changed. Aggregate By, new in dot net nine, totals the budget per department in one pass, without
      building groups first. Count By does the same for counting. The result is a new immutable list.

  - id: newops
    type: code
    heading: "Index and LeftJoin"
    lang: csharp
    code: |
      // .NET 9 Index(): (position, item), so the rank needs no counter variable.
      requests.OrderByDescending(r => r.Budget)
              .Take(count)
              .Index()
              .Select(x => new RankedRequest(x.Index + 1, x.Item.Code, x.Item.Title, x.Item.Budget))

      // .NET 10 LeftJoin: every department, also the ones without requests.
      departments
          .LeftJoin(TotalsByDepartment(requests), d => d.Code, t => t.DepartmentCode,
              (d, t) => new DepartmentLine(d.Name, t?.Count ?? 0, t?.Total ?? 0m))
          .OrderByDescending(l => l.Total)
          .ThenBy(l => l.Name, StringComparer.Ordinal)
    narration: >
      Two more new operators. Index gives you the position and the item together, so a ranking needs no counter
      variable. And dot net ten finally has Left Join. Before, a left join meant Group Join, Select Many and Default
      If Empty in exactly the right order. Now it's one call, and Legal shows up with zero requests instead of
      disappearing.

  - id: report
    type: screen
    heading: "The report, from pure functions"
    image: screens/report.jpg
    video: screens/report.mp4
    bar: "Terminal · dotnet run -- report"
    demo: >
      Windows Terminal (dark theme, font 18 pt or larger): dotnet run --project src/Contoso.Portfolio.Cli -- report.
      Visible: totals by department (IT 4 requests 354,500 EUR ...), the LeftJoin block with "Legal 0 0 EUR",
      "Draft=2 Submitted=4 Approved=5 Rejected=1", the top 3 (#1 PR-2026-0103 300,000 EUR) and the last line
      "method syntax == query syntax: True". Reference: demo/expected-output.txt.
    narration: >
      Here it runs. Totals per department, every department including Legal, requests by status, and the top three
      with their rank. And the last line: the method syntax version and the query syntax version of the same report
      give exactly the same result. A test pins that down too.

  - id: syntax
    type: code
    heading: "Query syntax: same pipeline, different spelling"
    lang: csharp
    code: |
      public static IReadOnlyList<DepartmentTotal> TotalsByDepartmentQuerySyntax(IEnumerable<ProjectRequest> requests) =>
      [
          .. from r in requests
             group r by r.DepartmentCode into g
             let total = g.Sum(x => x.Budget)
             orderby total descending
             select new DepartmentTotal(g.Key, g.Count(), total),
      ];

      [Fact]
      public void Method_syntax_and_query_syntax_give_the_same_report() =>
          Assert.Equal(Reports.TotalsByDepartment(Requests), Reports.TotalsByDepartmentQuerySyntax(Requests));
    narration: >
      Query syntax is the same pipeline with a different spelling. The compiler turns from, group, let and select into
      the same method calls. Use whichever reads better. Let is a nice reason to pick query syntax. But the new
      operators, Count By, Aggregate By, Left Join, have no keyword, so for those it's method syntax.

  - id: result
    type: code
    heading: "Errors as values, in query syntax"
    lang: csharp
    code: |
      public static Result<ProjectRequest> ParseLine(string line, int id, IReadOnlySet<string> departments) =>
          from fields in Fields(line, expected: 5)
          from budget in Budget(fields[3])
          from department in Department(fields[2], departments)
          from submitted in Date(fields[4])
          select new ProjectRequest(id, fields[0].Trim(), fields[1].Trim(), department, budget,
              RequestStatus.Draft, submitted);

      // what makes "from ... from ..." work on our own type:
      public static Result<TOut> SelectMany<T, TMid, TOut>(
          this Result<T> result, Func<T, Result<TMid>> bind, Func<T, TMid, TOut> project)
    narration: >
      Here's a functional trick. Query syntax isn't only for collections. Our Result type, a value or an error, has
      Select and Select Many methods, so the compiler lets us write a parser as a query. Each step runs only if the
      previous one succeeded, and the first error is the answer. No exceptions, no nested ifs.

  - id: import
    type: screen
    heading: "Four good lines, four readable errors"
    image: screens/import.jpg
    video: screens/import.mp4
    bar: "Terminal · dotnet run -- import"
    demo: >
      Terminal: dotnet run --project src/Contoso.Portfolio.Cli -- import samples/requests.csv. Visible:
      "requests.csv: 4 accepted, 4 rejected", the four "ok" lines, and "line 4: budget 'abc' is not a positive number",
