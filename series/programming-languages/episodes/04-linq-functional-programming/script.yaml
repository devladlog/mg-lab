  - id: deferred
    type: code
    heading: "Deferred execution: a query is a recipe"
    lang: csharp
    code: |
      var high = source.Where(r => Policy.PriorityFor(r.Budget) == Priority.High);

      var count = high.Count();          // runs the query
      var total = high.Sum(r => r.Budget);   // runs it again
      var first = high.First();          // and again
      // source read 3 times. With .ToList() first: 1 time.

      # .editorconfig: the analyzer for this exists, but it's off by default in .NET 10
      dotnet_diagnostic.CA1851.severity = warning
    narration: >
      Now, what really runs. A LINQ query is a recipe, not a result. Every time you call Count, Sum or First, the
      recipe runs again from the start. On a list that's wasted work. On a database query or a file, that's three
      round trips. The analyzer rule CA eighteen fifty-one catches it, but it's off by default in dot net ten, so
      we switch it on.

  - id: gotcha
    type: code
    heading: "Gotcha: the lambda captures the variable"
    short: gotcha
    lang: csharp
    code: |
      var threshold = 50_000m;
      var big = requests.Where(r => r.Budget >= threshold);   // nothing runs here

      var before = big.Count();     // runs now, threshold = 50,000   -> 5
      threshold = 250_000m;
      var after = big.Count();      // runs again, threshold = 250,000 -> 1

      // Same query object, different answer.
    narration: >
      And this one surprises people. We define a query with a threshold of fifty thousand. Count says five. Then
      somewhere later, someone changes the threshold variable. Same query object, count again: one. The lambda
      captured the variable, not its value, and the query only runs when you enumerate it. If you need a snapshot,
      call To List at that moment.

  - id: deferredrun
    type: screen
    heading: "Proof: the analyzer and the counter"
    image: screens/deferred.jpg
    video: screens/deferred.mp4
    bar: "Terminal · CA1851 + dotnet run -- deferred"
    demo: >
      Terminal: dotnet build demo/Analyzers -m:1 --no-incremental -v q (two "error CA1851" lines), then
      dotnet run --project src/Contoso.Portfolio.Cli -- deferred: "without ToList(): source read 3 times",
      "with ToList(): source read 1 time", "threshold 50,000 -> big.Count() = 5",
      "threshold changed to 250,000, same query object -> big.Count() = 1".
    narration: >
      Here's the proof. The build fails with CA eighteen fifty-one on a method that counts a sequence and then loops
      over it. And our counting source shows it: read three times without To List, once with it. Then five, and one,
      from the same query.

  - id: iqueryable
    type: code
    heading: "Same body, different type, different SQL"
    short: iqueryable
    lang: csharp
    code: |
      // IQueryable: the Where becomes a SQL WHERE.
      public static IQueryable<ProjectRequest> AtLeast(IQueryable<ProjectRequest> requests, decimal threshold) =>
          requests.Where(r => r.Budget >= threshold);

      // IEnumerable: LINQ to Objects. EF reads the WHOLE table, then filters in memory.
      public static IEnumerable<ProjectRequest> AtLeast(IEnumerable<ProjectRequest> requests, decimal threshold) =>
          requests.Where(r => r.Budget >= threshold);

      Queries.AtLeast(db.Requests, 50_000m)                               // 5 rows read
      Queries.AtLeast((IEnumerable<ProjectRequest>)db.Requests, 50_000m)  // 12 rows read, same 5 results
    narration: >
      Now the database. These two methods have the same body. The only difference is the parameter type. With
      I Queryable, the lambda is an expression tree, and Entity Framework turns the Where into SQL. With I
      Enumerable, it's a normal delegate: Entity Framework reads every row, and the filter runs in memory. Same
      answer, no error, no warning.

  - id: sql
    type: screen
    heading: "What the database actually received"
    image: screens/sql.jpg
    video: screens/sql.mp4
    bar: "Terminal · dotnet run -- sql"
    demo: >
      Terminal: dotnet run --project src/Contoso.Portfolio.Cli -- sql (creates portfolio.db with SQLite). Visible:
      the IQueryable block with "WHERE ef_compare("r"."Budget", @threshold) >= 0" and "5 results, 5 rows read",
      the IEnumerable block with no WHERE and "5 results, 12 rows read", then the LeftJoin SQL with
      "LEFT JOIN "Requests" AS "r" ON ..." and Legal 0 requests.
    narration: >
      This is what SQLite actually received. With I Queryable: a where clause, five rows. SQLite has no decimal
      type, so Entity Framework registers its own compare function. With I Enumerable: no where clause, twelve rows,
      for the same five results. With twelve rows nobody notices. With twelve million, everybody does. And dot net
      ten's Left Join becomes a real left join.

  - id: translate
    type: code
    heading: "Not everything translates"
    lang: csharp
    code: |
      // A C# method in Where: compiles, throws when the query runs.
      db.Requests.Where(r => Policy.IsStrategic(r))
      // InvalidOperationException: The LINQ expression ... could not be translated.

      // .NET 9 CountBy compiles on a DbSet, but EF Core 10 can't translate it either.
      db.Requests.CountBy(r => r.DepartmentCode)
      // Use GroupBy + Count: GROUP BY "r"."DepartmentCode"

      // The fix: filter in SQL first, then run the C# rule in memory, on purpose.
      var candidates = await db.Requests
          .Where(r => r.Status == RequestStatus.Submitted || r.Status == RequestStatus.Draft)
          .ToListAsync(ct);
      return [.. candidates.Where(Policy.IsStrategic)];
    narration: >
      And not everything translates. Put your own C# method inside a Where, and Entity Framework throws when the
      query runs, not when it compiles. Same with the new Count By on a database set: it compiles, but Entity
      Framework Core ten can't translate it. Use Group By and Count. The fix for your own rules: filter in SQL first,
      then switch to memory on purpose.

  - id: recap
    type: bullets
    heading: "Five rules"
    bullets:
      - "Pure functions and immutable data for business rules"
      - "Use the new operators: CountBy, AggregateBy, Index, LeftJoin"
      - "A query is a recipe: materialize once if you reuse it"
      - "Watch captured variables in deferred queries"
      - "IQueryable for databases; check the SQL in a test"
    narration: >
      Five rules. Pure functions and immutable data for business rules. Use the new operators, they make code shorter
      and clearer. A query is a recipe, so materialize it once if you use it more than once. Watch captured variables.
      And keep database queries I Queryable, with a test that checks the SQL.

