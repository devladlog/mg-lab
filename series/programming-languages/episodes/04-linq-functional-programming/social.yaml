linkedin_company:
  text: |
    Two C# methods with the same body. One reads 5 rows from the database, the other reads all 12. Same result, no exception, no warning.

    Episode 4 of DEVLADLOG Code writes functional C# with LINQ over the Contoso project requests and looks at what really runs:
    - pure functions over immutable records, with CountBy, AggregateBy and Index from .NET 9 and LeftJoin from .NET 10
    - a CSV import where errors are values, written as a query with Select and SelectMany on a Result type
    - deferred execution: the analyzer rule CA1851 catches a query that runs three times, and a lambda that captures the variable changes the count from 5 to 1
    - the SQL SQLite actually received: IQueryable gets a WHERE clause, IEnumerable does not

    34 tests, and the same queries against a real SQLite database with EF Core 10.

    Watch: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.
    #DotNet #CSharp #LINQ #EntityFramework
linkedin_personal:
  text: |
    I wrote the same filter twice. Same body, one parameter typed IQueryable, the other IEnumerable. Both returned the same 5 requests.

    The SQL tells a different story. With IQueryable, SQLite received a WHERE clause and 5 rows. With IEnumerable, there was no WHERE clause: all 12 rows came back and the filter ran in memory. No exception, no warning.

    With 12 rows nobody notices. With twelve million everybody does. I now keep a test that checks the generated SQL.

    Episode 4 of my C# series, with the other LINQ surprises: {YOUTUBE_URL}

    #DotNet #LINQ

    Narration uses an AI voice.
