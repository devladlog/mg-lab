linkedin_company:
  text: |
    A comment above the code said "budget 50k or more is high". The code under it said greater than 50,000. Nobody noticed until a test did.

    Episode 6 of DEVLADLOG Code takes a sixty-line legacy C# method and cleans it without changing what it does, except for one change we decide on, out loud:
    - principles as build gates: complexity limit of 10, no catch-all, braces everywhere. The legacy project fails with 17 errors, the clean one with zero
    - a golden master: 20 inputs in two modes, 40 results saved before touching a line
    - guard clauses in the legacy order, because the order of checks is behavior too
    - the result: 38 identical, 2 different, both the 50,000 boundary

    Then the traps the master cannot see: banker's rounding, and a Turkish culture that rejects the IT department. 18 tests.

    Watch: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.
    #DotNet #CSharp #CleanCode #Refactoring
linkedin_personal:
  text: |
    Math.Round on a decimal uses banker's rounding by default: a midpoint goes to the nearest even number. It looks like a bug, so the obvious improvement is to switch to away from zero.

    In my refactoring episode, 10,870 plus 15 percent is 12,500.50. Banker's rounding says 12,500. Away from zero says 12,501, one euro more on an amount somebody had already approved. The golden master turned line nine red.

    So the clean code keeps banker's rounding and now says so explicitly, where the next person will read it. Refactor first, change behavior only in a named step.

    Episode 6: {YOUTUBE_URL}

    #CleanCode #DotNet

    Narration uses an AI voice.
