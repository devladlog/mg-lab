linkedin_company:
  text: |
    Most Node tutorials end where the trouble starts: the file is small, the API answers instantly, and nobody presses Control C.

    Episode 9 of DEVLADLOG Code puts the Contoso project requests against a real HTTP service with zero npm packages:
    - streams and async generators joined with stream pipeline, so a bad row is a rejected record and the batch keeps going
    - a hand-written concurrency limit: against a service with a 300 ms lookup, the batch goes from 3.6 seconds one at a time to 0.66 seconds, five at a time
    - a promise cache that shares in-flight calls and forgets failures
    - AbortSignal.timeout combined with AbortSignal.any on every call, so Control C really cancels on the server
    - 26 tests with node:test against the real service, with no sleeping

    We also cover four traps, including the readline interface that silently loses lines.

    Watch: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.
    #NodeJS #JavaScript #AbortSignal #DevTools
linkedin_personal:
  text: |
    My Node tests passed, then failed every few runs, and it cost me an afternoon. The cause: readline starts emitting lines the moment the interface exists. I created it, awaited a directory creation, and only then started iterating. The lines were already gone, and the for await loop waited forever for an end that had already happened.

    The fix is to create the interface and iterate it in the same step.

    It is one of four traps in episode 9 of my series on Node.js patterns with zero npm packages: {YOUTUBE_URL}

    #NodeJS #JavaScript

    Narration uses an AI voice.
