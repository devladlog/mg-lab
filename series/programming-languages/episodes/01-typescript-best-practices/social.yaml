linkedin_company:
  text: |
    "strict": true is on by default in TypeScript now. It is still not the whole story.

    Episode 1 of DEVLADLOG Code builds a small project request intake where every best practice is enforced by a tool, not a wiki page:
    - the two flags strict does not include: noUncheckedIndexedAccess and exactOptionalPropertyTypes
    - unknown at the boundary, a Result type for expected failures, branded types for validated values
    - a discriminated union for request state, with assertNever so a forgotten case stops the build
    - type-aware ESLint for code that compiles and is still wrong, plus 40 Vitest tests in one CI command

    The surprise: TypeScript 7.0 ships no compiler API, so typescript-eslint cannot run on it. We run 7 for tsc and 6 for the tools, side by side with npm aliases.

    Watch: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.
    #TypeScript #DevTools #ESLint #NodeJS
linkedin_personal:
  text: |
    I upgraded to TypeScript 7 and expected everything to just get faster. tsc did. But typescript-eslint stopped working, because 7.0 ships no programmatic API and its peer range stops below 6.1.

    The fix from the TypeScript team is to install both with npm aliases: tsc runs 7, every tool that imports typescript gets 6.

    A second one from the same build: since 6.0, "types" defaults to empty. @types/node was installed and process was still unknown until I added "types": ["node"].

    Both are in episode 1 of my new series, with every practice enforced by the compiler, the linter or a test: {YOUTUBE_URL}

    #TypeScript #DevTools

    Narration uses an AI voice.
