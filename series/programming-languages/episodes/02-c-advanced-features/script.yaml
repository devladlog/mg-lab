  - id: service
    type: code
    heading: "Primary constructors: parameters, not fields"
    lang: csharp
    code: |
      public sealed class ApprovalService(TimeProvider time, IRequestStore store, ApprovalMetrics? metrics = null)
      {
          private readonly IRequestStore _store = store;   // must never change: copy to readonly

          public DecisionResult Approve(RequestCode code, EmailAddress approver, string role)
          {
              ...
              var withApproval = request with { Approvals = [.. request.Approvals, new Approval(...)] };
              ...
              if (final.State is RequestState.Approved) metrics?.Approved += 1;   // C# 14
              metrics?.LastDecisionAt = now;
          }
      }
    narration: >
      The service uses a primary constructor. But those are parameters, not readonly fields. Any method can reassign
      them, and the compiler won't say a word. So the store, which must never change, goes into a readonly field.
      And metrics is optional: C# fourteen null-conditional assignment updates it only when it's there.

  - id: gotcha
    type: code
    heading: "Gotcha: same line, different method"
    short: gotcha
    lang: csharp
    code: |
      namespace SpanMath {
          public static class SpanAverage {
              public static double Average(this ReadOnlySpan<int> values) => -1;
          }
      }

      int[] values = [1, 2, 3];
      values.Average();

      // C# 13  ->  System.Linq.Enumerable.Average   = 2
      // C# 14  ->  SpanMath.SpanAverage.Average     = -1     (no warning in either)
    narration: >
      Now the one that surprised us. We had our own Average extension over a read-only span, and LINQ imported as
      usual. Compiled as C# thirteen, values dot average calls LINQ. Compiled as C# fourteen, it calls our span
      method. Same source line, no warning, a different method. Microsoft documents it as a breaking change: span
      overloads now apply in more places. If you mean LINQ, call Enumerable dot Average explicitly.

  - id: gotchas
    type: screen
    heading: "Only warnings, unless you say so"
    image: screens/gotchas.jpg
    video: screens/gotchas.mp4
    bar: "Terminal · demo/expect-errors.sh"
    short: warnings
    demo: >
      Terminal running ./demo/expect-errors.sh. Visible: the error lines CS9264, CS9258 (twice) and CS8509 for
      demo/Gotchas, the six "ok" checks, and "C# 13: [1, 2, 3].Average() = 2". Optional split: the same build with
      -p:TreatWarningsAsErrors=false showing "Build succeeded" with warnings CS8509, CS9258, CS9264.
    narration: >
      More traps, in one script. A switch over every state of our closed record hierarchy: still not exhaustive,
      because C# has no closed hierarchies. A class with a member called field: the accessor now means something
      else. And here's the catch: all of these are only warnings by default. Without warnings as errors, the build
      just succeeds.

  - id: recap
    type: bullets
    heading: "Five rules"
    bullets:
      - "Warnings as errors, nullable on, analyzers at recommended"
      - "Records and patterns for data and rules"
      - "Extension members where they make call sites read better"
      - "Measure allocations in tests, don't guess"
      - "Re-run your tests after every language upgrade"
    narration: >
      Five rules. Warnings as errors, nullable on, recommended analyzers. Records and patterns for data and rules.
      Extension members where they make call sites read better. Measure allocations in tests instead of guessing.
      And re-run your whole test suite after every language upgrade, because the same source can bind differently.

