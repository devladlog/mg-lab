  - id: math
    type: code
    heading: "Generic math and compound assignment"
    lang: csharp
    code: |
      public static T Sum<T>(ReadOnlySpan<T> values)
          where T : IAdditionOperators<T, T, T>, IAdditiveIdentity<T, T>
      {
          var total = T.AdditiveIdentity;
          foreach (var value in values) total += value;
          return total;
      }

      public sealed class BudgetTally
      {
          public void operator +=(ProjectRequest request)   // C# 14: mutate in place
          {
              Count++; Total += request.Budget;
              if (request.Budget > Largest) Largest = request.Budget;
          }
      }
    narration: >
      Euros implements the generic math interfaces, so one Sum method works for int, decimal and Euros. And C#
      fourteen lets a class define its own plus equals. Tally plus equals request updates the tally in place
      instead of creating a new object every time. A test checks it's still the same instance.

  - id: span
    type: code
    heading: "Parsing without allocating"
    lang: csharp
    code: |
      public static bool TryParse(ReadOnlySpan<char> s, IFormatProvider? provider, out RequestCode result)
      {
          result = default;
          if (s.Length != 12 || !s.StartsWith("PR-") || s[7] != '-') return false;
          if (!int.TryParse(s.Slice(3, 4), NumberStyles.None, CultureInfo.InvariantCulture, out var year)) return false;
          if (!int.TryParse(s.Slice(8, 4), NumberStyles.None, CultureInfo.InvariantCulture, out var number)) return false;
          ...
      }

      // test: three codes from one string
      var before = GC.GetAllocatedBytesForCurrentThread();
      foreach (var range in text.Split(','))
          if (RequestCode.TryParse(text[range], out _)) found++;
      Assert.Equal(0, GC.GetAllocatedBytesForCurrentThread() - before);
    narration: >
      Request codes are parsed from a span. No substring, no split into strings, just slices. And we don't guess
      about performance, we measure it. The test parses three codes out of one string and asserts zero bytes
      allocated, using a counter the runtime already gives you.

