    heading: "Advanced C# you'll actually use"
    sub: "C# 14 on .NET 10, and where it bites"
    short: hook
    narration: >
      Advanced C# features make great conference slides. But which ones should you put in production code, and
      which ones quietly change what your code does? In this episode we build a small library with C# fourteen on
      dot net ten: records, patterns, extension members, spans. Fifty-three tests, and one line of code that calls a
      different method after you upgrade. Welcome to DEVLADLOG Code.

  - id: plan
    type: bullets
    heading: "What we're building"
    bullets:
      - "Same project request rules as episode 1"
      - "50,000 euros or more is High priority"
      - "250,000 or more goes to Finance, then the Board"
      - "You can't approve your own request"
      - "A library, a console demo, 53 xUnit tests"
    narration: >
      Same rules as the TypeScript episode, so you can compare. Fifty thousand euros or more is high priority. Two
      hundred and fifty thousand or more needs a justification, and goes to Finance first and the Board last. You
      can't approve your own request. One library, one console demo, fifty-three tests.

  - id: guardrails
    type: code
    heading: "Guardrails first"
    lang: xml
    code: |
      <!-- Directory.Build.props: every project in the folder -->
      <PropertyGroup>
        <TargetFramework>net10.0</TargetFramework>       <!-- C# 14 by default -->
        <Nullable>enable</Nullable>
        <TreatWarningsAsErrors>true</TreatWarningsAsErrors>
        <AnalysisLevel>latest-recommended</AnalysisLevel>
        <EnforceCodeStyleInBuild>true</EnforceCodeStyleInBuild>
      </PropertyGroup>
    narration: >
      Before any feature, the guardrails. One Directory dot Build dot props for every project: dot net ten, which
      gives you C# fourteen by default. Nullable reference types. Recommended analyzers. And warnings as errors. Keep
      that last one in mind, it matters later in this episode.

  - id: records
    type: code
    heading: "Records, required, and the field keyword"
    lang: csharp
    code: |
      public sealed record ProjectRequest
      {
          public required RequestCode Code { get; init; }

          public required string Title
          {
              get;
              init => field = string.IsNullOrWhiteSpace(value) || value.Trim().Length < 3
                  ? throw new ArgumentException("Title must have at least 3 characters.")
                  : value.Trim();
          }

          public required Euros Budget { get; init; }
          public RequestState State { get; init; } = new RequestState.Draft();
          public IReadOnlyList<Approval> Approvals { get; init; } = [];
      }
    narration: >
      The request is a record. Required and init mean the caller must set these, and nobody can change them later.
      New in C# fourteen: the field keyword. We validate and trim the title right in the accessor, without
      declaring a backing field. Budget is not a decimal, it's a Euros value type. More on that in a minute.

  - id: patterns
    type: code
    heading: "Patterns that read like the policy"
    lang: csharp
    code: |
      public static Route RouteFor(ProjectRequest request) => request switch
      {
          { Budget.Amount: >= 250_000m } => Route.Board,
          { Budget.Amount: >= 50_000m } or { Justification: not null } => Route.Finance,
          _ => Route.TeamLead,
      };

      public static bool IsFullyApproved(ProjectRequest request) => (RouteFor(request), request.Approvals) switch
      {
          (Route.TeamLead, [_, ..]) => true,
          (Route.Finance, [.., { Role: "Finance" }]) => true,
          (Route.Board, [{ Role: "Finance" }, .., { Role: "Board" }]) => true,
          _ => false,
      };
    narration: >
      Pattern matching is where C# really shines. Property and relational patterns turn routing into a table you can
      read next to the policy. And list patterns check the approval chain: for the Board route, the first approval
      must be Finance and the last must be the Board, whatever sits in between.

  - id: extensions
    type: code
    heading: "C# 14: extension members"
    lang: csharp
    code: |
      public static class RequestExtensions
      {
          extension(IEnumerable<ProjectRequest> requests)
          {
              public Euros TotalBudget => requests.Aggregate(Euros.Zero, (sum, r) => sum + r.Budget);
              public IEnumerable<ProjectRequest> HighPriority =>
                  requests.Where(r => Rules.PriorityFor(r.Budget) == Priority.High);
          }
      }
      public static class EurosExtensions
      {
          extension(Euros)
          {
              public static Euros FromThousands(decimal thousands) => new(thousands * 1_000m);
          }
      }
    narration: >
      The headline feature of C# fourteen: extension members. An extension block can now declare properties, so
      requests dot total budget reads like it belongs to the collection. And static extension members appear on the
      type itself: Euros dot from thousands. Old style extension methods keep working next to them.

