linkedin_company:
  text: |
    The same line of C# can call a different method after you upgrade to C# 14. No warning in either version.

    Episode 2 of DEVLADLOG Code builds a small library on .NET 10 with C# 14 and checks which advanced features earn a place in production code:
    - records with required and init, plus the new field keyword for validation in the accessor
    - property, relational and list patterns that read like the approval policy
    - extension members: extension properties and static extension members
    - span parsing with a test that asserts zero bytes allocated
    - 53 xUnit tests, and warnings as errors on every project

    The gotcha: values.Average() calls LINQ under C# 13 and our own span method under C# 14. Microsoft documents it as a breaking change.

    Watch: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.
    #DotNet #CSharp #CSharp14 #DevTools
linkedin_personal:
  text: |
    We had our own Average extension over ReadOnlySpan<int>, and System.Linq imported as usual. Compiled as C# 13, values.Average() on an int[] calls LINQ and returns 2. Compiled as C# 14, the same source line calls our span method and returns -1. No warning in either version.

    Microsoft lists it as a compiler breaking change: span overloads now apply in more places. If you mean LINQ, call Enumerable.Average explicitly.

    My lesson: re-run the whole test suite after every language upgrade, not only the build. Episode 2 of my C# series shows this and the other C# 14 traps: {YOUTUBE_URL}

    #DotNet #CSharp

    Narration uses an AI voice.
