linkedin_company:
  text: |
    Most Python Azure tutorials start by pasting a connection string. That string is a key to the whole storage account, and sooner or later it ends up in git.

    Episode 8 of DEVLADLOG Code writes the Contoso approval packs to Azure Blob Storage the keyless way:
    - Microsoft Entra ID and one data role, with shared key access switched off in the Bicep file
    - DefaultAzureCredential for development and a specific managed identity credential in Azure, as Microsoft's guidance recommends
    - pure Python rules first, with Azure only at the edge
    - writes that are safe to repeat: an existing blob becomes a status, and overwrite is an explicit flag
    - async uploads with a semaphore and a TaskGroup, and the ExceptionGroup they hide

    46 tests, ruff and strict mypy clean, with the blob tests running against the Azurite emulator.

    Watch: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.
    #Azure #Python #EntraID #BlobStorage
linkedin_personal:
  text: |
    A TaskGroup in Python always wraps failures in an ExceptionGroup, even a single one. So a plain except for the error you expect never runs.

    The fix is except*, which matches inside the group. My test proves it with a missing container, against the Azurite emulator.

    Two more from the same episode: Excel's CSV UTF-8 starts with a byte order mark, so the first column gets a different name and every row fails unless you decode with utf-8-sig. And Decimal is not JSON serializable, so the approval pack stores money as a string.

    Episode 8, Python for Azure without a single key: {YOUTUBE_URL}

    #Python #Azure

    Narration uses an AI voice.
