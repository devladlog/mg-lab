linkedin_company:
  text: |
    One word changed in a service registration. On a laptop in Development the app refuses to start. In Production it runs, exits with code 0, and both audit trails are empty.

    Episode 5 of DEVLADLOG Code builds design patterns as code that runs, with the dependency injection every .NET app already has:
    - Strategy: one class per approval route, picked from an IEnumerable, with no service locator
    - Decorator: a cached, metered approver directory wired with keyed services
    - Observer: audit, outbox and budget tally, each call isolated
    - Options: the policy in configuration, validated when the host starts

    The gotcha is a captive dependency: a singleton that holds a scoped audit trail forever. We show it in both environments, then add a test that builds the container with scope validation on, whatever the environment. 27 tests.

    Watch: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.
    #DotNet #CSharp #DependencyInjection #DesignPatterns
linkedin_personal:
  text: |
    A singleton observer that holds a scoped audit trail is a captive dependency. It compiles. In Production our console app ran, exited with code 0, and both batches reported 0 audit entries instead of 4.

    Run the same code with the Development environment and the host refuses to build: cannot consume scoped service AuditTrail from singleton IRequestObserver. That check is on by default in Development only.

    So I stopped relying on someone remembering to run in Development. A test now builds the real composition root with ValidateScopes and ValidateOnBuild on, whatever the environment.

    Episode 5 of my C# series: {YOUTUBE_URL}

    #DotNet #DependencyInjection

    Narration uses an AI voice.
