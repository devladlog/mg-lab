  - id: deadlock
    youtube_short_title: "The async deadlock, reproduced on demand in C# #Shorts"
    instagram_reel:
      caption: |
        On a single-threaded context, like a UI thread, we block on an async method with Wait. The method finishes its work in 100 milliseconds, then needs that same thread to continue. The thread is blocked waiting for it. Deadlock. ConfigureAwait(false) in the library avoids it, and awaiting all the way avoids the problem entirely.
        Full episode: link in bio.
        Narration uses an AI voice.
        #CSharp #DotNet #AsyncAwait
      cover_text: "The deadlock, on demand"
    tiktok:
      caption: "Block on async code on a single-threaded context and it deadlocks. ConfigureAwait(false) in libraries, and await all the way. #CSharp #DotNet #AsyncAwait"
