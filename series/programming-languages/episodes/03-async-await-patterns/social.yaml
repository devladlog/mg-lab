  - id: gotcha
    youtube_short_title: "Task.WaitAsync stops waiting, not working (C# timeout trap) #Shorts"
    instagram_reel:
      caption: |
        Task.WaitAsync with a timeout looks like a real timeout. Both throw a TimeoutException after 150 milliseconds. But WaitAsync only stops waiting. Nobody cancelled the HTTP call, so the API finishes the whole 300 millisecond lookup anyway. Under load, that makes things worse. Pass a linked cancellation token to HttpClient instead.
        Full episode: link in bio.
        Narration uses an AI voice.
        #CSharp #DotNet #AsyncAwait
      cover_text: "WaitAsync doesn't cancel"
    tiktok:
