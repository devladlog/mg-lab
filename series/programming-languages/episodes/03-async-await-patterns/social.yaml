linkedin_company:
  text: |
    Your timeout threw after 150 ms. The API call kept running for 300 ms anyway.

    Episode 3 of DEVLADLOG Code calls a small Finance API from C# on .NET 10 and measures async and await instead of describing it. Twelve requests:
    - one at a time: 3.8 seconds
    - all at once: a third of a second, with 24 calls in flight on the API
    - bounded to 4 requests: about 1 second, and the API never sees more than 8 calls

    We also show a timeout that cancels the work versus Task.WaitAsync, which only stops waiting, plus retries tested with FakeTimeProvider, and a deadlock reproduced on demand on a single-threaded context. 27 xUnit tests back it up.

    Watch: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.
    #DotNet #CSharp #AsyncAwait #DevTools
linkedin_personal:
  text: |
    Task.WaitAsync(timeout) and a real timeout both throw TimeoutException after about 150 ms. They look identical in the code and in the exception. The API log tells them apart: with the real timeout the call shows ABORTED by the client after 150 ms. With WaitAsync it shows done 300 ms.

    WaitAsync stops waiting, not working. Nobody cancelled the HTTP call. Do that under load and your timeouts make things worse.

    The fix is a linked cancellation token that reaches HttpClient. Episode 3 of my C# series measures it from the server side: {YOUTUBE_URL}

    #DotNet #AsyncAwait

    Narration uses an AI voice.
