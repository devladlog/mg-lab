linkedin_company:
  text: |
    0.29 times 100 is 28 in TypeScript, C# and Python, and 29 in PowerShell. Same expression, four languages.

    Episode 11 of DEVLADLOG Code gives one small job to TypeScript, C#, Python and PowerShell: a digest of 13 fictional Contoso project requests. Each implementation has to print the same 23 lines, checked against one golden file, so any difference is a language feature and not a different job.
    - TypeScript: Node runs .ts files directly (type stripping, stable since Node 24.12), erasable syntax only
    - C# 14 on .NET 10: a file-based app with no project file, strict System.Text.Json options
    - Python 3.13: ReadOnly typed dicts, the type statement, itertools.batched
    - PowerShell 7.6: classes, the ternary operator and null-conditional operators

    60 tests across four suites, and three gotchas where it bites.

    Watch: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.
    #DotNet #TypeScript #Python #PowerShell
linkedin_personal:
  text: |
    A PowerShell cast rounds. 0.29 times 100 is 28.999999999999996, and in TypeScript, C# and Python truncating it gives 28. A PowerShell [long] cast gives 29. Same expression, a different number per language.

    In episode 11 I gave one small job to four languages and compared the output character for character. For money, all four implementations avoid the question: decimals or integer cents, never floats.

    Related trap from the same build: in PowerShell, wrapping a null in an array and counting it gives 1, not 0.

    Episode 11: {YOUTUBE_URL}

    #PowerShell #DotNet

    Narration uses an AI voice.
