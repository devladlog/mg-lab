      Terminal in the repo folder of this episode. Run "pwsh demo/conformance.ps1". Visible: the toolchain block (node,
      dotnet, python, pwsh versions) and the four [ok] lines, each "23 lines, identical to expected/digest.txt",
      then "All four languages print the same digest." Reference: demo/expected-output.txt.
    narration: >
      One script runs all four and compares the output with the golden file. TypeScript, C sharp, Python, PowerShell:
      twenty three lines each, identical. Different languages, the same answer.

  - id: gotchas
    type: screen
    heading: "Where it bites"
    image: screens/gotchas.jpg
    video: screens/gotchas.mp4
    bar: "Terminal · demo/gotchas.ps1"
    short: gotcha
    demo: >
      Terminal running "pwsh demo/gotchas.ps1". Visible: section 1 with ERR_UNSUPPORTED_TYPESCRIPT_SYNTAX and the
      tsc error TS1294; section 2 with "Reflection-based serialization has been disabled for this application";
      section 3 with the five 0.29 times 100 lines: 28 in TypeScript, C sharp and Python, 29 in PowerShell. Scroll
      so the three section headings stay visible.
    narration: >
      Three honest gotchas. One: an enum is not erasable syntax, so Node refuses the file, and the compiler flags it
      the same way. Two: file based apps target native ahead of time compilation by default. On recording day that pulled in an I L compiler package that NuGet flags with a known high severity vulnerability, so with warnings as errors the build stops right there. And even when it builds, native A O T turns off reflection based JSON. Our real file sets publish A O T to false, and it works. Three: nought point two nine times one hundred is
      twenty eight in TypeScript, C sharp and Python, and twenty nine in PowerShell, because a PowerShell cast
      rounds. Use decimals.

  - id: recap
    type: bullets
    heading: "Five rules"
    bullets:
      - "Adopt features that remove code, not ones that add cleverness"
      - "Keep one golden output across languages and runtimes"
      - "Make the boundary strict: JSON, nullability, required fields"
      - "Use decimals or integer cents for money, never floats"
      - "Pin versions and re-run the tests after every upgrade"
    narration: >
      Five rules. Adopt features that remove code, not ones that add cleverness. Keep one golden output. Make the
      boundary strict. Use decimals or integer cents for money. And pin your versions, then re-run the tests after
      every upgrade.

