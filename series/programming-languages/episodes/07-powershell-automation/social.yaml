linkedin_company:
  text: |
    Every company has a PowerShell script nobody dares to touch. Copied between servers, no tests, and it fails silently.

    Episode 7 of DEVLADLOG Code automates the Contoso project request approvals the way you would write it now:
    - PSScriptAnalyzer on the legacy script: 13 findings, one of them an error. The same analyzer on the new module: zero
    - a small module with validated parameters that returns typed objects, not text
    - bad rows become errors with a stable error id, and the batch keeps going
    - -WhatIf and -Confirm on the command that writes to disk, and no overwrite unless you pass -Force
    - 29 Pester tests, and one command that runs both gates and exits with code 1 if either fails

    We also show three real gotchas: try and catch that sees nothing, output you did not ask for, and ConvertTo-Json stopping at depth 2.

    Watch: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.
    #PowerShell #Pester #Automation #DevTools
linkedin_personal:
  text: |
    ConvertTo-Json has a default depth of 2. My approvers sat three levels down, so the default turned them into the text System.Collections.Specialized.OrderedDictionary. PowerShell 7 only warns about it, the output is already wrong.

    The module now passes -Depth 5, and a Pester test reads all three approvers of a Board request back.

    It was one of three gotchas in episode 7 of my series, where I rebuild a legacy approval script as a module with -WhatIf, an analyzer gate and 29 Pester tests: {YOUTUBE_URL}

    #PowerShell #Pester

    Narration uses an AI voice.
