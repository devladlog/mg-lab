  - id: output
    youtube_short_title: "PowerShell function returns output you did not ask for #Shorts"
    instagram_reel:
      caption: |
        ArrayList.Add returns the index it just added. Inside a PowerShell function, every value that is not captured goes into the output, so the caller gets 0, 1, and then the real codes. Assign the call to null and the function says only what you meant.
        Full episode: link in bio.
        Narration uses an AI voice.
        #PowerShell #DevTools #Automation
      cover_text: "Output you did not ask for"
    tiktok:
      caption: "ArrayList.Add returns an index, and in a PowerShell function it leaks into the output: 0, 1, then your real values. Use $null =. #PowerShell #DevTools"
