linkedin_company:
  text: |
    Ask five developers why a report is slow and you get five answers. The team's first guess, the JSON clone, was the smallest of the three real causes.

    Episode 10 of DEVLADLOG Code stops guessing and measures a Node.js report over the Contoso project requests, with no packages:
    - a benchmark that warms up, repeats and reports the median and p95, because one timing proves nothing
    - a V8 CPU profile read by line: about two thirds of the time was one toLocaleString line, about a tenth the duplicate check, and the JSON copy did not make the top four
    - a Set, one shared formatter and an object spread as the fix, with a test that both versions produce identical output
    - event loop delay: the slow version made a 10 ms timer fire up to 91 ms late
    - a cache that never forgets, against a small LRU, measured on the heap

    14 tests keep it honest.

    Watch: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.
    #NodeJS #Profiling #Performance #DevTools
linkedin_personal:
  text: |
    I profiled a slow Node report and expected the hot callback to show up as its own function. It mostly did not. V8 inlines small callbacks into the caller, and built-ins like toLocaleString have no frame of their own, so 86 percent of the time landed on one function. That tells you nothing.

    The answer was in the position ticks on every profile node, a sample count per line. Read by line, one toLocaleString call was about two thirds of the time. The JSON clone everyone suspected did not even make the list.

    Episode 10, measure, don't guess: {YOUTUBE_URL}

    #NodeJS #Performance

    Narration uses an AI voice.
