linkedin_company:
  text: |
    Contoso's contracts arrive as scan_0001.pdf, and nobody types in the expiry date. Syntex, now called document processing, can read them. But it is a pay-as-you-go service, and the model cannot be created by script.

    In episode 10 of DEVLADLOG SharePoint, the final episode of the series, we teach the model in the browser and put everything around it in code:
    - A JSON plan for billing, the model, its extractors and the expected volume
    - A plan linter that checks example counts, language and library paths
    - A cost estimate from the plan, using the pay-as-you-go meters on Learn
    - A pre-flight that counts pages the way the meter does, before files are uploaded
    - 66 Pester tests, with the PnP cmdlets mocked

    Watch the episode: {YOUTUBE_URL}
    Written guide: {BLOG_URL}
    Narration uses an AI voice.
    #SharePoint #SharePointSyntex #DocumentProcessing #PnPPowerShell
linkedin_personal:
  text: |
    Document processing in SharePoint, formerly Syntex, bills per page, and every model applied to a library is billed for every file, on upload and on every update. In my example plan, 2,000 files a month on four models comes to 2,400 USD a month. The plan with one model and 40 files comes to 0.90 USD.

    You can't script the model, but you can script the estimate. So the plan gets a cost check and a budget before anything is uploaded.

    Episode 10 of DEVLADLOG SharePoint: {YOUTUBE_URL}

    #SharePoint #SharePointSyntex
    Narration uses an AI voice.
