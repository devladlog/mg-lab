linkedin_company:
  text: |
    You marked a column as required, so every document has it. Except it doesn't.

    Microsoft documents that uploads to a modern SharePoint library don't prompt for required columns. In episode 4 of DEVLADLOG SharePoint we build a fictional Contoso supplier library as code and decide what to do about it:
    - Content type IDs written down, following Learn's rules, so every site gets the same ones
    - A document set per supplier, holding contracts and invoices
    - A filing plan where the file name carries the metadata, checked before anything is uploaded
    - 31 Pester tests, with the PnP cmdlets mocked

    The rule that comes out of it: every required field needs a default value or a filing rule.

    Watch the episode: {YOUTUBE_URL}
    Written guide: {BLOG_URL}
    Narration uses an AI voice.
    #SharePoint #ContentTypes #DocumentManagement #PnPPowerShell
linkedin_personal:
  text: |
    "Required" on a SharePoint column feels like a guarantee. It isn't. Microsoft documents that uploading to a modern library doesn't prompt for required columns, so files can arrive without the metadata you asked for.

    My takeaway: treat required as a wish. Give every required field a default value or a filing rule, then audit what actually arrived.

    In episode 4 of DEVLADLOG SharePoint I check a folder of sample files against a filing plan before upload. Of nine files, five are ready and four are not. {YOUTUBE_URL}

    #SharePoint #DocumentManagement
    Narration uses an AI voice.
