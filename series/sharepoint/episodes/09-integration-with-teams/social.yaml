linkedin_company:
  text: |
    People say a Teams channel is just a folder in SharePoint. That is true for standard channels. A private channel and a shared channel each get a SharePoint site of their own, and the team owners cannot open it unless they are members.

    In episode 9 of DEVLADLOG SharePoint, a fictional Contoso purchasing team is planned as code:
    - A JSON plan for the team, its standard, private and shared channels, tabs and hub
    - A linter that catches invalid channel names, private channels without an owner and members who are not in the team
    - Provisioning that does only what is missing, so a second run changes nothing
    - A read-back that asks Graph where each channel's files live, instead of guessing folder URLs
    - 28 Pester tests, with the PnP cmdlets mocked

    Watch the episode: {YOUTUBE_URL}
    Written guide: {BLOG_URL}
    Narration uses an AI voice.
    #SharePoint #MicrosoftTeams #PnPPowerShell #Microsoft365
linkedin_personal:
  text: |
    "A Teams channel is just a folder in SharePoint." True for standard channels, not for the other two types. Every private channel and every shared channel gets its own SharePoint site. A team with one of each is three sites, not one.

    Learn also says people in the parent team and admins don't get access to a private channel site unless they are channel members. And a channel's type can't be changed after creation.

    Episode 9 of DEVLADLOG SharePoint plans a team as code: {YOUTUBE_URL}

    #SharePoint #MicrosoftTeams
    Narration uses an AI voice.
