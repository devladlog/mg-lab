linkedin_company:
  text: |
    The Custom Cyan theme in Microsoft's own PowerShell documentation uploads without a single error. Its main colour on a white page has a contrast ratio of 1.25 to 1. Nobody checks that for you.

    In episode 8 of DEVLADLOG SharePoint, the fictional Contoso intranet is designed as code, with a contrast check in front of the theme:
    - One JSON blueprint: home site, organization news, brand assets library, theme and global navigation
    - A contrast check in plain PowerShell using the W3C formula, with the 4.5 to 1 minimum for text
    - All ten default themes on Learn pass; Custom Cyan fails; the Contoso Operations theme scores 7.38 to 1
    - 22 Pester tests, with the PnP cmdlets mocked

    Watch the episode: {YOUTUBE_URL}
    Written guide: {BLOG_URL}
    Narration uses an AI voice.
    #SharePoint #Intranet #Accessibility #PnPPowerShell
linkedin_personal:
  text: |
    Microsoft's own documentation has a SharePoint theme example, Custom Cyan, that uploads without any error. Its main colour on a white page has a contrast ratio of 1.25 to 1, and text needs at least 4.5 to 1.

    The service accepts it, so the check has to be yours. The WCAG formula fits in a short piece of plain PowerShell, and I put it in front of the upload as a gate.

    Episode 8 of DEVLADLOG SharePoint designs an intranet as code: {YOUTUBE_URL}

    #SharePoint #Accessibility
    Narration uses an AI voice.
