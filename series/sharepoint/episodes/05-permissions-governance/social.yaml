linkedin_company:
  text: |
    Who can open your purchasing site right now? Not who should. Who can. After a year, the honest answer is usually "I'm not sure".

    In episode 5 of DEVLADLOG SharePoint, the rules for a fictional Contoso site are written down as a policy and checked against a snapshot of what the site really has:
    - A JSON policy for sharing, labels, owners, forbidden principals and which lists may break inheritance
    - A snapshot of groups, members, unique permissions and sharing links, saved as plain JSON
    - Audit rules that prefer groups to people and ignore Limited Access
    - A remediation plan in a safe order, with -WhatIf first

    Leaving a second owner to a human is a deliberate choice, not a gap. 23 Pester tests, with the PnP cmdlets mocked.

    Watch the episode: {YOUTUBE_URL}
    Written guide: {BLOG_URL}
    Narration uses an AI voice.
    #SharePoint #Governance #PnPPowerShell #Microsoft365
linkedin_personal:
  text: |
    A lesson from building a SharePoint permissions audit: breaking inheritance with "copy" copies the site's role assignments. So the library looks restricted, but Members still have Edit on it.

    So the policy declares exactly who may have access to each restricted list, and the audit flags the difference.

    Episode 5 of DEVLADLOG SharePoint walks through the policy, the snapshot, the audit and the fix: {YOUTUBE_URL}

    #SharePoint #Governance
    Narration uses an AI voice.
