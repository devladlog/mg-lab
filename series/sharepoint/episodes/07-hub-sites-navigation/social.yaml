linkedin_company:
  text: |
    Associate a SharePoint site with a hub and it gets the hub's theme, its navigation bar and its search scope. What it doesn't get is a link in that navigation, or any change to who can open it.

    In episode 7 of DEVLADLOG SharePoint, a fictional Contoso Operations hub is built as code:
    - A JSON plan for the hub, who may associate sites (empty means anyone) and the associated sites
    - A three-level mega menu, the most Learn allows, with links targeted to Entra groups
    - A linter for the navigation limits and for hub-to-hub hierarchy, which stops at three levels
    - 27 Pester tests, with the PnP cmdlets mocked

    One more point from Learn: audience targeting filters what people see, it is not a security measure.

    Watch the episode: {YOUTUBE_URL}
    Written guide: {BLOG_URL}
    Narration uses an AI voice.
    #SharePoint #HubSites #Navigation #PnPPowerShell
linkedin_personal:
  text: |
    Two things about SharePoint hubs that are easy to get wrong. Joining a hub doesn't add the site to the hub navigation, so you add the link yourself. And if you leave the list of who may associate sites empty, anyone can.

    Also, audience targeting on navigation links only filters what people see. Learn is explicit that it isn't security, and anyone editing the navigation sees every link.

    Episode 7 of DEVLADLOG SharePoint builds a hub and its navigation as code: {YOUTUBE_URL}

    #SharePoint #HubSites
    Narration uses an AI voice.
