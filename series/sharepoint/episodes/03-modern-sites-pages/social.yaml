linkedin_company:
  text: |
    Most SharePoint sites are configured by hand, once, and nobody can say what changed since.

    In episode 3 of DEVLADLOG SharePoint, a fictional Contoso purchasing site becomes a site template and a set of page designs in git:
    - A site script in JSON for regional settings, branding, sharing, a list and navigation links
    - Page designs as JSON too, built with PnP PowerShell, because site scripts have no verb for page content
    - A linter for the limits Learn documents: 30 actions applied synchronously, 300 asynchronously, and the rule that a site logo needs the communication site template
    - 40 Pester tests with the PnP cmdlets mocked

    A bad template with the classic mistakes gives 10 errors and 9 warnings, with no tenant involved.

    Watch the episode: {YOUTUBE_URL}
    Written guide: {BLOG_URL}
    Narration uses an AI voice.
    #SharePoint #SiteTemplates #PnPPowerShell #Microsoft365
linkedin_personal:
  text: |
    Microsoft publishes a JSON schema for SharePoint site scripts, and Learn documents the verbs. I assumed they matched. They don't.

    enableApprovals is on Learn but not in the schema. addFile and addFolder are in the schema but not on Learn. The schema also requires properties the docs don't show, and two Learn samples contain comments, so they aren't valid JSON.

    So the linter checks against both, and a test pins the difference. Episode 3 of DEVLADLOG SharePoint: {YOUTUBE_URL}

    #SharePoint #SiteTemplates
    Narration uses an AI voice.
