youtube:
  title: "SharePoint Site Templates & Modern Pages as Code with PnP PowerShell | DEVLADLOG SharePoint #3"
  tags: [SharePoint, SharePoint Online, site templates, site scripts, site designs, modern pages, communication site, PnP PowerShell, Pester, Microsoft 365, intranet]
