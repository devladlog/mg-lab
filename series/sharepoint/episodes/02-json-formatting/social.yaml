  - id: inview
    youtube_short_title: "SharePoint formatting gotcha: the field must be in the view #Shorts"
    instagram_reel:
      caption: |
        Learn says references to other fields only work when those fields are in the same view. A due date format that reads the status column can only tell a closed request from an open one if status is in the view. The format did not change; the view did. A linter can flag that before it ships. Full episode: link in bio.
        #SharePoint #JSONFormatting #MicrosoftLists
