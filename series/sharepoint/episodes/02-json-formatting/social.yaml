linkedin_company:
  text: |
    Column formatting usually lives in one place: a text box in the browser, edited by whoever got there last.

    In episode 2 of DEVLADLOG SharePoint the JSON lives in git instead, for a fictional Contoso purchase requests list:
    - A formatlint tool parses every Excel-style expression, because the JSON schema sees them only as strings
    - Four column formats and one view format, checked against sample rows
    - 62 tests, including Learn's own documented examples
    - A short PnP PowerShell script that lints first, stops on any error, then sets the custom formatter on each field and view

    It also covers two traps the schema will never catch: a date-only column that flags a request due today as overdue, and formats that read another column which is missing from the view.

    Watch the episode: {YOUTUBE_URL}
    Written guide: {BLOG_URL}
    Narration uses an AI voice.
    #SharePoint #JSONFormatting #MicrosoftLists #PnPPowerShell
linkedin_personal:
  text: |
    Here is a SharePoint formatting bug I would not have found by clicking around. A date-only column is stored as midnight. So at 09:00 on the due date, the simple check "due date is before now" is already true, and a request due today shows as overdue.

    The fix is to add one day, 86,400,000 milliseconds, before comparing. I put that in a test so it cannot quietly come back.

    Episode 2 of DEVLADLOG SharePoint covers it, with the formats in git: {YOUTUBE_URL}

    #SharePoint #JSONFormatting
    Narration uses an AI voice.
