    instagram_reel:
      caption: |
        The simplest overdue check compares the due date with now. But a date-only column has no time of day, so it is midnight. At nine in the morning on the due date, that comparison is already true and the request shows as overdue. Add one day, 86,400,000 milliseconds, and it shows due soon instead. A test proves it. Full episode: link in bio.
        #SharePoint #JSONFormatting #MicrosoftLists
