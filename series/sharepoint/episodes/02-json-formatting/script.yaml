    narration: >
      One script run later. Status pills, overdue dates in red with a warning icon, due soon in amber, the amount as a
      data bar, my own requests in bold, and overdue rows highlighted. The request due today is amber, not red.

  - id: pane
    type: screen
    heading: "Same JSON in the formatting pane"
    image: screens/format-pane.jpg
    bar: "Purchase Requests · Due date → Column settings → Format this column"
    demo: >
      Browser: Due date column header > Column settings > Format this column > Advanced mode, showing the JSON the
      script applied (the color expression with 86400000 visible). Do not save anything from the pane.
    narration: >
      Open format this column and it's the same JSON from git. Anyone can still tweak it here, which is exactly why
      export exists: pull what's live back into the repository before you overwrite it.

  - id: inview
    type: screen
    heading: "The gotcha: fields must be in the view"
    image: screens/not-in-view.jpg
    bar: "Microsoft Lists · Purchase Requests · Due dates only (personal view)"
    demo: >
      Browser: create a personal view "Due dates only" with just Title and Due date (no Status). Show a Closed request
      with an old due date. Capture how its due date renders now versus in "Open requests" (expected: the status check
      can't read RequestStatus, so the closed item is no longer plain; record what actually happens and adjust the
      narration). Delete the personal view afterwards.
    short: inview
    narration: >
      Now the trap. Learn says references to other fields only work when those fields are in the same view. This
      personal view shows the due date but not the status, so the format can't tell a closed request from an open
      one. The format didn't change; the view did. That's why the map lists each view's fields, and the linter
      flags it before it ships.

  - id: recap
    type: bullets
    heading: "Five rules"
    bullets:
      - "Formats live in git and go through a script"
      - "Lint the expressions, not just the schema"
      - "Every field a format reads must be in every view that shows it"
      - "Dates are milliseconds; date-only has no time of day"
      - "In a view format, @currentField means Title"
    narration: >
      Five rules. Formats live in git and reach the list through a script. Lint the expressions, not just the schema.
      Every field a format reads must be in every view that shows it. Dates are milliseconds, and date only has no
      time of day. And in a view format, at current field means title.

