    image: screens/after.jpg
    bar: "Microsoft Lists · Purchase Requests · Open requests"
    demo: >
      Terminal first (optional, small inset): Set-ListFormatting.ps1 output "No findings." then 4 Column + 1 View rows.
      Then the same browser view refreshed: status pills, red bold overdue date with warning icon, amber due-soon dates,
      amount data bars, own requests in bold, overdue open rows highlighted. Capture the row due today: it must be amber,
