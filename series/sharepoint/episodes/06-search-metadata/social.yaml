linkedin_company:
  text: |
    Which supplier contracts expire in the next sixty days? The library knows, because every contract has an expiry date. Search doesn't, until you tell it.

    When search crawls a site column it creates a managed property, and Learn's reference says those automatic properties are all text. In episode 6 of DEVLADLOG SharePoint, with fictional Contoso contracts, we make the metadata searchable on purpose:
    - A managed metadata term set with fixed IDs, created with PnP PowerShell
    - A search plan that maps columns to refinable properties of the right type
    - A KQL linter, because queries fail quietly: a space after the colon turns a filter into free text
    - 31 Pester tests, with the PnP cmdlets mocked

    Watch the episode: {YOUTUBE_URL}
    Written guide: {BLOG_URL}
    Narration uses an AI voice.
    #SharePoint #KQL #ManagedMetadata #PnPPowerShell
linkedin_personal:
  text: |
    SharePoint search quietly treats your date columns as text. When it crawls a site column it creates an automatic managed property, and those are all of type Text. KQL's less-than, greater-than and range operators only work on dates and numbers.

    So a property like ExpiryDateOWSDATE looks usable and isn't. The fix is to map the crawled property to a refinable date property and query by its alias.

    I also wrote a linter for KQL, since a bad query returns nothing and no error. Episode 6 of DEVLADLOG SharePoint: {YOUTUBE_URL}

    #SharePoint #KQL
    Narration uses an AI voice.
