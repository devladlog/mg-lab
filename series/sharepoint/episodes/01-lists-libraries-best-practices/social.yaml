linkedin_company:
  text: |
    Most SharePoint list problems are designed in on day one, and only show up at item 5,001.

    The 5,000 limit is the list view threshold, and it applies to each query, not to the list. A list can hold 30 million items, as long as every view filters first on an indexed column and returns fewer than 5,000 rows. Adding an index is only possible while the list is under 20,000 items, so indexes are a day-one decision.

    In episode 1 of DEVLADLOG SharePoint, the design of a fictional Contoso purchase requests list is a JSON file:
    - Lint it against 14 rules, each tied to a documented limit, with no tenant needed
    - Generate clean internal names and create indexed columns up front with PnP PowerShell
    - Build views with the indexed filter first
    - 31 Pester tests, with the PnP cmdlets mocked

    Watch the episode: {YOUTUBE_URL}
    Written guide: {BLOG_URL}
    Narration uses an AI voice.
    #SharePoint #MicrosoftLists #PnPPowerShell #Microsoft365
linkedin_personal:
  text: |
    A SharePoint list can hold 30 million items, yet plenty of lists hit a wall at 5,000. The limit is per query, not per list: a view has to filter first on an indexed column.

    The part that is easy to miss is that you can only add an index while the list is under 20,000 items. So I wrote the list design as JSON and linted it before the list exists. The detail that surprised me: Created By and Modified By count towards the 12 lookup columns per view.

    Episode 1 of DEVLADLOG SharePoint: {YOUTUBE_URL}

    #SharePoint #PnPPowerShell
    Narration uses an AI voice.
