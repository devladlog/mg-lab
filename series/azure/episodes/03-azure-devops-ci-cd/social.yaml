  - id: approvals
    youtube_short_title: "Azure Pipelines approvals run BEFORE your what-if. Here's the fix #Shorts"
    instagram_reel:
      caption: |
        Approvals are not in the YAML. They are set on the environment, and Azure Pipelines evaluates every check before the stage starts.

        So if your what-if runs inside the production stage, the approver signs off before the what-if even exists. The fix is to give the plan its own stage, so the approver reads its summary first.

        Full episode: link in bio

        #Azure #AzureDevOps #Bicep #DevOps
      cover_text: "Approve before what-if?"
    tiktok:
      caption: "Azure Pipelines checks run before the stage starts. If your what-if is inside the prod stage, the approver signs off blind. Give the plan its own stage. #Azure #AzureDevOps #DevOps"
  - id: gotcha
    youtube_short_title: "Azure Pipelines can create your prod environment with no approvals #Shorts"
    instagram_reel:
      caption: |
        If your YAML names an environment that does not exist, and Azure Pipelines knows who you are (for example you saved the pipeline in the web wizard), it creates the environment for you. With no approvals and no checks.

        The very first run then deploys straight to production. Create the environment and its checks before you save the pipeline.

        Full episode: link in bio

        #Azure #AzureDevOps #CICD #DevOps
      cover_text: "First run hits prod"
    tiktok:
      caption: "Gotcha: name a missing environment in Azure Pipelines YAML and the web wizard creates it for you, with no approvals. First run goes to prod. Create it first. #Azure #AzureDevOps #DevOps"
