linkedin_company:
  text: |
    Most pipelines are very good at one thing: going. Push to main and production has changed, whether you meant it or not.

    Episode 3 of DEVLADLOG Azure teaches an Azure Pipelines YAML pipeline when to stop:
    - Four stages: CI, lab, a what-if plan, and production behind an approval
    - Service connections with workload identity federation, one per environment, so there is no client secret to rotate
    - A what-if gate that blocks deletes and changes to protected properties such as network access
    - Approvals set on the environment, with the plan in its own stage so the approver reads it first
    - Tests for the pipeline itself, because nobody else will write them

    We also cover the gotcha that can send your very first run straight to production without a check.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.

    #Azure #AzureDevOps #CICD #Bicep #DevOps
linkedin_personal:
  text: |
    A lesson from building a pipeline for episode 3 of DEVLADLOG Azure: approvals are evaluated before a stage starts.

    So if your what-if runs inside the production stage, the approver signs off on a plan that does not exist yet. The fix is simple. Give the what-if its own stage, and the approver reads its summary first, then says yes.

    We also test the pipeline itself and block deletes and protected changes with a small gate script.

    Full episode: {YOUTUBE_URL}

    Narration uses an AI voice.

    #Azure #AzureDevOps #Bicep
facebook:
