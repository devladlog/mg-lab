# Plan one environment: what-if + gate only, nothing is deployed. Its own stage, because approvals on the
# target environment are evaluated before the deploy stage starts: the approver reads this summary first.
parameters:
  - name: name
    type: string
  - name: dependsOn
    type: object
  - name: serviceConnection
    type: string
  - name: resourceGroup
    type: string
  - name: parameterFile
    type: string
  - name: acceptProtectedChanges
    type: boolean
    default: false

stages:
  - stage: ${{ parameters.name }}
    displayName: Plan ${{ parameters.resourceGroup }}
    dependsOn: ${{ parameters.dependsOn }}
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: plan
        displayName: what-if + gate
        steps:
          - checkout: self
            fetchDepth: 1
          - task: AzureCLI@2
            displayName: what-if and gate (no deployment)
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              scriptLocation: scriptPath
              scriptPath: $(pipelineDir)/pipelines/scripts/deploy.sh
              arguments: >-
                --plan-only
                --resource-group ${{ parameters.resourceGroup }}
                --parameters $(workloadDir)/infra/${{ parameters.parameterFile }}
                --policy $(pipelineDir)/pipelines/gate-policy.json
                --accept-protected ${{ parameters.acceptProtectedChanges }}
                --summary $(Build.ArtifactStagingDirectory)/whatif/summary.md
                --save-whatif $(Build.ArtifactStagingDirectory)/whatif/whatif.json
                --azure-devops
          - task: PublishPipelineArtifact@1
            displayName: Publish what-if for the approver
            condition: succeededOrFailed()
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/whatif
              artifact: whatif-${{ parameters.name }}
