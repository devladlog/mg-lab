  - id: poison
    youtube_short_title: "Azure Functions retries 5 times, then the poison queue #Shorts"
    instagram_reel:
      caption: |
        The order is well formed, so the HTTP function accepts it, but the SKU is not in the catalogue. The logs show attempt one, two, three, four, five. Then the runtime moves the message to orders-poison.

        Nobody watches a poison queue by default, so a third function turns it into an error log you can alert on.

        Full episode: link in bio

        #Azure #AzureFunctions #DotNet #Serverless
      cover_text: "5 retries, then poison"
    tiktok:
