linkedin_company:
  text: |
    Support for the in-process model of .NET Azure Functions ended on 10 November 2026, and .NET 10 does not run on the Linux Consumption plan at all.

    In episode 1 of DEVLADLOG Azure we build a serverless order intake the current way:
    - .NET 10, isolated worker, Flex Consumption plan
    - An HTTP function that answers 202 or 400 and only queues valid orders
    - A queue function that prices the order and writes it to blob storage, with the order id as the blob name so a retry overwrites instead of duplicating
    - Retries, then the poison queue, with a third function that turns it into an error you can alert on
    - Managed identity everywhere, storage account keys disabled

    33 unit tests run without a Functions host, and the Bicep, tests and deploy scripts are in the public repo ({REPO_URL}).

    Watch the full episode: {YOUTUBE_URL}

    Narration uses an AI voice.

    #Azure #AzureFunctions #DotNet #Serverless #Bicep
linkedin_personal:
  text: |
    My first draft of a queue-triggered function compiled, and the unit tests passed. It still would not have worked.

    I had bound the trigger to the SDK queue message type to log the dequeue count, and used {OrderId} in the blob output path. Microsoft Learn is clear: payload properties in binding expressions do not work with SDK types. Fix: bind a plain record, read the dequeue count from binding data, and add a test that fails if anyone switches it back.

    Episode 1 of DEVLADLOG Azure covers that and the rest of a .NET 10 Flex Consumption order intake: {YOUTUBE_URL}

    Narration uses an AI voice.

    #Azure #AzureFunctions #DotNet
facebook:
  text: |
    How do you build a serverless order intake on Azure Functions in 2026? .NET 10, the isolated worker and Flex Consumption, because in-process support has ended.

    The new DEVLADLOG Azure episode builds it step by step: an HTTP function, a queue function, five retries, then the poison queue. No storage keys anywhere, just managed identity. We also show the one binding mistake that compiled fine and still failed.

    Watch here: {YOUTUBE_URL}

    Narration uses an AI voice.

