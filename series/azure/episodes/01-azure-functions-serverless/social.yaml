  - id: gotcha
    youtube_short_title: "The Azure Functions binding that compiled, passed tests, and didn't bind #Shorts"
    instagram_reel:
      caption: |
        My first draft bound the queue trigger to the SDK message type to log the dequeue count, and used the order id in the blob path. It compiled and the unit tests passed.

        But binding expressions on JSON payloads do not work with SDK types. The fix is a plain record, the dequeue count from binding data, and a test that fails if anyone switches it back.

        Full episode: link in bio

