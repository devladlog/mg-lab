linkedin_company:
  text: |
    Seven support tickets arrive. One has a full card number in plain text, another is furious, and three are not even in English.

    Episode 10 of DEVLADLOG Azure builds a small .NET app that triages them with Azure AI Language, using no keys at all:
    - Order matters: detect the language, redact personal data, then score sentiment on the redacted text only, so the raw card number goes to exactly one call
    - The service's limits (documents per request, characters per document) written as constants with tests
    - A Language resource on the free tier with key access disabled, so Microsoft Entra ID is the only way in
    - One narrow role, Cognitive Services Language Reader, instead of a key
    - Routing as a plain, unit-tested function: a card or bank number goes to security review, strong negative sentiment escalates

    We also say what we did not cover: Azure OpenAI, document analysis, custom models, private endpoints and the Standard tier.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.

    #Azure #AzureAI #EntraID #DotNet #Bicep
linkedin_personal:
  text: |
    A rule from episode 10 of DEVLADLOG Azure that I now apply to any text pipeline: redact before you analyze.

    The app detects the language, redacts personal data, and only then scores sentiment, on the redacted text. The raw card number goes to exactly one call, and no log or later service ever sees it. A test checks that the sentiment requests contain no raw email or card.

    The service gives signals. Our own unit-tested code makes the routing decision.

    Episode: {YOUTUBE_URL}

    Narration uses an AI voice.

    #Azure #AzureAI #DotNet
