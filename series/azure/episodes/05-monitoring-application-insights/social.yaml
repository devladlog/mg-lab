  - id: sampling
    youtube_short_title: "KQL tip: count with sum(ItemCount), not count(), when sampling is on #Shorts"
    instagram_reel:
      caption: |
        When sampling keeps one request in ten, each stored row carries an item count of ten. So count with sum of ItemCount, never with count().

        This query feeds the failure ratio alert and ignores windows with fewer than twenty requests. Every query file is type-checked against the workspace schema, so a misspelled column fails the build.

        Full episode: link in bio

        #Azure #KQL #ApplicationInsights #AzureMonitor
      cover_text: "sum(ItemCount), not count()"
    tiktok:
      caption: "Sampling kept 1 row in 10? Each row has ItemCount = 10. Use sum(ItemCount), never count(), in KQL alerts. #Azure #KQL #ApplicationInsights"
  - id: gotcha
    youtube_short_title: "ExportTarget.None doesn't mean no exporter: 6 tests, zero spans #Shorts"
    instagram_reel:
      caption: |
        With no connection string, my first draft set the exporter target to None. Six telemetry tests failed with zero spans.

        None does not mean no exporter. It means no pipeline at all, so even the in-memory exporter the tests had added got nothing. Locally the app now uses the Console exporter, and you see every span in the terminal.

        Full episode: link in bio

        #Azure #OpenTelemetry #DotNet #ApplicationInsights
      cover_text: "None means nothing"
    tiktok:
      caption: "Gotcha: ExportTarget.None doesn't switch the exporter off, it switches telemetry off. 6 tests failed with zero spans. Use Console locally. #Azure #OpenTelemetry #DotNet"
