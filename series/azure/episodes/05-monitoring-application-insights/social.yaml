linkedin_company:
  text: |
    Your API returns 400 for a bad order, and Application Insights calls it a failed request. Your queries count rows, but sampling kept one row in ten. And the alert fires on noise.

    Episode 5 of DEVLADLOG Azure instruments an orders API on .NET 10 with OpenTelemetry:
    - A custom span, plus an unsampled counter split by channel and never by customer
    - A processor that stops 400, 404 and 422 from counting as failures, while 500s still do
    - KQL that counts with sum(ItemCount) so sampling cannot skew it, with every query file type-checked in the build
    - Availability, failed-request and failure-ratio alerts written in Bicep, with Entra-only ingestion
    - 43 tests that run without Azure

    Then we break the app on purpose and watch the alerts fire.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.

    #Azure #ApplicationInsights #OpenTelemetry #KQL #DotNet
linkedin_personal:
  text: |
    When sampling keeps one request in ten, each stored row in Application Insights carries an item count of ten. If your alert query uses count(), it is counting the wrong thing.

    For episode 5 of DEVLADLOG Azure I used sum(ItemCount), and I put every KQL file through a type-check in the test run, so a misspelled column fails the build instead of failing at 3 a.m.

    Alert on metrics, diagnose with traces.

    Full episode: {YOUTUBE_URL}

    Narration uses an AI voice.

    #Azure #KQL #ApplicationInsights
