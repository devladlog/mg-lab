linkedin_company:
  text: |
    Azure Container Apps can scale an API to zero, so an idle night costs no usage charge. AKS keeps a node running whether a single pod is busy or not.

    Episode 8 of DEVLADLOG Azure builds one .NET 10 orders image and sets it up for both platforms, then compares what each one makes you write down:
    - The image comes from dotnet publish, with no Dockerfile and no Docker daemon
    - Liveness and readiness probes that answer two different questions, shared by both platforms
    - Graceful shutdown: readiness goes to 503 on SIGTERM, then the app drains before SIGKILL
    - Container Apps in Bicep with no registry password: a managed identity pulls the image, and scale goes down to zero
    - Revisions that run side by side, and a Kubernetes manifest where requests, limits and security context are all written down

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.

    #Azure #ContainerApps #AKS #Kubernetes #DotNet
linkedin_personal:
  text: |
    Two health probes, two different questions. That was the design lesson from episode 8 of DEVLADLOG Azure.

    Liveness asks whether the process can answer, and it never touches a dependency, because a slow database must not restart every replica. Readiness asks whether to send traffic, and it says no while the app warms up and while it drains after SIGTERM.

    Container Apps and Kubernetes both call the same two paths, so one .NET image works on both.

    Episode: {YOUTUBE_URL}

    Narration uses an AI voice.

    #Azure #Kubernetes #ContainerApps
