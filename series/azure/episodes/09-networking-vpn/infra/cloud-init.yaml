#cloud-config
# The "internal orders service": a stdlib Python web server on port 8080, started by systemd. It only answers
# to what the NSG lets through (the VPN client pool), and it has no public IP.
write_files:
  - path: /opt/orders/app.py
    permissions: '0755'
    content: |
      import json
      import socket
      from http.server import BaseHTTPRequestHandler, HTTPServer

      class Handler(BaseHTTPRequestHandler):
          def do_GET(self):
              body = json.dumps({"service": "contoso-orders-internal", "host": socket.gethostname(), "client": self.client_address[0], "path": self.path}).encode()
              self.send_response(200)
              self.send_header("Content-Type", "application/json")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)

          def log_message(self, *args):
              pass

      HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
  - path: /etc/systemd/system/orders.service
    content: |
      [Unit]
      Description=contoso internal orders service
      After=network-online.target

      [Service]
      ExecStart=/usr/bin/python3 /opt/orders/app.py
      Restart=always
      DynamicUser=yes

      [Install]
      WantedBy=multi-user.target
runcmd:
  - systemctl daemon-reload
  - systemctl enable --now orders.service
