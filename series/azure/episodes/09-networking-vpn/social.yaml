  - id: peering
    youtube_short_title: "Azure peering gateway transit: miss one half and the spoke has no route #Shorts"
    instagram_reel:
      caption: |
        Peering is directional, so each direction is its own resource in Bicep. The hub allows gateway transit. The spoke says to use the remote gateway.

        Miss either half and the spoke simply has no route to your VPN clients. Microsoft Learn also says gateway transit does not work with the Basic gateway SKU, and the spoke must not have a gateway of its own.

        Full episode: link in bio

        #Azure #AzureVPN #VNetPeering #Bicep
      cover_text: "Peering needs two halves"
    tiktok:
      caption: "Azure VNet peering is directional. Hub: allowGatewayTransit. Spoke: useRemoteGateways. Miss either half and the spoke has no route to VPN clients. #Azure #AzureVPN #Bicep"
  - id: gotcha
    youtube_short_title: "Changed Azure peering? Re-download the VPN client or lose routes #Shorts"
    instagram_reel:
      caption: |
        Microsoft Learn says that after you create or change peering, Windows clients must download and install the VPN client package again, or they keep the old routes.

        The symptom is a silent timeout, not an error. Our script regenerates the package for that reason. One limit: this episode is point-to-site only, with no site-to-site tunnel.

        Full episode: link in bio

        #Azure #AzureVPN #AzureNetworking #VNetPeering
      cover_text: "Silent timeout, no error"
    tiktok:
      caption: "Changed VNet peering? Windows VPN clients keep the old routes until you download and install the client package again. The symptom is a silent timeout. #Azure #AzureVPN #AzureNetworking"
