linkedin_company:
  text: |
    An internal service should have no public address, no open port, and nothing for a scanner to find. Episode 9 of DEVLADLOG Azure builds the network that lets a laptop reach it anyway, through a point-to-site VPN.

    What the episode builds:
    - Hub and spoke: the VPN gateway in the hub, one small Linux VM with a private address only in the spoke
    - Peering with gateway transit, written as two directional Bicep resources
    - A network security group with one allow rule from the VPN client pool, then deny
    - Certificates made with OpenSSL, with the private keys kept on the laptop
    - An address plan checked in code before anything is deployed, so overlapping ranges fail in a second instead of after a long gateway deployment
    - Network Watcher IP flow verify and next hop for when it does not work

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.

    #Azure #AzureVPN #AzureNetworking #Bicep #NetworkSecurity
linkedin_personal:
  text: |
    Overlapping address ranges are the oldest way to break a hybrid network, and you usually find out after the gateway deployment, which can take a long time.

    For episode 9 of DEVLADLOG Azure I made the address plan a JSON file and wrote a checker for the rules Microsoft Learn documents: five reserved addresses per subnet, a GatewaySubnet of /27 or larger, and no overlaps between networks that connect, including the VPN client pool.

    A bad plan now fails in a second, before anything is deployed.

    Episode: {YOUTUBE_URL}

    Narration uses an AI voice.

    #Azure #AzureVPN #Bicep
