series: "DEVLADLOG Azure"
status: draft-hold-for-review
ai_label: true
youtube_url: "{YOUTUBE_URL}"
linkedin_company:
  text: |
    Most cloud architecture lives in a diagram nobody tests. Six months later the storage account has a public endpoint and nobody knows when that happened.

    Episode 2 of DEVLADLOG Azure turns the architecture into code with tests, for a small fictional Contoso workload:

    - Bicep with one shape and two environments: lab and prod differ only in values
    - Storage and Key Vault with public network access disabled, reached through private endpoints
    - 15 pytest guardrails that read the compiled template, not the source
    - PSRule for Azure running Well-Architected rules before deployment, with narrow exceptions that expire
    - Two built-in Azure Policy assignments in the template: allowed locations and a required workload tag

    The gotcha: our first exception file matched on the environment tag only. PSRule reported 78 suppressed results, every rule against every lab resource. A broad exception hides the next real problem.

    Watch the episode: {YOUTUBE_URL}
    Code and tests: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.
    #Azure #Bicep #PSRule #AzureWellArchitected
linkedin_personal:
  text: |
    I wrote my first PSRule exception file in five minutes. It matched on the environment tag only, which looked sensible. Then PSRule reported 78 suppressed results: every listed rule, against every lab resource, including ones that had nothing to do with the rule.

    A broad exception is a blind spot with a nice name. Now each exception group targets one resource type, carries a reason, and has an expiry date. I checked it: with a date in the past, the rule fails again.

    That is episode 2 of DEVLADLOG Azure, where the architecture has tests. {YOUTUBE_URL}

    #Azure #Bicep
    Narration uses an AI voice.
