  - id: gotcha
    youtube_short_title: "Valid Entra token, 401? Check the audience in v2 tokens #Shorts"
    instagram_reel:
      caption: |
        In version 2 access tokens, the audience is always the API's client ID. In version 1 tokens it can be the App ID URI.

        Our API accepts the client ID only, so if you leave the token version at the default, perfectly valid tokens come back 401. Set requestedAccessTokenVersion to 2 and validate the client ID, nothing else.

        Full episode: link in bio

