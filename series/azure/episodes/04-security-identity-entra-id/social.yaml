linkedin_company:
  text: |
    Every API answers two questions on every request: who is calling, and what are they allowed to do? Most teams answer the first with a shared secret in a config file, and the second not at all.

    Episode 4 of DEVLADLOG Azure protects an orders API with Entra ID and zero secrets:
    - Scopes for people, app roles for workloads
    - The app registration, service principal and role assignments written as Bicep with the Microsoft Graph extension, next to the Azure resources
    - A managed identity for the order processor, so Azure holds the credential
    - ASP.NET Core policies that require an app-only token for writes, not just a role claim
    - 20 tests that run the real API pipeline with test-signed tokens

    One gotcha along the way: in v2 tokens the audience is the API's client ID, and valid tokens come back 401 if you leave the token version at the default.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.

    #Azure #EntraID #ManagedIdentity #DotNet #Bicep
linkedin_personal:
  text: |
    One thing I got wrong before building episode 4 of DEVLADLOG Azure: I assumed that if a token has the write role, it is safe to allow the write.

    Roles can show up in user tokens too. So the write policy in our API requires the app role and the idtyp claim set to app. A test sends a user token that carries the app role and expects a 403.

    The whole API runs with no secrets: managed identity for the workload, scopes for people, Entra objects in Bicep.

    Episode: {YOUTUBE_URL}

    Narration uses an AI voice.

    #Azure #EntraID #DotNet
