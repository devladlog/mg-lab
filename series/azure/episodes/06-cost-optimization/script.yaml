  - id: costanalysis
    type: screen
    heading: "Where the lab's money went"
    image: screens/cost-analysis.jpg
    video: screens/cost-analysis.mp4
    bar: "Cost Management · Cost analysis"
    demo: >
      Azure portal, Cost Management, Cost analysis at subscription scope, current month, Group by tag "workload":
      bars for order-intake (episode 1), contoso (episodes 2-3) and contoso-orders (episode 5), plus Untagged.
      Recorded at least a day after those episodes ran. Mask subscription name and ID.
    narration: >
      A day later, cost analysis grouped by the workload tag shows what the earlier episodes really cost. Tags only
      count from the moment they're applied, they're not retroactive, which is why the tag is required at deploy
