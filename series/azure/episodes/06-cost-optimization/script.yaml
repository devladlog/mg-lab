  - id: budget_screen
    type: screen
    heading: "The budget, filtered by tag"
    image: screens/budget.jpg
    video: screens/budget.mp4
    bar: "Cost Management · Budgets"
    demo: >
      Cost Management, Budgets: budget-contoso-lab, 10 per month, filter workload in (order-intake, contoso,
      contoso-orders), alert conditions Actual 50 percent, Actual 90 percent, Forecasted 100 percent, and the
      current spend against it. Mask the alert recipient address and subscription.
    narration: >
      Here's the budget after deploy budget dot s h: ten a month for the three lab workloads, with its three alert
      conditions and the spend so far.

  - id: waste
    type: code
    heading: "Leftovers, with a price tag"
    lang: kusto
    short: waste
    code: |
      // queries/unattached-disks.kql (based on Learn's FinOps best practices)
      resources
      | where type =~ 'microsoft.compute/disks' and managedBy == ""
      | extend diskState = tostring(properties.diskState)
      | where diskState != 'ActiveSAS' and tags !contains 'ASR-ReplicaDisk'

      | App Service plan with no apps | plan-contoso-leftover | 11.80 EUR |
      | Public IP not attached        | pip-contoso-forgotten |  3.28 EUR |
      | Unattached managed disk       | disk-orphaned-os      |  1.38 EUR |
      | Unattached managed disk       | disk-empty-never-used |  0.00 EUR |
      | **Left on the table**                                 | **16.46 EUR / month** |
    narration: >
      Resource Graph finds the leftovers: a plan whose apps are gone, an I P attached to nothing, and two loose disks.
      But look at the last line. Learn says an empty managed disk has no storage allocated until it's first used, so
      it costs nothing. The disk left behind by a deleted V M does. Same query result, different bill.

  - id: waste_screen
    type: screen
    heading: "Resource Graph Explorer and the report"
    image: screens/waste.jpg
    video: screens/waste.mp4
    bar: "Resource Graph Explorer · terminal"
    demo: >
      Left: Azure portal, Resource Graph Explorer, queries/unattached-disks.kql pasted and run, two rows
      (disk-orphaned-os FromImage, disk-empty-never-used Empty). Right: terminal with python -m costwatch waste,
      the priced table (plan, IP, two disks), the untagged table showing the public IP and the Advisor section.
      Run against rg-contoso-waste created by infra/deploy-waste-demo.sh. Mask subscription ID and the IP address.
    narration: >
      In the portal, the same query in Resource Graph Explorer. In the terminal, the full report with the untagged
      I P and Advisor's cost recommendations. Then the tear-down script deletes all of it.

  - id: recap
    type: bullets
    heading: "Five rules"
    bullets:
      - "Price the what-if, not the template"
      - "One price row per question, or stop"
      - "Budgets by tag: actual and forecast"
      - "Budgets warn, they don't stop spending"
      - "Hunt leftovers on a schedule, then tear down"
    narration: >
      Five rules. Price the what-if, where the values are resolved, not the template. Demand exactly one price row per
      question. Set budgets by tag, with actual and forecast thresholds. Remember that budgets warn, they don't stop
      anything. And hunt for leftovers regularly, then tear them down.

