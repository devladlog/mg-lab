linkedin_company:
  text: |
    The bill is decided at deploy time. The lab profile from our earlier episode costs about 25 euros a month before anyone sends a request. The prod profile costs 246. Both numbers come from the same template, and both are knowable before you deploy.

    Episode 6 of DEVLADLOG Azure covers three moments to save money:
    - Before deploy: a Python tool prices the what-if with the public Azure Retail Prices API and exits 1 when the month is over budget
    - While running: a Bicep budget filtered by workload tag, with actual and forecast thresholds
    - After: Resource Graph queries find the unused plan, public IP and disks, each with a monthly price
    - 51 tests that run without Azure

    Along the way: why a zero-row answer from the price API must never be treated as zero euros.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.

    #Azure #FinOps #CostManagement #Bicep #AzureResourceGraph
linkedin_personal:
  text: |
    My first cost estimator for episode 6 of DEVLADLOG Azure had a quiet bug. I filtered the Azure Retail Prices API on the ARM SKU name for an App Service B1 plan. The API answered with an empty list, and an estimator that sums whatever comes back would have said zero euros.

    For App Service that field is empty for B1. So the tool now demands exactly one price row per question. Zero rows or two, and it stops with exit code 2.

    A tool that can't price something should say so, not guess.

    Episode: {YOUTUBE_URL}

    Narration uses an AI voice.

    #Azure #FinOps #Python
