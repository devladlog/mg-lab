        Resource Graph finds the leftovers: a plan whose apps are gone, an IP attached to nothing, and two loose disks.

        But look at the last line. An empty managed disk has no storage allocated until it is first used, so it costs nothing. The disk left behind by a deleted VM does. Same query result, different bill.

