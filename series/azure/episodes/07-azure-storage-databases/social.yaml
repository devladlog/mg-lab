linkedin_company:
  text: |
    Your database connection drops right as the commit is acknowledged. Entity Framework retries, the insert runs again, and the customer now has two orders.

    Episode 7 of DEVLADLOG Azure gives an orders API a real database and makes retries safe:
    - Orders in Azure SQL Database on the free tier, with Microsoft Entra-only authentication and no password anywhere in the template
    - An Idempotency-Key header backed by a unique index, so a replay returns the order that committed
    - Keyset paging and ETags (412 on a stale version)
    - Invoices in Blob Storage with shared keys disabled, downloaded through read-only user delegation SAS links
    - A lifecycle rule that moves invoices to Cool, then Cold, then deletes them
    - 47 tests that run without Azure

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.

    #Azure #AzureSQL #BlobStorage #EntraID #DotNet
linkedin_personal:
  text: |
    For episode 7 of DEVLADLOG Azure I wanted to fix one specific bug: a retry that creates a second order.

    The fix lives in the database, not in the app. Every order needs an Idempotency-Key header, and a unique index enforces it. If the first commit really succeeded, the retry fails with a unique violation, and we return the order that is already there. Same body: replay. Different body: 409.

    Retry logic helps with flaky connections. It also needs something underneath that says no to duplicates.

    Episode: {YOUTUBE_URL}

    Narration uses an AI voice.

    #Azure #AzureSQL #DotNet
