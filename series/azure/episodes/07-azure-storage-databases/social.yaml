  - id: gotcha
    youtube_short_title: "Azure SQL free tier: first request after a pause fails with 40613 #Shorts"
    instagram_reel:
      caption: |
        The Azure SQL free tier pauses after fifteen minutes without connections, and you can't change that delay. The first connection then fails with error 40613 while the database resumes, usually in under a minute.

        Without retries, that's an error page for your first user of the morning. With them, it's a slow first request.

