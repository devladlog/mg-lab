  - id: idempotency
    youtube_short_title: "Idempotency in Azure SQL: let a unique index reject the duplicate #Shorts"
    instagram_reel:
      caption: |
        Every order needs an Idempotency-Key header, and the database has a unique index on it. If the commit's acknowledgement was lost, the retry runs as if nothing happened, and with generated keys that means a duplicate row.

        With the unique index, the second insert fails with error 2601, and we return the order that did commit. Two racing requests take the same path.

        Full episode: link in bio

        #Azure #AzureSQL #EntityFramework #DotNet
      cover_text: "Let the index say no"
