    type: outro
    heading: "Code on GitHub, guides on devladlog.com"
    sub: "github.com/devladlog/mg-lab"
    narration: >
      The A P I, the Bicep, the SQL scripts and all forty-seven tests are on GitHub, and the complete guide is on
