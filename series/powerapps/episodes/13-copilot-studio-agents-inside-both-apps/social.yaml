linkedin_company:
  text: |
    You can build and test a Copilot Studio agent on a trial licence. You cannot publish it, and both ways of embedding it in an app call a published agent.

    Episode 13 of DEVLADLOG Power Apps builds one agent, Inspection Assistant, for the canvas app (episode 11) and the model-driven app (episode 12):
    - Knowledge from three Dataverse tables and a SharePoint library of checklists, with the agent signing in as the user
    - One topic and one agent flow that creates a finding, only after a yes
    - Canvas app: the Copilot Studio connector. Model-driven app: the app assistant agent
    - The Copilot Credit rates from Learn, and what our trial can and cannot do

    The embedding is written and tested offline with a test double. The episode says plainly that it waits for a licence decision, and it makes no claim about answer quality.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #CopilotStudio #PowerApps #PowerPlatform #Dataverse #MicrosoftCopilot
linkedin_personal:
  text: |
    I built a Copilot Studio agent for my demo inspection apps and then hit a wall: our lab only has the trial, and a trial can build and test an agent but cannot publish it. Both ways of putting the agent into an app, the canvas connector and the model-driven app assistant, call a published agent.

    So in episode 13 the build and the test panel are real, and the embedding is written, tested offline, and waiting for a licence decision. I would rather say that than fake a screen.

    Check what your licence can publish before you plan the demo.

    Episode 13 of DEVLADLOG Power Apps: {YOUTUBE_URL}

    Narration uses an AI voice.

