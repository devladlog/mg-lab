  youtube_short_title: 'Custom connector code: Formatting.None is ambiguous #Shorts'
  instagram_reel:
    caption: |
      If your custom connector script does not compile, the portal just says internal server error. So the episode compiles the script in a test, the strict way: .NET Standard 2.0 with only the supported namespaces. It caught one. Newtonsoft and System.Xml both have a type called Formatting, so Formatting.None is ambiguous. Qualify it.

      Full episode: link in bio

