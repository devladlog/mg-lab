linkedin_company:
  text: |
    Ask a public holiday API for Portugal 2026 and you get 17 holidays. Only 13 of them close an office in Lisbon. Feed the raw list into your app and Carnival Tuesday stops being a working day.

    Episode 5 of DEVLADLOG Power Apps builds a custom connector from an OpenAPI file and a little C# custom code, so every app and flow gets the right answer.

    - An OpenAPI 2.0 definition with three operations, created in the solution with the Power Platform CLI
    - A GetDaysOff operation that excludes optional and regional holidays and returns the reason for each exclusion
    - Context.SendAsync for the several calls to the source, and a clear error instead of half a calendar
    - The script compiled in a test, the strict way the platform does it, with 51 tests in total

    The gotcha: with the raw list, Monday to Wednesday of Carnival week counts one working day. With the connector's filter it counts two.

    Watch the episode: {YOUTUBE_URL}
    Code and tests: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.
    #PowerApps #CustomConnectors #PowerPlatform #PowerAutomate
linkedin_personal:
  text: |
    A holiday list is not a list of days off. The public API I used returns 17 rows for Portugal in 2026, but only 13 close the office in Lisbon. Carnival is in the list with type optional, and Azores Day only applies in the Azores.

    If you plug the raw list into a working days function, one Carnival week gives you the wrong count and every overdue reminder that week is off. So in the fifth DEVLADLOG Power Apps episode the rule lives in a custom connector, and apps and flows share one answer. The lesson: put business rules in the connector, not in each app.

    {YOUTUBE_URL}

    #PowerApps #CustomConnectors
    Narration uses an AI voice.
