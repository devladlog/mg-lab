linkedin_company:
  text: |
    Your regex passes CT-00421 as a valid asset tag. In Power Apps the same check would reject it. The difference is the host, not your pattern.

    Episode 7 of DEVLADLOG Power Apps moves the repeated pieces of a canvas app into a component library: a header, a confirm dialog and a set of shared rules, for a fictional Contoso equipment desk.

    - Custom input properties with defaults, and events such as OnBack, OnConfirm and OnCancel
    - A dialog that owns no data: it raises an event and the app does the writes
    - Shared logic as output functions, tested in an empty Power Fx engine so they can only use their parameters
    - 109 tests that run the components and the app's handlers on the open source Power Fx engine

    The gotcha: IsMatch must match the whole text by default in Power Apps, but the default outside Power Apps is contains. Anchor the pattern with ^ and $.

    Watch the episode: {YOUTUBE_URL}
    Code and tests: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.
    #PowerApps #PowerFx #ComponentLibraries #PowerPlatform
linkedin_personal:
  text: |
    My asset tag check, IsMatch(tag, "CT-\d{4}"), failed two tests in the seventh DEVLADLOG Power Apps episode. It accepted CT-00421 and XCT-0042. Microsoft's docs explain why: MatchOptions.Complete is the default for IsMatch in Power Apps, but outside Power Apps the default is Contains, and my test engine is outside.

    Anchoring the pattern with ^ and $ makes the rule mean the same thing in every host. The lesson: if you test Power Fx outside Studio, check the defaults that differ, and anchor your patterns.

    {YOUTUBE_URL}

    #PowerFx #PowerApps
    Narration uses an AI voice.
