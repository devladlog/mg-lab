      With change tracking, a deleted row comes back as a reference with an ID, not the row. The register knows tags, not Dataverse IDs. So the exporter remembers which tag each ID had from earlier runs. A device created and deleted between two runs still shows up as deleted, so it is counted instead of sent with a blank tag.

