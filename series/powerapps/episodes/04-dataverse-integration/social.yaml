linkedin_company:
  text: |
    A nightly import from an asset register quietly marks every lent laptop as available again. The cause is not a bug in your code, it is how upsert works.

    Episode 4 of DEVLADLOG Power Apps connects an external system to Dataverse with a small C# console app built on the SDK for .NET, using a fictional Contoso equipment table.

    - An alternate key on the asset tag, so the register never needs Dataverse IDs
    - Upserts sent through ExecuteMultiple, so one bad row costs one row
    - Local validation that rejects a malformed tag, a bad date and a duplicate before any round trip
    - Change tracking for the way back, with the token saved only after the last page is written
    - 47 tests against a fake that follows the documented behaviour

    The gotcha: upsert has no "only on create". Send a status on every row and every lent device resets overnight.

    Watch the episode: {YOUTUBE_URL}
    Code and tests: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.
    #Dataverse #PowerApps #DotNet #PowerPlatform
linkedin_personal:
  text: |
    The obvious way to import devices is to send a status of Available on every row, because new rows need one. But upsert writes every attribute on update too, so every night every lent laptop would flip back to Available. Upsert has no "only on create".

    In the fourth DEVLADLOG Power Apps episode the register sends a status only for repair and retirement, and a second pass sets Available just for the rows the upsert created. A test pins it. The lesson: before you map a field in an upsert, ask what it does on update.

    {YOUTUBE_URL}

    #Dataverse #DotNet
    Narration uses an AI voice.
