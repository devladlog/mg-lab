linkedin_company:
  text: |
    A laptop comes back with the note "crack across the corner of the screen, still works". An AI Builder prompt can suggest what happens next. The interesting part is everything around the prompt, because the app should not take its answer on faith.

    Episode 10 of DEVLADLOG Power Apps adds an AI Builder prompt to a fictional Contoso equipment desk app. The prompt suggests. The person at the desk decides.

    - A prompt that returns bare JSON with three keys: a condition from a closed list of four, a confidence and a summary
    - The app parses the answer, checks the condition against an allow list and ignores anything below 0.7 confidence
    - Short notes are never sent and long ones are capped, to protect the credit budget
    - If the call fails, the desk carries on by hand
    - 119 tests on the open source Power Fx interpreter, using a stand-in for the prompt

    The gotcha: a missing confidence is blank, not zero. Min of 1 and blank is 1, so a missing value walked straight through the gate until a test caught it.

    Watch the episode: {YOUTUBE_URL}
    Code and tests: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.
    #AIBuilder #PowerApps #PowerFx #PowerPlatform
linkedin_personal:
  text: |
    My first confidence check for an AI Builder prompt was Max(0, Min(1, Value(...))). A test sent an answer with no confidence and the result was 1. Blank is not zero. Min of 1 and blank is 1, so a missing confidence walked straight through my 0.7 gate.

    The fix checks for blank first, and every forgot-a-field case is a test now. The tests use a stand-in for the prompt, so they cannot tell you whether the model is right, only that the rules around it hold. The lesson: treat model output as untrusted text and test the missing-field cases.

    {YOUTUBE_URL}

    #PowerFx #AIBuilder
    Narration uses an AI voice.
