# DEVLADLOG Power Apps — episode 14 (integration). Draft: code scenes are real excerpts from src/ and tests/, screen scenes need the lab recording.
# Honest scope: the AI Builder route needs Copilot Credits (none in the lab), so it is shown in the prompt builder only. No model output in this repo is faked.
episode: 14
slug: ai-models-in-both-apps
series_label: "POWER APPS"
series_name: "DEVLADLOG Power Apps"
file_prefix: "powerapps"
title: "AI models in both apps"
subtitle: "AI Builder, Azure OpenAI and Claude, scored on the same golden set"
voice: am_michael
thumbnail_text: "3 AI MODELS\nBOTH\nAPPS"
youtube:
  title: "AI Builder vs Azure OpenAI vs Claude in Power Apps: Golden Set | DEVLADLOG Power Apps #14"
  tags: [Power Apps, AI Builder, Azure OpenAI, Microsoft Foundry, Claude, custom connector, Entra ID, Key Vault, environment variables, golden set, canvas app, model-driven app, Power Platform]
