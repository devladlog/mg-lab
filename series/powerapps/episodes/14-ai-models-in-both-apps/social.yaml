linkedin_company:
  text: |
    Which model should say how serious a note about a fire door is? Instead of trusting a demo, episode 14 of DEVLADLOG Power Apps gives three routes the same job and scores them the same way.

    - One output contract: summary, category, severity and confidence. Anything else is rejected, not repaired
    - Three routes: an AI Builder prompt, Azure OpenAI through a custom connector with Entra sign-in, and Claude through the Anthropic API with the key in a secret environment variable
    - A golden set of thirteen labelled notes, including one that tells the model to ignore the rules
    - A score that counts invalid answers and under calls of Major and Critical separately

    The AI Builder route needs Copilot Credits that our lab does not have, so it is shown in the prompt builder only. The suggestion is saved in new columns and never overwrites the inspector's own severity. Thirteen notes is a smoke test, not a benchmark.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #PowerApps #AIBuilder #AzureOpenAI #PowerPlatform #AzureAI
linkedin_personal:
  text: |
    If you ask a model to rate severity, the mistake that costs you is not a wrong label, it is calling a Critical a Minor. So in episode 14 the scorer counts under calls of Major and Critical on their own, and treats a reply that breaks the JSON contract as invalid, not as a wrong answer.

    The golden set has thirteen notes, one of them a trap that tells the model to ignore the rules. Thirteen is a smoke test, so I do not crown a winner.

    Count the misses that hurt separately.

    Episode 14 of DEVLADLOG Power Apps: {YOUTUBE_URL}

    Narration uses an AI voice.

    #PowerApps #AzureAI #PowerPlatform
