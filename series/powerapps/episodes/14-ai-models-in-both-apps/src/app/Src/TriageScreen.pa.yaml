# AI triage of the selected inspection item (episode 11's app, one new screen). Three routes, same contract (src/contract/triage.schema.json):
#  - AI Builder prompt:  'InspectionTriage'.Predict(text).text        (needs Copilot Credits; text only here, the photo test is in the prompt builder)
#  - Azure OpenAI:       ContosoFoundryTriage.TriageFinding(...)      (custom connector, Entra sign-in, the user's own identity)
#  - Claude:             ClaudeTriage.Run(notes, photo, model)        (a cloud flow reads the secret environment variable; the app never sees the key)
# Accept writes only the five AI columns of the ContosoInspectionsAI solution. The base Severity is never touched.
Screens:
  TriageScreen:
    Properties:
      Fill: =RGBA(245, 246, 250, 1)
      OnVisible: =Set(triageRaw, ""); Set(triageBusy, false); Set(triageRoute, RouteFoundry)
    Children:
      - lblTriageTitle:
          Control: Label
          Properties:
            Text: ="AI suggestion"
            Role: =TextRole.Heading1
            Size: =24
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(0, 90, 158, 1)
            X: =0
            Y: =0
            Width: =Parent.Width - 88
            Height: =88
      - btnBackTriage:
          Control: Classic/Button
          Properties:
            Text: ="‹"
            OnSelect: =Back()
            AccessibleLabel: ="Back to the inspection"
            TabIndex: =0
            X: =Parent.Width - 88
            Y: =0
            Width: =88
            Height: =88
      - txtTriageNotes:
          Control: Classic/TextInput
          Properties:
            Default: =selectedItem.Notes
            Mode: =TextMode.MultiLine
            HintText: ="What did you see?"
            AccessibleLabel: ="Notes to send to the model"
            TabIndex: =0
            X: =16
            Y: =104
            Width: =Parent.Width - 32
            Height: =160
      - drpTriageRoute:
          Control: Classic/DropDown
          Properties:
            Items: =[RouteAIBuilder, RouteFoundry, RouteClaude]
            OnChange: =Set(triageRoute, Self.Selected.Value)
            AccessibleLabel: ="Which model route"
            TabIndex: =0
            X: =16
            Y: =280
            Width: =Parent.Width - 32
            Height: =88
      - btnSuggest:
          Control: Classic/Button
          Properties:
            Text: =If(triageBusy, "Thinking...", "Suggest")
            DisplayMode: =If(CanTriage(txtTriageNotes.Text, triageBusy), DisplayMode.Edit, DisplayMode.Disabled)
            OnSelect: |-
              =Set(triageBusy, true);
              With(
                  {
                      notes: BuildTriageNotes(txtTriageNotes.Text),
                      photo: PhotoBase64(JSON(selectedItem.Photo, JSONFormat.IncludeBinaryData))
                  },
                  Set(
                      triageRaw,
                      IfError(
                          Switch(
                              triageRoute,
                              RouteAIBuilder, 'InspectionTriage'.Predict(notes).text,
                              RouteFoundry, First(ContosoFoundryTriage.TriageFinding({ model: FoundryDeployment, max_tokens: 300, messages: [{ role: "system", content: TriageSystemPrompt }, { role: "user", content: "Notes: " & notes }] }).choices).message.content,
                              RouteClaude, ClaudeTriage.Run(notes, photo, ClaudeModel).text,
                              ""
                          ),
                          Notify("The model could not answer: " & FirstError.Message, NotificationType.Error); ""
                      )
                  )
              );
              Set(triageBusy, false)
            AccessibleLabel: ="Ask the model for a suggestion"
            TabIndex: =0
            X: =16
            Y: =384
            Width: =Parent.Width - 32
            Height: =88
      - lblTriageResult:
          Control: Label
          Properties:
            Text: =If(IsBlank(triageRaw), "", TriageBanner(triageRaw, triageRoute) & Char(10) & TriageSummary(triageRaw) & If(SuggestionNeedsPhoto(triageRaw, !IsBlank(selectedItem.Photo)), Char(10) & "A Major or Critical failed item needs a photo before you save it.", ""))
            Live: =Live.Polite
            AccessibleLabel: ="The model's suggestion"
            X: =16
            Y: =488
            Width: =Parent.Width - 32
            Height: =200
      - btnAccept:
          Control: Classic/Button
          Properties:
            Text: ="Save suggestion"
            DisplayMode: =If(TriageValid(triageRaw), DisplayMode.Edit, DisplayMode.Disabled)
            OnSelect: |-
              =Patch(
                  'Inspection items',
                  selectedItem,
                  {
                      'AI severity': Switch(TriageSeverity(triageRaw), "Minor", 'AI severity (Inspection items)'.Minor, "Major", 'AI severity (Inspection items)'.Major, "Critical", 'AI severity (Inspection items)'.Critical, 'AI severity (Inspection items)'.Info),
                      'AI provider': triageRoute,
                      'AI confidence': TriageConfidence(triageRaw),
                      'AI summary': TriageSummary(triageRaw),
                      'AI suggestion accepted': true
                  }
              );
              Notify("Suggestion saved. The item's own severity is unchanged.", NotificationType.Success)
            AccessibleLabel: ="Save the suggestion on the item"
            TabIndex: =0
            X: =16
            Y: =Parent.Height - 104
            Width: =Parent.Width - 32
            Height: =88
