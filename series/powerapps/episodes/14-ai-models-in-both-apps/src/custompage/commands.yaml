# Command bar command for the Inspection item table (modern command designer, Power Fx), added to the Inspection Back Office app from episode 12.
# Built in the app designer: select the Inspection items page > Edit command bar > Main form. Same pattern as episode 12's Review board command.
table: cin_inspectionitem
commands:
  - id: aitriage
    label: AI suggestion
    icon: Lightbulb
    locations: [mainForm]
    visible: |-
      Self.Selected.State <> FormMode.New
    onSelect: |-
      Navigate(Self.Selected.Item, {Page: 'Item AI triage'})
