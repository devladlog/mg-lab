linkedin_company:
  text: |
    Weekday(d) <= 5 reads like Monday to Friday. In Power Fx it means Sunday to Thursday.

    Episode 3 of DEVLADLOG Power Apps moves the business rules of a canvas app into user-defined functions, so every screen calls the same code and the rules run in tests.

    - Typed functions in App.Formulas: working day, working days between two dates, loan state and colour
    - Switch(true, ...) instead of nested If
    - String interpolation, and the language tag on Text so a user running the app in Portuguese does not get Portuguese dates in an English message
    - 39 test methods on Microsoft's open source Power Fx interpreter, with a fixed clock

    The gotcha: wrapping a Filter in With looks tidier, but With creates a collection internally. Collections cannot be delegated, and you get no warning. Use With for values, never for tables.

    Watch the episode: {YOUTUBE_URL}
    Code and tests: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.
    #PowerFx #PowerApps #CanvasApps #PowerPlatform
linkedin_personal:
  text: |
    Two Power Fx traps from the latest DEVLADLOG Power Apps episode. First, Weekday starts the week on Sunday by default, so Weekday(d) <= 5 means Sunday to Thursday. Pass StartOfWeek.Monday.

    Second, a tidy-looking With around a Filter. Microsoft's docs say With creates a collection internally, collections cannot be delegated, and there is no delegation warning. A unit test cannot see it either, because in memory both versions return the same rows.

    So the working day rules live in tested functions, and the delegation trap gets a lint instead. The lesson: use With for values, never for tables.

    {YOUTUBE_URL}

    #PowerFx #PowerApps
    Narration uses an AI voice.
