linkedin_company:
  text: |
    Field inspectors walk a site, check what is on the list, and take a photo of what fails. What does it take to build the phone app they carry, from an empty environment to a published app?

    Episode 11 of DEVLADLOG Power Apps is a long-form build special on Contoso Inspections:
    - Four Dataverse tables and a security role, created from one schema file
    - Rules written once as named formulas and user-defined functions, tested outside Power Apps
    - A gallery that delegates, a camera, validation, offline mode, responsive layout and an accessibility check
    - Monitor, a solution, sharing, and a run on a real phone

    The data model is shared with episode 12, where we build the back office model-driven app for the same tables. Every formula shown runs in a test, and the episode says plainly what only the real tenant can prove.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #PowerApps #PowerPlatform #Dataverse #PowerFx #CanvasApps
linkedin_personal:
  text: |
    I put the security in the Dataverse role, not in the app. The Inspection Field Inspector role has Basic scope, which means own records. So the canvas app has no "my inspections" filter that could be wrong: Dataverse only returns that inspector's rows.

    Security that lives in the app is security that can be bypassed.

    This is part of a long build special, episode 11 of DEVLADLOG Power Apps. It builds a phone inspection app end to end: {YOUTUBE_URL}

    Narration uses an AI voice.

