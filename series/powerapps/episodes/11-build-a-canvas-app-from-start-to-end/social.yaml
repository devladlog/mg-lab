  - id: role
    youtube_short_title: "Dataverse security role: why the app has no my-records filter #Shorts"
    instagram_reel:
      caption: |
        Basic scope means own records. The Inspection Field Inspector role reads and writes only the inspections and items the signed-in person owns, and reads all sites.

        So the app has no "my inspections" filter to get wrong. Dataverse only returns that inspector's rows. Security that lives in the app is security that can be bypassed.

        Full episode: link in bio
        #PowerApps #Dataverse #PowerPlatform
      cover_text: "Security lives in the role"
