    youtube_short_title: "A Power Apps gallery that delegates: Filter, StartsWith, Sort #Shorts"
    instagram_reel:
      caption: |
        Filter, StartsWith on a text column, equals on a choice, and a sort are the operations Microsoft Learn lists as delegable to Dataverse. The server does the work, so the gallery stays correct past 500 rows.

        No Search, no Len on a column. In Studio, the blue underline is the real proof.

