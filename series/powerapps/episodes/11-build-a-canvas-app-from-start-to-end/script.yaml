scenes:
  - id: hook
    type: title
    heading: "An empty environment to a published phone app"
    sub: "Tables, screens, photos, offline, validation, Monitor, a solution, a security role"
    short: hook
    narration: >
      Field inspectors walk a site, check what is on the list, and take a photo of what fails. Today we build the phone app
      they carry, from an empty environment to a published app that Alex Demo opens on a real phone. Dataverse tables, a
      list, a new inspection with items and photos, offline, validation, and a security role. And the data model is shared:
      the next episode builds the back office app for the same tables, where a reviewer approves what Alex submits.
      Welcome to DEVLADLOG Power Apps. We keep it honest along the way. Every formula you see runs in a test on this machine,
      and anything that needs the real tenant is marked, so you know what was proven and what was recorded.

  - id: plan
    type: bullets
    heading: "The whole path, in order"
    bullets:
      - "Tables and a security role, from one shared schema file"
      - "Named formulas and functions hold the rules"
      - "Screens: list, new inspection, detail, item"
      - "Delegation, offline, responsive, accessible"
      - "Monitor, solution, share, phone"
    narration: >
      Here is the order. First the data and the security role, both generated from one schema file. Then the rules, written
      once as named formulas and functions. Then four screens. Then we check four things a demo hides: delegation,
      offline, layout on different screens, and accessibility. We finish with Monitor, a solution, sharing, and the phone.
      Nothing here is magic. Each step is a file in the repo, so you can follow along, or lift a single piece, like the
      schema script or the validation function, into your own project.

  - id: schema
    type: code
    heading: "One schema file, shared with the model-driven app"
    lang: json
    code: |
      {"logicalName": "cin_photo", "displayName": "Photo", "type": "image", "maxSizeKB": 10240}
      {"logicalName": "cin_status", "displayName": "Status", "type": "choice", "choice": "cin_inspectionstatus",
      "options": [["Draft", 0], ["In progress", 1], ["Submitted", 2], ["Approved", 3], ["Rejected", 4]], "default": 0, "required": true},
      {"name": "cin_inspection_inspectionitem", "referenced": "cin_inspection", "referencing": "cin_inspectionitem", "lookup": "cin_inspectionid", "delete": "Cascade", "parental": true}
    narration: >
      Four tables. Site and Inspector are shared reference data. Inspection and Inspection item are user owned, so every row
      belongs to the person who created it. An item has a photo column, an image column with a ten megabyte limit. The
      inspection status is one choice with five values, and an item is a child of its inspection, so it goes when the
      inspection goes.
      This file is an exact copy of the one the model-driven episode uses, and a test fails if the two ever differ. One
      Dataverse solution, two apps, one data model.

  - id: tables-screen
    type: screen
    heading: "The tables in the ContosoInspections solution"
    image: screens/tables.jpg
    video: screens/tables.mp4
    bar: "make.powerapps.com · Solutions > ContosoInspections > Tables"
    demo: >
      Lab tenant, environment DEV, signed in as the lab maker. Solutions > ContosoInspections > Tables: Inspector, Site, Inspection,
      Inspection item, all with the cin_ prefix. Open Inspection > Columns: Status is a Choice (Draft, In progress, Submitted,
      Approved, Rejected) and Inspection number is an auto number. Open Inspection item > Columns: Photo is an Image column.
      Mask the environment URL and account name.
    narration: >
      This is what the script creates. Four tables inside a solution called ContosoInspections, all with the c i n prefix.
      Status is a choice. The inspection number is an auto number, so Dataverse hands out I N S dash zero zero zero zero one
      and the app never builds one. Photo on Inspection item is an image column. Because they are created into the solution,
      they travel with it later.
      Notice the display names. Inspection date, Requires follow-up, Inspection items. Those are the names the formulas use,
      so they read like a sentence, not like a database dump.

  - id: provision
    type: code
    heading: "Plan first, send later"
    lang: text
    code: |
      > Provision-ContosoInspections.ps1 -EnvironmentUrl https://contoso.crm.dynamics.com -PlanOnly
      Plan for solution ContosoInspections (publisher prefix cin): nothing is sent.
      Table         POST       cin_inspectionitem
      Column        POST       /EntityDefinitions(LogicalName='cin_inspectionitem') + cin_photo
      Relationship  POST       cin_inspection_inspectionitem (adds lookup cin_inspectionid)
      Key           POST       cin_site_sitecode
      SecurityRole GET/POST   /roles (Inspection Field Inspector), 17 privileges, AddSolutionComponent
      Publish       POST       /PublishAllXml
    narration: >
      The script talks to the Dataverse Web API, with the solution header on every create so each component lands in the
      solution. It never signs in. You hand it a token. With plan only it prints exactly what it would send. The Pester tests
      mock the web calls and prove a second run creates nothing twice.
      The script is safe to run twice. It looks for each publisher, solution, table, column, key and role before it creates
      one. For the first run in a real environment you give it a token from your own sign in, and it only ever talks to the
      environment you name.

  - id: role
    type: code
    heading: "Security lives in the role, not the app"
    lang: json
    short: role
    code: |
      "name": "Inspection Field Inspector",
      "cin_inspection": {"Create": "Basic", "Read": "Basic", "Write": "Basic", "Append": "Basic", "AppendTo": "Basic"},
      "cin_inspectionitem": {"Create": "Basic", "Read": "Basic", "Write": "Basic", "Append": "Basic", "AppendTo": "Basic"},
      "cin_site": {"Read": "Global", "AppendTo": "Global"},
    narration: >
      Basic scope means own records. The Inspection Field Inspector role reads and writes only the inspections and items the
      signed in person owns, and reads all sites. So the app has no my inspections filter to get wrong. Dataverse only
      returns that inspector's rows. Security that lives in the app is security that can be bypassed.
      The role has no delete, and the Approved and Rejected decisions are not the inspector's to make. Those belong to a
      second role, the back office reviewer, which the model-driven episode owns.

  - id: named
    type: code
    heading: "Named formulas: rules in one place"
    lang: text
    code: |
      Formulas: |-
      =TapTarget = 88;
      CurrentInspector = LookUp(Inspectors, Email = User().Email);
      UnresolvedItemCount = CountRows(Filter('Inspection items',
          Passed = false && IsBlank('Resolved on')));
    narration: >
      The app's Formulas property holds named formulas. A constant like the touch target size, and values that follow the
      data, like the signed in inspector and the items still unresolved. They recalculate when the data changes, so no screen
      has an OnVisible that refreshes a counter and no variable gets stale.
      Named formulas also keep the screens thin. A screen that needs the open count just says open count. There is exactly
      one place that defines what open means, and one place to fix if the status choice changes.

  - id: udf-pure
    type: code
    heading: "Pure functions you can unit test"
    lang: text
    code: |
      ValidateItem(name: Text, notes: Text, severity: Text, passed: Boolean, hasPhoto: Boolean): Text =
          If(
              Len(Trim(name)) < 3, "Give the item a name of at least 3 characters.",
              severity = "Critical" && passed, "A critical item cannot be marked as passed.",
              !passed && IsSerious(severity) && !hasPhoto,
                  "A failed Major or Critical item needs a photo.",
              ""
          );
    narration: >
      A user defined function takes typed inputs and returns text. This one returns the first problem with an item, or an
      empty string. It reads no controls and changes nothing, so the open source Power Fx engine can run it in a test. A
      failed major or critical item needs notes and a photo, and a critical item can never be marked as passed. That last rule
      is the same one the back office app enforces on the server, mirrored here so the inspector hears it on the phone.
      Because the function is pure, the same call feeds the red message under the form and the guard on the save button.
      They can never disagree, and one test covers both.

  - id: udf-behavior
    type: code
    heading: "Behavior functions: four writes, one pattern"
    lang: text
    code: |
      ResolveItem(): Boolean = {
          IfError(
              Patch('Inspection items', selectedItem, { 'Resolved on': Today() }),
              Notify("Couldn't resolve it: " & FirstError.Message, NotificationType.Error); false,
              Set(selectedItem, Blank()); Notify("Marked as resolved", NotificationType.Success); true
          )
      };
    narration: >
      Writes are behavior functions, in curly braces. Each one returns true or false, and it handles its own error with If
      Error. It never navigates, because a function that names a screen can form a cycle with that screen. The button decides
      where to go, only when the function says it worked.
      There are four of these: start an inspection, add an item, resolve an item, and submit. Each one validates first,
      writes second, and reports honestly. A failed write shows a message with the real error text instead of silently doing
      nothing.

  - id: newapp-screen
    type: screen
    heading: "Create the app inside the solution"
    image: screens/new-app.jpg
    video: screens/new-app.mp4
    bar: "Power Apps Studio · Contoso Inspections"
    demo: >
      Lab tenant, DEV. Solutions > ContosoInspections > New > App > Canvas app, Phone size. Name Contoso Inspections. Add data:
      Dataverse > Inspection, Inspection item, Site, Inspector. Settings > Display: Scale to fit off, Lock aspect ratio off, Lock
      orientation off. Settings > Updates: show that Data row limit is 500. Open App > Formulas to show the named formulas.
      Mask account name.
    narration: >
      In Studio, create the app from inside the solution, phone size, and add the four tables. Turn off scale to fit and the
      aspect ratio lock, so the layout can respond to the screen. The data row limit stays at five hundred. We will make sure we
      never depend on it.
      A tip from experience: name the controls the moment you create them. The source files and the tests refer to controls
      by name, and two buttons both called Button one is a merge problem waiting to happen.

  - id: gallery
    type: code
    heading: "A gallery that delegates"
    lang: text
    short: gallery
    code: |
      =Sort(
          Filter(
              Inspections,
              StartsWith('Inspection number', txtSearch.Text) &&
                  (IsBlank(statusFilter) || cin_status = statusFilter)
          ),
          'Inspection date',
          SortOrder.Descending
      )
    narration: >
      The list. Filter, StartsWith on a text column, equals on a choice, and a sort are the operations Learn lists as
      delegable to Dataverse. The server does the work, so the gallery stays correct past five hundred rows. No Search, no
      Len on a column. It is always sorted, because offline rows can come back in a different order.
      There is one more detail. The status filter is a variable that is blank for all, so the formula checks is blank first.
      That keeps the whole condition on one table, which is what lets Dataverse run it.

  - id: delegation-screen
    type: screen
    heading: "The blue underline is the real test"
    image: screens/delegation.jpg
    video: screens/delegation.mp4
    bar: "Power Apps Studio · galInspections.Items"
    demo: >
      Lab tenant, DEV, Studio with the list screen open. Select galInspections > Items: no blue underline and no delegation
      warning triangle. Then, as a deliberate contrast, temporarily change StartsWith to Search: the blue underline and the
      warning "Delegation warning" appear. Press Ctrl+Z to undo. Mask account name.
    narration: >
      In Studio, the gallery Items formula has no blue underline. Change StartsWith to Search and the warning appears. That
      underline is the real proof. My tests can read a formula and reject calls that Learn does not list as delegable, but
      only Studio knows for sure. Undo, and keep the delegable version.
      If you ever see the blue underline, the fix is usually to move the condition into a delegable shape, or to filter on a
      column that is indexed, rather than to raise the row limit. Raising the limit only hides the problem until the table
      grows.

  - id: list-screen
    type: screen
    heading: "The list: search, chips, newest first"
    image: screens/list.jpg
    video: screens/list.mp4
    bar: "Power Apps Studio · InspectionsScreen (phone preview)"
    demo: >
      Lab tenant, DEV, Studio play mode, phone preview, signed in as Alex Demo. InspectionsScreen shows the title "Inspections",
      the summary line "2 open · no unresolved items" (numbers depend on the data), the search box, chips All, Draft, In progress,
      Submitted, and rows like "INS-00001 · Harbor Warehouse". Type "INS-0000" in search: the list narrows. Tap In progress: only
      those, the chip is bold and filled. Mask account name.
    narration: >
      The list screen. A summary line, a search box, three status chips plus all, and the inspections newest first. Type a few
      letters and the list narrows. The pressed chip is bold and filled, not only a different color, and each row says its
      status in words, with a mark in front.
      The summary line at the top uses two named formulas, so it updates the moment an inspection is submitted. The warning
      about unresolved items is words first, and the color only reinforces it. Approved and rejected inspections also show
      up here, read only, and we come back to those.

  - id: newinsp-screen
    type: screen
    heading: "New inspection: pick a site, start a draft"
    image: screens/new-inspection.jpg
    video: screens/new-inspection.mp4
    bar: "Power Apps Studio · NewInspectionScreen"
    demo: >
      Lab tenant, DEV, Studio play mode. Tap New inspection. The screen says who is inspecting (Alex Demo). Open the Site
      dropdown, pick Harbor Warehouse, leave today's date, tap Start. The detail screen opens with status Draft. Online, the number
      INS-000xx is assigned by Dataverse once saved; if the title still says "New inspection", go back to the list and the number
      is there. Mask account name.
    narration: >
      A new inspection needs a site and a date. Start creates the draft for the signed in inspector and opens it. The number
      comes from Dataverse, an auto number, so two inspectors can never collide and the app has no counter to get wrong.
      Draft means the visit is planned and nothing is recorded yet. The first item moves it to in progress, and submit
      moves it to submitted. Those three are the inspector's part of the flow.

  - id: status-flow
    type: bullets
    heading: "Status: the inspector's part, and the reviewer's"
    bullets:
      - "Draft: the visit is planned, nothing recorded"
      - "In progress: the first item was saved"
      - "Submitted: score, follow-up and summary entered"
      - "Approved or Rejected: set by the reviewer in the model-driven app"
    narration: >
      One status choice, five values, two apps. This app only ever writes the first three. Draft when you start, in progress
      when the first item is saved, and submitted when you hand it in. A test checks that the app never writes approved or
      rejected. Those two are the reviewer's decision, made in the model-driven app we build next, and the inspector sees them
      here, read only, with a banner saying so.
      That is the bridge between the two episodes. The same row, the same status column, two apps, and a security role that
      decides who can do what.

  - id: camera
    type: code
    heading: "The camera, and what the Dataverse column wants"
    lang: text
    code: |
      OnSelect: =Set(itemPhoto, Self.Photo)
      Photo: If(IsBlank(itemPhoto), Blank(), { Full: itemPhoto, Value: itemPhoto })
    narration: >
      The Camera control takes a picture when you tap it, and the Photo property holds it. An image column in Dataverse takes a
      record with Full and Value, both set to the picture's address. A photo is optional for a passed item, so a blank photo
      saves a blank column.
      Remember that a camera control is for quick evidence. If an inspector needs a sharp, full resolution picture, the add
      picture control reads from the phone's gallery or camera app at the full size instead.

  - id: item-screen
    type: screen
    heading: "An item with a photo, and the rule that blocks it"
    image: screens/item.jpg
    video: screens/item.mp4
    bar: "Power Apps mobile (Android) · ItemScreen"
    demo: >
      Real phone, Power Apps mobile, signed in as Alex Demo, screen recorded with the phone's recorder. Open the draft inspection,
      tap Add item. Name "Fire door", severity Major, category Fire, switch Passed off, notes empty: the red message under the form
      says "A failed Major or Critical item needs notes (at least 10 characters)." Type notes, the message changes to "A failed
      Major or Critical item needs a photo." Tap the camera to capture: the message clears. Tap Save: the inspection goes to In
      progress. Mask account name.
    narration: >
      On the phone. A failed major item with no notes, and the message appears under the form, in words. Add notes and the
      message changes. Take the photo and it clears. The same function that shows the message also guards the save, so the
      button cannot skip it. Save, and the draft becomes in progress.
      Severity and category are dropdowns, so there is nothing to mistype. A passed item needs neither notes nor a photo.
      An item that failed stays open until the inspector taps mark resolved, which stamps today's date.

  - id: validate-test
    type: code
    heading: "The tests run the same function"
    lang: csharp
    code: |
      [InlineData("Aisle clear", "", "Info", true, false, "")]
      [InlineData("Fire door", "short", "Major", false, true, "A failed Major or Critical item needs notes (at least 10 characters).")]
      [InlineData("Fire door", "", "Critical", true, true, "A critical item cannot be marked as passed.")]
      public void An_item_is_validated_before_it_is_saved(string name, string notes, string severity, bool passed, bool photo, string expected)
    narration: >
      The tests load the app's real formulas into the open source Power Fx interpreter, with in memory Dataverse tables built
      from the same schema file. This one feeds the validation function every combination of severity, notes, photo and
      passed. A hundred and twenty six tests like it run in a few seconds, and none of them needs a tenant.
      The same pattern covers the submit rules too. A score between zero and a hundred, at least one item, a follow up date
      when follow up is on, and a summary. If someone edits a rule, a test fails, and you see which sentence changed.

  - id: responsive
    type: code
    heading: "One screen, one column or two"
    lang: text
    code: |
      SizeBreakpoints: =[1200, 1800, 2400]
      LayoutDirection: |-
        =If(InspectionScreen.Size >= ScreenSize.Medium,
            LayoutDirection.Horizontal, LayoutDirection.Vertical)
    narration: >
      Layout is containers, not pixel positions. On a phone the details and the items stack in one column. When the screen
      reaches the medium breakpoint, a sideways phone or a tablet, the same container turns horizontal and they sit side by
      side. The breakpoints are the phone defaults from Learn.
      A minimum screen width and height keep the layout from collapsing on a very small device. The screens are never
      narrower than the device and never narrower than the design size, and a test checks both.

  - id: responsive-screen
    type: screen
    heading: "Same screen, phone and tablet"
    image: screens/responsive.jpg
    video: screens/responsive.mp4
    bar: "Power Apps mobile (Android) · InspectionScreen"
    demo: >
      Real phone, Power Apps mobile, signed in as Alex Demo, screen recorded. Open the in progress inspection upright: details above
      the items list, one column. Rotate the phone to landscape: details on the left, items on the right, no horizontal
      scrolling. Mask account name.
    narration: >
      Upright, one column. Turn the phone and the details move left, the items move right, and nothing scrolls sideways. We
      changed no screen, only the container direction.
      This is the cheapest kind of responsive design. There is no separate tablet app and no duplicated screen. One layout,
      two directions, decided by a single formula.

  - id: a11y
    type: bullets
    heading: "Accessibility, checked in code and in Studio"
    bullets:
      - "Every control you tap has an AccessibleLabel"
      - "Touch targets are 88 units, which is 44 pixels"
      - "Errors are text in a live region, not only red"
      - "Status says Draft, not just a color"
      - "Text contrast is at least 4.5 to 1"
      - "Tab order: default order, no TabIndex above 0"
    narration: >
      Accessibility is rules you can check. Every control you tap has an accessible label. Touch targets are eighty eight
      units, which is forty four pixels. Messages are text in a live region, so a screen reader announces them. Status is
      written out, not only colored. Contrast is at least four point five to one. And Learn says not to set a tab index above
      zero.
      Some of this is easy to forget when the app looks fine. A screen reader user cannot see that a chip is filled, so the
      chip also gets a label. A sighted user with low vision cannot read pale gray on white, so the contrast is computed in
      a test.

  - id: a11y-screen
    type: screen
    heading: "The accessibility checker"
    image: screens/accessibility.jpg
    video: screens/accessibility.mp4
    bar: "Power Apps Studio · App checker > Accessibility"
    demo: >
      Lab tenant, DEV, Studio. Select the App checker icon in the top bar, then the Accessibility tab: the list of issues, ideally
      empty. If something is flagged, select it and the control is highlighted. Then on the phone, turn on TalkBack and swipe
      through the list screen: the gallery announces "Inspections", the search box announces its label. Mask account name.
    narration: >
      Studio's app checker has an accessibility tab. Run it as the last step of every screen. Then switch on the phone's screen
      reader and swipe through. If the labels are good, you can use the app without looking at it.
      The checker catches the missing labels and the contrast problems. It cannot tell you whether the labels make sense.
      That part is a person with a screen reader, even for five minutes.

  - id: offline
    type: code
    heading: "Offline: the globe, and a banner that tells the truth"
    lang: text
    code: |
      =Switch(Connection.Sync,
          ConnectionSync.Connected, Icon.Globe,
          ConnectionSync.ConnectedPendingUpsync, Icon.GlobeChangesPending,
          ConnectionSync.NotConnected, Icon.GlobeNotConnected,
          ConnectionSync.NotConnectedSyncError, Icon.GlobeError)
      Visible: =Host.OfflineEnabled
      Visible: =!Connection.Connected
    narration: >
      Offline uses the built in Dataverse offline mode, not Save Data and Load Data. The globe icon follows Connection dot
      Sync, as in Learn's offline template, and the banner appears when there is no connection. Creating inspections and
      items works offline. No button depends on the connection, because the app uses no flows. One consequence: the
      inspection number is an auto number, so a row created offline has none until it syncs, and the screen says new
      inspection until then.
      Offline mode has its own rules. Sort the galleries, because rows can come back in a different order. Don't expect
      calculated columns to refresh on the device. And keep the offline profile small, because everything in it has to fit
      on the phone.

  - id: offline-screen
    type: screen
    heading: "The offline profile, then airplane mode"
    image: screens/offline.jpg
    video: screens/offline.mp4
    bar: "Power Apps Studio · Settings > General > Can be used offline"
    demo: >
      Lab tenant, DEV. In Studio, Settings > General > Can be used offline: on, then New profile with current app data. Show the
      tables: Inspection, Inspection item, Site, Inspector. Save and publish the profile, then save and publish the app. Then on the
      real phone: open the app, wait for the first sync, turn on airplane mode: the banner and the globe not connected. Add an
      item, the globe shows changes pending. Turn airplane mode off: the globe goes back to connected. Mask account name.
    narration: >
      Turn on can be used offline in the app settings and create a profile with only the four tables we need. Publish the
      profile first, then the app. On the phone, wait for the first sync, then airplane mode. The banner shows, the item
      still saves, and when the signal comes back it syncs.
      One detail from Learn: if you edit and publish the offline profile later, you must publish the app again. And a user
      needs read access to the canvas app, the mobile offline profile and the sync error tables, which our role includes.

  - id: monitor-screen
    type: screen
    heading: "Monitor: watch the app run"
    image: screens/monitor.jpg
    video: screens/monitor.mp4
    bar: "Power Apps Studio · Advanced tools > Monitor"
    demo: >
      Lab tenant, DEV. In Studio, Advanced tools > Open monitor. Play the app in Studio, open a few inspections and save an
      item. In Monitor: the list of events, a Dataverse request, its duration, and a row of the Network type. Then, for a
      published app: the app's Details page > Live monitor > Play published app. Mask account name and URLs.
    narration: >
      Monitor shows every event as the app runs. Dataverse requests, how long they took, and the errors. Open it from Studio
      for the session you are testing, or from the app's details page with Live monitor to watch the published app. It is where
      you find out why a screen is slow.
      Two modes are worth knowing. Studio monitoring is for the session you are testing. Live monitor for the published app
      is for a problem that only happens on a real device, and it costs some performance while it is on, so switch it off
      afterwards.

  - id: solution
    type: code
    heading: "The solution, packed and unpacked offline"
    lang: text
    code: |
      pac solution pack   --zipfile ContosoInspections.zip --folder src/solution/ContosoInspections
      pac solution unpack --zipfile ContosoInspections.zip --folder unpacked

      Passed  test_pack_then_unpack_gives_back_the_same_source
      Passed  test_the_shell_does_not_hand_write_entities_or_roles
    narration: >
      The solution source in the repo is a shell. The tables and the role are created by the script and exported by P A C,
      because Learn says editing tables and roles by hand in the solution file is not supported. The tests run the real Power
      Platform CLI, pack and unpack, with no sign in.
      The result is a repeatable package. Pack the source, import it into a test environment, and the same tables, role and
      app appear. We keep the exported canvas app file next to the solution, because the app itself comes from Studio.

  - id: solution-screen
    type: screen
    heading: "Add the app, the role and the offline profile"
    image: screens/solution.jpg
    video: screens/solution.mp4
    bar: "make.powerapps.com · Solutions > ContosoInspections"
    demo: >
      Lab tenant, DEV. Solutions > ContosoInspections: the four tables, the Inspection Field Inspector role, the Contoso Inspections canvas
      app. Select the app > Advanced > Add required objects: the offline profile is added. Then Export solution > Unmanaged.
      Mask account name and environment URL.
    narration: >
      Back in the solution. The tables, the role, and the app. Select the app and choose add required objects, so the offline
      profile comes with it. Then export. Now the whole thing moves to another environment as one package.
      Choose unmanaged for development and managed for anything that will be installed in test or production. The offline
      profile matters here. If you forget it, the app arrives in the next environment without its offline data.

  - id: share-screen
    type: screen
    heading: "Share with a security role"
    image: screens/share.jpg
    video: screens/share.mp4
    bar: "make.powerapps.com · Contoso Inspections > Share"
    demo: >
      Lab tenant, DEV, signed in as the lab administrator. Apps > Contoso Inspections > Share. Add Alex Demo. Under Data
      permissions, assign the security role Inspection Field Inspector. Save. Open the lab user list in the admin center and show
      Alex Demo has the Inspection Field Inspector role. Mask account names.
    narration: >
      Save and publish the app first. Then share it with Alex Demo. The share panel lets a system administrator assign a security
      role, so the user can read and write the tables. Roles go to people and security groups, not to Microsoft 365 groups.
      Sharing a canvas app and giving someone table access are two different things. Without the role, the app opens and
      then shows errors. With it, the app opens and shows exactly the rows the person owns.

  - id: phone-screen
    type: screen
    heading: "Alex Demo, on a phone, the published app"
    image: screens/phone.jpg
    video: screens/phone.mp4
    bar: "Power Apps mobile (Android) · Contoso Inspections"
    demo: >
      Real phone, Power Apps mobile signed in as Alex Demo, screen recorded. The app is in the app list. Open it: list of Alex's
      inspections only. New inspection > site > Start > Add item with a photo > enter a score and a summary, switch follow up on
      > Submit. The row moves to Submitted and the screen says "Waiting for the back office to review it." Then sign in as Sam
      Demo on the lab host and show that Sam does not see Alex's inspections. If the model-driven app from episode 12 is built:
      as the reviewer, approve Alex's inspection there, pull to refresh on the phone, and show the row with Approved and the
      banner "Approved by the back office." Mask account names.
    narration: >
      The finished test. Alex opens the app on the phone and sees only Alex's inspections. New inspection, an item with a
      photo, a score, a summary, follow up, submit. The status moves to submitted, and the screen says it is waiting for the
      back office. Sam signs in and doesn't see any of it, and that comes from the role.
      Then the bridge. In the model-driven app, the reviewer approves it, and back on Alex's phone the same row reads
      approved, read only. This is the check no unit test can do. A real person, a real phone, a real camera, and the role
      doing its job.

  - id: gotcha
    type: bullets
    heading: "Gotcha: what this app does not prove"
    bullets:
      - "Delegation: only Studio's blue underline is proof"
      - "Two columns are called Status: the app writes cin_status"
      - "Set does not carry an error: take the record into With first"
      - "Camera photos are limited to 640 by 480 pixels"
      - "Offline: no flows, no Save Data, no number until it syncs"
    narration: >
      Honest limits. Delegation: my tests reject calls that Learn doesn't list as delegable, but Studio's blue underline is the
      real check. Dataverse has a system status column with the same display name as ours, so the app uses the logical name
      c i n underscore status, and the first thing to check in Studio is that IntelliSense agrees. In the test engine, the Set
      function swallowed a failed save, so start inspection takes the new record into With first and tests it with If Error.
      Confirm that in Studio too. The camera control tops out at six forty by four eighty, so use the add picture control for
      full resolution.
      None of these is a reason not to build this way. They are the things to check before you tell your team the app is
      done.

  - id: tests
    type: bullets
    heading: "What the tests run, and what they cannot"
    bullets:
      - "126 canvas tests: formulas, flows, lint, offline, responsive"
      - "Python tests: schema copy, solution pack, plan"
      - "19 Pester tests: the provisioning script, mocked"
      - "Not tested: a real tenant, a real phone, a real camera"
    narration: >
      A hundred and twenty six canvas tests, the Python tests, and nineteen Pester tests. They prove the formulas, that the
      schema is still the exact copy the back office app uses, the solution packaging, and the script's plan. They do not prove
      that Dataverse accepts the calls, that Studio loads the source, or that a phone behaves. That is what the recording is
      for.
      Run them in the order the readme lists. The Python and Pester tests need no packages beyond the ones in the readme,
      and the canvas tests restore their packages once. Everything runs locally, one at a time.

  - id: recap
    type: bullets
    heading: "What we built"
    bullets:
      - "Four tables, one role, one schema shared with episode 12"
      - "Four screens, rules in named formulas and functions"
      - "Delegable list, validation, camera, offline"
      - "Monitor, solution, shared with a role, tested on a phone"
    narration: >
      So that's the path. Four tables and a role from one file, shared with the back office app. Four screens with the rules in
      named formulas and functions. A delegable list, validation, a camera, and offline. And then Monitor, a solution, sharing
      with a role, and a real phone. Every piece is in the repo, from the schema file to the last test. Take the parts you
      need, and change the table names to your own.

  - id: outro
    type: outro
    heading: "Code on GitHub, guides on devladlog.com"
    sub: "github.com/devladlog/mg-lab"
    narration: >
      The schema, the script, the app source and all the tests are on GitHub, and the complete guide is on devladlog dot com.
      Links are in the description. Next time we build the same inspections app as a model driven app. Subscribe so you don't
