# One inspection: its details, its items, and Submit. Items are filtered by the inspection's own id.
#   Small (phone upright)   one column: details, items, submit
#   Medium and up           details+submit on the left, items on the right (two panes), same controls
#   Submit                  only while the inspection is In progress; the rules live in ValidateSubmit (App.Formulas)
#   After Submit            Approved and Rejected are set by the reviewer in the model-driven app (episode 12); this screen shows
#                           the decision and keeps everything read-only
Screens:
  InspectionScreen:
    Properties:
      Fill: =RGBA(245, 246, 250, 1)
      Width: =Max(App.Width, If(App.Width < App.Height, App.DesignWidth, App.DesignHeight))
      Height: =Max(App.Height, If(App.Width < App.Height, App.DesignHeight, App.DesignWidth))
    Children:
      - lblInspectionTitle:
          Control: Label
          Properties:
            Text: =Coalesce(selectedInspection.'Inspection number', "New inspection")
            Role: =TextRole.Heading1
            Size: =24
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(0, 90, 158, 1)
            X: =0
            Y: =0
            Width: =Parent.Width - TapTarget
            Height: =TapTarget
      - btnBackInspection:
          Control: Classic/Button
          Properties:
            Text: ="‹"
            OnSelect: =Back()
            AccessibleLabel: ="Back to inspections"
            TabIndex: =0
            X: =Parent.Width - TapTarget
            Y: =0
            Width: =TapTarget
            Height: =TapTarget
      - conInspectionBody:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            LayoutDirection: |-
              =If(InspectionScreen.Size >= ScreenSize.Medium,
                  LayoutDirection.Horizontal, LayoutDirection.Vertical)
            LayoutGap: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =12
            X: =0
            Y: =TapTarget
            Width: =Parent.Width
            Height: =Parent.Height - Self.Y
          Children:
            - conDetails:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  FillPortions: =1
                  LayoutMinWidth: =480
                Children:
                  - lblSite:
                      Control: Label
                      Properties:
                        Text: =selectedInspection.Site.'Site name' & " (" & selectedInspection.Site.'Site code' & ")"
                        FontWeight: =FontWeight.Semibold
                        Size: =20
                        Height: =48
                  - lblWhen:
                      Control: Label
                      Properties:
                        Text: =Text(selectedInspection.'Inspection date', "dddd d mmmm yyyy", "en-GB") & " · " & Text(selectedInspection.cin_status)
                        Height: =48
                  - lblDecision:
                      Control: Label
                      Properties:
                        # Bridge to episode 12: the back office decides, the inspector only reads the outcome.
                        Text: |-
                          =Switch(Text(selectedInspection.cin_status),
                              "Approved", "Approved by the back office.",
                              "Rejected", "Rejected by the back office. Check their notes with your lead.",
                              "Submitted", "Waiting for the back office to review it.",
                              "")
                        Live: =Live.Polite
                        Height: =If(Self.Text = "", 0, 64)
                  - lblSuggest:
                      Control: Label
                      Properties:
                        # A hint, not a rule: SuggestScore and SuggestFollowUp count this inspection's failed items by severity.
                        Text: |-
                          ="Suggested from the items: score " & SuggestScore(
                              FailedCount(selectedInspection.cin_inspectionid, "Critical"),
                              FailedCount(selectedInspection.cin_inspectionid, "Major"),
                              FailedCount(selectedInspection.cin_inspectionid, "Minor")
                          ) & If(
                              SuggestFollowUp(FailedCount(selectedInspection.cin_inspectionid, "Critical"), FailedCount(selectedInspection.cin_inspectionid, "Major")),
                              ", follow-up needed", ", no follow-up needed")
                        Height: =48
                  - txtScore:
                      Control: Classic/TextInput
                      Properties:
                        Default: =If(IsBlank(selectedInspection.Score), "", Text(selectedInspection.Score))
                        Format: =TextFormat.Number
                        HintText: ="Score from 0 to 100"
                        AccessibleLabel: ="Score from 0 to 100"
                        DisplayMode: =If(IsEditable(Text(selectedInspection.cin_status)), DisplayMode.Edit, DisplayMode.View)
                        TabIndex: =0
                        Height: =TapTarget
                  - tglFollowUp:
                      Control: Classic/Toggle
                      Properties:
                        Default: =selectedInspection.'Requires follow-up'
                        TrueText: ="Follow-up needed"
                        FalseText: ="No follow-up"
                        AccessibleLabel: ="Requires follow-up"
                        DisplayMode: =If(IsEditable(Text(selectedInspection.cin_status)), DisplayMode.Edit, DisplayMode.View)
                        TabIndex: =0
                        Height: =TapTarget
                  - dpFollowUp:
                      Control: Classic/DatePicker
                      Properties:
                        DefaultDate: |-
                          =Coalesce(selectedInspection.'Follow-up date', FollowUpDateFor(
                              FailedCount(selectedInspection.cin_inspectionid, "Critical"),
                              FailedCount(selectedInspection.cin_inspectionid, "Major")))
                        AccessibleLabel: ="Follow-up date"
                        DisplayMode: =If(tglFollowUp.Value && IsEditable(Text(selectedInspection.cin_status)), DisplayMode.Edit, DisplayMode.Disabled)
                        TabIndex: =0
                        Height: =TapTarget
                  - txtSummary:
                      Control: Classic/TextInput
                      Properties:
                        Default: =Coalesce(selectedInspection.Summary, "")
                        Mode: =TextMode.MultiLine
                        HintText: ="Summary (at least 10 characters)"
                        AccessibleLabel: ="Summary"
                        DisplayMode: =If(IsEditable(Text(selectedInspection.cin_status)), DisplayMode.Edit, DisplayMode.View)
                        TabIndex: =0
                        Height: =160
                  - btnSubmit:
                      Control: Classic/Button
                      Properties:
                        Text: ="Submit inspection"
                        DisplayMode: =If(selectedInspection.cin_status = 'Status (Inspections)'.'In progress', DisplayMode.Edit, DisplayMode.Disabled)
                        OnSelect: =If(SubmitInspection(If(IsBlank(txtScore.Text), Blank(), Value(txtScore.Text)), tglFollowUp.Value, dpFollowUp.SelectedDate, txtSummary.Text), Back())
                        AccessibleLabel: ="Submit inspection"
                        TabIndex: =0
                        Height: =TapTarget
            - conItems:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  FillPortions: =1
                  LayoutMinWidth: =480
                Children:
                  - lblItems:
                      Control: Label
                      Properties:
                        Text: =ItemCount(selectedInspection.cin_inspectionid) & If(ItemCount(selectedInspection.cin_inspectionid) = 1, " item", " items")
                        Role: =TextRole.Heading2
                        FontWeight: =FontWeight.Semibold
                        Size: =20
                        Height: =48
                  - galItems:
                      Control: Gallery
                      Properties:
                        # The lookup's id comparison is the one filter here whose delegation Learn doesn't spell out: check Studio shows no
                        # blue underline. Severity sorts by its stored value, not its label.
                        Items: |-
                          =Sort(
                              Filter('Inspection items', Inspection.cin_inspectionid = selectedInspection.cin_inspectionid),
                              Severity,
                              SortOrder.Descending
                          )
                        OnSelect: =Set(selectedItem, ThisItem)
                        AccessibleLabel: ="Items"
                        TemplateSize: =120
                        FillPortions: =1
                      Children:
                        - lblItemName:
                            Control: Label
                            Properties:
                              Text: =ThisItem.Item
                              FontWeight: =FontWeight.Semibold
                              Size: =18
                              X: =24
                              Y: =12
                              Width: =Parent.TemplateWidth - 48
                              Height: =44
                        - lblItemMeta:
                            Control: Label
                            Properties:
                              # Severity and state are words, not only colour.
                              Text: |-
                                =Text(ThisItem.Severity) & " · " & If(ThisItem.Passed, "Passed", If(IsBlank(ThisItem.'Resolved on'), "Failed, open", "Failed, resolved " & Text(ThisItem.'Resolved on', "d mmm", "en-GB")))
                              Color: =If(!ThisItem.Passed && IsBlank(ThisItem.'Resolved on'), RGBA(164, 38, 44, 1), RGBA(50, 49, 48, 1))
                              X: =24
                              Y: =60
                              Width: =Parent.TemplateWidth - 48
                              Height: =44
                  - conItemActions:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        Height: =TapTarget
                      Children:
                        - btnAddItem:
                            Control: Classic/Button
                            Properties:
                              Text: ="Add item"
                              DisplayMode: =If(IsEditable(Text(selectedInspection.cin_status)), DisplayMode.Edit, DisplayMode.Disabled)
                              OnSelect: =Navigate(ItemScreen, ScreenTransition.Cover)
                              AccessibleLabel: ="Add an item to this inspection"
                              TabIndex: =0
                              FillPortions: =1
                              Height: =TapTarget
                        - btnResolve:
                            Control: Classic/Button
                            Properties:
                              Text: ="Mark resolved"
                              DisplayMode: =If(!IsBlank(selectedItem) && !selectedItem.Passed && IsBlank(selectedItem.'Resolved on'), DisplayMode.Edit, DisplayMode.Disabled)
                              OnSelect: =ResolveItem()
                              AccessibleLabel: ="Mark the selected item as resolved"
                              TabIndex: =0
                              FillPortions: =1
                              Height: =TapTarget
