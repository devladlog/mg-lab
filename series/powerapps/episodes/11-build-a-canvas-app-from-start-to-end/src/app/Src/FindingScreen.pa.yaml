# Add a finding: title, severity, category, details and a photo. Validation is ValidateFinding (App.Formulas) and shows in a
# polite live region next to the Save button, so it is announced by screen readers and written out, not only coloured.
#   Camera   Learn: the Camera control works in the player on the phone; offline it still takes the picture, and the row syncs later.
#   Photo    stored in the Finding.Photo image column (max size MaxPhotoKB); a Major or Critical finding must have one.
Screens:
  FindingScreen:
    Properties:
      Fill: =RGBA(245, 246, 250, 1)
      OnVisible: =Set(findingPhoto, Blank())
      Width: =Max(App.Width, If(App.Width < App.Height, App.DesignWidth, App.DesignHeight))
      Height: =Max(App.Height, If(App.Width < App.Height, App.DesignHeight, App.DesignWidth))
    Children:
      - lblFindingScreenTitle:
          Control: Label
          Properties:
            Text: ="Add finding"
            Role: =TextRole.Heading1
            Size: =24
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(0, 90, 158, 1)
            X: =0
            Y: =0
            Width: =Parent.Width - TapTarget
            Height: =TapTarget
      - btnBackFinding:
          Control: Classic/Button
          Properties:
            Text: ="‹"
            OnSelect: =Back()
            AccessibleLabel: ="Back to the inspection"
            TabIndex: =0
            X: =Parent.Width - TapTarget
            Y: =0
            Width: =TapTarget
            Height: =TapTarget
      - conFindingForm:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =12
            X: =0
            Y: =TapTarget
            Width: =Parent.Width
            Height: =Parent.Height - Self.Y
          Children:
            - txtFindingTitle:
                Control: Classic/TextInput
                Properties:
                  Default: =""
                  HintText: ="Title, e.g. Fire door wedged open"
                  AccessibleLabel: ="Finding title"
                  TabIndex: =0
                  Height: =TapTarget
            - drpSeverity:
                Control: Classic/Dropdown
                Properties:
                  Items: =["Observation", "Minor", "Major", "Critical"]
                  AccessibleLabel: ="Severity"
                  TabIndex: =0
                  Height: =TapTarget
            - drpCategory:
                Control: Classic/Dropdown
                Properties:
                  Items: =["Safety", "Housekeeping", "Equipment", "Documentation"]
                  AccessibleLabel: ="Category"
                  TabIndex: =0
                  Height: =TapTarget
            - txtFindingDetails:
                Control: Classic/TextInput
                Properties:
                  Default: =""
                  Mode: =TextMode.MultiLine
                  HintText: ="Details (required for Major and Critical)"
                  AccessibleLabel: ="Finding details"
                  TabIndex: =0
                  Height: =128
            - camFinding:
                Control: Camera
                Properties:
                  OnSelect: =Set(findingPhoto, Self.Photo)
                  AccessibleLabel: ="Take a photo of the finding. Tap the camera to capture."
                  TabIndex: =0
                  Height: =320
            - lblProblem:
                Control: Label
                Properties:
                  # Live region: the message is announced when it changes, and it is text, not only a red border.
                  Text: =ValidateFinding(txtFindingTitle.Text, txtFindingDetails.Text, drpSeverity.Selected.Value, !IsBlank(findingPhoto))
                  Live: =Live.Polite
                  Color: =RGBA(164, 38, 44, 1)
                  Height: =If(Self.Text = "", 0, 64)
            - lblPhotoState:
                Control: Label
                Properties:
                  Text: =If(IsBlank(findingPhoto), "No photo yet", "Photo attached")
                  Height: =40
            - btnSave:
                Control: Classic/Button
                Properties:
                  Text: ="Save finding"
                  OnSelect: =If(AddFinding(txtFindingTitle.Text, txtFindingDetails.Text, drpSeverity.Selected.Value, drpCategory.Selected.Value), Back())
                  AccessibleLabel: ="Save finding"
                  TabIndex: =0
                  Height: =TapTarget
