# Add an inspection item: name, category, severity, passed or not, notes and a photo. Validation is ValidateItem (App.Formulas)
# and shows in a polite live region next to the Save button, so it is announced by screen readers and written out, not only coloured.
#   Camera   Learn: the Camera control works in the player on the phone; offline it still takes the picture, and the row syncs later.
#   Photo    stored in the Inspection item's Photo image column (max size MaxPhotoKB); a failed Major or Critical item must have one.
#   Rules    a critical item cannot be passed: the same rule runs server side as a table-scope business rule (episode 12).
Screens:
  ItemScreen:
    Properties:
      Fill: =RGBA(245, 246, 250, 1)
      OnVisible: =Set(itemPhoto, Blank())
      Width: =Max(App.Width, If(App.Width < App.Height, App.DesignWidth, App.DesignHeight))
      Height: =Max(App.Height, If(App.Width < App.Height, App.DesignHeight, App.DesignWidth))
    Children:
      - lblItemScreenTitle:
          Control: Label
          Properties:
            Text: ="Add item"
            Role: =TextRole.Heading1
            Size: =24
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(0, 90, 158, 1)
            X: =0
            Y: =0
            Width: =Parent.Width - TapTarget
            Height: =TapTarget
      - btnBackItem:
          Control: Classic/Button
          Properties:
            Text: ="‹"
            OnSelect: =Back()
            AccessibleLabel: ="Back to the inspection"
            TabIndex: =0
            X: =Parent.Width - TapTarget
            Y: =0
            Width: =TapTarget
            Height: =TapTarget
      - conItemForm:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =12
            X: =0
            Y: =TapTarget
            Width: =Parent.Width
            Height: =Parent.Height - Self.Y
          Children:
            - txtItemName:
                Control: Classic/TextInput
                Properties:
                  Default: =""
                  HintText: ="Item, e.g. Fire door"
                  AccessibleLabel: ="Item name"
                  TabIndex: =0
                  Height: =TapTarget
            - drpSeverity:
                Control: Classic/Dropdown
                Properties:
                  Items: =["Info", "Minor", "Major", "Critical"]
                  AccessibleLabel: ="Severity"
                  TabIndex: =0
                  Height: =TapTarget
            - drpCategory:
                Control: Classic/Dropdown
                Properties:
                  Items: =["Safety", "Electrical", "Fire", "Structural", "Housekeeping"]
                  AccessibleLabel: ="Category"
                  TabIndex: =0
                  Height: =TapTarget
            - tglPassed:
                Control: Classic/Toggle
                Properties:
                  Default: =true
                  TrueText: ="Passed"
                  FalseText: ="Failed"
                  AccessibleLabel: ="Passed. Switch off when the check failed."
                  TabIndex: =0
                  Height: =TapTarget
            - txtItemNotes:
                Control: Classic/TextInput
                Properties:
                  Default: =""
                  Mode: =TextMode.MultiLine
                  HintText: ="Notes (required for a failed Major or Critical item)"
                  AccessibleLabel: ="Item notes"
                  TabIndex: =0
                  Height: =128
            - camItem:
                Control: Camera
                Properties:
                  OnSelect: =Set(itemPhoto, Self.Photo)
                  AccessibleLabel: ="Take a photo of the item. Tap the camera to capture."
                  TabIndex: =0
                  Height: =320
            - lblProblem:
                Control: Label
                Properties:
                  # Live region: the message is announced when it changes, and it is text, not only a red border.
                  Text: =ValidateItem(txtItemName.Text, txtItemNotes.Text, drpSeverity.Selected.Value, tglPassed.Value, !IsBlank(itemPhoto))
                  Live: =Live.Polite
                  Color: =RGBA(164, 38, 44, 1)
                  Height: =If(Self.Text = "", 0, 64)
            - lblPhotoState:
                Control: Label
                Properties:
                  Text: =If(IsBlank(itemPhoto), "No photo yet", "Photo attached")
                  Height: =40
            - btnSave:
                Control: Classic/Button
                Properties:
                  Text: ="Save item"
                  OnSelect: =If(AddItem(txtItemName.Text, txtItemNotes.Text, drpSeverity.Selected.Value, drpCategory.Selected.Value, tglPassed.Value), Back())
                  AccessibleLabel: ="Save item"
                  TabIndex: =0
                  Height: =TapTarget
