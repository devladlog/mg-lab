linkedin_company:
  text: |
    You set a due date in a model-driven app, and a user in another time zone sees the day before. The cause is one missing property on the column.

    Episode 1 of DEVLADLOG Power Apps builds Equipment Desk, a small app for lending laptops, monitors and phones, with the data model and the app created from code.

    - Two Dataverse tables, Equipment and Loan, and the app module created through the Web API
    - A dry run that lists all 39 requests before anything touches an environment
    - A TypeScript form script for the Loan form with 38 passing tests and no tenant needed
    - Blocking errors on the field, and an overdue banner that informs without blocking save

    The gotcha: without a date-time behaviour, Dataverse creates date columns as user local, even when the format is date only. Decide it before you create the column, because date only cannot be changed back.

    Watch the episode: {YOUTUBE_URL}
    Code and tests: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.
    #PowerApps #Dataverse #ModelDrivenApps #PowerPlatform
linkedin_personal:
  text: |
    I used to think a date-only column was a date-only column. It is not. If you do not set the date-time behaviour, Dataverse creates it as user local, and Microsoft's docs warn that people in another time zone can see a different day. A due date that moves by a day is a real bug.

    In the first DEVLADLOG Power Apps episode, every date column is created with date only behaviour from code, and the form script around it has 38 tests that run without a tenant. The lesson: decide date behaviour before you create the column, because you cannot switch it back later.

    {YOUTUBE_URL}

    #PowerApps #Dataverse
    Narration uses an AI voice.
facebook:
  text: |
    Ever had a due date show up one day off for someone in another time zone? In Dataverse the culprit can be a date column created with the default user local behaviour.

    In this DEVLADLOG Power Apps episode we build a small equipment lending app for a fictional Contoso team: two tables, the app and a tested form script, all from code. We also show the one setting that avoids the date bug.

    Watch it here: {YOUTUBE_URL}

    #PowerApps #Dataverse
    Narration uses an AI voice.
