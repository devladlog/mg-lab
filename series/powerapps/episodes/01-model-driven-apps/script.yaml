  - id: formscript
    type: code
    heading: "The form script: one refresh, every rule"
    lang: typescript
    code: |
      export function refresh(fc: Xrm.FormContext, now: Date): void {
        const dates = readDates(fc);
        const errors = validateDates(dates, now);
        for (const field of DATE_FIELDS) {
          const control = fc.getControl(field) as Xrm.Controls.StandardControl | null;
          const error = errors.find((e) => e.field === field);
          if (error) control?.setNotification(error.message, `contoso.dates.${field}`);
          else control?.clearNotification(`contoso.dates.${field}`);
        }
        const state = loanState(dates, now);
        if (state.state === "onTime") fc.ui.clearFormNotification(STATE_NOTIFICATION);
        else fc.ui.setFormNotification(state.message, state.state === "overdue" ? "WARNING" : "INFO", STATE_NOTIFICATION);
        // locked when returned, loan name filled when empty...
      }
    narration: >
      The form script uses the form context from the execution context, not the deprecated X r m dot page. One refresh
      function applies every rule. Real errors use set notification on the field, which blocks save. The overdue banner
      uses a form notification, which informs but never blocks. The rules themselves live in a separate file with no
      X r m at all.

  - id: tests
    type: code
    heading: "Thirty-eight tests, no tenant"
    lang: text
    code: |
      $ npm test
      ✔ picking an earlier due date puts a blocking notification on the field, fixing it clears it
      ✔ overdue loan shows a warning banner on load
      ✔ returning the device locks the loan and replaces the banner
      ✔ daysBetween counts calendar days across the daylight-saving change
      ✔ 90 days is the limit, 91 is too long
      ✔ date columns are created DateOnly (not the UserLocal default)
      ✔ re-run against a provisioned environment creates nothing new
      ✔ validation errors stop the publish
      ✔ web resource bundle exposes Contoso.LoanForm.onLoad as a classic (non-module) script
      ℹ tests 38
      ℹ pass 38
    narration: >
      Thirty-eight tests with Node's built in test runner, no tenant needed. The form script runs against a small fake
      form context. One test pins the Lisbon time zone, because the day the clocks change only has twenty-three hours,
      and counting days by milliseconds gets it wrong. Another builds the bundle and checks the function name the form
      designer will call.

  - id: handler
    type: screen
    heading: "One handler in the designer"
    image: screens/form-handler.jpg
    video: screens/form-handler.mp4
    bar: "Power Apps · form designer · Loan main form · Events"
    demo: >
      Loan main form in the form designer, Events tab, On Load handler dialog: library contoso_/scripts/loanform.js,
      function Contoso.LoanForm.onLoad, "Pass execution context as first parameter" checked. Highlight the checkbox.
    narration: >
      In the form designer we register exactly one handler: On Load, calling contoso dot loan form dot on load, with
      pass execution context as first parameter checked. Forget that checkbox and there's no form context. The script
      attaches its own on change handlers, so the designer stays simple.

  - id: live
    type: screen
    heading: "A due date before the loan date"
    image: screens/due-date-error.jpg
    video: screens/due-date-error.mp4
    bar: "Model-driven app · Equipment Desk · New Loan"
    short: live
    demo: >
      Running app, New Loan. Loan date and due date were defaulted (today and plus fourteen days). Pick CT-0042 Laptop and
      alex.demo@contoso.com, then set the due date to a day before the loan date: the red notification "Due date can't be
      before the loan date." shows on the field. Press Save to show the save is blocked. Second capture
      (screens/overdue-banner.jpg) for the cutaway: an existing loan due three days ago showing the yellow banner
      "Overdue by 3 days. Contact the borrower."
    narration: >
      Now the real app. A new loan already has today's date and a due date two weeks out. Pick a device and a borrower,
      and the loan name fills itself. Set the due date before the loan date and the field shows an error. Try to save,
      and the platform blocks it. Open a loan that's three days late and the banner says so, before anyone has to ask.

  - id: licence
    type: bullets
    heading: "Before you ship"
    bullets:
      - "Users need a Power Apps premium licence to run it"
      - "Stricter licence checks for model-driven apps from February 2027"
      - "Grant the app to a security role, not to everyone"
      - "Unmanaged developer environments are being retired"
      - "Move it with the solution: managed in test and production"
    narration: >
      Before you ship. Every user needs a premium licence, and Microsoft has announced stricter checks for model-driven
      apps from February twenty twenty-seven. Grant the app to a security role. If you built
      this in a Developer Plan environment, note that unmanaged developer environments are being retired, so keep your
      work in a solution and move it as a managed solution to test and production.

  - id: recap
    type: bullets
    heading: "Five rules"
    bullets:
      - "Design the data model first; the app follows it"
      - "Decide date behaviour before you create the column"
      - "Create everything inside your own solution"
      - "Validate before you publish"
      - "Form scripts: formContext, pure rules, unit tests"
    narration: >
      Five rules. Design the data model first, the app follows it. Decide date behaviour before you create the column.
      Create everything inside your own solution. Validate before you publish. And write form scripts against the form
      context, with the rules in a pure module and real tests.

  - id: outro
    type: outro
    heading: "Code on GitHub, guides on devladlog.com"
    sub: "github.com/devladlog/mg-lab"
    narration: >
      The provisioning script, the form script and all thirty-eight tests are on GitHub, and the complete guide is on
      devladlog dot com. Links are in the description. Next time: canvas apps, on the same Dataverse tables. Subscribe so
      you don't miss it.
