scenes:
  - id: hook
    type: title
    heading: "Model-driven apps, for real"
    sub: "Data model from code, form logic in TypeScript, a real app"
    short: hook
    narration: >
      A model-driven app is only as good as the data model under it. In this episode we build one for real: two
      Dataverse tables and the app itself created from code, a form script in TypeScript with thirty-eight passing
      tests, and the running app, including the date bug that catches almost everyone. Welcome to DEVLADLOG Power Apps.

  - id: when
    type: bullets
    heading: "When is model-driven the right choice?"
    bullets:
      - "Your data lives in Dataverse and has relationships"
      - "Forms, views and navigation come from the data model"
      - "Security roles decide who sees the app and the rows"
      - "Canvas when the screen layout matters more than the data"
      - "Every user needs a Power Apps premium licence"
    narration: >
      First, when does model-driven make sense? When your data lives in Dataverse and has real relationships. Forms, views
      and navigation come from the data model. Security roles decide who sees the
      app. If the exact screen layout matters more, that's a canvas app, our next episode. And be clear about cost: every
      user who runs a model-driven app needs a Power Apps premium licence.

  - id: plan
    type: bullets
    heading: "What we're building: Equipment Desk"
    bullets:
      - "Equipment: asset tag, category, status, purchase date"
      - "Loan: equipment lookup, borrower, loan, due and return dates"
      - "A device with loan history can't be deleted"
      - "App module, site map, validate, publish: all from code"
      - "Form script: defaults, blocking errors, overdue banner"
    narration: >
      We're building Equipment Desk, an app for lending laptops, monitors and phones. Two tables: Equipment, and Loan,
      with a lookup to the device. A device with loan history can't be deleted, you retire it instead. The app module,
      site map, validation and publishing all happen from code. And the Loan form gets a script for defaults, errors and
      an overdue banner.

  - id: model
    type: code
    heading: "The model is plain data"
    lang: typescript
    code: |
      export const loan: TableDef = {
        schemaName: "contoso_Loan",
        displayName: "Loan",
        primaryName: { schemaName: "contoso_Name", displayName: "Loan", maxLength: 100 },
        columns: [   // displayName and description trimmed for the slide
          { kind: "string", schemaName: "contoso_BorrowerEmail", maxLength: 100, format: "Email", required: true },
          { kind: "date",   schemaName: "contoso_LoanDate",  required: true },
          { kind: "date",   schemaName: "contoso_DueDate",   required: true },
          { kind: "date",   schemaName: "contoso_ReturnedOn" },
          { kind: "memo",   schemaName: "contoso_Notes", maxLength: 2000 },
        ],
      };
    narration: >
      The model is plain TypeScript data: tables, columns, the lookup and the app, all with the contoso publisher
      prefix. Pure functions turn it into Web API payloads: entity definitions, attributes and a one to many relationship,
      in the exact shapes from the Microsoft Learn articles. A test fails if any schema name is missing the prefix.

  - id: dates
    type: code
    heading: "The date bug that catches everyone"
    lang: typescript
    short: gotcha
    code: |
      case "date":
        // Without DateTimeBehavior the column is created as UserLocal, and a "date only"
        // value can then show as the previous day for users in another time zone.
        return {
          "@odata.type": "Microsoft.Dynamics.CRM.DateTimeAttributeMetadata",
          AttributeType: "DateTime",
          ...common,
          Format: "DateOnly",
          DateTimeBehavior: { Value: "DateOnly" },
        };
    narration: >
      Here's the gotcha. If you don't set a behaviour, Dataverse creates date columns as user local, even when the
      format is date only. Microsoft's own docs warn that users in another time zone can then see a different day. A
      due date that moves by a day is a real bug. So every date column is created with date only behaviour, and you
      decide this up front, because once a column is date only you can't change it back.

  - id: provision
    type: code
    heading: "The app module, from code"
    lang: typescript
    code: |
      const appId = appRow?.appmoduleid
        ?? (await dv.request("POST", "appmodules", appModulePayload(model.app), inSolution)).entityId!;

      await dv.request("POST", "AddAppComponents", {
        AppId: appId,
        Components: [
          { "@odata.type": "Microsoft.Dynamics.CRM.sitemap", sitemapid: sitemapId },
          ...tableNames.map((t) => ({ "@odata.type": "Microsoft.Dynamics.CRM.entity", entityid: tableIds.get(t) })),
        ],
      });
      const validation = (await dv.request("GET", `ValidateApp(AppModuleId=${appId})`)).body?.AppValidationResponse;
      // errors? stop. Otherwise: PublishXml for the tables and the app
    narration: >
      The app follows the documented sequence: create the app module, add the site map and both tables with Add App
      Components, run Validate App, which is the same check as the Validate button in the designer, and only publish if
      there are no errors. Every write carries the solution unique name header, so everything lands in our solution,
      ready for A L M.

  - id: dryrun
    type: code
    heading: "Dry run first, every step idempotent"
    lang: text
    code: |
      $ npm run plan
      GET   publishers?$select=publisherid,customizationprefix&$filter=uniquename eq 'contoso'
      POST  publishers
      POST  solutions
      POST  EntityDefinitions  [solution EquipmentDesk]
      POST  EntityDefinitions(LogicalName='contoso_equipment')/Attributes  [solution EquipmentDesk]
      ...
      POST  RelationshipDefinitions  [solution EquipmentDesk]
      POST  appmodules  [solution EquipmentDesk]
      POST  sitemaps  [solution EquipmentDesk]
      POST  AddAppComponents
      GET   ValidateApp(AppModuleId=...)
      POST  PublishXml

      39 requests, 19 writes (dry run: nothing sent)
    narration: >
      Before touching an environment, the dry run prints every request: thirty-nine in total, nineteen of them writes.
      Each step checks first and only creates what's missing, so running it twice creates nothing new, and there's a
      test for exactly that.

