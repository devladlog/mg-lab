linkedin_company:
  text: |
    You unpack a solution as unmanaged, as Microsoft's unpack task recommends, then ask pac for a managed package. It stops with "Solution package type did not match requested type."

    Episode 9 of DEVLADLOG Power Apps gives a fictional Contoso equipment app a path from development to test to production, with no clicking in production.

    - An export pipeline that exports twice, unpacks as Both and pushes a branch for review
    - A build that lints the source, stamps the version, packs unmanaged and managed zips and runs the solution checker
    - Deployment settings where configuration is written down and connection identifiers are tokens filled from a variable group
    - TEST deploys first, PRODUCTION waits for an approval
    - 84 tests, including the real pac command line, run offline

    The gotcha: a source unpacked as unmanaged cannot be packed as managed. Export both, unpack as both, and one folder packs both zips.

    Watch the episode: {YOUTUBE_URL}
    Code and tests: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.
    #PowerPlatform #ALM #AzureDevOps #PowerApps
linkedin_personal:
  text: |
    This one cost me a while. Microsoft's unpack task recommends unmanaged. I unpacked that way, asked pac for a managed package, and got "Solution package type did not match requested type." The solution file says Managed 0.

    In the ninth DEVLADLOG Power Apps episode the export pipeline exports twice and unpacks as Both, so the same folder packs both zips. Two tests keep it honest. The lesson: decide the managed and unmanaged story at export time, because you cannot fix it at pack time.

    {YOUTUBE_URL}

    #PowerPlatform #ALM
    Narration uses an AI voice.
