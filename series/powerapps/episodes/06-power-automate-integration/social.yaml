linkedin_company:
  text: |
    Most Power Apps that call a flow pass the email address, the subject and the body text. Microsoft's own docs warn that those arguments travel as network traffic and can be intercepted and changed.

    Episode 6 of DEVLADLOG Power Apps turns a copy-reminder button into a cloud flow where the app sends exactly one thing: a loan id.

    - Power Apps (V2) trigger with a single typed input
    - The flow reads the loan from Dataverse and decides whether a reminder is allowed: not returned, overdue, a contoso.com address
    - Every path ends in a Respond to a Power App action with the same outputs
    - Both connections set to provided by the run-only user, so the flow only reads what the person who tapped can read
    - The flow kept as code and deployed into the solution, with 44 tests

    The gotcha: "overdue" needs a time zone. Late in the evening UTC, Lisbon is already on the next day.

    Watch the episode: {YOUTUBE_URL}
    Code and tests: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.
    #PowerAutomate #PowerApps #Dataverse #PowerPlatform
linkedin_personal:
  text: |
    A flow that checks "is this loan overdue" with utcNow() is wrong for part of every day. At half past eleven at night in July, Lisbon is already on the next day, so a loan due that day is overdue there but not in UTC. Convert from UTC to the office time zone before you compare dates.

    That is one of the checks in the sixth DEVLADLOG Power Apps episode, where the app sends the flow only a loan id and the flow decides everything else. A test named for exactly this boundary keeps it fixed. The lesson: never let the app choose who gets the email, and never trust UTC for a business date.

    {YOUTUBE_URL}

    #PowerAutomate #PowerApps
    Narration uses an AI voice.
facebook:
  text: |
    Should your app tell a flow who to email? In this DEVLADLOG Power Apps episode the phone app sends only a loan id. The flow reads the loan from Dataverse, refuses anything that should not get a reminder, sends the email and answers back to the app.

    We also cover whose connection runs the flow and a time zone boundary that makes "overdue" wrong for a few hours a day. Fictional Contoso data throughout.

    Watch it here: {YOUTUBE_URL}

    #PowerAutomate #PowerApps
    Narration uses an AI voice.
