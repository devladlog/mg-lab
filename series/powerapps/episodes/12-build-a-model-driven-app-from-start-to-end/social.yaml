  - id: gotcha
    youtube_short_title: "Power Fx gotcha: a text with only spaces is not blank #Shorts"
    instagram_reel:
      caption: |
        The reject command first checked that reviewer notes were not blank. But a text containing only spaces is not blank in Power Fx, so a reviewer could reject with a single space.

        The fix is to Trim first, and there is a test for exactly that. Run it without the trim and it fails.

        Full episode: link in bio
        #PowerApps #PowerFx #Dataverse
      cover_text: "Is a space blank?"
    tiktok:
      caption: "Power Fx gotcha: a text with only spaces is not blank. Use IsBlank(Trim(...)) before you allow a reject. #PowerApps #PowerFx #Dataverse"
  - id: sam
    youtube_short_title: "Test Dataverse column security as a normal user, not as admin #Shorts"
    instagram_reel:
      caption: |
        We test as Sam Demo, a normal user, not an administrator. On a submitted inspection the Review tab shows the reviewer notes. Remove Sam from the field security profile and reload: the column shows a lock and the value is hidden.

        A system administrator always sees secured columns, so testing as admin proves nothing.

        Full episode: link in bio
        #PowerApps #Dataverse #PowerPlatform
      cover_text: "Test as Sam, not admin"
    tiktok:
      caption: "Admins always see secured columns, so testing as admin proves nothing. Test with a normal user, then remove the profile and reload. #PowerApps #Dataverse #PowerPlatform"
