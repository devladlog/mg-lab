linkedin_company:
  text: |
    A reviewer who works through fifty inspections a day wants lists, filters and keyboard speed, not a custom layout. That is the case for a model-driven app on the back office side.

    Episode 12 of DEVLADLOG Power Apps is a long-form build special: Inspection Back Office, from an empty app to a solution, on the same Dataverse tables as the canvas app in episode 11.
    - Forms, views, a dashboard and a business process flow
    - Business rules, with the scope picked on purpose
    - Command bar buttons written in Power Fx, plus a custom page for the review board
    - Security roles and a secured column, tested as a normal user instead of an admin

    The episode is open about its limits: the generated solution packs and unpacks offline but was not imported into a tenant, and the designer results come from the recording.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #PowerApps #PowerPlatform #Dataverse #PowerFx #ModelDrivenApps
linkedin_personal:
  text: |
    A system administrator always sees secured columns, so testing security as admin proves nothing. In episode 12 I test the model-driven app as Sam Demo, a normal back office user. The reviewer notes show on the Review tab. Remove Sam from the field security profile, reload, and the column shows a lock.

    Test with the least privileged account that should work, then with one that should not.

    Episode 12 of DEVLADLOG Power Apps: {YOUTUBE_URL}

    Narration uses an AI voice.

    #PowerApps #Dataverse #PowerPlatform
