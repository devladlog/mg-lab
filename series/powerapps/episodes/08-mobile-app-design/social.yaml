linkedin_company:
  text: |
    Turn the phone sideways and your canvas app scrolls, even though everything fits. The default screen height formula is the cause.

    Episode 8 of DEVLADLOG Power Apps reworks the open loans screen of a fictional Contoso equipment app for real phone use.

    - Orientation: Learn's own example, a screen designed at 640 x 1136, gets 1136 as its height when the phone is sideways, so the app scrolls on a 640 unit screen
    - One pane upright, two panes side by side when there is room, with Learn's phone breakpoints written out
    - Touch targets of at least 88 phone units, checked by a test
    - Offline-first Dataverse with a connection banner, and a barcode scan for asset tags with a typed fallback
    - 112 tests that run the real formulas at different screen sizes

    The gotcha: Power Automate flows are not supported in offline mode, so the send-reminder button is disabled offline and says why.

    Watch the episode: {YOUTUBE_URL}
    Code and tests: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.
    #PowerApps #CanvasApps #MobileApps #PowerPlatform
linkedin_personal:
  text: |
    A button that runs a cloud flow looks fine in the office and fails in the storeroom. Microsoft's mobile offline limitations say Power Automate flows are not supported in offline mode.

    In the eighth DEVLADLOG Power Apps episode the send-reminder button is disabled without a connection and says why, while mark returned is a plain patch that works offline and syncs later. A lint fails if any flow call is not behind a connection check. The lesson: when you add offline, list every action that needs a server and decide what the user sees for each one.

    {YOUTUBE_URL}

    #PowerApps #PowerAutomate
    Narration uses an AI voice.
