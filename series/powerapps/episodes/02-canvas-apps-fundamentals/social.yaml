linkedin_company:
  text: |
    Your canvas app says "Loan saved", the user goes back to the list, and then an error appears. Two writes, one chain, and the second failure came too late.

    Episode 2 of DEVLADLOG Power Apps builds a phone app for a fictional Contoso equipment desk and runs its formulas in 52 automated tests on Microsoft's open source Power Fx engine.

    - Gallery formulas written so Dataverse can delegate them
    - Named formulas instead of variables set in OnStart
    - One label holds every validation rule, and the Lend button simply checks whether it is empty
    - The app kept as pa.yaml source, so the formulas can be tested outside Studio

    The gotcha: inside IfError, a chain separated by semicolons does not stop at the first error. The fix is one IfError pair per write, and one test found the bug before users did.

    Watch the episode: {YOUTUBE_URL}
    Code and tests: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.
    #PowerApps #PowerFx #CanvasApps #Dataverse #PowerPlatform
linkedin_personal:
  text: |
    My first Lend button chained a Collect, a Patch, a Notify and a Back inside one IfError. When the device update failed, the user saw "Loan saved", went back, and only then saw an error. Microsoft's docs say it plainly: in a chain, the second Patch is attempted even if the first one fails.

    I only found it because the formulas run in 52 tests on the open source Power Fx interpreter, and one test simulated a missing privilege. The fix is one IfError pair per write. The lesson: never trust a semicolon chain to stop on an error.

    {YOUTUBE_URL}

    #PowerFx #PowerApps
    Narration uses an AI voice.
