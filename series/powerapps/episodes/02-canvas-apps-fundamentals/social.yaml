- id: delegation
  youtube_short_title: 'Canvas app delegation in 30 seconds #Shorts'
  instagram_reel:
    caption: |
      When a query is delegated, Dataverse runs it and you get every match. When any part cannot be delegated, Power Apps processes only the first 500 rows and just shows a warning. Raising the limit to 10,000 only hides the problem. On Dataverse, wrapping a column in Text, Len or Trim breaks delegation. Microsoft's tip: set the data row limit to 1 while you test.

      Full episode: link in bio

      #PowerApps #Dataverse #PowerPlatform
    cover_text: DELEGATION IN 30 SEC
