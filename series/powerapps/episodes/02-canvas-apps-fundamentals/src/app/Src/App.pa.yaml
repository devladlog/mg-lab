# Equipment Desk (phone) - canvas app on the Dataverse tables from episode 1.
# Hand-written in the Power Apps source code format (schema v3.0). Control versions are omitted on purpose:
# Learn: "If no version is specified, the most current version of the control is used."
App:
  Properties:
    StartScreen: =BrowseScreen
    # Named formulas: declared once, recalculated automatically, no OnStart needed.
    Formulas: |-
      =DefaultLoanDays = 14;
      MaxLoanDays = 90;
