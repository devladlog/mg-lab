linkedin_company:
  text: |
    One team calling one model deployment is a demo. Ten teams sharing it is a platform.

    Episode 2 of DEVLADLOG AI builds the AI gateway pattern in Azure API Management, as code:

    - Both Azure OpenAI accounts keyless: local auth disabled, only the gateway's managed identity can call the model
    - One subscription and one token budget per team: over the minute limit returns 429, over the monthly quota returns 403
    - Primary and secondary region behind circuit breakers that accept 429
    - Token metrics by subscription in Application Insights
    - 37 tests that run before anything is deployed, including a Bicep compile

    The gotcha: the OpenAI SDK retries a 429 twice by default, so a gateway retry behind it can turn one call into nine. Retry in one place.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.
    #AzureOpenAI #APIManagement #AzureAI #Bicep
linkedin_personal:
  text: |
    A team's quota got burned by one chatty app, and everyone else paid for it. That is the problem an AI gateway solves, so I built one in Bicep for the second DEVLADLOG AI episode.

    The part that surprised me: the OpenAI SDK retries a 429 twice by default. Put a gateway retry of two behind it and one click can become nine calls to the model, all counting against your quota. The test in the repo proves one call becomes three requests.

    Retry in one place. Ours is the gateway.

    {YOUTUBE_URL}

    #AzureOpenAI #AzureAI
    Narration uses an AI voice.
