linkedin_company:
  text: |
    A model that never flags a single ticket can be about 87 percent accurate. So when someone shows you a machine learning score, what are they actually showing you?

    Episode 16 of DEVLADLOG AI trains a classic model on a fictional Contoso service desk, will this ticket breach its SLA, and checks one pitfall at a time whether its number can be believed.

    - An audit that flags a leaked column: the first response time is only known after the ticket is picked up
    - A no-skill baseline next to logistic regression, judged on AUC and average precision, not accuracy
    - Preprocessing inside the pipeline, so nothing is learned from test data
    - Group splits that hold out employees, not rows
    - A decision threshold chosen from costs, and a verdict against flag-nothing and flag-everything

    The data is synthetic with planted traps, so the process is the point.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.
    #MachineLearning #DataScience #scikitlearn #AzureAI
linkedin_personal:
  text: |
    A model that never flags a single ticket can be about 87 percent accurate.

    That is how I opened the machine learning fundamentals episode of DEVLADLOG AI. The data is synthetic with traps I planted: rare positives, a column from the future, and employees who file many tickets. With the leaky column the score looks brilliant. Keep the employee identifier and random rows and it is still flattering. Hold out whole people and you see what the model really does.

    An unusually high score is usually a leak, not a triumph.

    {YOUTUBE_URL}

    #MachineLearning #AzureAI
    Narration uses an AI voice.
