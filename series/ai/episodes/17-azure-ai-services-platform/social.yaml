linkedin_company:
  text: |
    Sixteen episodes into this series, every episode created its own Azure resource. That works for a demo. It is not how you run it.

    Episode 17 of DEVLADLOG AI gives a fictional Contoso service desk one Foundry resource, one identity, and a way to see who calls what.

    - One AI Services resource, custom subdomain, local authentication disabled, logs to Log Analytics, all in Bicep
    - The surprise: the subscription Owner gets four 403s. Owner and Contributor carry management permissions only, so a keyless call needs a data role
    - A probe that calls four services with the same identity and shows status, time and answer for each
    - An audit whose rules say whether they come from Learn or from our own policy
    - Usage from Azure Monitor metrics, and a retirement scanner pointed at the earlier episodes of this series

    The gotcha: a green platform is not a good model. The probe proves a service answers, not that it answers well.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.
    #AzureAI #AzureAIFoundry #Entra #AzureMonitor
linkedin_personal:
  text: |
    I was the subscription Owner, the most powerful role there is, and all four calls to Azure AI services came back 403.

    In the platform episode of DEVLADLOG AI the resource has local authentication disabled. Learn is explicit: Owner and Contributor carry management permissions only, not the data permissions. Without a data role, a keyless call is refused, however senior the caller is. Assign the data plane role, wait about five minutes, and the same command works.

    Nothing is broken, that is just how Entra-only access behaves.

    {YOUTUBE_URL}

    #AzureAI #Entra
    Narration uses an AI voice.
