  - id: gotcha
    type: code
    heading: "The gotcha: 'contains' is not 'equals'"
    lang: text
    code: |
      Built-in rule:  model.assetId  contains  allowedAssetId
      Learn: ".../models/gpt-5" also matches GPT-5.2 and GPT-5.4

      too broad:  azureml://registries/azure-openai/models/gpt-5
      one model:  azureml://registries/azure-openai/models/gpt-5/
      one version: azureml://registries/azure-openai/models/gpt-5-mini/versions/2025-08-07

      allowedPublishers: ["OpenAI"]  ->  every OpenAI model passes
      Policy needs ~15 minutes after assignment; compliance scans can take up to 24 hours
    short: gotcha
    narration: >
      Here's the honest gotcha. The approved models policy matches asset IDs with contains, not equals. Learn's own
      example: allow G P T five without a trailing slash and you've also allowed five point two and five point four.
      Pin the full version. Leave publishers empty, or you approve a whole vendor. And give a new assignment fifteen
      minutes before you test it.

  - id: compliance-manager
    type: screen
    heading: "Where the compliance officer works"
    image: screens/compliance-manager.jpg
    bar: "Microsoft Purview · Compliance Manager"
    demo: "Purview portal (lab tenant, masked): Compliance Manager > Regulations, 'Premium AI templates' header visible with EU Artificial Intelligence Act; then the new assessment 'HR assistant: EU AI Act' > an improvement action > Evidence tab > Add evidence > Document, uploading reports/evidence-hr-bot.txt, which then appears in the evidence list."
    narration: >
      The compliance officer doesn't read our terminal. They work in Purview Compliance Manager, which has premium
      templates for the E U A I Act, ISO forty two thousand and one and the NIST A I risk framework. We create the
      assessment and attach our report as evidence on an improvement action. One gotcha: the evidence tab takes
      text files, not markdown, so the report is saved as dot t x t.
    # TODO after recording: name the improvement action the report was attached to.

  - id: tests
    type: code
    heading: "30 tests, no cloud needed"
    lang: text
    code: |
      $ python -m pytest tests -q
      ..............................                       [100%]
      30 passed

      test_register.py             every register problem reported at once
      test_arm_inventory.py        real azure-core pipeline: token scope, api-versions, paging
      test_controls_and_evidence.py  each control fails on its own violation; shadow AI; CLI exit codes
      test_bicep.py                built-in policy IDs, effects, exact-version asset IDs
    narration: >
      Thirty tests run locally. Every control is proven to fail on its own violation, from a key left on to a stale
      responsible AI gate. The ARM calls go through the real Azure core pipeline against canned responses, so
      tokens, A P I versions and paging are tested without a subscription.

  - id: recap
    type: bullets
    heading: "Five rules for AI governance"
    bullets:
      - "Register every AI system, in the repo"
      - "Deny what must never happen, with Azure Policy"
      - "Pin model versions and approve them by exact ID"
      - "Hunt for unregistered AI resources"
      - "Ship evidence, not slides"
    narration: >
      Five rules. Register every AI system, in the repo. Deny what must never happen with Azure Policy. Pin model
      versions and approve them by exact ID. Hunt for AI resources nobody registered. And ship evidence, not
      slides. When the auditor asks, you run one command and hand over the report.

