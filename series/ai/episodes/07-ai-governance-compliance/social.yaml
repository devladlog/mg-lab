linkedin_company:
  text: |
    Your compliance officer asks three questions. What AI do we run? Who owns it? Can you prove the controls are on? If the answer is a spreadsheet someone updated in March, you do not have governance.

    Episode 7 of DEVLADLOG AI builds it as code, for four fictional Contoso AI systems.

    - A register in the repository: owner, internal impact tier, approved models with pinned versions, human oversight
    - Azure Policy that denies keyed AI resources and unapproved model deployments
    - An evidence pack that compares the register with what Azure actually runs: eleven controls, a report and an exit code for your pipeline
    - Shadow AI detection: a resource with no registered owner is always a fail

    The gotcha: the approved models policy matches with contains, not equals. Allow GPT-5 without the full version and you have also allowed 5.2 and 5.4.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.
    #AIGovernance #AzurePolicy #AzureAI #Compliance
linkedin_personal:
  text: |
    An Azure Policy detail from the AI governance episode of DEVLADLOG AI that could bite you: the approved models policy matches asset IDs with contains, not equals.

    Learn's own example: allow GPT-5 without a trailing slash and you have also allowed 5.2 and 5.4. So pin the full model version, and leave the publisher list empty or you approve a whole vendor.

    The bigger idea is three layers that do not trust each other: a register in the repo, policy that blocks mistakes, and an evidence pack that checks what is really running.

    {YOUTUBE_URL}

    #AIGovernance #AzureAI
    Narration uses an AI voice.
