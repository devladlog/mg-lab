- id: rrf
  youtube_short_title: 'How hybrid search merges two rankings: reciprocal rank fusion #Shorts'
  instagram_reel:
    caption: |
      How does hybrid search merge two rankings with completely different scores? Reciprocal rank fusion. Each document gets one over its rank plus sixty from every list it appears in, and the scores are added. A chunk that is second in both lists beats a chunk that is first in only one.

      Full episode: link in bio

      #AzureAISearch #HybridSearch #AzureAI
    cover_text: RECIPROCAL RANK FUSION
  tiktok:
