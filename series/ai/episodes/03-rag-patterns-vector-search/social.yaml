linkedin_company:
  text: |
    Most RAG bots answer confidently, and nobody can tell whether the answer came from the handbook or from the model's imagination.

    Episode 3 of DEVLADLOG AI builds retrieval augmented generation that can be measured and has to show its sources, on a fictional Contoso HR handbook.

    - Chunk by section, about 512 tokens with 25% overlap, titles kept in every chunk
    - One Azure AI Search index with text and vectors, no keys
    - Four retrieval modes compared on 16 labelled questions: keyword, vector, hybrid, hybrid plus semantic ranker
    - Numbered citations that code checks, and a fixed sentence when the handbook has no answer

    The gotcha: search never says no. Ask about company cars and you still get five chunks. Make refusal a tested outcome.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.
    #RAG #AzureAISearch #AzureOpenAI #AzureAI
linkedin_personal:
  text: |
    The most useful RAG lesson I have taken from building the third DEVLADLOG AI episode: search never says no.

    Ask the HR bot about the company car policy and Azure AI Search still returns the top five chunks, because ranking only orders what exists. If the prompt gives the model no way out, it builds an answer from whatever came back.

    So refusal is an explicit, tested outcome, with one fixed sentence, and citations are checked in code. Then I measured four retrieval modes on 16 labelled questions instead of picking one by feel.

    {YOUTUBE_URL}

    #RAG #AzureAI
    Narration uses an AI voice.
