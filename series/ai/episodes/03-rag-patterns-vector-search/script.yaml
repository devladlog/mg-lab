  - id: hook
    type: title
    heading: "Your bot read the handbook. Prove it."
    sub: "RAG with Azure AI Search, measured"
    short: hook
    narration: >
      Every company wants a chatbot that answers from its own documents. Most of them answer confidently, and nobody
      can tell whether the answer came from the handbook or from the model's imagination. Today we build retrieval
      augmented generation that we can measure, and that has to show its sources. Welcome to DEVLADLOG AI.

  - id: problem
    type: bullets
    heading: "The HR bot from episode two needs facts"
    bullets:
      - "Answer only from the Contoso HR handbook"
      - "Find the right section, whatever words people use"
      - "Cite a source for every claim"
      - "Say so when the handbook has no answer"
      - "Compare retrieval options with numbers, not vibes"
    narration: >
      Remember the hr bot team behind our gateway in episode two? Their bot now has to answer from the fictional
      Contoso HR handbook. It must find the right section whatever words people use, cite a source for every claim,
      say so when the handbook has no answer, and we want numbers to compare retrieval options, not vibes.

  - id: arch
    type: diagram
    heading: "The pipeline"
    nodes: ["Docs", "Chunks", "Index", "Answer"]
    labels: ["HR handbook (.md)", "by section", "text + vectors", "with citations"]
    narration: >
      The pipeline has four stops. Markdown documents are split into chunks by section. Each chunk is embedded and
      pushed into an Azure AI Search index that holds both text and vectors. At question time we retrieve the best
      chunks, and the model answers from them, with numbered citations we can check.

  - id: chunking
    type: code
    heading: "Chunk by section, keep the context"
    lang: python
    code: |
      def chunk_markdown(markdown, source, max_chars=MAX_CHARS, overlap=OVERLAP):
          title, sections = split_sections(markdown)
          chunks = []
          for heading, body in sections:
              prefix = f"{title} > {heading}" if heading != title else title
              budget = max_chars - len(prefix) - 2
              for part, piece in enumerate(split_long(body, budget, min(overlap, budget // 2 - 1))):
                  chunks.append(Chunk(
                      id=f"{slugify(source)}-{slugify(heading)}-{part}",
                      section_key=f"{source}#{slugify(heading)}",
                      content=f"{prefix}\n\n{piece}", ...))
          return chunks
    narration: >
      One chunk per section. A long section is split on sentence boundaries, using the starting point Microsoft
      Learn recommends: about five hundred twelve tokens, roughly two thousand characters, with twenty five percent
      overlap. Every chunk starts with its document and section title, so it still makes sense on its own.

  - id: index
    type: code
    heading: "One index, text and vectors, no keys"
    lang: python
    code: |
      SearchField(
          name="content_vector",
          type=SearchFieldDataType.Collection(SearchFieldDataType.Single),
          searchable=True, hidden=True,
          vector_search_dimensions=1536,
          vector_search_profile_name=VECTOR_PROFILE,
      )
      AzureOpenAIVectorizer(
          vectorizer_name=VECTORIZER,
          parameters=AzureOpenAIVectorizerParameters(
              resource_url=aoai_endpoint, deployment_name=embedding_deployment,
              model_name="text-embedding-3-small",
              # no api_key, no auth_identity -> the search service's managed identity
          ),
      )
    narration: >
      The index has searchable text fields and one vector field with fifteen thirty six dimensions, the size of text
      embedding three small. The vectorizer lets the search service embed the question itself. With no key and no
      identity set, it uses the service's own managed identity, which our Bicep gives the Open A I User role.

  - id: modes
    type: code
    heading: "Four retrieval modes, one function"
    lang: python
    code: |
      kwargs = {"select": SELECT, "top": top}
      if mode in ("keyword", "hybrid", "hybrid_semantic"):
          kwargs["search_text"] = question
      if mode in ("vector", "hybrid", "hybrid_semantic"):
          kwargs["vector_queries"] = [VectorizableTextQuery(
              text=question, k_nearest_neighbors=k, fields=VECTOR_FIELD)]
      if mode == "hybrid_semantic":
          kwargs["query_type"] = "semantic"
          kwargs["semantic_configuration_name"] = SEMANTIC_CONFIG
      return kwargs
    narration: >
      Here are the four ways to ask. Keyword is classic full text search with B M twenty five. Vector sends the
      question as text and lets the vectorizer embed it. Hybrid sends both in one request. And hybrid semantic adds
      the semantic ranker, which re-ranks the fused results with a language model.

  - id: rrf
    type: code
    heading: "How hybrid merges two rankings"
    lang: python
    code: |
      def rrf(ranked_lists, k=60, weights=None):
          for ranked, weight in zip(lists, weights):
              for rank, doc_id in enumerate(ranked, start=1):
                  scores[doc_id] += weight / (rank + k)
          return sorted(scores.items(), key=...)

      def test_document_good_in_both_lists_beats_first_in_one():
          keyword = ["exp-4", "meals", "mileage"]
          vector = ["flights", "meals", "carry-over"]
          assert rrf([keyword, vector])[0][0] == "meals"
    short: rrf
    narration: >
      How does hybrid merge two rankings with completely different scores? Reciprocal rank fusion. Each document
      gets one over its rank plus sixty from every list it appears in, and the scores are added. So a chunk that is
      second in both lists beats a chunk that is first in only one. The service does this for you; this test just
      makes it visible.

