  - id: answer-code
    type: code
    heading: "Citations you can check"
    lang: python
    code: |
      def check_citations(text, hits, finish_reason="stop"):
          if text.strip() == NOT_FOUND:
              return Answer(text, not_found=True, grounded=True, finish_reason=finish_reason)
          numbers = [int(n) for n in _CITATION.findall(text)]
          valid = sorted({n for n in numbers if 1 <= n <= len(hits)})
          invalid = sorted({n for n in numbers if not 1 <= n <= len(hits)})
          grounded = bool(valid) and not invalid and finish_reason == "stop"
          return Answer(text, [hits[n - 1] for n in valid], invalid, False, grounded, finish_reason)
    narration: >
      The model sees the retrieved chunks numbered one to five inside delimiters, and must cite a number after every
      fact, or reply with one fixed sentence. Then code checks the answer. A citation to a source we never sent, no
      citation at all, or a truncated answer means it is not grounded, and the app can refuse to show it.

  - id: answer
    type: screen
    heading: "An answer with its sources"
    image: screens/answer.jpg
    video: screens/answer.mp4
    bar: "Terminal · python -m hrrag.answer"
    demo: "Terminal: PYTHONPATH=src python -m hrrag.answer \"If I don't use all my vacation this year, can I keep some days?\" ... showing the answer with [n] citations, the five sources with scores and reranker scores, the cited ones marked with *, and grounded=True."
    narration: >
