    type: code
    heading: "38 tests, no cloud needed"
    lang: text
    code: |
      $ python -m pytest tests -q
      ......................................                 [100%]
      38 passed

      test_search_sdk.py         real Azure Search SDK vs a local stub:
                                 index PUT, mergeOrUpload, hybrid + semantic body
      test_embeddings_and_answer real OpenAI SDK: batching, citations, refusals
      test_bicep.py              keyless search + OpenAI, search identity role
      test_chunking.py           every labelled section exists in the handbook
    narration: >
      Thirty eight tests run in seconds without any cloud resource. The real Azure Search and Open A I SDKs run
      against local stubs, so we check the exact request bodies. The Bicep is compiled and checked for keyless
      services, and the evaluation set is checked against the handbook itself.

  - id: recap
    type: bullets
    heading: "Five rules for RAG"
    bullets:
      - "Chunk by structure, keep titles in every chunk"
      - "Same embedding model at index and query time"
      - "Hybrid plus semantic ranker, then measure it"
      - "Number the sources, check every citation in code"
      - "Make 'not in the handbook' a tested answer"
    narration: >
      Five rules. Chunk by structure and keep titles in every chunk. Use the same embedding model at index time and
      query time. Start with hybrid plus the semantic ranker, then measure it on your own questions. Number the
      sources and check every citation in code. And make not in the handbook a tested answer.

