    demo: "Terminal: PYTHONPATH=src python -m hrrag.answer \"What is the company car policy?\" ... showing the fixed sentence 'I can't find that in the Contoso HR handbook.', the five unrelated sources, and not_found=True."
    narration: >
      Now a question the handbook can't answer: the company car policy. Five chunks still come back, as you can see,
      but none of them is about cars, and the model replies with the fixed sentence instead of inventing a policy.
    # TODO after recording: this narration assumes the recorded run printed not_found=True; if the model answered
    # anyway, keep the take and say so (it is exactly the gotcha), and tighten the system prompt in answer.py.

  - id: gotcha
    type: code
    heading: "The gotcha: search never says no"
    lang: python
    code: |
      def test_retrieval_always_returns_something_even_out_of_scope(local_index):
          # Retrieval has no notion of "no answer": the answer step must refuse, not the search.
          assert len(local_index.search("What is the company car policy?", "hybrid", 5)) == 5

      def test_no_hits_means_no_model_call(stub_server):
          result = answer(aoai(stub_server), "anything", [], deployment="chat", model="gpt-5-mini")
          assert result.not_found and stub_server.requests == []
    short: gotcha
    narration: >
      Here is the honest gotcha. Search never says no. Ask about company cars and you still get the top five chunks,
      because ranking only orders what exists. If your prompt doesn't give the model a way out, it will build an
      answer from whatever came back. Make refusal an explicit, tested outcome, and check citations in code.

