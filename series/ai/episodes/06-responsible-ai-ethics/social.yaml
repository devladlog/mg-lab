status: draft-hold-for-review
ai_label: true
youtube_url: '{YOUTUBE_URL}'
linkedin_company:
  text: |
    Responsible AI usually arrives as a slide with six principles. Slides do not stop a bad release. Tests do.

    Episode 6 of DEVLADLOG AI turns the principles into a release gate for a fictional Contoso HR bot, run against real Azure services.

    - Guardrail policy for the model deployment defined in Bicep
    - Azure AI Content Safety: Prompt Shields on the question and every retrieved document
    - A poisoned document is dropped, a prompt attack is blocked, a self-harm signal is escalated to a person
    - A red team set with attacks and with real HR questions that only look risky, so over-blocking is measured too
    - A fairness probe that changes only the name, and a report with a named owner

    The gotcha: the Content Safety Python SDK defaults to an API version Learn lists as deprecated, so pin it yourself.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.
    #ResponsibleAI #ContentSafety #AzureAI #PromptShields
linkedin_personal:
  text: |
    One decision in the responsible AI episode of DEVLADLOG AI I keep thinking about: a self-harm signal is not blocked, it is escalated to a person.

    Blocking someone who tells you they are struggling is a harm too. So the guard has three outcomes, not two: drop a poisoned document, block an attack, hand distress to a human.

    The release gate also measures over-blocking, with real HR questions that only look risky, and writes a report with a named owner. A gate that cannot fail is not a gate, so the tests make it fail on purpose.

    {YOUTUBE_URL}

    #ResponsibleAI #AzureAI
    Narration uses an AI voice.
