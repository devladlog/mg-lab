    demo: "Azure portal, the workspace in rg-mglab-ai-08 > Logs, KQL: AppTraces | where Message == \"triage\" | summarize n=count() by window=tostring(Properties[\"hr_window\"]), lang=tostring(Properties[\"hr_lang\"]) | order by window — results table (and optionally the column chart) showing English and Portuguese counts per window. Resource names masked."
    narration: >
