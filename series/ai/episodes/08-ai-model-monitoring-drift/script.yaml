scenes:
  - id: hook
    type: title
    heading: "The model didn't change"
    sub: "Your users did"
    short: hook
    narration: >
      The HR bot passed every test before release. Then Contoso launched a hybrid work allowance and opened an
      office in Porto. Same model, same prompt, different questions. Today we build the monitoring that notices,
      before the users do. Welcome to DEVLADLOG AI.

  - id: four
    type: bullets
    heading: "Four things people call drift"
    bullets:
      - "Input drift: who asks, and how"
      - "Prediction drift: what the bot answers"
      - "Quality: whether the answers are still right"
      - "Model version: which model actually answered"
    narration: >
      Drift is four different problems. The inputs change: new topics, another language. The predictions change:
      different categories. The quality changes: answers get worse. And the model itself can change under you. Each
      one needs its own signal, and you need all four. An LLM app has no feature table, so we build these signals
      ourselves from the bot's own telemetry.

  - id: pipeline
    type: diagram
    heading: "From one call to one alert"
    nodes: ["Triage", "Telemetry", "Log Analytics", "Monitor", "Alert"]
    labels: ["gpt-5-mini", "OpenTelemetry", "AppTraces", "PSI + golden set", "Azure Monitor"]
    narration: >
      Every triage call writes one structured record through OpenTelemetry to Application Insights. A monitor reads
      two windows back from Log Analytics, computes drift and quality, and writes a report record. An Azure Monitor
      alert rule watches for that report. Everything is keyless and deployed from one Bicep file, so the whole lab
      goes away with one command at the end.

  - id: record
    type: code
    heading: "One record per call, no question text"
    lang: python
    code: |
      for q in questions:
          feats = input_features(q["question"])
          try:
              t = triage(client, deployment, q["question"])
          except Exception as e:
              failures += 1
              sink("triage_error", telemetry.attributes(window, error=type(e).__name__, **feats))
              continue
          sink("triage", telemetry.attributes(
              window, **feats, category=t.category, urgency=t.urgency, needs_human=t.needs_human, model=t.model,
              latency_ms=t.latency_ms, prompt_tokens=t.prompt_tokens, completion_tokens=t.completion_tokens))
    narration: >
      Here's the record. Input features are computed locally: a language hint and a length bucket. Then the model's
      answer, the model version that actually served the call, latency and tokens. What's missing on purpose is the
      question itself. These are employees writing to HR. Monitoring doesn't need their words.

  - id: keyless
    type: code
    heading: "Keyless telemetry"
    lang: python
    code: |
      # infra/main.bicep:  Microsoft.Insights/components  DisableLocalAuth: true
      from microsoft.opentelemetry import use_microsoft_opentelemetry

      use_microsoft_opentelemetry(
          enable_azure_monitor=True,
          azure_monitor_connection_string=connection_string,
          azure_monitor_exporter_credential=credential,
          azure_monitor_enable_live_metrics=False,
          logger_name=LOGGER_NAME,
          enable_sensitive_data=False,
      )
    narration: >
      Application Insights has local authentication off, so nothing gets in without an Entra token. We use the
      Microsoft OpenTelemetry Distro, which Learn recommends for new Python apps, pass a credential with the
      Monitoring Metrics Publisher role, collect only our own logger, and keep message content out of the traces.

