      already tells the story: count by window and language, and the Portuguese share grows in the current window.
    # TODO after recording: if the language counts barely moved, say so; the monitor will report it the same way.

  - id: psi
    type: code
    heading: "Population Stability Index, in ten lines"
    lang: python
    code: |
      def psi(expected: list[float], actual: list[float]) -> float:
          """PSI = sum((actual - expected) * ln(actual / expected)); 0 when identical, grows with the shift."""
          return sum((a - e) * math.log(a / e) for e, a in zip(expected, actual))

      cats = sorted(set(b) | set(c))
      p, q = distribution(b, cats), distribution(c, cats)
      result.psi, result.js = psi(p, q), js_distance(p, q)
      result.status = ("significant" if result.psi >= PSI_SIGNIFICANT
                       else "moderate" if result.psi >= PSI_MODERATE else "ok")
    short: psi
    narration: >
      Population stability index and Jensen Shannon distance are two of the drift metrics Azure Machine Learning's
      model monitoring uses. PSI compares the share of each value in the two windows. Zero means identical. Learn's
      guidance: below point one, no significant change. Point two or more, significant. Jensen Shannon distance is
      the symmetric cousin, always between zero and one, and we report it next to PSI.

  - id: monitor-run
    type: screen
    heading: "The drift report, from the real workspace"
    image: screens/monitor.jpg
    bar: "Terminal · python -m hrmon.monitor"
    demo: "Terminal: PYTHONPATH=src python -m hrmon.monitor --workspace-id $WS --baseline baseline --current current --appinsights \"$APPINSIGHTS\" ; echo exit=$?  — the table (lang, length, category, urgency, needs_human with n, PSI, JS, status, biggest shift), the model versions line, the golden accuracy line, 'ALERT: YES' or 'ALERT: no', and the exit code."
    narration: >
      Here's the monitor against the lab workspace. Input features first, then the predictions, each with its PSI,
      its status and the biggest shift. Then the model versions that served each window, the golden accuracy, and
      the verdict. The exit code is the contract: zero means carry on, one means a person should look, so a
      scheduler or a pipeline can act on it without parsing the table.
    # TODO after recording: name the features marked significant and the exit code. If nothing drifted, say so.

  - id: worse
    type: code
    heading: "Different is not the same as worse"
    lang: python
    code: |
      @property
      def model_changed(self) -> bool:
          b, c = (set(v) for v in self.models.values()) if len(self.models) == 2 else (set(), set())
          return bool(b and c and b != c)

      @property
      def quality_dropped(self) -> bool:
          vals = list(self.quality.values())
          return len(vals) == 2 and vals[0] - vals[1] > QUALITY_DROP

      @property
      def alert(self) -> bool:
          return any(f.drifted for f in self.features) or self.quality_dropped or self.model_changed
    narration: >
      Drift says different, not worse. New topics are real, and the bot may handle them fine. Only the golden set
      says whether answers got worse. And the reverse happens too: one test swaps the model version behind the same
      inputs. No drift at all, but accuracy drops. That's why the alert looks at all three.

  - id: gotcha
    type: code
    heading: "The gotcha: zeros and small samples"
    lang: python
    code: |
      EPSILON = 1e-4          # a value never seen in the baseline would make PSI infinite
      MIN_COUNT = 30          # fewer records than this in either window -> "insufficient"

      def test_same_population_split_in_two_is_not_zero_but_below_threshold():
          population = rng.choices(["leave", "payroll", "benefits", "equipment"], weights=[4, 3, 2, 1], k=400)
          r = drift.compare("category", population[:200], population[200:])
          assert 0 < r.psi < drift.PSI_MODERATE
    short: gotcha
    narration: >
      Two honest gotchas. A language the baseline never saw makes PSI infinite, because you divide by zero, so empty
      bins get a tiny epsilon. And two samples of the same population never match exactly. With forty records per
      window, treat PSI as a smoke alarm, not a measurement, and below thirty, don't compute it at all.

  - id: alert
    type: screen
    heading: "Azure Monitor raises the alert"
    image: screens/alert.jpg
    bar: "Azure portal · Monitor · Alerts"
    demo: "Azure portal > Monitor > Alerts (filtered to rg-mglab-ai-08): the fired alert 'mglab-mon-drift-alert' (severity 2) opened, showing the condition (query on AppTraces drift_report, Count > 0) and the fired time. Subscription and names masked."
    narration: >
      The monitor also wrote a drift report record. The log search alert rule, deployed in Bicep, checks every five
      minutes for a report with PSI at or above point two, and here it fires. From here you'd route it to the HR bot
      team's action group.
    # TODO after recording: if the alert took longer than the window to fire, say how long it took.

  - id: tests
    type: code
    heading: "36 tests, no cloud needed"
    lang: text
    code: |
      $ python -m pytest tests -q
      ....................................                 [100%]
      36 passed

      test_drift_and_features.py         PSI formula, smoothing, bands, small samples, language hint
      test_triage_traffic_telemetry.py   real openai SDK; no question text; real OpenTelemetry log records
      test_logs_and_monitor.py           real LogsQueryClient; KQL injection refused; model swap without drift
      test_bicep.py                      local auth off, pinned model, alert rule, three roles
    narration: >
      Thirty six tests run locally with the real OpenAI, Azure Monitor query and OpenTelemetry libraries against
      local doubles. They check that no question text reaches telemetry, that a window label can't inject KQL, and
      that a model swap alerts even when nothing drifts.

  - id: recap
    type: bullets
    heading: "Five rules for monitoring an LLM app"
    bullets:
      - "Log features and answers, not people's words"
      - "Watch inputs, predictions, quality and model version"
      - "Use PSI with a threshold and a minimum sample"
      - "Keep a golden set and re-run it every window"
      - "Pin the model and alert when it changes"
    narration: >
      Five rules. Log features and answers, not people's words. Watch inputs, predictions, quality and the model
      version. Use PSI with a threshold and a minimum sample. Keep a golden set and re run it every window. And pin
      the model, then alert if it changes anyway.

