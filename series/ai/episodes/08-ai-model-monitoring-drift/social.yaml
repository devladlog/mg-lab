- id: psi
  youtube_short_title: 'Population Stability Index in ten lines of code #Shorts'
  instagram_reel:
    caption: |
      PSI compares the share of each value in two windows. Zero means identical. Learn's guidance: below 0.1, no significant change, 0.2 or more, significant. Jensen Shannon distance is the symmetric cousin, always between zero and one, and we report it next to PSI.

      Full episode: link in bio

      #DataDrift #ModelMonitoring #AzureAI
    cover_text: PSI IN 10 LINES
  tiktok:
    caption: 'PSI compares each value''s share across two windows. 0 = identical, under 0.1 no real change,
      0.2+ significant. Ten lines of Python. #DataDrift #ModelMonitoring #AzureAI'
- id: gotcha
  youtube_short_title: 'PSI gotchas: zeros and small samples #Shorts'
  instagram_reel:
    caption: |
      A language the baseline never saw makes PSI infinite, because you divide by zero, so empty bins get a tiny epsilon. And two samples of the same population never match exactly. With forty records per window, treat PSI as a smoke alarm, not a measurement, and below thirty, do not compute it at all.

      Full episode: link in bio

      #DataDrift #ModelMonitoring #AzureAI
    cover_text: 'PSI: ZEROS AND SMALL N'
  tiktok:
    caption: 'Unseen category = divide by zero = infinite PSI, so use an epsilon. With 40 records per
      window PSI is a smoke alarm; under 30, skip it. #DataDrift #AzureAI'
