linkedin_company:
  text: |
    The HR bot passed every test before release. Then Contoso opened an office in Porto and launched a hybrid work allowance. Same model, same prompt, different questions.

    Episode 8 of DEVLADLOG AI builds the monitoring that notices, before the users do.

    - One structured record per call through OpenTelemetry to Application Insights, with no question text in it
    - A monitor that compares two windows: input features, predictions, model versions served, and a golden set
    - Population Stability Index in about ten lines, with an exit code for schedulers
    - An Azure Monitor alert rule, deployed in Bicep, that fires on the drift report
    - Keyless, with 36 tests and no cloud needed

    The gotcha: a language the baseline never saw makes PSI infinite, and with small samples PSI is a smoke alarm, not a measurement.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.
    #ModelMonitoring #DataDrift #AzureMonitor #AzureAI
linkedin_personal:
  text: |
    Drift says different, not worse. That distinction came out of the monitoring episode of DEVLADLOG AI.

    New topics and a new language in the questions are real, and the bot may handle them fine. Only a golden set re-run each window tells you whether answers got worse. And the reverse happens: swap the model version behind the same inputs and there is no drift at all, but accuracy drops.

    So the alert looks at inputs, predictions, quality and the model version. And the telemetry carries features, not what employees wrote.

    {YOUTUBE_URL}

    #ModelMonitoring #AzureAI
    Narration uses an AI voice.
