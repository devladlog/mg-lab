linkedin_company:
  text: |
    Ask the Contoso HR bot the same question twice and the wording changes. Is that a bug, a setting, or just how language models work?

    Episode 15 of DEVLADLOG AI opens the box on a real Azure OpenAI deployment with five small tools in one Python package.

    - Tokens: six sentences in English and Portuguese counted with two encodings, and Portuguese needs more
    - Next-token probabilities from log probabilities, and why a confident token can still be wrong
    - Temperature and seed measured over eight runs per setting, checking that the facts survive, not the wording
    - Streaming time to first text, without crashing on chunks that have an empty choices list
    - A context budget packer, and our estimate compared with the billed prompt tokens

    The gotcha: seed is best effort, so never write a test that needs identical text.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.
    #GenerativeAI #LLM #AzureOpenAI #AzureAI
linkedin_personal:
  text: |
    Seed is best effort. Learn says determinism is not guaranteed, so a test that expects identical text from a model will eventually fail.

    In the generative AI episode of DEVLADLOG AI I run the same prompt eight times per setting and check something better: do the facts survive? The question is about leave carry over, and the facts to keep are the five day limit and the 31st of March. The command exits with one if a fact goes missing.

    Wording moves. Test the facts.

    {YOUTUBE_URL}

    #GenerativeAI #AzureAI
    Narration uses an AI voice.
