linkedin_company:
  text: |
    Extracting text from an invoice is the easy part. Deciding what to do with it is the hard part: pay it, send it back, or ask a person to look.

    Episode 4 of DEVLADLOG AI turns fictional Contoso supplier invoices into decisions with Azure Document Intelligence.

    - Prebuilt invoice model, keyless, with typed fields and a confidence on each
    - Routing to approve, review or reject across five sample invoices
    - Reject only on facts the model is sure of: wrong customer VAT number, or a duplicate
    - Missing fields, low confidence or totals that do not add up go to a person, with boxes drawn on the document
    - Prebuilt layout turns a scanned policy into Markdown for RAG

    The gotcha: the free tier reads only the first two pages, so a total on page three simply comes back missing. Missing is never treated as empty.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.
    #DocumentIntelligence #AzureAI #InvoiceProcessing #Python
linkedin_personal:
  text: |
    Here is the rule I would keep from the Document Intelligence episode of DEVLADLOG AI: only reject on facts you are sure of.

    A wrong customer VAT number read with high confidence, or a duplicate, gets rejected. A missing field, a low confidence or totals that do not add up could just be a reading error, so those go to a person, never to the bin.

    And the free tier only reads the first two pages, so a total on page three comes back with no total. Missing is not empty, it is a review.

    {YOUTUBE_URL}

    #DocumentIntelligence #AzureAI
    Narration uses an AI voice.
