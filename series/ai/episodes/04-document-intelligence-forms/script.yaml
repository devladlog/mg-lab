  - id: decide
    type: code
    heading: "Reject only what you are sure of"
    lang: python
    code: |
      customer_vat = normalise_tax_id(inv.value("CustomerTaxId"))
      if (customer_vat and customer_vat != CONTOSO_VAT
              and inv.confidence("CustomerTaxId") >= thresholds["CustomerTaxId"]):
          reject.append(f"billed to VAT {inv.value('CustomerTaxId')}, not Contoso")

      for name in REQUIRED:
          if inv.value(name) in (None, ""):
              review.append(f"{name} not found")
      for name, minimum in thresholds.items():
          if inv.value(name) not in (None, "") and inv.confidence(name) < minimum:
              review.append(f"{name} confidence {inv.confidence(name):.2f} < {minimum:.2f}")
      if None not in (sub, tax, total) and abs(sub + tax - total) > TOLERANCE:
          review.append(f"subtotal {sub} + tax {tax} != total {total}")
    short: decide
    narration: >
      Here is the most important design rule. We only reject on facts we are sure of: a customer VAT number that is
      not Contoso's, read with high confidence, or a duplicate. A missing field, a low confidence, or totals that
      don't add up could be a reading error, so those go to a person, never to the bin.

  - id: thresholds
    type: bullets
    heading: "Where the thresholds come from"
    bullets:
      - "Confidence: an estimate between 0 and 1"
      - "Learn: pick thresholds from a pilot on your documents"
      - "Example in the transparency note: 0.80"
      - "We start stricter for money and IDs: 0.90"
      - "Re-tune when suppliers or templates change"
    narration: >
      Where do the thresholds come from? Microsoft's transparency note for Document Intelligence says to run a pilot
      on your own documents and pick the thresholds from it, with zero point eight as an example. We start stricter,
      zero point nine, for amounts and identifiers. These are starting points, to tune on real data.

