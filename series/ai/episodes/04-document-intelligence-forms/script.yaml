  - id: sections
    type: code
    heading: "Same shape as the episode three index"
    lang: python
    code: |
      def markdown_sections(markdown):
          markdown = _FIGURE_OR_COMMENT.sub("", markdown)  # page numbers, page breaks, figures
          path, out, body, current = [], [], [], None
          for line in markdown.splitlines():
              m = _HEADING.match(line)
              if m:
                  if current is not None and "\n".join(body).strip():
                      out.append((current, "\n".join(body).strip()))
                  path = path[: len(m.group(1)) - 1] + [m.group(2)]
                  current, body = " > ".join(path), []
              else:
                  body.append(line)
    narration: >
      And this function splits that Markdown on headings, keeping the full heading path and dropping page numbers,
      page breaks and figures, which the layout model writes as HTML comments and figure tags. That is exactly the
      shape our episode three chunker indexes, so paper policies can join the HR bot's knowledge.

