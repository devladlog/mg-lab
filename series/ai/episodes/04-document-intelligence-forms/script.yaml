  - id: gotcha
    type: code
    heading: "The gotcha: the free tier reads two pages"
    lang: python
    code: |
      # Learn, service limits, Free (F0): max 2 pages per analysis, 4 MB per file,
      # 1 analyze request and 1 get request per second.
      # A total printed on page 3 simply isn't in the result.

      def test_missing_required_policy_field_goes_to_review():
          d = decide(to_invoice(analyze_result(sample("01"), drop=("CustomerTaxId",))))
          assert d.outcome == "review" and "CustomerTaxId not found" in d.reasons
    short: gotcha
    narration: >
      Here is the honest gotcha. The free tier is great for a demo, but it only processes the first two pages of a
      document, and it allows one analyze request per second. A three page invoice with the total on page three
      just comes back without a total. That is why a missing field is never treated as an empty value: it goes
      to review.

