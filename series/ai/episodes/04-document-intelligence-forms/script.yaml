  - id: recap
    type: bullets
    heading: "Five rules for document intake"
    bullets:
      - "Prebuilt model first; custom only when it falls short"
      - "Money as decimals, totals checked in code"
      - "Reject only confident facts"
      - "Low confidence or missing: a human, with boxes"
      - "Know your tier's page and rate limits"
    narration: >
      Five rules. Start with a prebuilt model, and go custom only when it falls short. Treat money as decimals and
      check the totals in code. Reject only on confident facts. Send low confidence and missing fields to a person,
      with boxes showing where to look. And know your tier's page and rate limits.

