  - id: hook
    type: title
    heading: "Invoices in, decisions out"
    sub: "And a human only when it matters"
    short: hook
    narration: >
      Extracting text from an invoice is the easy part. The hard part is deciding what to do with it: pay it, send
      it back, or ask a person to look. Today we turn supplier invoices into decisions, and we let the model's own
      confidence decide when a human is needed. Welcome to DEVLADLOG AI.

  - id: problem
    type: bullets
    heading: "Contoso finance, every morning"
    bullets:
      - "Supplier invoices arrive as scans and photos"
      - "Policy: Contoso VAT, supplier VAT, date, tax amount"
      - "Wrong company or duplicate: reject"
      - "Unsure or inconsistent: a person reviews"
      - "Everything else: straight through"
    narration: >
      Contoso's finance team gets supplier invoices as scans and phone photos. The expenses policy we indexed in
      episode three says an invoice must show Contoso's VAT number, the supplier's VAT number, the date and the tax.
      Invoices for another company, or duplicates, are rejected. Anything uncertain goes to a person. The rest goes
      straight through.

  - id: arch
    type: diagram
    heading: "The intake pipeline"
    nodes: ["Invoice", "Analyze", "Rules", "Route"]
    labels: ["PNG, JPEG, PDF", "prebuilt-invoice", "policy + maths", "approve · review · reject"]
    narration: >
      The pipeline is short. A file goes to Azure Document Intelligence with the prebuilt invoice model. We map the
      fields it returns, with their confidence, run our policy and arithmetic rules, and route each invoice to
      approve, review or reject.

  - id: analyze
    type: code
    heading: "Analyze: one call, one long-running operation"
    lang: python
    code: |
      def analyze_file(client, path, *, model_id="prebuilt-invoice", locale="en-US", polling_interval=None):
          kwargs = {"locale": locale}
          if polling_interval is not None:
              kwargs["polling_interval"] = polling_interval
          with open(path, "rb") as f:
              poller = client.begin_analyze_document(model_id, f, **kwargs)
          result = poller.result()
          return result.as_dict() if hasattr(result, "as_dict") else dict(result)

      client = DocumentIntelligenceClient(endpoint, DefaultAzureCredential())
    narration: >
      The client uses Default Azure Credential, so there are no keys: the resource has local auth disabled and our
      user has the Cognitive Services User role. Analyze is a long running operation. The SDK posts the bytes, gets
      an operation location back, and polls it until the result is ready.

  - id: fields
    type: code
    heading: "Typed fields, each with a confidence"
    lang: python
    code: |
      def field_value(f):
          t = f.get("type")
          if t == "currency":
              cur = f.get("valueCurrency") or {}
              return _money(cur.get("amount")), cur.get("currencyCode")
          if t == "date":
              v = f.get("valueDate")
              return (date.fromisoformat(v) if v else None), None
          if t == "number":
              v = f.get("valueNumber")
              return (None if v is None else Decimal(str(v))), None
          if t == "string":
              return f.get("valueString"), None
    narration: >
      Every field comes back typed. Totals are currency objects with an amount and a currency code, dates are real
      dates, and every field carries a confidence between zero and one. We convert money to decimals immediately,
      because floating point is not how you compare totals.

  - id: field-json
    type: screen
    heading: "What the model actually returns"
    image: screens/field-json.jpg
    video: screens/field-json.mp4
    bar: "VS Code · results/01-fabrikam-clean.json"
    demo: "VS Code with results/01-fabrikam-clean.json (saved by --save-json), folded to documents[0].fields.InvoiceTotal: type currency, valueCurrency {amount, currencyCode EUR}, content, confidence, boundingRegions with the pixel polygon."
    narration: >
