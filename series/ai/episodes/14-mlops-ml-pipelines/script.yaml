scenes:
  - id: hook
    type: title
    heading: "A model that can say no to itself"
    sub: "Azure Machine Learning pipeline, gate, registry, canary"
    short: hook
    narration: >
      Most machine learning projects can train a model. Fewer can answer a simple question: why is this version in production,
      and who checked it? Today the Contoso Porto service desk gets a model that predicts which tickets will miss their S L A,
      and a pipeline that refuses to ship it when the numbers are not good enough. Welcome to DEVLADLOG AI.

  - id: scenario
    type: bullets
    heading: "Fictional tickets, a real release process"
    bullets:
      - "Predict at creation: will this ticket breach its SLA?"
      - "Validate, train, gate: one Azure ML pipeline"
      - "Register only what passed, with the evidence"
      - "Roll out blue green, ten percent first"
    narration: >
      The model predicts, when a ticket is created, the probability that it will breach its S L A. The data is fictional and
      generated by a rule we wrote, so the point is the process, not the accuracy. A pipeline validates the data, trains,
      and applies a gate. Only a model that passes is registered, and only a registered model is deployed, first to ten
      percent of the traffic.

  - id: prepare-code
    type: code
    heading: "Bad data stops here"
    lang: python
    code: |
      errs = validate(df)
      if errs:
          print("DATA VALIDATION FAILED")
          for e in errs:
              print(" -", e)
          return 2
      df["created_at"] = pd.to_datetime(df["created_at"])
      df = df.sort_values("created_at").reset_index(drop=True)
      cut = int(len(df) * (1 - test_fraction))
      train, test = df.iloc[:cut], df.iloc[cut:]
    narration: >
      The first step refuses a bad extract and lists every problem: a missing column, an unknown priority, a label rate that
      makes no sense. Then it splits by time, so the model is always judged on tickets newer than the ones it learned from.
      A random split would flatter it.

  - id: pipeline-code
    type: code
    heading: "The pipeline is a YAML file"
    lang: yaml
    code: |
      jobs:
        prepare:
          type: command
          component: ./components/prepare.yml
          inputs:
            raw: ${{parent.inputs.raw_data}}
        train:
          type: command
          component: ./components/train.yml
          inputs:
            train: ${{parent.jobs.prepare.outputs.train}}
            seed: ${{parent.inputs.seed}}
          outputs:
            model_out: ${{parent.outputs.model}}
    narration: >
      The pipeline is three command components, connected by their inputs and outputs. Each component names its code folder
      and its environment, so every step runs in the same pinned container, on a cluster that scales to zero. The tests
      load this YAML with the Azure Machine Learning S D K, and also run the exact commands from it on this machine.

  - id: gate-code
    type: code
    heading: "The gate is a function"
    lang: python
    code: |
      MIN_AUC = 0.70
      MAX_AUC_DROP = 0.02
      MIN_P1_RECALL = 0.60

      def decide(metrics: dict, baseline_auc: float = 0.0) -> Decision:
          reasons: list[str] = []
          if metrics["auc"] < MIN_AUC:
              reasons.append(f"AUC {metrics['auc']:.3f} is below the floor {MIN_AUC}")
          if baseline_auc and metrics["auc"] < baseline_auc - MAX_AUC_DROP:
              reasons.append(f"AUC {metrics['auc']:.3f} is worse than production {baseline_auc:.3f} by more than {MAX_AUC_DROP}")
    short: gate
    narration: >
      The gate is a plain function with three rules. An absolute floor. No worse than the model already in production, within a
      tolerance. And a slice check: recall on urgent tickets, because a good average can hide a bad slice. The numbers are
      ours. On this fictional data, different seeds moved the score by about three hundredths, so the tolerance has to be wider
      than the noise. Tune yours on your own history.

  - id: pipeline-screen
    type: screen
    heading: "The pipeline, running on the cluster"
    image: screens/pipeline.jpg
    video: screens/pipeline.mp4
    bar: "Azure ML studio · Jobs · slabreach-train-and-gate"
    demo: "Terminal: RG=rg-mglab-ai-14 WS=<workspace> scripts/train-and-register.sh (first run, production AUC 0). Then Azure ML studio > Jobs > the pipeline job: the graph prepare > train > evaluate, all completed, and the evaluate step's log with the PROMOTE line. Show the terminal's final line 'registered sla-breach version 1'. Mask subscription, tenant, workspace suffix."
    narration: >
      Here is the first run. The script finds no model in the registry, so production A U C is zero, and submits the pipeline.
      In the studio, the three steps run one after another on the cluster. The evaluate step prints its verdict, and because
      it said promote, the job completes, and the script registers version one.
    # TODO after recording: read the test AUC and the P1 recall as printed by the evaluate step.

  - id: gate-screen
    type: screen
    heading: "The gate says no"
    image: screens/gate.jpg
    video: screens/gate.mp4
    bar: "Terminal + Azure ML studio · failed job"
    demo: "Terminal: python -m slabreach generate --out build/raw --scenario noisy --seed 4, then scripts/train-and-register.sh. The script prints the production AUC read from the registry tag, then 'ended as Failed: nothing is registered'. Then studio > the failed job > evaluate step > Outputs + logs: the REJECT line with its reasons. Then Models: still only version 1."
    narration: >
      Now the interesting run. We feed it a bad extract, with a third of the labels scrambled. This time the script reads
      production A U C from a tag on the registered model, and passes it to the pipeline. The evaluate step rejects the new
      model, the job fails, and the script stops. Nothing is registered, and the model list still shows one version. A failing
      gate is the pipeline working.
    # TODO after recording: read the reasons printed by the evaluate step exactly, and the numbers.

  - id: register-code
    type: code
    heading: "Register only what completed"
    lang: bash
    code: |
      case "$STATUS" in
        Completed) break ;;
        Failed|Canceled|NotResponding) echo "job $JOB ended as $STATUS: nothing is registered"; exit 1 ;;
      esac
      VERSION="$(az ml model create --name "$MODEL" --type mlflow_model --path "azureml://jobs/$JOB/outputs/model" \
        --set "tags.test_auc=$AUC" "tags.pipeline_job=$JOB" --query version -o tsv -g "$RG" -w "$WS")"
    narration: >
      Registration happens in a script, after the job. Anything but completed means exit, nothing registered. If it completed,
      the model is registered from the job output, with the test A U C and the job name as tags. The registry is now the
      source of truth: the next run reads that tag as its baseline, and anyone can trace a version back to the run that made it.
      The tests run these scripts against a stand in command, to prove the order of calls and that a failed job registers nothing.

  - id: registry-screen
    type: screen
    heading: "The registry keeps the evidence"
    image: screens/registry.jpg
    video: screens/registry.mp4
    bar: "Azure ML studio · Models · sla-breach"
    demo: "Azure ML studio > Models > sla-breach: the version list (v1, then v2 after the good second run: python -m slabreach generate --out build/raw --seed 2 then scripts/train-and-register.sh), open a version: type MLflow, tags test_auc and pipeline_job, then the job link. Mask workspace suffix."
    narration: >
      After a good second run, with fresh data, the registry has version two. Each version is an M L flow model, with the test
      A U C and the pipeline job in its tags. From a version in production, one click gets you to the run, the data split, and the
      code that produced it.
    # TODO after recording: say whether the second run was promoted and what the AUC difference to version one was.

  - id: canary-code
    type: code
    heading: "Blue green, ten percent first"
    lang: bash
    code: |
      az_ online-deployment create --name "$NEW" --endpoint-name "$ENDPOINT_NAME" -f aml/deployment.yml \
        --set name="$NEW" endpoint_name="$ENDPOINT_NAME" model="azureml:$MODEL:$VERSION"
      az_ online-endpoint invoke --name "$ENDPOINT_NAME" --deployment-name "$NEW" --request-file aml/sample-request.json
      az_ online-endpoint update --name "$ENDPOINT_NAME" --traffic "$LIVE=90 $NEW=10"
    narration: >
      Deployment follows the blue green pattern from Learn. The new version goes to the other colour with no traffic. We send
      it a request directly, to check it answers. Then ten percent of the live traffic. Because the model is an M L flow model,
      Azure Machine Learning needs no scoring script and no environment file, and the endpoint uses Microsoft Entra tokens, not keys.

  - id: endpoint-screen
    type: screen
    heading: "Two versions, one endpoint"
    image: screens/endpoint.jpg
    video: screens/endpoint.mp4
    bar: "Azure ML studio · Endpoints · slabreach"
    demo: "Terminal: scripts/deploy-canary.sh 1 (first time), then scripts/deploy-canary.sh 2. Studio > Endpoints > the endpoint: Details tab with blue 90 and green 10, authentication Microsoft Entra token. Terminal: az ml online-endpoint invoke --name <endpoint> --request-file aml/sample-request.json showing two predictions. Mask endpoint name suffix and scoring URI."
    narration: >
      The endpoint now serves two versions. Ninety percent of the requests go to blue, ten percent to green, and the
      authentication is Microsoft Entra. A request with two tickets comes back with a probability for each. When the numbers
      hold, one more script moves everything to green and deletes blue, because a deployment costs money for as long as it exists.
    # TODO after recording: say what the two predictions were and whether the urgent ticket scored higher.

  - id: gotcha
    type: bullets
    heading: "The honest gotchas"
    bullets:
      - "The gate fails the whole job: simple, and crude"
      - "MLflow 3 changed names Learn's sample still uses"
      - "The workflow is tested, not run, in this episode"
      - "Delete the workspace permanently, or the name is stuck"
    short: gotcha
    narration: >
      The honest part. A gate that fails the job is simple, but it is crude, and the thresholds are ours. M L flow three
      renamed a helper that Learn's scoring script sample still imports, and refuses its old file store by default. Our
      git hub workflow signs in with open I D connect and is checked, but it was not run in this episode. And deleting a workspace is
      a soft delete by default: the name stays reserved for fourteen days unless you delete it permanently.

  - id: outro
    type: outro
    heading: "Code on GitHub, guides on devladlog.com"
    sub: "github.com/devladlog/mg-lab"
    narration: >
