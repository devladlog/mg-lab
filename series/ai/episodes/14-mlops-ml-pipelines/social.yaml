- id: gotcha
  youtube_short_title: 'Azure ML gotchas: MLflow 3 and soft-deleted workspaces #Shorts'
  instagram_reel:
    caption: |
      MLflow 3 renamed a helper that Learn's scoring script sample still imports, and refuses its old file store by default. And deleting a workspace is a soft delete by default: the name stays reserved for fourteen days unless you delete it permanently. A gate that fails the job is simple, but crude.

      Full episode: link in bio

      #MLOps #AzureML #MLflow
