- id: gate
  youtube_short_title: 'The model gate is just a function #Shorts'
  instagram_reel:
    caption: |
      The gate is a plain function with three rules. An absolute floor. No worse than the model already in production, within a tolerance. And a slice check: recall on urgent tickets, because a good average can hide a bad slice. On this fictional data, different seeds moved the score by about three hundredths.

      Full episode: link in bio

      #MLOps #AzureML #AzureAI
    cover_text: THE GATE IS A FUNCTION
