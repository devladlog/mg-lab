linkedin_company:
  text: |
    Most machine learning projects can train a model. Fewer can answer a simple question: why is this version in production, and who checked it?

    Episode 14 of DEVLADLOG AI builds an Azure Machine Learning pipeline for a fictional Contoso service desk model that predicts SLA breaches, and a pipeline that refuses to ship it when the numbers are not good enough.

    - Three command components in YAML: validate and split by time, train, evaluate
    - A gate function with an absolute floor, a no-worse-than-production check, and a recall check on urgent tickets
    - A bad extract with a third of the labels scrambled: the gate rejects it and nothing is registered
    - Registration only after a completed job, with the test AUC and job name as tags
    - Blue-green rollout, 10 percent of traffic first, Entra tokens and no keys

    The data is fictional, so the point is the process, not the accuracy.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.
    #MLOps #AzureML #MachineLearning #AzureAI
linkedin_personal:
  text: |
    A failing gate is the pipeline working.

    In the MLOps episode of DEVLADLOG AI I feed the Azure ML pipeline an extract with a third of the labels scrambled. The evaluate step rejects the new model, the job fails, nothing is registered, and the model list still shows one version.

    Also learned: on this fictional data, different seeds moved the score by about three hundredths, so the gate tolerance has to be wider than the noise. Tune your thresholds on your own history, not mine.

    {YOUTUBE_URL}

    #MLOps #AzureAI
    Narration uses an AI voice.
