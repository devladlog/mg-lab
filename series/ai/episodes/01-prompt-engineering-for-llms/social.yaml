- id: spotlight
  youtube_short_title: 'Spotlighting: keep untrusted text as data, not instructions #Shorts'
  instagram_reel:
    caption: |
      Tickets are written by anyone, so the text is untrusted. Spotlighting marks where the ticket starts and ends, and replaces every space with a caret so the model can see which words came from outside. We strip look-alike delimiters first. It reduces the risk, it does not remove it.

      Full episode: link in bio

      #PromptInjection #AzureOpenAI #AzureAI
    cover_text: SPOTLIGHTING
  tiktok:
    caption: 'Untrusted ticket text? Mark it. Delimiters plus a caret for every space, and strip fake
      closing tags first. It reduces the risk, it does not remove it. #PromptInjection #AzureAI'
- id: gotcha
  youtube_short_title: 'Why temperature 0 breaks on GPT-5 and o-series models #Shorts'
  instagram_reel:
    caption: |
      For years every prompt sample set temperature to zero. Reasoning models, the GPT-5 family and the o series, do not support temperature, top p or max tokens. They need max completion tokens, and hidden reasoning tokens count toward it. Set it too low and you get finish reason length and no answer.

      Full episode: link in bio

      #AzureOpenAI #GPT5 #AzureAI
    cover_text: TEMPERATURE 0 BREAKS
  tiktok:
