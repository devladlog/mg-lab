linkedin_company:
  text: |
    You changed one line in a prompt and it looked better on the three examples you tried. Did it get better, or just different?

    Episode 1 of DEVLADLOG AI treats prompts like code: versioned, reviewed and scored on a labelled dataset.

    - Ticket triage for a fictional Contoso helpdesk: category, priority, summary, needs a human
    - Two prompt versions scored on the same 20 tickets, three of them injection attacks
    - Strict structured outputs, with the schema rules checked in a unit test
    - Spotlighting, so the ticket text stays data and not instructions
    - Entra ID only, no API keys

    The gotcha: reasoning models such as the GPT-5 family do not accept temperature, so the request has to be built per model family.

    Watch the episode: {YOUTUBE_URL}
    Code, dataset and tests: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.
    #PromptEngineering #AzureOpenAI #AzureAI #LLM
linkedin_personal:
  text: |
    For years every prompt sample I copied set temperature to 0. Then I moved a triage prompt to a GPT-5 deployment and learned that reasoning models do not support temperature at all. They want max completion tokens, and the hidden reasoning tokens count against that limit. Set it too low and you get no answer.

    So in the first DEVLADLOG AI episode the request is built per model family, and the prompt versions are scored on 20 labelled tickets, three of them attacks. The lesson: let the model family decide your parameters, not an old sample.

    {YOUTUBE_URL}

    #PromptEngineering #AzureAI
    Narration uses an AI voice.
