linkedin_company:
  text: |
    A chatbot demo is easy. The hard part starts at turn nine, when the user asks for a person, gives an email address that is not theirs, or asks what their name was.

    Episode 11 of DEVLADLOG AI builds a service desk chatbot on Azure OpenAI for a fictional Contoso office and tests what it remembers, what it does and when it steps aside.

    - Memory: the API is stateless, so each request carries a running summary plus the newest whole turns that fit a budget
    - A tool that opens tickets, with every argument validated in code
    - A handoff that is a plain rule, English and Portuguese, with zero model calls
    - Streaming with usage, and content filter errors removed from the history
    - Seven scripted dialogues in two memory modes

    The gotcha: the summary is a paraphrase written by a model, so it can bend a detail, and it is personal data that needs an expiry.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.
    #ConversationalAI #Chatbot #AzureOpenAI #AzureAI
linkedin_personal:
  text: |
    When a user asks a chatbot for a person, I do not want the model to decide. In the conversational AI episode of DEVLADLOG AI a plain phrase check, in English and Portuguese, hands the conversation over with zero model calls. The model can also ask for a handoff through a tool, but the rule is the safety net.

    Same idea for tools: the model proposes, the code decides. Every argument is validated, the contact must be a company address, and one conversation can open three tickets at most.

    A person is a rule, not a prompt.

    {YOUTUBE_URL}

    #ConversationalAI #AzureAI
    Narration uses an AI voice.
