linkedin_company:
  text: |
    People attach photos to service desk tickets: a laptop with a sticker, a broken monitor, a meeting room screen, and sometimes a colleague standing right there.

    Episode 13 of DEVLADLOG AI reads the asset tag from the photo with Azure Vision Image Analysis 4.0, and makes sure the people in it are never stored.

    - One keyless call for caption, tags, objects, text, people and smart crops
    - The service reads text; our rules find the asset tag, with a confidence floor, and a corrected look-alike character goes to a person to confirm
    - People boxes are pixelated, and the thumbnail is cut from the pixelated copy
    - Next-step rules with a reason for each, and a gate over seven photos

    Two gotchas: blurring people leaves the text, so meeting names on a room display stay readable and our rule asks for review. And Learn says Image Analysis retires on 25 September 2028, so the rest of the code only sees our own types.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.
    #ComputerVision #AzureVision #AzureAI #Privacy
linkedin_personal:
  text: |
    Blurring the people in a photo does not make the photo safe. In the computer vision episode of DEVLADLOG AI the sample is a meeting room: the service finds the person, we pixelate the box, and the face is gone. But the room display still shows meeting names and organisers, because blurring people does not remove text.

    So a rule notices text in a photo with people and asks for a review. Also: the thumbnail is cut from the pixelated copy, never from the original.

    Pixelating a chair costs nothing. Storing a face costs a lot.

    {YOUTUBE_URL}

    #ComputerVision #AzureAI
    Narration uses an AI voice.
