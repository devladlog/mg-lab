  - id: evaluate-screen
    type: screen
    heading: "The gate"
    image: screens/evaluate.jpg
    video: screens/evaluate.mp4
    bar: "Terminal · python -m photoscan evaluate"
    demo: "Terminal: PYTHONPATH=src python -m photoscan evaluate --endpoint $VISION ; echo exit=$?. The table of seven cases with decision, expected decision, tag read and people blurred; any '!' problem lines; the summary line; RESULT; the exit code."
    narration: >
      The gate runs seven photos, six drawn by us and the Learn sample. A wrong tag attached to an asset fails it. A person
      who is not really pixelated fails it. A failed call fails it. And at least sixty percent of the tags we know are there
      must be read. The expectations are ours, written in a file, and the table shows where the service and our rules
      disagreed with them.
    # TODO after recording: say which cases failed, which tags were read, whether the look-alike case was caught, and the exit code.

  - id: gotcha
    type: bullets
    heading: "The honest gotcha: this service is on its way out"
    bullets:
      - "Learn: Image Analysis is deprecated, retired 25 September 2028"
      - "Blurring people does not remove names in text"
      - "Seven photos prove plumbing, not accuracy"
      - "Our adapter keeps the swap to one file"
    short: gotcha
    narration: >
      The honest part. Learn now says Image Analysis is deprecated and will be retired on the twenty fifth of September
      twenty twenty eight, with Document Intelligence, Face, and Content Understanding named as alternatives. That is why the
      rest of the code only sees our own types, so a new backend is one file. Second, blurring people leaves the text. Third,
      seven photos prove the plumbing, not the accuracy. Test on your own photos.

