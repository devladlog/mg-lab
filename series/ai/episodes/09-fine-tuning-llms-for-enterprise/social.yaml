linkedin_company:
  text: |
    Fine-tuning is a button. Anyone can click it. The hard part is knowing, with evidence, that the new model is no worse than the prompt you had, cheaper, and safe to ship.

    Episode 9 of DEVLADLOG AI fine-tunes a model for a fictional HR bot's triage step on Azure, with a gate that can say no.

    - A pre-flight check on 150 fictional messages in English and Portuguese: format, duplicates, conflicting labels, personal data, leakage
    - A training job on the plain OpenAI client, keyless, in one region
    - Both models evaluated on the same 45 held-out items
    - Four gates: valid output, accuracy no worse than baseline, a recall floor on messages that need a human, at least half the input tokens saved

    The gotcha: 27 right out of 30 sounds like 90 percent, but the real range is about 74 to 96. With 45 items, the gate can say not worse, not better.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.
    #FineTuning #AzureOpenAI #AzureAI #LLM
linkedin_personal:
  text: |
    27 right out of 30 sounds like 90 percent. The real range is about 74 to 96.

    That is the lesson from the fine-tuning episode of DEVLADLOG AI. With 45 held-out items, one wrong answer moves accuracy by two points, so two good models cannot be told apart. That is why the gate checks that the tuned model is not worse, and why more labelled examples are the best investment.

    The other number: a deployed fine-tuned model has an hourly hosting fee whether or not anyone calls it. Know that bill before you deploy.

    {YOUTUBE_URL}

    #FineTuning #AzureAI
    Narration uses an AI voice.
