scenes:
  - id: hook
    type: title
    heading: "An agent is a loop with your permissions"
    sub: "So give it a brake pedal"
    short: hook
    narration: >
      An AI agent is a loop. The model asks for a tool, your code runs it, and the result goes back to the model,
      again and again, with your permissions. Today we build one that works a real queue, and we put two brakes on
      it: a person, and the code itself. Welcome to DEVLADLOG AI.

  - id: problem
    type: bullets
    heading: "The queue from episode four"
    bullets:
      - "Invoices that the intake step sent to review"
      - "One total doesn't add up, one scan is faded"
      - "One is over the approval limit, one is a duplicate"
      - "Goal: an assistant that works the queue"
      - "Rule: a person confirms every approval"
    narration: >
      In episode four, Contoso's invoice intake sent some invoices to review. One has totals that don't add up, one
      is a faded scan, one is above the approval limit, and one was rejected as a duplicate. We want an assistant
      that works through that queue, but never approves anything on its own.

  - id: arch
    type: diagram
    heading: "One agent, four tools, two gates"
    nodes: ["Prompt", "Agent", "Tools", "Human", "Store"]
    labels: ["work the queue", "gpt-5-mini", "3 read, 1 write", "yes or no", "policy in code"]
    narration: >
      The agent runs on Microsoft Agent Framework, the successor to Semantic Kernel and AutoGen, with a G P T five
      mini deployment on Azure OpenAI. Three tools only read. The fourth approves an invoice, and that one passes
      two gates: a person, then the policy written in code.

  - id: tools
    type: code
    heading: "Tools are plain functions"
    lang: python
    code: |
      @tool(name="get_invoice", approval_mode="never_require")
      def get_invoice(invoice_id: Annotated[str, "Invoice id, for example INV-2026-0142"]) -> str:
          """Get one invoice: vendor, VAT number, date, subtotal, tax, total, status and review reasons."""
          inv = store.get(invoice_id)
          return json.dumps(inv if inv else {"error": "not_found", "invoice_id": invoice_id})

      @tool(name="approve_invoice", approval_mode="always_require", max_invocations=5)
      def approve_invoice(
          invoice_id: Annotated[str, "Invoice id to approve"],
          note: Annotated[str, "Why the approval is justified, citing the policy section"],
      ) -> str:
          """Approve an invoice for payment. A person must confirm every call; the policy is enforced again here."""
          return json.dumps(store.approve(invoice_id, note, approver))
    narration: >
      Tools are plain Python functions. The framework builds the JSON schema from the type hints and the
      docstring. Reading an invoice never needs approval. Approving one is marked always require, so the framework
      stops and hands the call back to us instead of running it.

  - id: limits
    type: code
    heading: "Bound the loop, keep the state local"
    lang: python
    code: |
      LIMITS = {"max_iterations": 8, "max_function_calls": 16, "max_duration_seconds": 120.0,
                "allow_concurrent_invocation": False}

      client = OpenAIChatClient(model=deployment, azure_endpoint=endpoint, credential=credential)
      client.function_invocation_configuration.update(LIMITS)

      return Agent(
          client=client,
          name="ap-assistant",
          instructions=INSTRUCTIONS,
          tools=tools.all,
          middleware=[audit] if audit else None,
          default_options={"store": False},
      )
    narration: >
      Two settings matter here. By default the loop may make forty model round trips, with no limit on tool calls
      or time, so we cap all three. And store false means the service doesn't keep response objects between calls;
      the session holds the history. The credential is Entra ID, there is no key.

  - id: loop
    type: code
    heading: "The approval loop"
    lang: python
    code: |
      session = agent.create_session()
      response = await agent.run(prompt, session=session)
      ...
      while response.user_input_requests:
          ...
          replies = []
          for request in response.user_input_requests:
              call = request.function_call
              ...
              args = _arguments(call.arguments)
              ok = bool(decide(call.name, args))
              outcome.decisions.append(Decision(call.name, args, ok))
              replies.append(request.to_function_approval_response(ok))
          outcome.rounds += 1
          response = await agent.run(Message(role="user", contents=replies), session=session)
    narration: >
      When the agent wants to approve something, the run returns user input requests instead of an answer. We show
      the tool name and arguments to a person, turn their yes or no into an approval response, and resume in the
      same session. A yes replayed into another session is ignored by the framework.

  - id: approval
    type: screen
    heading: "The agent asks, a person decides"
    image: screens/approval.jpg
    bar: "Terminal · python -m apagent.run"
    demo: "Terminal: PYTHONPATH=src python -m apagent.run --endpoint $AOAI --deployment chat --audit audit/run.jsonl — the run pauses on '>>> APPROVAL NEEDED  approve_invoice' with invoice_id and note shown and the cursor at 'Approve? [y/N]'. The recorder types y."
    narration: >
