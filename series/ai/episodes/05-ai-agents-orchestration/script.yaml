  - id: result
    type: screen
    heading: "Answer, audit trail, queue"
    image: screens/result.jpg
    bar: "Terminal · python -m apagent.run"
    demo: "Same terminal after answering y: the '=== Agent ===' block with one line per invoice, the '=== Tool calls (audit) ===' table (tool, outcome, ms, arguments) and '=== Queue after the run ===' with statuses, plus the tokens line."
    narration: >
      The agent finishes with one line per invoice and the next step for each. Below, the audit trail from our
      middleware lists every tool that actually ran, and the queue shows exactly one invoice approved. The others
      stay in review, with a reason a person can act on.
