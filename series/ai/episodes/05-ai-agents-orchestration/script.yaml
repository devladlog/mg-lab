  - id: refusal
    type: code
    heading: "A human yes is not enough"
    lang: python
    code: |
      def _refusal(inv: dict, note: str) -> str | None:
          kinds = _reason_kinds(inv)
          if inv["status"] != "review":
              return f"status is {inv['status']}; rejected invoices are not reopened from the review queue"
          if "arithmetic" in kinds:
              return "totals do not add up; request a corrected invoice from the supplier"
          if Decimal(inv["total"]) > APPROVAL_LIMIT:
              return f"total {inv['total']} is above the EUR {APPROVAL_LIMIT} limit; the finance manager approves"
          if "new-supplier" in kinds:
              return "first invoice from a new VAT number; procurement must verify the supplier first"
          if not note or not note.strip():
              return "an approval note is required"
          return None
    short: policy
    narration: >
      People click yes when they're busy. So the tool checks the policy again, in code: no approvals on totals that
      don't add up, nothing above the five thousand euro limit, no new suppliers, no reopened rejects. The prompt
      describes the rules. The code enforces them.

  - id: when
    type: bullets
    heading: "Agent or workflow?"
    bullets:
      - "Open-ended task, tools chosen at run time: agent"
      - "Well-defined steps, fixed order: workflow"
      - "Several agents must coordinate: workflow"
      - "Learn: if a function can do it, write the function"
    narration: >
      Not everything should be an agent. Microsoft's guidance is simple. Use an agent for open ended tasks where the
      model picks the tools. Use a workflow when the steps are known or several agents must coordinate. And if you
      can write a function to do it, write the function.

  - id: pipeline
    type: code
    heading: "Two agents, least privilege each"
    lang: python
    code: |
      def findings_only(messages: list[Message]) -> list[Message]:
          for m in reversed(messages):
              if m.role == "assistant" and m.text.strip():
                  return [Message(role="user", contents=[f"Checker findings:\n{m.text.strip()}"])]
          return [Message(role="user", contents=["Checker findings: none. Say that no e-mail can be drafted."])]

      checker = Agent(client=client, name="checker", instructions=CHECKER, tools=read_only,
                      default_options={"store": False})
      writer = Agent(client=client, name="writer", instructions=WRITER, default_options={"store": False})
      writer_step = AgentExecutor(writer, id="writer", context_mode="custom", context_filter=findings_only)
      workflow = SequentialBuilder(participants=[checker, writer_step], intermediate_output_from=[checker]).build()
    narration: >
      For the Northwind invoice we use a sequential workflow. A checker agent with two read only tools finds the
      problem and the policy. A writer agent with no tools at all drafts the e-mail to the supplier. The writer only
      receives the checker's final text, through a context filter.

  - id: gotcha
    type: code
    heading: "The gotcha: 'only responses' includes tool results"
    lang: python
    code: |
      def test_chain_only_agent_responses_alone_would_leak_tool_results(stub, client):
          ...
          wf = SequentialBuilder(participants=[checker, writer], chain_only_agent_responses=True).build()
          asyncio.run(wf.run("Check invoice INV-2026-0142."))
          writer_input = stub.bodies()[-1]["input"]
          assert "function_call_output" in [i.get("type") for i in writer_input]
          assert "vendor_vat" in str(writer_input)
    short: gotcha
    narration: >
      Here is the honest gotcha. The obvious setting, chain only agent responses, sounds like the writer gets just
      the checker's answer. But the checker's response messages include its tool calls and tool results, so the raw
      invoice data flows to the next agent. This test proves it. That's why we filter the context ourselves.

  - id: pipeline-run
    type: screen
    heading: "Checker finds, writer drafts"
    image: screens/pipeline.jpg
    bar: "Terminal · python -m apagent.pipeline INV-2026-0142"
    demo: "Terminal: PYTHONPATH=src python -m apagent.pipeline INV-2026-0142 --endpoint $AOAI --deployment chat — the '=== checker ===' block (INVOICE / ISSUE / POLICY / ACTION lines), the '=== writer ===' block starting with 'Subject:', and the 'saved outbox/INV-2026-0142-draft.md (draft, not sent)' line."
    narration: >
      And the real run. The checker reports the arithmetic problem with the numbers and the policy section. The
      writer turns that into a short e-mail asking for a corrected invoice. It's saved as a draft. Sending it is
      still a human decision.
    # TODO after recording: confirm the checker quoted 1000.00 + 230.00 vs 1240.00; if it phrased it differently, say so.

  - id: tests
    type: code
    heading: "27 tests, no cloud needed"
    lang: text
    code: |
      $ python -m pytest tests -q
      ...........................                         [100%]
      27 passed

      test_agent_loop.py  real Agent Framework vs a local Responses API stub:
                          approval pauses, declined calls never run, policy refusals,
                          runaway loop capped, replayed approval ignored
      test_pipeline.py    checker -> writer, no tools and no tool results for the writer
      test_store.py       every policy rule      test_bicep.py  keyless account, pinned model
    narration: >
      Twenty seven tests run in seconds without any cloud resource. The real Agent Framework talks to a local stub
      of the Responses API, so we test that approvals pause the run, a declined call never executes, a runaway loop
      is capped, and the writer never sees tool results.

  - id: recap
    type: bullets
    heading: "Five rules for agents"
    bullets:
      - "Read tools free, write tools need a person"
      - "Enforce the policy in the tool, not the prompt"
      - "Cap iterations, calls and time"
      - "Least privilege per agent: tools and context"
      - "Audit every tool that runs"
    narration: >
      Five rules. Reading is free, writing needs a person. Enforce the policy in the tool, not in the prompt. Cap
      iterations, tool calls and time. Give each agent only the tools and the context it needs. And audit every
      tool that actually runs.

