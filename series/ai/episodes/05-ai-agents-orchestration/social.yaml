linkedin_company:
  text: |
    An AI agent is a loop. The model asks for a tool, your code runs it, and the result goes back to the model, with your permissions.

    Episode 5 of DEVLADLOG AI builds one on Microsoft Agent Framework and Azure OpenAI that works Contoso's invoice review queue, with two brakes on it.

    - Three read-only tools, and an approve tool marked always require approval
    - A person types yes, then the tool checks the policy again in code: totals that add up, the 5,000 euro limit, no new suppliers, no reopened rejects
    - The loop is capped on model round trips, tool calls and time
    - A two-agent workflow: a checker with read-only tools, a writer with none
    - 27 tests, no cloud needed

    The gotcha: chain only agent responses still passes tool results to the next agent, so we filter the context ourselves.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.
    #AIAgents #AgentFramework #AzureOpenAI #AzureAI
linkedin_personal:
  text: |
    A human clicking yes is not a safety control. People click yes when they are busy.

    In the agents episode of DEVLADLOG AI the approve tool pauses for a person, and then checks the policy again in code: no approvals on totals that do not add up, nothing above the limit, no new suppliers. The prompt describes the rules. The code enforces them.

    Also a surprise in Agent Framework: the setting to chain only agent responses still includes the first agent's tool results, so raw data flows on. A test proves it, and we filter the context ourselves.

    {YOUTUBE_URL}

    #AIAgents #AzureAI
    Narration uses an AI voice.
