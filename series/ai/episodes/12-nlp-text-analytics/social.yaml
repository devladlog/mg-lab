linkedin_company:
  text: |
    Every service desk sits on a pile of free text that could tell you what is breaking and who is unhappy. It is also full of names, phone numbers and email addresses.

    Episode 12 of DEVLADLOG AI runs 13 fictional Contoso tickets in English, Portuguese and Spanish through Azure Language, with one rule: the analysis never sees the personal data.

    - Language detection first, then PII redaction by the service plus a local pass for identifiers only Contoso knows
    - Only redacted text goes on to sentiment with opinion mining, key phrases and entities
    - Fail closed: if redaction fails for a ticket, nothing else runs on its raw text
    - Service limits as constants, with batching and splitting
    - A privacy gate that searches every output for the strings we planted

    The gotcha: redaction removes what the service recognises, nothing more. The gate is a regression test, not a proof.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.
    #AzureLanguage #NLP #PII #AzureAI
linkedin_personal:
  text: |
    Order matters more than models in text analytics. In the NLP episode of DEVLADLOG AI the pipeline detects the language, removes the personal data, and only then runs sentiment, key phrases and entities on the redacted text.

    And it fails closed: if the PII call errors for a ticket, that ticket is blocked and its raw text goes nowhere else.

    The honest part: redaction removes what the service recognises, so an odd phone format can survive. My gate only finds the strings I planted, so it is a regression test, not a proof.

