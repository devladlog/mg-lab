linkedin_company:
  text: |
    Every package you add is code you did not write, running with your permissions. Can your team say who chose each version, where each package comes from, and what happens when a new advisory lands on a Friday?

    Episode 11 of DEVLADLOG Dev Tools puts those three answers into files, on a fictional Contoso orders API:

    - Central package management: one Directory.Packages.props decides every version
    - NuGet Audit warnings that become errors in one pipeline job only
    - Package source mapping, so Contoso.* comes only from the private feed
    - An Azure Artifacts feed, published by the build identity
    - Python tools pinned with hashes

    The gotcha: source mapping is not applied when the package is already in the global packages folder. A wrong mapping let a lookalike copy in, and fixing it changed nothing until we cleared the folder.

    Watch the episode: {YOUTUBE_URL}
    Code and tests: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.
    #DevTools #NuGet #DotNet #SupplyChainSecurity
linkedin_personal:
  text: |
    A pull request added an old web client library. Restore warned about Newtonsoft.Json 10.0.1, a high severity advisory, and nobody on the PR had asked for that package. It came in as a transitive dependency.

    The fix was one line in Directory.Packages.props. With transitive pinning on, every project gets the fixed version and no project file changes. Audit codes stay warnings on laptops and fail only in one dedicated pipeline job, so a new advisory does not block someone's bug fix.

    Episode 11 of DEVLADLOG Dev Tools: {YOUTUBE_URL}

    #NuGet #DotNet
    Narration uses an AI voice.
