linkedin_company:
  text: |
    Five developers, five different VS Codes: two formatters fighting over one file, a linter only half the team has, and an extension nobody remembers installing.

    Episode 2 of DEVLADLOG Dev Tools fixes that with files in the repo:
    - .vscode/extensions.json for workspace recommendations, short and per repository
    - Workspace settings with one default formatter per language
    - An audit script that compares code --list-extensions with the file and installs what is missing
    - The security controls VS Code gives you: publisher trust and the extensions.allowed setting

    When no marketplace extension matched our commit rules, we built one in TypeScript. It asks four questions and writes a Conventional Commit header into the commit box, keeping any body you already typed. The same rules are tested against the Git hook from episode 1.

    The gotcha: extensions.json is not strict JSON, so a plain JSON parser fails on it, and a regex that strips comments also eats half of every URL.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #VSCode #TypeScript #DevTools #ConventionalCommits
linkedin_personal:
  text: |
    A small bug from this episode that is worth knowing about: VS Code's own .vscode/extensions.json is not valid JSON. It allows comments and trailing commas, so Python's json.load fails on the first line.

    The quick fix is a regex that deletes everything after two slashes. That also deletes half of every URL inside a string. The audit script instead walks the text, skips comments only outside strings, then drops trailing commas, and there are tests for both cases.

    The rest of the episode covers recommendations, workspace settings and a small extension we build ourselves.

    {YOUTUBE_URL}

    Narration uses an AI voice.

    #VSCode #DevTools
