linkedin_company:
  text: |
    Every test is green, and the finance report takes two seconds. Nobody wrote a bug. The code is just slow, and a guess about why is usually wrong.

    DEVLADLOG Dev Tools episode 10 measures instead, on the same .NET orders API with 100,000 seeded orders:
    - A repeatable load that empties the report cache before every request, so a cached answer does not hide the cost
    - dotnet-counters for allocations and garbage collection, then dotnet-trace opened in Speedscope
    - The finding: my hunch was date formatting, and the trace put it at 0.1 percent. About 84 percent of busy time was reading and change-tracking every order
    - One fix: filter and group in the database. The median went from 1846 ms to 20 ms on a shared two-CPU machine, so read it as an order of magnitude
    - A guard test that counts queries and allocated bytes instead of seconds, so it cannot flake

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Full guide: {BLOG_URL}

    Narration uses an AI voice.

    #DevTools #DotNet #EFCore #Performance
linkedin_personal:
  text: |
    I was sure the slow report was the date formatting, because the code formats a date for every order. The trace said otherwise: 0.1 percent. About 84 percent of the busy time was inside ToListAsync, loading and change-tracking every order ever placed.

    Without the profile I would have optimised the wrong line. The fix was one query that filters and groups in the database.

    The part I like most is the guard: a test that counts SQL commands and allocated bytes, not seconds, so it does not flake on a busy build agent.

    Episode 10 of DEVLADLOG Dev Tools: {YOUTUBE_URL}

    Narration uses an AI voice.

    #DotNet #DevTools
