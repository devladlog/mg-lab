thumbnail_text: "GREEN TESTS.\nSLOW\nREPORT."
youtube:
  title: "Profiling .NET: dotnet-counters, dotnet-trace, Speedscope and EF Core | DEVLADLOG Dev Tools #10"
  tags: [performance, profiling, dotnet-trace, dotnet-counters, speedscope, EF Core, ASP.NET Core, SQLite, GC, load test, DevTools]
