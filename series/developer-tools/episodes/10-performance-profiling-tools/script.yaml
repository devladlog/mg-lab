# DEVLADLOG Dev Tools — episode 10. Code excerpts and outputs are real (src/orders-app, bugs/, tests/, run on the build
# machine on 21 Nov 2026: .NET SDK 10.0.115, dotnet-counters and dotnet-trace 10.0.750501, 100000 seeded orders, Release build,
# a shared 2 CPU machine: the milliseconds are real but noisy). The three `screen` scenes are recorded later on the Windows
# recording laptop (Windows Terminal, speedscope.app in a browser): see demo.md.
episode: 10
slug: performance-profiling-tools
