  - id: postcreate
    youtube_short_title: "A dev container post-create script that is safe to run twice #Shorts"
    instagram_reel:
      caption: |
        Our post-create script does three things. Docker creates a new named volume owned by root, and the tools run as the vscode user, so it takes ownership once.
        Then it installs the Git hooks, because git clone never copies hooks. Then it restores packages.
        It runs again after every rebuild, so every step is safe to repeat, and a failed restore stops it.
        Full episode: link in bio.
