linkedin_company:
  text: |
    A new developer joins the team. Day one is installing the right SDK, the right Python for the Git hooks, the GitHub CLI and the extensions, then asking why the tests fail only on their machine.

    Episode 3 of DEVLADLOG Dev Tools turns that list into one file in the repository:
    - A .NET 10 dev container image on Ubuntu, with Features for Python and the GitHub CLI
    - A forwarded port, a NuGet cache volume and the team's extensions
    - A post-create script that installs the Git hooks and restores packages, safe to run twice
    - 45 pytest tests that check the configuration without a Docker daemon

    The gotcha: we pinned the image with a major version of 1. When the image moved to its next major, that tag stopped being rebuilt, and it was still serving a release candidate SDK. Nothing failed. So we wrote a small check that compares the pinned and floating tags in the registry and exits with an error when the pin falls behind.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #DevContainers #VSCode #DotNet #Docker #DevTools
linkedin_personal:
  text: |
    Pinning a dev container image to a major version sounds like the safe choice. It was not, for us.

    We pinned mcr.microsoft.com/devcontainers/dotnet to the 1-10.0-noble tag. When the image moved on to its next major, that tag simply stopped being rebuilt. Our pin was last built in October 2025 and still carried a release candidate SDK. No error, no warning.

    A small script now reads both tags from the registry and fails when the pin falls behind. No Docker needed to run it.

    Pin majors, and check that the pin still moves: {YOUTUBE_URL}

    Narration uses an AI voice.

    #DevContainers #DotNet
