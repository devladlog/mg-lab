linkedin_company:
  text: |
    Your first Dockerfile builds, the container runs, the demo works. It also ships the whole SDK, runs as root, bakes a password into the image and downloads every package again when you change one line.

    Episode 4 of DEVLADLOG Dev Tools fixes that for a .NET 10 orders API:
    - A small linter that flags the naive Dockerfile: 10 errors and 2 warnings
    - A multi-stage build with restore as its own layer, pinned by tag and digest
    - A chiseled final image that runs as the non-root app user on port 8080
    - Compose with SQL Server: the API starts only when the database is healthy, and the password comes from a required .env value

    The gotcha: the SQL client encrypts by default, the dev SQL Server container has a self-signed certificate, and the connection fails until you add TrustServerCertificate. Microsoft Learn says that is for controlled development environments only, never production.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #Docker #DockerCompose #DotNet #SQLServer #DevTools
linkedin_personal:
  text: |
    One detail from this episode that I think more people should know: a chiseled .NET image has no shell. docker exec into the API fails, by design. That is the point. No shell, no package manager, non-root by default.

    The other change that pays off every day is ordering. Copy only the project file, restore, then copy the source. Edit one .cs file and the restore layer comes from cache.

    The episode builds the fixed Dockerfile and a Compose stack with SQL Server, and checks both with tests that need no Docker daemon.

    {YOUTUBE_URL}

    Narration uses an AI voice.

    #Docker #DotNet
