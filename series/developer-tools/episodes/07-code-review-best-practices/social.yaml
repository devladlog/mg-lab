linkedin_company:
  text: |
    The tests are green, the pull request is small, and the code still returns a 500 for a perfectly normal request. That is what a code review is for.

    Episode 7 of DEVLADLOG Dev Tools builds a review process where the machines do the boring half and the human part finds the real bug:
    - A pull request template written as a map for the reviewer, with a check that the sections exist and are not placeholders
    - Size and routing checks before a human looks: lines to read per area, and who owns which files
    - Comments labelled with Conventional Comments, with a small linter requiring issues, questions and to-dos to say blocking or non-blocking
    - A reproduced bug: two failing tests prove that cancelling an unknown order returns a 500 and cancelling twice quietly succeeds
    - A queue metric for hours to first review, to see waiting, never to rank people

    One gotcha is ours: our first suggestion block dropped a line, and the author's own test failed when it was applied as written.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #CodeReview #GitHub #DotNet #PullRequests #DevTools
linkedin_personal:
  text: |
    My own mistake from this episode: I wrote a GitHub suggestion that replaced two lines with a single guard clause, and I dropped the assignment that was on one of them.

    A suggestion replaces exactly the lines it is anchored to. Applied as written, the author's own test failed: the status stayed "open" instead of "cancelled".

    So now I build the suggestion, run the tests, and only then post it. It sounds obvious. It is also easy to skip when the comment is a one-click change.

    {YOUTUBE_URL}

    Narration uses an AI voice.

    #CodeReview #GitHub
