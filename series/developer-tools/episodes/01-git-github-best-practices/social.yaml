linkedin_company:
  text: |
    Every team has a Git best practices page. Every team also has a main branch full of commits called "fix" and "updated stuff".

    In episode 1 of DEVLADLOG Dev Tools we turn that page into checks that actually run, in three layers:
    - Local hooks: Conventional Commit messages, no commits on main, no staged secrets, no oversized files
    - CI: the same Python module re-checks every tracked file and the pull request title on the server
    - A GitHub ruleset, kept as JSON in the repo: pull request required, one approval including code owners, squash only, the three CI jobs required

    One honest finding: hooks are optional. git commit --no-verify skips them, token and all, so the layer that really catches it is CI. We also reproduce a hook that breaks on Windows line endings and show the .gitattributes fix.

    The kit comes with 54 pytest tests, most of them making real git commits in throwaway repos.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #Git #GitHub #GitHubActions #ConventionalCommits #DevTools
linkedin_personal:
  text: |
    A best practices page only works if something checks it. For this episode I built one small Python module that backs a local hook, a CI job and a GitHub ruleset, so the rule you see locally is the rule the server enforces.

    The lesson worth spelling out: hooks are only fast feedback. git commit --no-verify skips them completely, including the secret check. A test in the kit proves it: the --no-verify commit with a token succeeds locally, and the CI scan fails on it.

    Full walkthrough: {YOUTUBE_URL}

    Narration uses an AI voice.

    #Git #DevTools
