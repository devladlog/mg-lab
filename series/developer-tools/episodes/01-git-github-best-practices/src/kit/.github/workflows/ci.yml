name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege for GITHUB_TOKEN; raise per job only if a job needs more.
permissions:
  contents: read

# A new push to the same PR cancels the run that is now out of date.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pyyaml
      - run: python -m pytest -q

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Backstop for `git commit --no-verify`: scan every tracked file, not just the diff.
      - run: python3 tools/repo_guard/cli.py scan-tree

  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Squash merge uses the PR title as the commit message, so the title must be a Conventional Commit.
      # Untrusted input goes through an env var, never ${{ }} inside the script (script injection).
      - name: Conventional Commit PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 tools/repo_guard/cli.py title "$PR_TITLE"
