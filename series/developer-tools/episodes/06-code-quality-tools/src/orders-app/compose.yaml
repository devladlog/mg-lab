# Local stack: the API image built from ./Dockerfile plus SQL Server, on a private network.
#   cp .env.example .env    (then set a strong MSSQL_SA_PASSWORD)
#   docker compose up --build        # or: docker compose watch
name: contoso-orders

services:
  api:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}   # CI sets the commit SHA; /healthz reports it
    image: contoso/orders-api:dev
    ports:
      - "127.0.0.1:8080:8080"          # loopback only: not reachable from the rest of the network
    environment:
      Database__Provider: SqlServer
      # "db" is the service name: Compose's network resolves it. TrustServerCertificate only because the
      # dev SQL Server uses a self-signed certificate; never in production.
      ConnectionStrings__Orders: >-
        Server=db;Database=Orders;User Id=sa;TrustServerCertificate=True;
        Password=${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy     # wait until SQL Server answers, not just until it starts
    develop:
      watch:
        - action: rebuild
          path: ./src

  db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:1433:1433"          # optional: SSMS or VS Code on the host
    volumes:
      - mssql-data:/var/opt/mssql      # data survives "docker compose down" (not "down -v")
    healthcheck:
      # $$ = the container's own variable, so the password is never written into this file
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD"
          -No -b -Q "SELECT 1" -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  mssql-data:
