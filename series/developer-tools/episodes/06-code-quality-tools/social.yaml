episode: 6
series: "DEVLADLOG Dev Tools"
status: draft-hold-for-review
ai_label: true
youtube_url: "{YOUTUBE_URL}"
linkedin_company:
  text: |
    If a human reviewer is the one pointing out an unused import, a missing cancellation token or a wrong indent, your quality bar depends on someone's mood.

    Episode 6 of DEVLADLOG Dev Tools moves those rules into the build and the pipeline, on a .NET 10 orders API:
    - Directory.Build.props switches on analysis level 10 and makes warnings errors; .editorconfig holds the rules with a severity each
    - dotnet format fixes locally and only reports in CI: it repairs seven of the eight findings in our demo file, and the culture rule needs a human
    - Ruff for the Python tools, pinned to an exact version so a new release cannot turn a green pipeline red overnight
    - A coverage gate on the lines you changed, not just the total

    That last one matters. Our example pull request has 91 percent total coverage, so a total-only gate passes, yet only 5 of its 13 changed lines ran in a test. The diff gate fails it.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #DotNet #CodeQuality #Ruff #GitHubActions #DevTools
linkedin_personal:
  text: |
    Coverage totals lie. In this episode a pull request adds a tested CSV export and a discount method with no test. Total coverage is 91.4 percent, so a gate on the total passes.

    But only 5 of the 13 lines the pull request changed ran in a test. That is 38.5 percent, and the gate set at 80 percent on changed lines fails it, listing the exact lines that no test covers.

    Measuring the lines you touched means the review asks for the missing test, instead of someone hunting through a coverage report.

    {YOUTUBE_URL}

    Narration uses an AI voice.

    #DotNet #CodeQuality
