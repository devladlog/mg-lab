  - id: hang
    youtube_short_title: "Two locks, opposite order: reading a .NET deadlock dump #Shorts"
    instagram_reel:
      caption: |
        The API looks healthy but two requests never answer. dotnet-stack lists every thread, and two of them wait in Monitor.Enter, one in Invalidate and one in Snapshot.

        The dump shows two locks, each owned by a different thread, and the stacks name the file and line. The fix is one lock order everywhere, plus a test with a timeout so a deadlock fails instead of hanging. Dumps are copies of memory, so delete them.

        Full episode: link in bio
