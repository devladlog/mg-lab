linkedin_company:
  text: |
    The finance report is missing the orders from the last day of the month. No exception, no crash, just wrong numbers.

    DEVLADLOG Dev Tools episode 9 finds the cause with five techniques on one .NET orders API:
    - Turn the report into a failing test first: Expected 30, Actual 29
    - git bisect run names the commit that caused it: six commits, two test runs. The script exits 125 for a commit that does not build or where the test does not exist, because dotnet test with a filter that matches nothing exits 0
    - The VS Code debugger: launch configuration in the repo, breakpoint, logpoint, conditional breakpoint
    - One request out of the logs by trace id. The traceId field in the error body is the W3C traceparent form, not the bare trace id
    - A hang read from dotnet-stack and dotnet-dump: two locks taken in opposite order

    The patches, scripts and 70 automated tests are in the repo.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Full guide: {BLOG_URL}

    Narration uses an AI voice.

    #DevTools #DotNet #VSCode #Git
linkedin_personal:
  text: |
    A "bug fix" that is really a refactor: someone computed the last day of the month once, and the report quietly lost every order dated the 31st. No exception, just 29 instead of 30.

    The habit that paid off is boring. Write the failing test first, then let git bisect run search for the commit, with a script that exits 125 to skip commits it cannot test. Careful: dotnet test with a filter that matches nothing exits 0, so an old commit would look good.

    Episode 9 of DEVLADLOG Dev Tools: {YOUTUBE_URL}

    Narration uses an AI voice.

    #DotNet #Git #DevTools
