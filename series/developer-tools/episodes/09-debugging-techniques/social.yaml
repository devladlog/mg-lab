  - id: bisect
    youtube_short_title: "git bisect run: find the bad commit in 2 test runs #Shorts"
    instagram_reel:
      caption: |
        Give git bisect one good commit, one bad commit, and a script that exits zero or one. Six commits to search, two test runs, and git names the refactor that broke the month-end report.

        The trap: dotnet test with a filter that matches nothing prints a warning and exits 0, so an old commit would look good. The script checks that the test really ran, otherwise it exits 125 to skip.

