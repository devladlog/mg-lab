# API tests: the Postman collection from api-tests/, run headless against the API built from this commit.
#
#   lint collection ─► OpenAPI coverage ─► start the API (dotnet run) ─► Newman: Health+Orders+Validation, Data-driven
#                                                                      └► JUnit gate (did the tests actually run?)
name: api-tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  api-tests:
    name: api-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api-tests/package-lock.json
      - name: Install Newman (pinned in package-lock.json)
        working-directory: api-tests
        run: npm ci --no-audit --no-fund
      - name: Lint the collection and the environments
        working-directory: api-tests
        run: npm run lint
      - name: Every documented operation and response has a test
        working-directory: api-tests
        run: npm run coverage
      - name: Run the collection against the API built from this commit
        env:
          EXPECTED_VERSION: ${{ github.sha }}
        run: bash scripts/run-api-tests.sh
      - name: Keep the JUnit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-test-results
          path: api-tests/results/
          if-no-files-found: error
          retention-days: 14
