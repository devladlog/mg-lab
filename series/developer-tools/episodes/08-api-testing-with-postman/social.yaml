linkedin_company:
  text: |
    Your API tests pass and the pipeline is green. How many assertions actually ran? A Postman collection with no tests exits with success, and nobody notices.

    Episode 8 of DEVLADLOG Dev Tools builds API tests that can fail, for a .NET 10 orders API:
    - The API publishes its own OpenAPI document; we commit a snapshot so a contract change shows up in a pull request
    - A Postman collection that checks status, validates the body against a strict schema, and follows a create-then-read flow
    - A data file that drives six invalid orders through one request, each rejected for the right field
    - Newman runs the same collection headless in GitHub Actions, with JUnit reports

    Two gotchas: the generated schema lets an integer also be a string, so we write a strict one by hand; and with every test removed, 9 requests ran, 0 assertions, exit code 0. A small gate counts assertions and fails.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #Postman #APITesting #OpenAPI #GitHubActions #DevTools
linkedin_personal:
  text: |
    Nothing to fail is not the same as everything passed.

    For this episode I removed every test from a Postman collection and ran it with Newman. Nine requests, zero assertions, exit code 0. A green build proving nothing.

    A small script now reads the JUnit report and fails unless at least the expected number of assertions ran. A linter also rejects any request that has no tests of its own.

    If you run API tests in CI, count what ran, not just what failed: {YOUTUBE_URL}

    Narration uses an AI voice.

    #Postman #APITesting #DevTools
