  text: |
    Can an API test pass when it checks nothing? Yes.

    In this DEVLADLOG episode we build Postman tests that can fail for a .NET API, run them in GitHub Actions, and show a collection with no tests that still exits with success. Then we add a check that counts the assertions.

    Watch it here: {YOUTUBE_URL}

    Narration uses an AI voice.

    #Postman #DevTools
