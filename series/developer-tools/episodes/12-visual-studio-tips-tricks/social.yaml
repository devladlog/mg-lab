linkedin_company:
  text: |
    Most Visual Studio tips are shortcuts you forget by Friday. The ones that last are files you commit.

    Episode 12 of DEVLADLOG Dev Tools teaches a fictional Contoso orders API about Visual Studio:

    - A .vsconfig that lists the workload and components the repository needs
    - Solution filters that load and build only part of the solution, and dotnet build accepts them too
    - A snippet for the API test you keep writing, expanded and compiled in the test project
    - One .runsettings file, wired to every runner by a property in Directory.Build.props
    - A launch profile that sets environment variables and keeps Hot Reload on
    - A small Python check for the files that fail quietly

    The gotcha: dotnet test does not auto-detect a .runsettings in the solution root. We removed the property and the test that reads the environment variable failed.

    Watch the episode: {YOUTUBE_URL}
    Code and tests: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.
    #DevTools #VisualStudio #DotNet #Testing
linkedin_personal:
  text: |
    I assumed a .runsettings file in the solution root just works. Visual Studio can auto-detect it if you switch that option on. dotnet test never does.

    I removed the RunSettingsFilePath property and the test that reads an environment variable failed with "CONTOSO_REGION is '(not set)'". Passing --settings fixes one command. Setting the property in Directory.Build.props fixes every runner.

    That is one of five repository files in episode 12 of DEVLADLOG Dev Tools: {YOUTUBE_URL}

    #VisualStudio #DotNet
    Narration uses an AI voice.
