linkedin_company:
  text: |
    The pipeline is green and the deploy step says succeeded. Which commit is running in production right now? If the pipeline itself cannot answer that, it is not finished.

    Episode 5 of DEVLADLOG Dev Tools builds one GitHub Actions workflow with five jobs for a .NET 10 API:
    - Guardrails from episode 1, then build and test with actions pinned to commits and packages restored in locked mode
    - An end-to-end job that runs episode 4's Compose stack with a real SQL Server and a smoke test of the container
    - Publish on main only: one image, tagged with the full commit, with a signed build provenance attestation
    - A deploy job behind a required approval, using OIDC instead of a stored password, that is done only when the live app reports your commit

    The trap we cover: when there is no database, the SQL Server tests skip, dotnet test exits with zero, and the job is green with nothing proven. Our gate counts tests that ran.

    91 tests check the workflow, scripts and Bicep.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #GitHubActions #CICD #DotNet #Docker #DevTools
linkedin_personal:
  text: |
    A skipped test is not a passing test, and dotnet test will not tell you the difference.

    In this episode the SQL Server tests have no database to talk to. All four are skipped, dotnet test exits with zero, and the job is green. Even the .trx counters show zero not executed.

    The fix is small: a script reads the report, demands at least four tests that actually passed, and fails if any were skipped. Count tests that ran, not tests that did not fail.

    The rest of the pipeline is in the episode: {YOUTUBE_URL}

    Narration uses an AI voice.

    #GitHubActions #DotNet #CICD
