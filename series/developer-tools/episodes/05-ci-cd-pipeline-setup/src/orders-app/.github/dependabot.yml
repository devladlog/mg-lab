# Keeps the SHA-pinned actions in .github/workflows current: Dependabot opens a PR with the new commit SHA and
# updates the "# vX.Y.Z" comment on the same line. The PR then runs the whole pipeline like any other change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
