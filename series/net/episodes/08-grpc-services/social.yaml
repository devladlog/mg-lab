linkedin_company:
  text: |
    A program talks to our API and neither side writes a single line of serialization code. That is gRPC, and it comes with a couple of traps that only show up when you run it for real.

    In episode 8 of DEVLADLOG .NET we add a gRPC front door to the project requests API:
    - requests.proto, the contract, written first
    - Unary, server streaming and client streaming calls
    - The same database and the same validation rules as REST, on a second port
    - A console client with deadlines and retries (retry only what is safe to repeat)
    - 32 new tests, then the same API on real Kestrel

    The trap everyone hits once: point the client at the REST port and you get Internal, HTTP_1_1_REQUIRED instead of a friendly message.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #DotNet #gRPC #ASPNETCore #Protobuf #CSharp
linkedin_personal:
  text: |
    Point a gRPC client at the wrong port and you do not get a friendly message. In episode 8 of DEVLADLOG .NET our console client got: Internal, "The HTTP/2 server closed the connection", HTTP_1_1_REQUIRED. Going the other way, curl with HTTP/1.1 to the gRPC port got a 400.

    Plain http needs an HTTP/2-only endpoint, because without TLS there is no protocol negotiation. So development has two ports: one for REST, one for gRPC.

    The episode also covers deadlines, retries and why money should not be a double.

    {YOUTUBE_URL}

    Narration uses an AI voice.

    #DotNet #gRPC
