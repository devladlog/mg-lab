  - id: wrongport
    type: screen
    heading: "Gotcha: the wrong port"
    image: screens/wrong-port.jpg
    video: screens/wrong-port.mp4
    bar: "Terminal · requests-cli --address http://localhost:5207"
    short: wrongport
    demo: >
      Terminal in src/ProjectRequests.Cli. Run: dotnet run -- --address http://localhost:5207 get 1. In frame: the
      error "gRPC error: Internal - Error starting gRPC call. HttpRequestException: The HTTP/2 server closed the
      connection. HTTP/2 error code 'HTTP_1_1_REQUIRED'". Then curl.exe --http1.1 -o NUL -w "%{http_code}"
      http://localhost:5208/healthz which prints 400. Then the right port: dotnet run -- get 1 works.
    narration: >
      The trap everyone hits once. Point the client at the REST port, and you don't get a friendly message. You get
      internal, and the H T T P two server closed the connection, error code H T T P one point one required. The
      port speaks only H T T P one. Send H T T P one to the gRPC port, and you get a four hundred. Two ports, two
      protocols. Same thing, backwards.

  - id: decimal
    type: code
    heading: "Gotcha: money is not a double"
    lang: csharp
    code: |
      public partial class DecimalValue   // generated half: Units, Nanos
      {
          public static implicit operator decimal(DecimalValue v) => v.Units + v.Nanos / 1_000_000_000m;
          public static implicit operator DecimalValue(decimal value)
          {
              var units = decimal.ToInt64(value);                          // truncates toward zero
              var nanos = decimal.ToInt32((value - units) * 1_000_000_000m);   // same sign as units
              return new DecimalValue(units, nanos);
          }
      }
      // Test: 12,345.67 survives the wire
      Assert.Equal(12_345, stored.Budget.Units);
      Assert.Equal(670_000_000, stored.Budget.Nanos);
    narration: >
      Back to the budget. Nine decimal places, no rounding, thanks to a small partial class with two implicit
      operators. The test checks twelve thousand three hundred forty-five sixty-seven comes back exactly. The
      catch, and Learn says it too: other languages have to know this format, so a shared contract needs it
      documented.

  - id: retries
    type: code
    heading: "Deadlines and retries"
    lang: csharp
    code: |
      var retryReads = new RetryPolicy
      {
          MaxAttempts = 3, InitialBackoff = TimeSpan.FromMilliseconds(200), MaxBackoff = TimeSpan.FromSeconds(2),
          BackoffMultiplier = 2, RetryableStatusCodes = { StatusCode.Unavailable },
      };
      ServiceConfig = new ServiceConfig { MethodConfigs =
      {
          new MethodConfig { Names = { new MethodName { Service = ServiceName, Method = "GetRequest" } }, RetryPolicy = retryReads },
          new MethodConfig { Names = { new MethodName { Service = ServiceName, Method = "ListRequests" } }, RetryPolicy = retryReads },
          // nothing for ImportRequests: a retried import could create the rows twice
      } }
      // every call: a deadline is a UTC time, and there is no default one
      await client.GetRequestAsync(request, deadline: DateTime.UtcNow.Add(timeout), cancellationToken: ct);
    narration: >
      Deadlines and retries. A deadline is a U T C time, and there is no default, so without one a call can wait
      forever. Retries are configured once, on the channel, for status unavailable. We list only the two reads.
      Import gets no policy, because retrying it could create the same requests twice. Learn adds that a call
      that already received headers is committed, and streaming reads don't retry after the first message.

  - id: deadlinescreen
    type: screen
    heading: "Unavailable and DeadlineExceeded"
    image: screens/deadline.jpg
    video: screens/deadline.mp4
    bar: "Terminal · requests-cli · deadline and a stopped server"
    demo: >
      Terminal in src/ProjectRequests.Cli. First: dotnet run -- --deadline 0.001 list. In frame: "gRPC error:
      DeadlineExceeded". Then Ctrl+C the API terminal and run dotnet run -- get 1. In frame (after about a second and
      a half, the retries): "gRPC error: Unavailable - Error connecting to subchannel." Restart the API afterwards.
    narration: >
      A one millisecond deadline: deadline exceeded, immediately. Now stop the server and ask for a request. The
      client tries three times with backoff, then gives up with unavailable. Both are statuses you can switch on,
      not stack traces to parse.

  - id: browser
    type: bullets
    heading: "gRPC and the browser, SignalR and gRPC"
    bullets:
      - "Browsers can't make HTTP/2 gRPC calls: gRPC-Web"
      - "gRPC-Web: no client or bidirectional streaming"
      - "Blazor WebAssembly stays on REST and SignalR here"
      - "Broadcast to many clients: SignalR, not gRPC"
      - "Services talking to services: gRPC"
    narration: >
      So where does it fit? Browsers can't make the H T T P two calls gRPC needs, so Blazor WebAssembly would need
      gRPC-Web, which drops client and bidirectional streaming. Our board stays on REST and SignalR. And Learn
      says it plainly: for broadcasting to many clients, use SignalR. gRPC is for services talking to services.

  - id: tests
    type: screen
    heading: "A real gRPC client, in memory"
    image: screens/tests.jpg
    video: screens/tests.mp4
    bar: "Terminal · dotnet test"
    demo: >
      VS Code terminal in the episode folder: Clear-Host; dotnet test. In frame: both test apps passed, total 133,
      succeeded 132, skipped 1 (episode 5's opt-in SQL Server test). Optional: Testing view with GrpcServiceTests,
      CliTests and CancellationStatusInterceptorTests expanded. Compare deploy/tests.output.txt.
    narration: >
      All of it runs in dotnet test. The real client against the real service, over the test server. Statuses,
      streams, the decimal, the deadline, even a fake outage to count retries. A hundred and thirty-three tests,
      one skipped, the SQL Server one from episode five.

  - id: takeaways
    type: bullets
    heading: "Take this with you"
    bullets:
      - "Contract first: one proto file, generated server and client"
      - "Plain http: an HTTP/2-only port. Otherwise TLS"
      - "Statuses, not HTTP codes: NotFound, Unavailable, DeadlineExceeded"
      - "Always a deadline; retry only what is safe to repeat"
      - "Pass the call's cancellation token to everything"
    narration: >
      To recap. The contract comes first. Plain H T T P means an H T T P two only port. Errors are statuses, so
      catch the R P C exception. Always set a deadline, and retry only what's safe to repeat. And pass the call's
      cancellation token to everything you await.

