  - id: hook
    type: title
    heading: "gRPC Services"
    sub: "Write the contract first"
    short: hook
    narration: >
      Last time the server pushed to browsers. This time a program talks to our API, and neither side writes a
      single line of serialization code. gRPC. A contract file, generated clients, streaming in both directions,
      and a couple of traps that only show up when you run it for real. Welcome to DEVLADLOG dot net.

  - id: plan
    type: bullets
    heading: "What we're building"
    bullets:
      - "requests.proto: the contract, written first"
      - "Three calls: unary, server streaming, client streaming"
      - "Same database, same rules as REST, second port"
      - "A console client with deadlines and retries"
      - "32 new tests, then the same API on real Kestrel"
    narration: >
      The plan. One proto file defines the service. The API gets a second front door, on its own port, with the
      same database and the same validation as REST. A console client calls it with deadlines and retries.
      Thirty-two new tests, and then all of it on real Kestrel.

  - id: proto
    type: code
    heading: "The contract comes first"
    lang: protobuf
    code: |
      // requests.proto (condensed): messages, service base class and client are generated from this
      service Requests {
        rpc GetRequest (GetRequestMessage) returns (RequestReply);                // unary
        rpc ListRequests (ListRequestsMessage) returns (stream RequestReply);     // server streaming
        rpc ImportRequests (stream NewRequestMessage) returns (ImportReply);      // client streaming
      }
      // Protobuf has no decimal: units and nanos, the format Learn documents
      message DecimalValue { int64 units = 1; sfixed32 nanos = 2; }
      message RequestReply {
        int32 id = 1;
        DecimalValue budget = 3;
        google.protobuf.StringValue justification = 6;   // wrapper: a string that can be null
        google.protobuf.Timestamp decided_at = 11;       // message field: null until set
      }
    narration: >
      The proto file is the contract, and the server and client code are generated from it. Three call shapes.
      Unary, one message each way. Server streaming, many replies. Client streaming, many requests, one answer.
      Protobuf has no decimal type, so the budget travels as units and nanos, the format Learn documents. And a
      plain string can't be null, so the optional justification uses the string value wrapper.

  - id: service
    type: code
    heading: "Unary and server streaming"
    lang: csharp
    code: |
      public override async Task<RequestReply> GetRequest(GetRequestMessage request, ServerCallContext context)
      {
          var dto = await db.Requests.Where(r => r.Id == request.Id).Select(RequestEndpoints.ToDto)
              .FirstOrDefaultAsync(context.CancellationToken);
          return dto?.ToReply() ?? throw new RpcException(new Status(StatusCode.NotFound, $"Request {request.Id} not found."));
      }

      public override async Task ListRequests(ListRequestsMessage request,
          IServerStreamWriter<RequestReply> responseStream, ServerCallContext context)
      {
          await foreach (var dto in query.OrderBy(r => r.Id).Select(RequestEndpoints.ToDto).AsAsyncEnumerable()
                             .WithCancellation(context.CancellationToken))
              await responseStream.WriteAsync(dto.ToReply(), context.CancellationToken);   // one message per row
      }
    narration: >
      The service derives from the generated base class. Not found is not an H T T P four oh four. It's a status
      code, not found, sent in the trailers, and the client sees an R P C exception. The streaming method writes one
      message per row, and every awaited call gets the call's cancellation token, so a client that goes away stops
      the work.

  - id: import
    type: code
    heading: "Client streaming reuses the REST rules"
    lang: csharp
    code: |
      // ImportRequests (condensed)
      await foreach (var message in requestStream.ReadAllAsync(context.CancellationToken))
      {
          var row = ++reply.Received;
          var input = message.ToCreateRequest();            // the same input model POST /api/requests validates
          if (!Validator.TryValidateObject(input, new ValidationContext(input), results, true))
              { /* add errors with this row number */ continue; }      // a bad row doesn't stop the import

          var (created, errors) = await RequestEndpoints.CreateCoreAsync(input, db, clock, events, ct);
          if (created is not null) reply.CreatedIds.Add(created.Id);   // creation code shared with REST,
      }                                                                // including last episode's SignalR push
      return reply;                                                    // one answer, at the end
    narration: >
      Client streaming. The service reads rows as they arrive, runs the same data annotation rules the REST
      endpoint uses, and calls the same creation code. That code also does last episode's SignalR push, so
      imported requests show up on the live board. A bad row is reported with its position, and doesn't stop
      the rest. The single reply comes when the client says it's done.

  - id: kestrel
    type: code
    heading: "gRPC needs HTTP/2: its own port"
    lang: json
    code: |
      // appsettings.Development.json
      "Kestrel": { "Endpoints": {
        "Rest": { "Url": "http://localhost:5207", "Protocols": "Http1" },
        "Grpc": { "Url": "http://localhost:5208", "Protocols": "Http2" }
      } }

      // Program.cs
      builder.Services.AddGrpc(o =>
      {
          o.EnableDetailedErrors = builder.Environment.IsDevelopment();   // can leak details: dev only
          o.Interceptors.Add<CancellationStatusInterceptor>();
      });
      app.MapGrpcService<RequestsGrpcService>();
    narration: >
      gRPC needs HTTP/2. Without T L S, Learn says the endpoint must be HTTP/2 only, because an endpoint offering
      both can't negotiate, and calls fail. So development gets two ports. Fifty-two oh seven for REST and SignalR,
      fifty-two oh eight for gRPC. In production you'd use T L S. Detailed errors stay a development switch,
      because Learn warns they can leak sensitive information.

