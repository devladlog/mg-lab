  - id: gotcha
    youtube_short_title: "Three ASP.NET Core API gotchas that bit us #Shorts"
    instagram_reel:
      caption: |
        Three gotchas. A Produces application/json attribute on the controller changed our error responses from problem+json to plain json, and two tests caught it.

        One class-level ProducesResponseType 401 made every 200 disappear from the OpenAPI document. And dotnet user-jwts with --role writes a role claim, singular, while Entra writes roles. Use --claim roles instead.

        Full episode: link in bio

