linkedin_company:
  text: |
    Most API tutorials stop at "it returns JSON". Then production asks: who is calling, what are they allowed to do, what does an error look like, and what happens when someone hammers the endpoint?

    In episode 2 of DEVLADLOG .NET we answer all four with an ASP.NET Core controller API on .NET 10, an expense claims service.
    - JWT bearer authentication with the authority and audience in configuration
    - Approvers need the Claims.Approve app role, and nobody can approve their own claim
    - One exception handler, so every error is problem details
    - Rate limiting per user: five submits per minute, then 429 instead of the default 503
    - Tests that use the real JwtBearer handler, not a fake login

    We also show three gotchas, including a Produces attribute that quietly changed our error content type.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #DotNet #ASPNETCore #WebAPI #RateLimiting #CSharp
linkedin_personal:
  text: |
    ASP.NET Core rate limiting rejects with a 503 by default. That tells clients your server is down, not that they are going too fast. In episode 2 of DEVLADLOG .NET we set 429 explicitly and partition the limit by user.

    One more detail: UseRateLimiter must come after UseAuthentication. Otherwise every request lands in the same anonymous partition. Also, the limiter runs before model validation, so invalid submits use up permits too, and a test pins it.

    {YOUTUBE_URL}

    Narration uses an AI voice.

    #DotNet #ASPNETCore
