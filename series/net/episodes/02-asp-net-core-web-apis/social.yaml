    instagram_reel:
      caption: |
        Rate limiting is built into ASP.NET Core, with one surprise: rejected requests get a 503 by default, which tells clients the server is down. Set 429.

        Partition by user, so one noisy client doesn't block everyone. And call UseRateLimiter after authentication, otherwise every caller lands in the same anonymous window.

        Full episode: link in bio

