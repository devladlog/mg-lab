  - id: captive
    youtube_short_title: "A captive DbContext: no exception, just wrong data #Shorts"
    instagram_reel:
      caption: |
        A singleton that takes the DB context in its constructor is created once, so it keeps the first DB context forever.

        We approve a request through the API and ask both. The API, with a fresh context, says Approved. The captive singleton says Submitted, because its change tracker hands back the object it already has. No exception. Just wrong data.

        Full episode: link in bio

        #DotNet #DependencyInjection #EFCore #CSharp
      cover_text: "No exception. Wrong data."
    tiktok:
      caption: "Singleton + DbContext = captive dependency. After approval the API says Approved, the singleton still says Submitted. No exception. #DotNet #EFCore #CSharp"
  - id: gotcha
    youtube_short_title: "BackgroundService gotchas: one exception stops the host #Shorts"
    instagram_reel:
      caption: |
        Three gotchas from the DI episode. Our digest query sorted after projecting into a record, and EF Core couldn't translate it: sort before the projection.

        Advancing a fake clock four days on a one-day timer gave four digests, not one.

        And since .NET 6 an unhandled exception in a BackgroundService stops the whole host, so every run is caught and logged. We removed that catch, and a test failed.

        Full episode: link in bio

        #DotNet #BackgroundService #CSharp #EFCore
      cover_text: "One exception stops the host"
    tiktok:
      caption: "Since .NET 6 an unhandled exception in a BackgroundService stops the whole host. One failed webhook would take the API down. #DotNet #CSharp #ASPNETCore"
