linkedin_company:
  text: |
    Here is a bug that passes every test on your laptop. In production the app starts fine, then quietly serves data that is no longer true. The cause: a singleton that takes a DbContext in its constructor.

    In episode 4 of DEVLADLOG .NET we add a background digest feature to the project requests API and catch that bug before it ships.
    - Scope validation is on by default only in Development, so Production starts anyway and returns stale data
    - A BackgroundService that creates one scope per run
    - Keyed services to pick the notification channel by name
    - Options with ValidateOnStart, so a bad setting stops the app at startup
    - Everything on the built-in container, with tests pinning each rule

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #DotNet #DependencyInjection #ASPNETCore #CSharp #BackgroundService
linkedin_personal:
  text: |
    The nastiest DI bug in episode 4 of DEVLADLOG .NET did not throw. A singleton captured the first DbContext, and after we approved a request through the API it still said Submitted. Its change tracker kept handing back the object it already had.

    ValidateScopes and ValidateOnBuild are on by default only in Development, so Production started without complaint. If you can afford it, turn validation on everywhere.

    The episode also covers keyed services, ValidateOnStart and why one exception stops a BackgroundService host.

    {YOUTUBE_URL}

    Narration uses an AI voice.

    #DotNet #DependencyInjection
