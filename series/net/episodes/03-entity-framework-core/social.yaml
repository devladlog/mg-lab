linkedin_company:
  text: |
    An approver opens a request for 40,000. While they read it, the requester raises it to 400,000. The approver clicks approve. What got approved?

    In episode 3 of DEVLADLOG .NET we move the project requests API from an in-memory store to Entity Framework Core 10, and make the answer "nothing, until they have seen the new number".
    - A concurrency token that is the version the client saw, not just the version read a few milliseconds ago
    - Reads as projections: one SELECT, nothing tracked
    - Separate migration sets per provider, plus a committed SQL script checked by a test
    - SQLite for local runs and tests

    We also cover three gotchas: dates losing their Z, DateTimeOffset on SQLite, and case-sensitive text comparison.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #DotNet #EntityFrameworkCore #EFCore #SQLite #CSharp
linkedin_personal:
  text: |
    Loading a row and saving it only protects the few milliseconds between your SELECT and your UPDATE. The approver in our demo looked at the screen for minutes.

    In episode 3 of DEVLADLOG .NET the client sends back the version it read, and we set that as the original value of the EF Core concurrency token. If the row changed since, the update matches zero rows and the API answers 409. Removing that one line makes the 409 test fail; we tried.

    {YOUTUBE_URL}

    Narration uses an AI voice.

    #DotNet #EFCore
