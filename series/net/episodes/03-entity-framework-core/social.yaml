    instagram_reel:
      caption: |
        Three gotchas from this EF Core episode. Right after a POST, createdAt ended with a Z. Read it back and the Z was gone, because the database doesn't store DateTime.Kind.

        We used DateTime, not DateTimeOffset, because SQLite can't order DateTimeOffsets in SQL. And SQLite compares text case-sensitively while SQL Server doesn't, so we normalise department codes.

