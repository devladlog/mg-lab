  - id: offline
    youtube_short_title: "Outbox first, send second: offline in .NET MAUI #Shorts"
    instagram_reel:
      caption: |
        With no network, the request shouldn't fail. It should wait. The app writes each draft to an outbox on the device first, and only then tries to send it.

        The sync service flushes the outbox oldest first. If the server is unavailable it stops, keeps the order and waits for the next try. Network access reporting Internet doesn't mean the server answers.

        Full episode: link in bio

        #DotNet #DotNetMAUI #CSharp #Offline
      cover_text: "Save first, send second"
    tiktok:
      caption: "Offline-first in .NET MAUI: write the draft to an outbox on the device, then send. Server unavailable? Stop, keep the order, retry later. #DotNet #DotNetMAUI #CSharp"
  - id: online
    youtube_short_title: "Retried send, one request: the GUID is the key #Shorts"
    instagram_reel:
      caption: |
        Why a repeated send can't count twice: the draft's GUID is its idempotency key.

        If a flush died after the server answered, the draft is simply sent again, and the service recognises the key and replays the first result. That's the payoff of building the idempotency key into the service in the previous episode.

        Full episode: link in bio

