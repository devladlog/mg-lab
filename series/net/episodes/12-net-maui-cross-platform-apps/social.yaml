linkedin_company:
  text: |
    A phone app lives where the network comes and goes. In episode 12 of DEVLADLOG .NET we build a .NET MAUI app for the requests service from the previous episode, around one rule: save on the device first, send second.
    - One MAUI project with a request list and a form, targeting Android and Windows (Apple targets need a Mac, so they are out)
    - Logic in a plain library, with thin pages, so it is testable without an emulator
    - An outbox that flushes oldest first and stops when the server is unavailable
    - The draft's GUID doubles as the idempotency key, so a repeated send is a replay, not a second request
    - 59 tests, plus compiled bindings that turn a binding typo into a build error

    The episode also covers a CanExecute trap and the Android emulator address 10.0.2.2.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #DotNet #DotNetMAUI #CSharp #MVVM #Android
linkedin_personal:
  text: |
    In episode 12 of DEVLADLOG .NET I learned that the guard on a MAUI command is CanExecute, not the command itself. Through ICommand, which is what a Button uses, a second tap is ignored while the first runs. Call SubmitCommand.ExecuteAsync twice from code and you get two drafts. A test now documents it.

    The same episode keeps the sync logic in a plain library and uses the draft's GUID as the idempotency key, so a retried send cannot create a duplicate.

    {YOUTUBE_URL}

    Narration uses an AI voice.

    #DotNet #DotNetMAUI
