linkedin_company:
  text: |
    .NET 8 and .NET 9 both reached end of support on 10 November 2026, according to Microsoft's lifecycle page. If your service still runs on one of them, the questions are what you already use and what moving to .NET 10 (LTS) gives you.

    In episode 10 of DEVLADLOG .NET we answer with one class library that targets .NET 8 and .NET 10, with the .NET 9 code behind a single conditional, and the same tests run once per target:
    - C# 12 and .NET 8: primary constructors, collection expressions, frozen lookups
    - C# 13 and .NET 9: CountBy, AggregateBy, the Lock type, params ReadOnlySpan
    - What the compiler says when you use newer features on an older target
    - Why raising LangVersion is not the fix

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #DotNet #CSharp #DotNet10 #Upgrade #ASPNETCore
linkedin_personal:
  text: |
    A lock typed as object is still a Monitor. In episode 10 of DEVLADLOG .NET I held the same Lock instance inside lock (Lock gate) and inside lock (object gate) and checked IsHeldByCurrentThread: true for the first, false for the second. The new System.Threading.Lock is only used when the expression's type is exactly Lock, so a field or parameter still declared as object quietly keeps the old behaviour. The compiler warns with CS9216.

    The episode also shows why retargeting beats raising LangVersion.

    {YOUTUBE_URL}

    Narration uses an AI voice.

    #DotNet #CSharp
