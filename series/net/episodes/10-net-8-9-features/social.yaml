    youtube_short_title: "Four C# 12/13 and .NET 9 surprises #Shorts"
    instagram_reel:
      caption: |
        Four things that surprised us. A lock typed as object is still a monitor. A class primary-constructor parameter isn't a property, and you can mutate it.

        The JSON serializer ignores read-only lists until you pick Populate, and then it appends. And TimeSpan.FromSeconds with a double came out one tick short, where the integer overload in .NET 9 is exact.

