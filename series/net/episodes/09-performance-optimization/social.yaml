linkedin_company:
  text: |
    The requests list is slow. Everyone has a theory: add a cache, add an index, rewrite it in something faster. In episode 9 of DEVLADLOG .NET we do not guess. We measure, fix the one thing the measurement points at, and measure again.

    The project requests API now holds 20,000 requests, and we:
    - Count the SQL the endpoint really sends, and find the N+1
    - Fix the query with a projection and paging, proven with BenchmarkDotNet
    - Cache twice: output cache for responses, HybridCache for computed values
    - Switch to source-generated JSON with reflection turned off
    - Watch our own counters live with dotnet-counters

    Some results are honest surprises: with reflection off, the first HybridCache call threw until we registered a serializer, and a client no-cache header did not bypass the output cache.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #DotNet #Performance #EFCore #BenchmarkDotNet #ASPNETCore
linkedin_personal:
  text: |
    I expected AsNoTracking to make our EF Core list query faster. In episode 9 of DEVLADLOG .NET it did, but it was not the big win: for 200 rows, Include with no-tracking took 0.9 ms against 1.2 ms tracked, about 25% less time and 31% less memory. The big wins were removing the N+1 (10.3 ms down to 1.2 ms) and projecting just the columns we needed (0.5 ms).

    Those are one laptop's numbers, so read the ratios, not the milliseconds. The lesson holds: measure, don't assume.

    {YOUTUBE_URL}

    Narration uses an AI voice.

    #DotNet #EFCore #Performance
