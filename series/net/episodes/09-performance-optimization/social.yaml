linkedin_company:
  text: |
    The requests list is slow. Everyone has a theory: add a cache, add an index, rewrite it in something faster. In episode 9 of DEVLADLOG .NET we do not guess. We measure, fix the one thing the measurement points at, and measure again.

    The project requests API now holds 20,000 requests, and we:
    - Count the SQL the endpoint really sends, and find the N+1
    - Fix the query with a projection and paging, proven with BenchmarkDotNet
    - Cache twice: output cache for responses, HybridCache for computed values
    - Switch to source-generated JSON with reflection turned off
    - Watch our own counters live with dotnet-counters

    Some results are honest surprises: no-tracking was not faster than tracking in our run, and a client no-cache header did not bypass the output cache.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #DotNet #Performance #EFCore #BenchmarkDotNet #ASPNETCore
linkedin_personal:
  text: |
    I expected AsNoTracking to make our EF Core list query faster. In episode 9 of DEVLADLOG .NET it did not: Include with no-tracking (9.5 ms) did not beat Include tracked (7.5 ms) for 200 rows. It only used less memory. The big wins were removing the N+1 and projecting just the columns we needed.

    The benchmark ran on a shared CPU with wide error bars, so treat the numbers as directional. The lesson holds: measure, don't assume.

    {YOUTUBE_URL}

    Narration uses an AI voice.

    #DotNet #EFCore #Performance
