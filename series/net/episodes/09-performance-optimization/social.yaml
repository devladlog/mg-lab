  - id: stampede
    youtube_short_title: "HybridCache: 30 callers, one computation #Shorts"
    instagram_reel:
      caption: |
        For a computed value, the dashboard summary, we use HybridCache. When thirty requests arrive on a cold cache, only one runs the factory and the others wait for it.

        Our test proves it with a counter: thirty callers, one computation. A plain memory cache ran the factory more than once in the same experiment. Tags let a write invalidate everything about requests in one call.

        Full episode: link in bio

