  - id: gotcha
    youtube_short_title: "Four honest performance findings in ASP.NET Core #Shorts"
    instagram_reel:
      caption: |
        Four honest findings. With reflection off, the first HybridCache call threw, because it serializes what it stores, so we registered a serializer.

        Source-generated JSON allocated the same as reflection for a string, and half as much for UTF-8 bytes. No-tracking took about 25% less time and 31% less memory than tracking in our run, and the projection roughly halved both again. And a client's no-cache header did not bypass the output cache, so evict by tag.

        Full episode: link in bio

