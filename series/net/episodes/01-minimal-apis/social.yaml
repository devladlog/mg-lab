linkedin_company:
  text: |
    Minimal APIs get a reputation: fine for a demo, a mess in production, with everything piled into one giant Program.cs.

    In episode 1 of DEVLADLOG .NET we build a project requests API on .NET 10 and keep Program.cs short:
    - Route groups, with the endpoints in their own class
    - Built-in validation (AddValidation) with a cross-field rule for big budgets
    - TypedResults and Results<...>, so the compiler checks every response
    - An OpenAPI 3.1 document that describes every status code
    - 22 tests (10 unit, 12 integration) that run in about a second

    It also covers two things that bit us: the CLI picking an OpenAPI package version for the wrong major release, and a validation rule that only runs after every attribute passes.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #DotNet #MinimalAPIs #ASPNETCore #OpenAPI #CSharp
linkedin_personal:
  text: |
    A small lesson from building the first DEVLADLOG .NET episode: pin your package versions to your target framework.

    I ran dotnet add package for OpenAPI on a net10.0 project and the CLI picked version 11.0.0. Restore succeeded, then the build failed with "no AddOpenApi". The 11.0.0 package only ships a net11.0 library. Pinning --version 10.0.15 fixed it.

    The episode builds a Minimal API with route groups, TypedResults, built-in validation and 22 tests, and shows that gotcha plus the validation one.

    {YOUTUBE_URL}

    Narration uses an AI voice.

    #DotNet #MinimalAPIs
