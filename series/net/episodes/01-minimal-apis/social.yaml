  - id: validation
    youtube_short_title: "Built-in validation in .NET 10 Minimal APIs #Shorts"
    instagram_reel:
      caption: |
        Validation in Minimal APIs used to need a library or a hand-written filter. In .NET 10 you call AddValidation and the DataAnnotations on your request are checked before the handler runs.

        Attributes cover the simple rules. A cross-field rule, like requiring a justification for big budgets, goes in IValidatableObject. If anything fails, the client gets a 400 with every error.

        Full episode: link in bio

        #DotNet #MinimalAPIs #ASPNETCore #CSharp
      cover_text: "AddValidation in .NET 10"
    tiktok:
      caption: "No library needed: .NET 10 AddValidation checks DataAnnotations on Minimal API requests before your handler runs. Cross-field rules go in IValidatableObject. #DotNet #MinimalAPIs #CSharp"
  - id: gotcha
    youtube_short_title: "dotnet add package picked the wrong OpenAPI version #Shorts"
    instagram_reel:
      caption: |
        Two gotchas from this episode. dotnet add package for OpenAPI on a net10.0 app picked version 11.0.0. Restore worked, the build failed with "no AddOpenApi". Fix: pin --version 10.0.15.

        Second: the cross-field validation rule only runs once every attribute passes, so a client fixes the title first and only then learns about the justification. It is documented, and we have a test for it.

        Full episode: link in bio

