  - id: asserts
    type: code
    heading: "NUnit 5: assertions you must await"
    lang: csharp
    code: |
      // NUnit 5: ThrowsAsync returns a Task. Forget the await and the build fails:
      //   error NUnit2059: Method 'ThrowsAsync' returns a Task and is not being observed
      var ex = await Assert.ThrowsAsync<DbUpdateConcurrencyException>(() => approver.SaveChangesAsync(Ct));
      Assert.That(ex.Entries, Has.Count.EqualTo(1));

      using (Assert.EnterMultipleScope())            // report every failed assert, not just the first
      {
          Assert.That(raise.StatusCode, Is.EqualTo(HttpStatusCode.OK));
          Assert.That(approve.StatusCode, Is.EqualTo(HttpStatusCode.Conflict));
          Assert.That(now.GetProperty("status").GetString(), Is.EqualTo("Submitted"));
      }
    narration: >
      Two N unit details worth knowing. In N unit five, assert throws async returns a task that you must await. We
      forgot once, and the N unit analyzer turned it into a build error. And enter multiple scope collects every
      failing assertion in a block, instead of stopping at the first one.

  - id: failurescreen
    type: screen
    heading: "Same bug, two failure messages"
    image: screens/two-failures.jpg
    bar: "VS Code terminal · Invoke-Tests.ps1 -Mode Unit with a broken threshold"
    demo: >
      In VS Code, change HighThreshold in src/ProjectRequests.Api/Requests/PriorityRules.cs from 50_000m to 49_000m,
      save, run ./deploy/Invoke-Tests.ps1 -Mode Unit. In frame: the NUnit failure ("Expected: Standard / But was:
      High", test name Classify_uses_the_50k_threshold(49999.99d,Standard)) and the xUnit failure ("Assert.Equal()
      Failure: Values differ / Expected: Standard / Actual: High"), then total 18, failed 2. See
      deploy/failure-messages.output.txt. Revert the change right after. Nothing to mask.
    narration: >
      Let's break the threshold on purpose: forty-nine thousand instead of fifty. Both frameworks catch it, at the
      same boundary, with slightly different words. Expected standard, but was high. Put it back, and we're green.

  - id: gotcha
    type: code
    heading: "Gotcha: one filter, two dialects"
    lang: xml
    code: |
      dotnet test --filter-trait Category=Unit
        NUnit app -> Exit code: 5   Unknown option '--filter-trait'

      <!-- Directory.Build.targets: route each argument to the framework that understands it -->
      <TestingPlatformCommandLineArguments Condition="'$(XunitTestProject)' == 'true'"
          >$(TestingPlatformCommandLineArguments) $(XunitArgs)</TestingPlatformCommandLineArguments>
      <TestingPlatformCommandLineArguments Condition="'$(EnableNUnitRunner)' == 'true'"
          >$(TestingPlatformCommandLineArguments) $(NUnitArgs)</TestingPlatformCommandLineArguments>

      dotnet test "-p:XunitArgs=--filter-trait Category=Unit" "-p:NUnitArgs=--filter TestCategory=Unit"

      <!-- Same lines in Directory.Build.props: no error, no filter. All 69 tests run. -->
    short: gotcha
    narration: >
      Now the gotcha from the start. X unit three filters with filter trait. N unit keeps the old filter syntax. Pass
      one to both, and the N unit app refuses to start: unknown option, exit code five. The fix, straight from
      Learn: route each argument only to the projects that understand it. And put it in directory build targets,
      not props. In props, those properties don't exist yet, so the condition is false. No error, no filter, all
      sixty-nine tests run.

  - id: filterscreen
    type: screen
    heading: "Exit code 5, then the routed filter"
    image: screens/filter-gotcha.jpg
    bar: "VS Code terminal · Invoke-Tests.ps1 -Mode FilterGotcha, then -Mode Unit"
    demo: >
      Terminal: ./deploy/Invoke-Tests.ps1 -Mode FilterGotcha. In frame: xUnit app passed (total 8), then "Handshake
      failures", "Exit code: 5", "Unknown option '--filter-trait'" for ProjectRequests.Tests.NUnit.dll. Then
      ./deploy/Invoke-Tests.ps1 -Mode Unit: both apps passed, total 18. See deploy/filter-gotcha.output.txt and
      deploy/unit.output.txt. Crop the pipe path in the command line. Nothing to mask.
    narration: >
      Here it is for real. The x unit app runs its eight unit tests, the N unit app exits with code five. With the
      routed arguments, both run: eighteen unit tests, in a few seconds.

  - id: sqlserver
    type: code
    heading: "Tests that need real infrastructure: skip, don't pass"
    lang: csharp
    code: |
      // xUnit v3: skip at run time
      var server = SqlServerTestDatabase.ServerConnectionString;     // env var REQUESTS_TEST_SQLSERVER
      Assert.SkipWhen(string.IsNullOrWhiteSpace(server), SqlServerTestDatabase.SkipReason);

      // NUnit
      if (string.IsNullOrWhiteSpace(server))
          Assert.Ignore(SqlServerTestDatabase.SkipReason);

      await using var db = SqlServerTestDatabase.CreateContext(server!, "xunit");   // own database per run
      try
      {
          await db.Database.MigrateAsync(Ct);
          Assert.NotNull(await db.Departments.SingleOrDefaultAsync(d => d.Code == "fin", Ct));   // SQLite: null
      }
      finally { await db.Database.EnsureDeletedAsync(Ct); }
    narration: >
      Some tests need real infrastructure. These apply the SQL Server migrations to a brand-new database, check that
      department codes compare case-insensitively there, unlike SQLite, and drop the database. Without a connection
      string they report skipped, with the reason. Never a fake green.

  - id: sqlscreen
    type: screen
    heading: "The same tests against SQL Server in the lab"
    image: screens/sqlserver-lab.jpg
    bar: "VS Code terminal · Invoke-Tests.ps1 -Mode SqlServer against CON-SQL01"
    demo: >
      Lab laptop, Hyper-V lab running (CON-SQL01, 10.20.0.30). In pwsh set $env:REQUESTS_TEST_SQLSERVER (typed off
      camera, see demo.md) and run ./deploy/Invoke-Tests.ps1 -Mode SqlServer. In frame: both apps passed, 3 tests
      (xUnit 2, NUnit 1), 0 skipped. Optional second capture: SSMS Object Explorer on CON-SQL01 during the run,
      showing a ProjectRequests_xunit_... database that disappears after refresh. Mask the connection string if it
      ever appears.
    narration: >
      And on the lab's SQL Server. Set the connection string, and the same tests run for real: a database appears,
      gets migrated, checked, and dropped again.

  - id: coveragescreen
    type: screen
    heading: "One coverage report for both frameworks"
    image: screens/coverage-report.jpg
    bar: "Browser · coverage-report/index.html (ReportGenerator)"
    demo: >
      Run ./deploy/Invoke-Tests.ps1 -Mode Coverage, then open coverage-report/index.html in the browser. In frame:
      "Parser: MultiReport (2x Cobertura)", line coverage about 93 percent, branch coverage about 89 percent, class
      list with PriorityRules at 50 percent. Then click PriorityRules to show the two red const lines. Nothing to
      mask (local file).
    narration: >
      Finally, coverage. Each app writes a Cobertura file, and Report Generator merges them into one page. One
      curiosity: our price rules show fifty percent, with the two decimal constants in red. Decimal constants
      aren't real constants in I L. They're static fields set in a static constructor that never runs, because
      every caller has the value inlined. Coverage numbers need reading, not worshipping.

  - id: outro
    type: outro
    heading: "Code on GitHub, guides on devladlog.com"
    sub: "github.com/devladlog/mg-lab"
    narration: >
      To sum up: pick one test platform for the whole solution, learn which defaults each framework flips, route
      framework-specific options, and skip what can't run instead of faking it. All sixty-nine tests and the
      PowerShell runner are on GitHub, and the full guide is on devladlog dot com. Next time: Blazor, WebAssembly
      and Server. This was DEVLADLOG dot net, by Momento Galático.
