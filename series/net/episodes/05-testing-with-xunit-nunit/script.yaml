scenes:
  - id: hook
    type: title
    heading: "Testing with xUnit and NUnit"
    sub: "Same API, two frameworks, one dotnet test"
    short: hook
    narration: >
      Your team writes x unit. The team next door writes N unit. And somebody asks: can we run both from one
      command, with one coverage report? Yes, on dot net ten. But one innocent filter will break half of it, and
      another will silently do nothing. Today we test the same API with both frameworks, side by side. Welcome to
      DEVLADLOG dot net.

  - id: plan
    type: bullets
    heading: "What we're doing"
    bullets:
      - "Episode 4's API and its 39 tests, still on xUnit v2 and VSTest"
      - "Move them to xUnit v3 on Microsoft.Testing.Platform"
      - "Write the core tests again in NUnit 5"
      - "One dotnet test, one filter, one coverage report"
      - "Opt-in tests against a real SQL Server in the lab"
    narration: >
      We start from episode four: the project requests API and its thirty-nine tests, on x unit two and the old
      V S test runner. We move them to x unit three on the Microsoft Testing Platform, write the core tests again in
      N unit five, and run everything with one command. Plus a few tests that only run when a real SQL Server is
      around.

  - id: platform
    type: code
    heading: "Step one: the test project is an app"
    lang: xml
    code: |
      <!-- global.json: dotnet test runs in Microsoft.Testing.Platform mode (.NET 10 SDK) -->
      { "test": { "runner": "Microsoft.Testing.Platform" } }

      <!-- xUnit v3 -->
      <OutputType>Exe</OutputType>
      <PackageReference Include="xunit.v3" Version="4.0.3" />

      <!-- NUnit: the NUnit runner is opt-in -->
      <EnableNUnitRunner>true</EnableNUnitRunner>
      <OutputType>Exe</OutputType>
      <PackageReference Include="NUnit" Version="5.0.0" />
      <PackageReference Include="NUnit3TestAdapter" Version="6.3.1" />
    narration: >
      With the Microsoft Testing Platform, a test project is an executable. You can run it with dotnet test, dotnet
      run, or just start it. One line in global dot json switches dotnet test to the new mode. X unit three needs an
      output type of exe. N unit needs that too, plus enable N unit runner. Don't mix V S test and testing platform
      projects in one solution: Learn says that's not supported.

  - id: migration
    type: code
    heading: "xUnit v2 to v3: two lines, fifty warnings"
    lang: csharp
    code: |
      // csproj: xunit 2.9.3 -> xunit.v3 4.0.3, plus <OutputType>Exe</OutputType>. All 39 tests compiled.
      // Then the analyzer: 50 x warning xUnit1051
      //   Calls to methods which accept CancellationToken should use TestContext.Current.CancellationToken

      internal static class TestCancellation      // imported with "using static" in the csproj
      {
          public static CancellationToken Ct => TestContext.Current.CancellationToken;
      }

      var response = await _client.PostAsJsonAsync("/api/requests", NewRequest(75_000m, "it"), Ct);
      await db.SaveChangesAsync(Ct);
    narration: >
      The migration was smaller than expected. Swap the package, make it an exe, and all thirty-nine tests compiled
      and passed. Then the analyzer spoke up: fifty places where an async call could take a cancellation token and
      didn't. X unit three gives every test one, so a timeout or an aborted run actually stops the H T T P call. We
      pass it everywhere.

  - id: theories
    type: code
    heading: "Data-driven tests, both ways"
    lang: csharp
    code: |
      // xUnit v3
      [Theory]
      [InlineData(49_999.99, Priority.Standard)]          // attributes can't hold decimals: xUnit converts the double
      [InlineData(50_000, Priority.High)]
      public void Classify_uses_the_50k_threshold(decimal budget, Priority expected) =>
          Assert.Equal(expected, PriorityRules.Classify(budget));
      public static TheoryData<decimal, string?, bool> JustificationCases => new() { { 250_000m, null, false }, /*...*/ };

      // NUnit 5
      [TestCase(49_999.99, Priority.Standard)]            // NUnit converts the double to decimal too
      [TestCase(50_000, Priority.High)]
      public void Classify_uses_the_50k_threshold(decimal budget, Priority expected) =>
          Assert.That(PriorityRules.Classify(budget), Is.EqualTo(expected));
      private static IEnumerable<TestCaseData<decimal, string?, bool>> JustificationCases()
      { yield return new(250_000m, null, false); /*...*/ }
    narration: >
      Same business rule, both frameworks. Theory with inline data on the left, test case on the right. Attributes
      can't hold decimals, so we write a double, and both frameworks convert it. For richer rows, x unit has typed
      theory data. N unit five adds a generic test case data, so the compiler checks every row too.

  - id: xunitfixture
    type: code
    heading: "xUnit: a new instance for every test"
    lang: csharp
    code: |
      public sealed class SeededApi : IAsyncLifetime          // created once per test class
      {
          public RequestsApiFactory Factory { get; } = new();
          public HttpClient Client { get; private set; } = null!;

          public async ValueTask InitializeAsync()            // v3: ValueTask, disposal is IAsyncDisposable
          {
              Client = Factory.CreateClient();
              foreach (var (department, budget) in Seed) { /* POST /api/requests */ }
          }
          public async ValueTask DisposeAsync() { await Factory.DisposeAsync(); Factory.DeleteDatabase(); }
      }

      [Trait("Category", "Integration")]
      public sealed class SeededApiTests(SeededApi api) : IClassFixture<SeededApi> { /* read-only tests */ }
    narration: >
      Here's the big philosophical difference. X unit creates a new instance of the test class for every single
      test. Anything you want to share, like an app with a seeded database, goes into a fixture. In version three,
      initialize and dispose return value task. And because the data is shared, every test in this class is read
      only.

  - id: nunitlifecycle
    type: code
    heading: "NUnit: one instance, shared by every test"
    lang: csharp
    code: |
      [assembly: Parallelizable(ParallelScope.Fixtures)]      // NUnit: nothing runs in parallel unless you opt in

      [Category("Integration")]
      public sealed class ApiTests
      {
          private RequestsApiFactory _factory = null!;        // ONE instance of ApiTests for all its tests
          private HttpClient _client = null!;

          [OneTimeSetUp] public void StartApp() => _factory = new RequestsApiFactory();
          [SetUp]        public void NewClient() => _client = _factory.CreateClient();
          [TearDown]     public void DisposeClient() => _client.Dispose();
          [OneTimeTearDown] public async Task StopApp() { await _factory.DisposeAsync(); _factory.DeleteDatabase(); }
      }
    short: lifecycle
    narration: >
      N unit does the opposite. One instance of the class, shared by every test in it. So a field is shared state.
      One time set up starts the app once; set up gives each test a fresh client. And parallelism is flipped too:
      x unit runs test classes in parallel by default, N unit runs nothing in parallel until you say so. Same
      words, opposite defaults.

