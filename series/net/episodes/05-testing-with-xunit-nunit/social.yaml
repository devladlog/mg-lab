  - id: lifecycle
    youtube_short_title: "xUnit vs NUnit: same words, opposite defaults #Shorts"
    instagram_reel:
      caption: |
        xUnit creates a new instance of the test class for every test. NUnit does the opposite: one instance, shared by every test in the class, so a field is shared state.

        Parallelism is flipped too. xUnit runs test classes in parallel by default; NUnit runs nothing in parallel until you say so. In NUnit, OneTimeSetUp starts the app once and SetUp gives each test a fresh client.

        Full episode: link in bio

        #DotNet #xUnit #NUnit #CSharp
      cover_text: "Opposite defaults"
    tiktok:
      caption: "xUnit: new instance per test. NUnit: one instance shared by every test, so fields are shared state. Parallelism defaults are flipped too. #DotNet #xUnit #NUnit"
  - id: gotcha
    youtube_short_title: "One test filter, exit code 5, and a silent no-op #Shorts"
    instagram_reel:
      caption: |
        xUnit v3 filters with --filter-trait. NUnit keeps the old filter syntax. Pass one filter to both and the NUnit app refuses to start: unknown option, exit code 5.

        The fix is to route each argument only to the projects that understand it. Put it in Directory.Build.targets, not props. In props, those properties don't exist yet, so the condition is false. No error, no filter, all 69 tests run.

        Full episode: link in bio

        #DotNet #xUnit #NUnit #CSharp
      cover_text: "Exit code 5"
    tiktok:
      caption: "--filter-trait broke the NUnit app (exit code 5). The fix in Directory.Build.props did nothing: all 69 tests ran. Use .targets. #DotNet #xUnit #NUnit"
