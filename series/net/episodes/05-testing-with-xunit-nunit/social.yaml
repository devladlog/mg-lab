linkedin_company:
  text: |
    Your team writes xUnit. The team next door writes NUnit. Can you run both from one command, with one coverage report? On .NET 10, yes. But one innocent filter breaks half of it, and another silently does nothing.

    In episode 5 of DEVLADLOG .NET we test the same API with both frameworks side by side:
    - xUnit v2 to v3 on Microsoft.Testing.Platform: two lines changed, about 50 new warnings
    - The same core tests rewritten in NUnit 5
    - xUnit creates a new instance per test; NUnit shares one instance across a fixture, and the parallelism defaults are opposite
    - One dotnet test, one routed filter and one merged coverage report

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #DotNet #xUnit #NUnit #UnitTesting #CSharp
linkedin_personal:
  text: |
    One filter option, two test frameworks, two outcomes. In episode 5 of DEVLADLOG .NET I passed --filter-trait to a solution with an xUnit v3 project and an NUnit 5 project. xUnit ran. NUnit refused to start: unknown option, exit code 5.

    The fix is conditional TestingPlatformCommandLineArguments. Put it in Directory.Build.props and nothing happens: no error, no filter, all 69 tests run. It works in Directory.Build.targets, because the properties it checks are not defined yet when props is evaluated.

    {YOUTUBE_URL}

    Narration uses an AI voice.

    #DotNet #xUnit #NUnit
