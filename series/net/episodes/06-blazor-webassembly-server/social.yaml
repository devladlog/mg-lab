linkedin_company:
  text: |
    Blazor Server or Blazor WebAssembly? On .NET 10 that is the wrong question. One Blazor app can render a page as plain HTML, run the next one on the server over a live connection, and the next one in the browser on .NET compiled to WebAssembly.

    In episode 6 of DEVLADLOG .NET we build all three on top of the project requests API:
    - Requests list: static server rendering, streamed
    - Request page: Interactive Server, with [PersistentState] so prerendering does not call the API twice
    - New request form: Interactive WebAssembly, calling the API directly with CORS configured
    - One Contracts library, so the same DTOs and validation rules are shared by the API, the server and the browser
    - 19 bUnit component and host tests

    We also show the trap where a WebAssembly page crashes during server prerendering.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #DotNet #Blazor #WebAssembly #ASPNETCore #CSharp
linkedin_personal:
  text: |
    Here is a Blazor trap from episode 6 of DEVLADLOG .NET. A WebAssembly page is prerendered on the server first, using the server's services. I registered my API client only in the client project, and the page returned a 500 before the browser ever got anything: no registered service of type IRequestsApi.

    Two fixes: register the service on the server too, or turn prerendering off for that page. I registered it in both Program.cs files and added a test so nobody removes it.

    {YOUTUBE_URL}

    Narration uses an AI voice.

    #DotNet #Blazor
