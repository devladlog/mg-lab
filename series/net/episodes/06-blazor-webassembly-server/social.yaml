  - id: persist
    youtube_short_title: "Blazor prerendering calls your API twice. Fix it #Shorts"
    instagram_reel:
      caption: |
        An Interactive Server page is prerendered first, then a circuit takes over. Learn warns that OnInitializedAsync then runs twice, once for the prerender and once for the interactive render. That's two API calls per page view.

        New in .NET 10, the PersistentState attribute saves the value into the page and restores it. A test checks the API is called once during prerender.

        Full episode: link in bio

        #DotNet #Blazor #ASPNETCore #CSharp
