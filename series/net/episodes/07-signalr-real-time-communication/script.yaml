  - id: takeaways
    type: bullets
    heading: "Take this with you"
    bullets:
      - "Hub<T>, and IHubContext to push from anywhere else"
      - "Configure AddJsonProtocol on both sides"
      - "Reconnect = new connection: rejoin groups, reload state"
      - "SignalR doesn't queue: missed while away means missed"
      - "More than one server: a backplane, or Azure SignalR Service"
    narration: >
      To recap. Strongly typed hubs, and I hub context everywhere else. The same J SON settings on both ends. After
      a reconnect, rejoin your groups and reload, because SignalR doesn't keep what you missed. And the moment you
      run two servers, add a backplane.

