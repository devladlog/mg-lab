  - id: hook
    type: title
    heading: "SignalR Real-Time Communication"
    sub: "The server talks first"
    short: hook
    narration: >
      Someone approves a request, and every screen that shows it changes, right now. No refresh button, no polling
      every five seconds. That's SignalR. Today our project requests API learns to push, to a live board in the
      browser and to a console on an approver's desk. And we'll break it on purpose, twice. Welcome to DEVLADLOG
      dot net.

  - id: plan
    type: bullets
    heading: "What we're building"
    bullets:
      - "A strongly typed hub in the API: /hubs/requests"
      - "Push after every committed write: created, updated"
      - "Department groups: watch everything, or just Finance"
      - "One client library: Blazor WebAssembly board and a console watcher"
      - "24 new tests with a real hub and a real client"
    narration: >
      The plan. A hub in the existing API. The endpoints push an event after every successful write. Clients can
      watch all departments or just one, using groups. One small client library serves both the Blazor live board
      and a console app. And every bit of it is tested against a real hub, in memory.

  - id: hub
    type: code
    heading: "A strongly typed hub"
    lang: csharp
    code: |
      // Contracts/Live.cs (condensed): shared by the server and every client
      public interface IRequestsClient { Task RequestCreated(RequestDto request); Task RequestUpdated(RequestDto request); }

      public sealed class RequestsHub(ILogger<RequestsHub> logger) : Hub<IRequestsClient>
      {
          public async Task<string> Watch(string? department, RequestsDbContext db)
          {
              var group = string.IsNullOrWhiteSpace(department) ? AllGroup : await GroupForKnownAsync(department, db);
              if (Context.Items.TryGetValue(GroupKey, out var old) && old is string previous && previous != group)
                  await Groups.RemoveFromGroupAsync(Context.ConnectionId, previous);
              await Groups.AddToGroupAsync(Context.ConnectionId, group);
              Context.Items[GroupKey] = group;            // a new hub instance per call: no state in fields
              return group;
          }
      }
    narration: >
      The hub derives from hub of I requests client, so the server can only call methods that interface declares.
      A typo is a compile error, not a silent no-op. Watch puts the connection in one group: all, or one
      department. Learn is clear that a new hub instance handles every call, so the current group lives in the
      connection's items, never in a field.

  - id: push
    type: code
    heading: "Push from the endpoints, after the commit"
    lang: csharp
    code: |
      // RequestEndpoints.Create
      await db.SaveChangesAsync(ct);                        // INSERT ... RETURNING "Id"
      var dto = AsDto(entity);
      await events.CreatedAsync(dto, ct);                   // only after the write succeeded
      return TypedResults.Created($"/api/requests/{entity.Id}", dto);

      // SignalRRequestEvents: IHubContext, never a hub instance
      public sealed class SignalRRequestEvents(IHubContext<RequestsHub, IRequestsClient> hub, ...) : IRequestEvents
      {
          public Task CreatedAsync(RequestDto request, CancellationToken ct) =>
              SendAsync(request, c => c.RequestCreated(request));
          // SendAsync: hub.Clients.Groups("all", "dept:" + request.Department), failures logged, never a 500
      }
    narration: >
      Outside the hub, you send through I hub context. The endpoints call it only after save changes succeeds, so
      a rejected write pushes nothing. Each connection is in exactly one group, so sending to all plus the
      department never delivers twice. And if a push fails, we log it. The data is already committed. SignalR is a
      notification, not a transaction.

  - id: feed
    type: code
    heading: "The client: reconnect, then rejoin"
    lang: csharp
    code: |
      _connection = new HubConnectionBuilder()
          .WithUrl(new Uri(apiBaseAddress, RequestsHubContract.Path))
          .AddJsonProtocol(o => o.PayloadSerializerOptions.Converters.Add(new JsonStringEnumConverter()))
          .WithAutomaticReconnect()                         // waits 0, 2, 10, 30 seconds, then gives up
          .Build();

      _connection.On<RequestDto>(nameof(IRequestsClient.RequestCreated), r => Created?.Invoke(r));
      _connection.On<RequestDto>(nameof(IRequestsClient.RequestUpdated), r => Updated?.Invoke(r));

      _connection.Reconnected += async _ =>
      {
          await _connection.InvokeAsync<string>(RequestsHubContract.Watch, Department);   // groups are gone
          await SetState(FeedState.Connected);
          Resubscribed?.Invoke();                            // "you missed events: reload"
      };
    narration: >
      On the client, one hub connection with automatic reconnect. By default it retries after zero, two, ten and
      thirty seconds. Handlers are registered before we start. And look at the reconnected handler. A reconnect is a
      brand new connection, with a new I D, and the server has forgotten its groups. So we call watch again, and
      tell the page to reload what it missed.

  - id: board
    type: code
    heading: "The live board: connect first, then load"
    lang: razor
    code: |
      @page "/live"
      @rendermode InteractiveWebAssembly
      @implements IAsyncDisposable

      // Not OnInitializedAsync: that also runs during prerendering, on the server. OnAfterRender doesn't.
      protected override async Task OnAfterRenderAsync(bool firstRender)
      {
          if (!firstRender) return;
          feed = FeedFactory.Create();
          feed.Created += r => OnEvent("created", r);
          feed.Resubscribed += () => _ = InvokeAsync(ReloadAsync);
          await feed.StartAsync(department: null);   // connect FIRST...
          await ReloadAsync();                       // ...then load: an event in between is merged, not lost
      }
    narration: >
      The board is a WebAssembly page, so the browser itself holds the connection to the API. We connect in on after
      render, because that never runs during prerendering, so the server never opens a connection it would throw
      away. And we connect before loading the list, so an event that lands in between is merged instead of lost.

