  - id: json
    type: code
    heading: "Gotcha one: SignalR has its own JSON settings"
    lang: csharp
    code: |
      // Server: ConfigureHttpJsonOptions does NOT apply to the hub protocol
      services.AddSignalR()
          .AddJsonProtocol(o => o.PayloadSerializerOptions.Converters.Add(new JsonStringEnumConverter()));

      // Test: a client WITHOUT the converter, binding RequestDto
      raw.On<RequestDto>(nameof(IRequestsClient.RequestCreated), typed.Add);
      var sent = await CreateAsync(_factory, "FIN");
      Assert.Equal(sent.Id, (await control.NextAsync()).Id);   // the configured client got it
      await Task.Delay(500, Ct);
      Assert.True(typed.IsEmpty);                              // this one silently dropped it
      Assert.Equal(HubConnectionState.Connected, raw.State);   // no exception, still connected
    narration: >
      Our REST API already sends enums as strings. The hub didn't, because configure H T T P J SON options doesn't
      apply to SignalR. It has its own add J SON protocol, on the server and on the dot net client. Worse, our test
      shows what a mismatched client does: it drops the message, logs it, and stays connected. No exception
      anywhere. Configure both sides.

