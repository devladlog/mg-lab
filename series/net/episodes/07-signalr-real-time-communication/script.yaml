  - id: reconnectscreen
    type: screen
    heading: "Stop the server. Start it again."
    image: screens/reconnect.jpg
    video: screens/reconnect.mp4
    bar: "API terminal Ctrl+C · watcher · live board"
    short: reconnect
    demo: >
      Three panes: API terminal, watcher terminal, /live. Ctrl+C the API: watcher prints "connection: Reconnecting",
      board shows "connection lost, reconnecting…". Wait about 5 s, dotnet run --launch-profile http again. Within
      the next retry (10 s attempt) watcher prints "reconnected as <new id>, watching FIN again", board shows
      connected and "reconnected: reloading the list". Create a FIN request: it arrives on both.
    narration: >
      Now break it. Stop the API. The console says reconnecting. Start it again, and at the next retry, twenty seconds later, it's back with a new connection I D, watching Finance again, and the next Finance request arrives. Learn says group membership isn't preserved when a connection reconnects. Without
      that watch call in the reconnected handler, this console would be connected and deaf. Our tests prove it with
      a plain connection: reconnected, zero messages.

  - id: cors
    type: code
    heading: "CORS for a hub is not CORS for an API"
    lang: csharp
    code: |
      // Learn: specific origins, GET + POST + DELETE (long polling cleanup), credentials allowed
      services.AddCors(o => o.AddPolicy("signalr", policy => policy
          .WithOrigins(config.GetSection("Cors:AllowedOrigins").Get<string[]>() ?? [])
          .WithMethods("GET", "POST", "DELETE")
          .AllowAnyHeader()
          .AllowCredentials()));

      app.MapHub<RequestsHub>("/hubs/requests").RequireCors("signalr");   // REST keeps last episode's policy

      // HubException: the only exception message that reaches the client
      throw new HubException($"Unknown department '{department}'.");
    narration: >
      The board runs on port fifty-one eighty, the hub on fifty-two oh seven. Learn lists what SignalR needs: get,
      post and delete, and credentials allowed, even without authentication, for sticky sessions. That's looser than
      our REST policy, so it gets its own named policy, on the hub endpoint only. And only a hub exception's message
      reaches the client. Anything else is a generic error.

  - id: scaleout
    type: code
    heading: "Gotcha two: two servers, two islands"
    lang: csharp
    code: |
      [Fact]
      public async Task A_write_handled_by_another_instance_is_not_pushed()
      {
          using var instanceB = RequestsApiFactory.ForExistingDatabase(_factory.DatabasePath);
          var (_, created, _) = await WatchAsync(null);                   // connected to instance A

          var viaB = await CreateAsync(instanceB, "FIN", title: "Written on B");
          var viaA = await CreateAsync(_factory, "FIN", title: "Written on A");

          Assert.Equal(viaA.Id, (await created.NextAsync()).Id);          // B's request never arrived
          Assert.Equal(viaB.Id + 1, viaA.Id);                             // ...same database, though
      }
    short: scaleout
    narration: >
      The trap that waits for your first scale-out. Two instances, one database. A client on instance A never hears
      about a write handled by instance B, because connections and groups live in each process. Learn's answer is a
      backplane. Azure SignalR Service is the recommendation on Azure, and the app doesn't need sticky sessions.
      Redis works too, but still needs them.

