linkedin_company:
  text: |
    Someone approves a request, and every screen that shows it changes right now. No refresh button, no polling every five seconds. That is SignalR.

    In episode 7 of DEVLADLOG .NET our project requests API learns to push, and we break it on purpose, twice.
    - A strongly typed hub, with events pushed after every committed write
    - Department groups: watch everything, or just Finance
    - Reconnects: a new connection ID means no groups, so the client must rejoin
    - Two API instances on one database: a write handled by instance B never reaches a client on instance A
    - 24 new tests against a real hub and a real client, in memory

    Learn's answer to the scale-out problem is a backplane, such as Azure SignalR Service.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #DotNet #SignalR #ASPNETCore #RealTime #CSharp
linkedin_personal:
  text: |
    A SignalR client that reconnects fine can still be deaf. In episode 7 of DEVLADLOG .NET we restart the API under two clients. Both reconnect with a new connection ID. Group membership is not preserved on reconnect, so only the client that calls Watch again in its Reconnected handler keeps receiving Finance requests. The plain WithAutomaticReconnect connection gets nothing.

    Messages sent while a client was away are gone too, so reload state after you rejoin.

    {YOUTUBE_URL}

    Narration uses an AI voice.

    #DotNet #SignalR
