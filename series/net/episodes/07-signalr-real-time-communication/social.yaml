    instagram_reel:
      caption: |
        Two API instances, one database. A client on instance A never hears about a write handled by instance B, because connections and groups live in each process.

        Learn's answer is a backplane. Azure SignalR Service is the recommendation on Azure, and the app doesn't need sticky sessions. Redis works too, but still needs them.

