    instagram_reel:
      caption: |
        We stop the API. Both clients say reconnecting. Start it again and they're back, with a new connection ID.

        Learn says group membership isn't preserved when a connection reconnects. Without the Watch call in the Reconnected handler, our console watcher would be connected and deaf. Our tests prove it with a plain connection: reconnected, zero messages.

