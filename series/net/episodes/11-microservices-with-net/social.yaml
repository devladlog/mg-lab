linkedin_company:
  text: |
    A microservice is easy to build. The hard part starts the first time the other service is down.

    In episode 11 of DEVLADLOG .NET we take the budget check out of the project requests API, put it in its own service, add a YARP gateway, and then stop that service on camera.
    - Services know names, not addresses (service discovery)
    - Retry reads freely, retry writes only with an idempotency key
    - Budget down: the request is saved as Pending, the circuit opens, the gateway reports Degraded, and a worker finishes the job when Budget returns
    - The lost answer: the reservation is made but the reply is lost, and the retry with the same key does not reserve twice
    - 30 tests, then three real processes

    One honest limit: there is no message broker, so the services are still coupled in time.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #DotNet #Microservices #YARP #Resilience #ASPNETCore
linkedin_personal:
  text: |
    The standard .NET resilience handler retries every HTTP method, including POST. Learn says so, and warns that a retried POST can duplicate data.

    In episode 11 of DEVLADLOG .NET we keep the handler but only retry when the failure is transient and the call is a read or carries an Idempotency-Key. Then we inject a fault where the Budget service makes the reservation and loses the answer. The retry gets the first reservation back, so a test sees 12,000 reserved, not 36,000.

    {YOUTUBE_URL}

    Narration uses an AI voice.

    #DotNet #Microservices
