linkedin_company:
  text: |
    An invoice needs approval and the manager is on holiday. Two days later it should go to someone else automatically. And when the manager comes back and taps approve on the old request, that answer must not count.

    In DEVLADLOG Deep Dive episode 4 we build approvals that wait, escalate and cannot be answered twice:
    - A flow puts each ready invoice on a Service Bus queue
    - A Durable Functions orchestration runs the approval: manager first, finance director above 5,000 euros
    - A durable timer races an external event, and the loser is cancelled
    - A second Power Automate flow is the human interface, with approvals in Teams and Outlook

    The trap with orchestrators is replay. The Durable analyzer failed our build on DateTime.UtcNow and on an unbounded loop, and we show the fix.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #DurableFunctions #PowerAutomate #ServiceBus #Azure #DotNet
linkedin_personal:
  text: |
    Orchestrator code runs again and again on replay, and it has to make the same decisions every time.

    In episode 4 of the DEVLADLOG Deep Dive my first draft had an unbounded while loop, and I tried DateTime.UtcNow in the stage loop. The Durable Functions analyzer, which ships with the extension, failed the build on both. The fix: take time and IDs from the orchestration context, pass settings in the input, and keep every call to the outside world in an activity.

    While an approval waits for a human, no function is running at all.

    {YOUTUBE_URL}

    Narration uses an AI voice.

    #DurableFunctions #Azure
