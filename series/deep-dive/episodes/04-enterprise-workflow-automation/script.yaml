  - id: gotcha
    type: bullets
    heading: "Deterministic, or broken"
    short: gotcha
    bullets:
      - "DateTime.UtcNow in the orchestrator: build error DURABLE0001"
      - "while (true) without ContinueAsNew: DURABLE0011"
      - "Use context.CurrentUtcDateTime and context.NewGuid()"
      - "Settings travel in the input; I/O lives in activities"
    narration: >
      The trap with orchestrators is replay: the code runs again and again and must make the same decisions. Our first
      draft had an unbounded while loop, and we tried date time dot utc now in the stage loop. The Durable analyzer,
      which ships with the extension, failed the build on both. Take time and IDs from the context, pass settings in the input, and
      keep every call to the outside world in an activity.

  - id: recap
    type: bullets
    heading: "What to take away"
    bullets:
      - "Durable owns the process; Power Automate owns the people"
      - "Race a durable timer against the event, cancel the loser"
      - "One request, one event name, one signed link"
      - "The business key is the instance ID"
      - "Test on a real engine: timers and events included"
    narration: >
      To recap. Durable owns the process, Power Automate owns the people. Race a durable timer against the event and
      cancel the loser. One request, one event name, one signed link. Make the business key the instance ID. And test
      on a real engine, timers included.

