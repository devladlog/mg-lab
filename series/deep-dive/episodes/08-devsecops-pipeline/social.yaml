linkedin_company:
  text: |
    Someone updates a dependency, and a build nobody reviewed lands in production. A pipeline should decide what is allowed to ship.

    In DEVLADLOG Deep Dive episode 8 we build that pipeline with GitHub Actions, Azure DevOps and container security, with no cloud secret stored anywhere:
    - A managed identity trusts tokens from one GitHub environment only, so a pull request, another branch or another job cannot get a token
    - That identity can push to the registry and update one container app, nothing else; a second identity that can only pull runs the app
    - A vulnerability gate that blocks, with waivers that expire
    - Actions pinned to a commit SHA, and the image scanned before push and deployed by digest

    We also cover where this bites, including role assignments that take minutes to propagate.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #DevSecOps #GitHubActions #AzureDevOps #DevTools #Azure
linkedin_personal:
  text: |
    The best secret to protect is the one you never store.

    In episode 8 of the DEVLADLOG Deep Dive the pipeline signs in to Azure with OIDC. A managed identity trusts tokens from one GitHub environment, so the subject names the repository and the production environment. A pull request or another branch cannot get a token, and the identity can update only one container app.

    Two habits from the same episode: pin actions to a SHA because tags move, and give every vulnerability waiver an expiry date. Exceptions that never expire become the policy.

    {YOUTUBE_URL}

    Narration uses an AI voice.

    #DevSecOps #GitHubActions
