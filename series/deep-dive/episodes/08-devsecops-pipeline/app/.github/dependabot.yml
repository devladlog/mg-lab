version: 2
# A cool-down before a brand-new release is proposed: most malicious or broken releases are pulled within days
# (zizmor's dependabot-cooldown audit asks for at least 7).
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: pip
    directory: /security
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
