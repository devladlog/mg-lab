  - id: grants-screen
    type: screen
    heading: "The identity's real permissions"
    image: screens/sql-grants.jpg
    video: screens/sql-grants.mp4
    bar: "SQL Server Management Studio · purchase-requests"
    demo: "SSMS on the recording laptop connected to the Azure SQL database purchase-requests (rg-mglab-deep-dive-03) as the Entra admin, 002-grant-app.sql just executed: app identity (EXTERNAL_USER) with db_datareader and db_datawriter; DENY UPDATE / DENY DELETE on AuditEntries. Server name masked."
    narration: >
      Signed in as the SQL Entra admin, we run the grant script. The web app's identity is a database user with
      reader and writer roles, and a deny on update and delete for the audit table.

  - id: submit-screen
    type: screen
    heading: "Alex submits from Power Apps"
    image: screens/app-submit.jpg
    video: screens/app-submit.mp4
    bar: "Power Apps · Contoso Purchase Requests"
    demo: "Canvas app in play mode signed in as Alex Demo: 'Two lab servers', 7,500 EUR just submitted, green Submitted banner, My requests shows it as Pending."
    narration: >
      Now the app, as Alex. Two lab servers, seven thousand five hundred euros. The connector sends Alex's token, the
      API takes the owner from it, and the request shows as pending.

  - id: decide-screen
    type: screen
    heading: "Sam is refused, Jordan approves"
    image: screens/app-decide.jpg
    video: screens/app-decide.mp4
    bar: "Power Apps · approver view"
    demo: "Canvas app as Sam Demo: the 7,500 request selected, red banner 'Requests above 5,000 EUR need a finance approver.' Then as Jordan Demo: status Approved and the audit panel (see demo.md)."
    narration: >
      Sam opens it and taps approve. The API refuses: above five thousand euros needs a finance approver, and the app
      shows that message from the API. Jordan approves it. The audit trail lists all three steps, including the refusal.

  - id: gotcha
    type: bullets
    heading: "Valid token, still refused"
    short: gotcha
    bullets:
      - "The API registration picks the token version"
      - "v1: sts.windows.net issuer, api:// audience"
      - "v2: login.microsoftonline.com issuer, client ID audience"
      - "Default claim mapping renames roles and scp: every call 403"
      - "F1 + SQL: 'Allow Azure services' admits other tenants too"
    narration: >
      Three traps. One: the token version is chosen by the API's registration, not the client. Version one has a
      different issuer and audience than version two, so validate the wrong pair and a good token gets four oh one.
      Two: default claim mapping renames roles and scope, so every policy fails with four oh three. Our tests prove
      both. Three: the free tier has no network integration, so SQL needs the allow Azure services rule, and that
      admits any Azure client, other customers too. Entra-only auth is what protects us. In production, use a private
      endpoint.

  - id: recap
    type: bullets
    heading: "What to take away"
    bullets:
      - "The app is the screen; the API decides"
      - "Scope first, then roles, then business rules"
      - "Identity from the token, never from the body"
      - "Managed identity, data rights only, append-only audit"
      - "Test with real tokens, not with auth turned off"
    narration: >
      To recap. The app is the screen, the API decides. Check scope, then roles, then business rules. Take identity
      from the token, never from the body. Managed identity, data rights only, append-only audit. And test with real
      tokens, not with authentication switched off.

  - id: outro
    type: outro
    heading: "Code on GitHub, guides on devladlog.com"
    sub: "github.com/devladlog/mg-lab"
    narration: >
