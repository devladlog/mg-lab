linkedin_company:
  text: |
    Sam is an approver. Sam also submits purchase requests. What stops Sam from approving his own? In most low-code apps, a hidden button.

    In DEVLADLOG Deep Dive episode 3 the app is just the screen, and every rule lives in a .NET API that trusts only the caller's Entra token:
    - A Power Apps canvas app calling a custom connector that signs in as the user
    - An ASP.NET Core API that checks scope first, then roles, then business rules
    - Azure SQL reached with the API's own managed identity, with an append-only audit table
    - Rules as pure functions, so they are easy to test: you cannot decide your own request, and anything above 5,000 euros needs the finance role

    We also walk through the token traps: v1 versus v2 issuer and audience, and claim mapping that renames roles.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #PowerApps #DotNet #AzureSQL #EntraID #PowerPlatform
linkedin_personal:
  text: |
    A valid token is not the same as an allowed request. That is the lesson I keep relearning.

    In episode 3 of the DEVLADLOG Deep Dive, the Power Apps canvas app only draws the screen. The API decides: scope first, then roles, then business rules, and the caller's identity always comes from the token, never from the request body. So Sam cannot approve his own request, whatever roles he holds.

    The gotcha that cost the most time: the token version is chosen by the API's app registration, not by the client. Validate the wrong issuer and audience pair and a good token gets a 401.

    {YOUTUBE_URL}

    Narration uses an AI voice.

    #DotNet #PowerApps #EntraID
