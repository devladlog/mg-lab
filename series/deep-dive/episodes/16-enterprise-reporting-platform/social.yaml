linkedin_company:
  text: |
    Every Contoso department wants a report, and every department may only see its own purchase requests. Nobody wants forty hand-built copies of one model with security nobody can read.

    Deep Dive 16 turns the reporting layer into code:
    - The Power BI semantic model lives in Git as TMDL text files, so a change is a readable diff in a pull request
    - Row-level security is one dynamic role on the department table, driven by a hidden mapping table, with no second rule on the fact table
    - Promotion from development to test to production is a Fabric deployment pipeline request, with parameter rules changing the endpoint per stage
    - A policy file checks scanner API output: production models certified, labelled and on a capacity

    The code has 23 xUnit tests that load the folder with the TMDL serializer and 23 Pester tests for the scripts. They cannot run the DAX engine, and the episode says so.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Full guide: {BLOG_URL}

    Narration uses an AI voice.

    #PowerBI #MicrosoftFabric #TMDL #DataGovernance
linkedin_personal:
  text: |
    A row-level security test from your own account proves nothing. Learn says RLS restricts only users with the Viewer role, so workspace admins, members and contributors see every row.

    Two more things that bit me while building a Power BI model as code: a deployment pipeline copies the model but not the role members or the endorsement, so you assign people and certify again after the first deploy to a stage. And a service principal cannot run queries on a model with RLS, so the check has to use a person.

    Deep Dive 16: {YOUTUBE_URL}

    Narration uses an AI voice.

    #PowerBI #RowLevelSecurity
