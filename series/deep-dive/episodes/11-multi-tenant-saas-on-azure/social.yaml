linkedin_company:
  text: |
    Contoso's purchase request platform works. Now Northwind and Adventure Works want it too, sharing one app and one database. Somewhere in that code, one day, somebody will forget a WHERE clause.

    In DEVLADLOG Deep Dive episode 11 we build the system so that the mistake does not matter. Three locks:
    - Identity: the customer signs in with their own Entra tenant, and the API takes the tenant from the validated token and nowhere else
    - Application: Entity Framework query filters add the tenant to every query
    - Data: row-level security in SQL repeats the rule, with the tenant stored read-only in the session context

    We also cover what bit us: Platform admin only counting from the home tenant, a query filter that one call can skip, and our own tests catching that we had locked out our own staff.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #MultiTenant #SaaS #EntraID #SQLServer #DotNet
linkedin_personal:
  text: |
    In a multi-tenant app, the question is not whether somebody will forget a WHERE clause. It is what happens when they do.

    In episode 11 of the DEVLADLOG Deep Dive the tenant comes from the validated token's tid claim and nowhere else. EF Core filters every query by it, and row-level security in the database repeats the rule. The query filter is just code, and IgnoreQueryFilters skips it, which is exactly why the database needs its own lock.

    A small lesson from our own tests: they caught that we had locked out our own staff, because the home tenant is not a customer.

    {YOUTUBE_URL}

    Narration uses an AI voice.

    #MultiTenant #DotNet
