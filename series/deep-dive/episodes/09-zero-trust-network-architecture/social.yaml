linkedin_company:
  text: |
    A finance user signs in from a laptop nobody has checked, on a network nobody owns, and reaches the same key vault as everyone else. Being inside the network is not a reason to trust.

    In DEVLADLOG Deep Dive episode 9 we decide who and what may reach Contoso's purchase platform, one request at a time:
    - Conditional Access asks about identity: how strong was the authentication
    - Intune answers about the device: is it healthy and encrypted
    - The network question is answered by what is not there: no public address, no inbound rule, a private endpoint for the one service that matters
    - Policies are kept as JSON files in the repo, linted, and start in report-only

    We also cover report-only gotchas from Learn, including a device with no compliance policy counting as compliant by default.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #ZeroTrust #ConditionalAccess #Intune #EntraID #Azure
linkedin_personal:
  text: |
    Start every Conditional Access policy in report-only. That is the first line of the policy in episode 9 of the DEVLADLOG Deep Dive.

    The policy is a JSON file in the repo: Office 365, from Windows, for the pilot group, break-glass account excluded. The grant is a compliant device plus MFA. Because it is data, we can lint it before it touches a tenant.

    One catch from Learn: a report-only policy that requires a compliant device can still prompt people on macOS, iOS and Android to pick a certificate. That is why ours is limited to Windows.

    {YOUTUBE_URL}

    Narration uses an AI voice.

    #ZeroTrust #ConditionalAccess
