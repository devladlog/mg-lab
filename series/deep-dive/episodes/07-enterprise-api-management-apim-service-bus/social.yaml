linkedin_company:
  text: |
    A network blip, the app retries, and finance reviews the same seven thousand euro purchase twice.

    In DEVLADLOG Deep Dive episode 7 every system that wants to send Contoso a purchase event comes through one front door: Azure API Management in front of a Service Bus topic.
    - The gateway checks the Entra token (issuer, audience and the Purchase.Submit app role), then a rate limit, then the body against the OpenAPI schema
    - It enqueues with its own managed identity and answers 202: accepted, not processed
    - The caller's idempotency key becomes the MessageId, and duplicate detection is on at topic creation
    - Two subscriptions read the topic: everything, and only the big purchases for finance

    We also go through the Consumption tier limits we found in Learn, and test the policy size limit.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #AzureAPIManagement #ServiceBus #Azure #APIDesign #EntraID
linkedin_personal:
  text: |
    A gateway should do identity, rate and shape. The services behind it should keep the business rules.

    In episode 7 of the DEVLADLOG Deep Dive the APIM policy checks the token, then a rate limit, then the body against the schema, cheap checks first. Then it puts the event on a Service Bus topic and answers 202. The caller's key becomes the MessageId, so a retry does not reach finance twice.

    The design detail that is easy to miss: duplicate detection cannot be switched on later. You decide when you create the topic.

    {YOUTUBE_URL}

    Narration uses an AI voice.

    #AzureAPIManagement #ServiceBus
