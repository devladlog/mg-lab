    instagram_reel:
      caption: |
        Here is the gateway policy, in order.
        First the token: right issuer from the tenant, right audience, and the Purchase.Submit app role.
        Then a rate limit of 20 calls a minute.
        Then the body, checked against the schema from the OpenAPI definition, with no extra properties allowed.
        Cheap checks first, so bad calls never cost more.
