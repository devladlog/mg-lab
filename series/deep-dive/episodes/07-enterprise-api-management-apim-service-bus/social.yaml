    instagram_reel:
      caption: |
        Gotchas on the API Management Consumption tier, all from Learn.
        Rate limit by key is not available, so we limit per subscription key instead.
        The built-in send-service-bus-message policy is for the classic tiers, so we call the REST API.
        The policy document is capped at 16 KiB, and our tests check that.
        And duplicate detection on a topic is fixed when you create it.
