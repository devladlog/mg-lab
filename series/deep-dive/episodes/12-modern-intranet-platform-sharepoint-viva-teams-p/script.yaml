scenes:
  - id: hook
    type: title
    heading: "Run it twice"
    sub: "and the intranet is still the same intranet"
    short: hook
    narration: >
      Contoso's intranet is a pile of one-off sites. H R has one, I T has one, and nobody can find either. Today we build
      the front door: a SharePoint hub with the department sites under it, a home site that opens inside Teams as Viva
      Connections, and a Power Automate approval for company news. And we build it as code, so one script can rebuild it on
      any tenant, and run twice is the same as run once. This is the DEVLADLOG Deep Dive.

  - id: architecture
    type: diagram
    heading: "One contract, six steps"
    nodes: ["Contract", "Site design", "Hub + sites", "Home site", "Teams"]
    labels: ["intranet.json", "News Requests list", "Navigation", "Viva Connections", "Approval flow"]
    narration: >
      One contract file describes the whole intranet. A PowerShell module reads it and builds in a fixed order: a site
      design first, then the sites, then the hub, then the department associations, then the hub navigation, and last the
      home site. Viva Connections is not a separate product to deploy. It is the home site, shown inside Teams. And the news
      approval is a flow on a list that the site design creates.

  - id: contract
    type: code
    heading: "The contract"
    lang: json
    code: |
      },
      "hub": {
        "alias": "contoso-home",
        "title": "Contoso Home",
        "description": "The front door of the Contoso intranet"
      },
      "spokes": [
        { "alias": "contoso-hr",  "title": "People and Culture", "description": "Policies, benefits, onboarding" },
        { "alias": "contoso-it",  "title": "IT Help",            "description": "Support, devices, access" },
        { "alias": "contoso-ops", "title": "Operations",         "description": "Facilities, purchasing, travel" }
      ],
      "hubNavigation": [
        { "title": "People and Culture", "site": "contoso-hr" },
        { "title": "IT Help",            "site": "contoso-it" },
        { "title": "Operations",         "site": "contoso-ops" },
        { "title": "Expenses",           "url": "https://expenses.contoso.example", "external": true }
      ],
    narration: >
      Here is the contract. Names, aliases, navigation and statuses live in one file. The provisioning script, the health
      check, the flow and the tests all read it. So when someone renames a department, the tests tell you what else has to
      change, before a user does.

  - id: sitedesign
    type: code
    heading: "The site design"
    lang: json
    code: |
      "actions": [
        {
          "verb": "setSiteBranding",
          "navigationLayout": "Megamenu",
          "headerLayout": "Compact",
          "headerBackground": "Neutral",
          "showFooter": true
        },
        {
          "verb": "setSiteExternalSharingCapability",
          "capability": "Disabled"
        },
    narration: >
      The site design is a JSON script, using verbs from Microsoft's schema. It sets the header and the mega menu, turns
      external sharing off, creates a News Requests list with a status choice, and adds a navigation link. Note what is
      missing: there is no join hub site verb. That verb carries a tenant specific hub id, so we associate sites from
      PowerShell instead, and a test fails if anyone adds it.

  - id: provision
    type: code
    heading: "Safe to run twice"
    short: idempotent
    lang: powershell
    code: |
      $children = @(Get-PnPHubSiteChild @conn -Identity $hubUrl -ErrorAction SilentlyContinue | ForEach-Object { ConvertTo-SiteUrl $_ })
      foreach ($sp in $Contract.spokes) {
          $url = Get-IntranetSiteUrl -TenantName $TenantName -Alias $sp.alias
          if ($children -contains (ConvertTo-SiteUrl $url)) { [pscustomobject]@{ Step = 'Association'; Target = $url; Action = 'Exists' }; continue }
          if ($PSCmdlet.ShouldProcess($url, "Associate with hub $hubUrl")) {
              Add-PnPHubSiteAssociation @conn -Site $url -HubSite $hubUrl | Out-Null
              [pscustomobject]@{ Step = 'Association'; Target = $url; Action = 'Associated' }
          }
          else { [pscustomobject]@{ Step = 'Association'; Target = $url; Action = 'WhatIf' } }
      }
    narration: >
      The module is built to run twice. Before every step it asks whether the thing already exists. The hub is registered
      once, and a department is associated only when it is missing. A second run reports Exists on every line and changes
      nothing. With what if, a first run prints the plan and touches nothing.

  - id: limits
    type: bullets
    heading: "Numbers from the planning guide"
    bullets:
      - "2,000 hub sites per tenant"
      - "Hub registration changes: 2 to 4 hours"
      - "Hub navigation: 100 links recommended"
      - "Home site: a communication site"
      - "One Viva Connections experience with E, F or A"
    narration: >
      Microsoft's planning guidance gives the numbers. Two thousand hub sites per tenant. A change to hub registration can
      take two to four hours to show up. Recommended: at most a hundred hub navigation links, and no more than ninety nine
      sites in the Sites web part. A home site must be a communication site, and one Viva Connections experience is included
      with an E, F or A licence.

  - id: tests
    type: code
    heading: "No tenant, real signatures"
    lang: text
    code: |
      $ pwsh -NoProfile -c 'Invoke-Pester ./tests'
        Provisioning builds everything from an empty tenant, in a safe order                      Passed
        Provisioning is idempotent: a second run changes nothing but refreshes the site script... Passed
        Provisioning completes a half-built intranet: only the missing department and link...     Passed
        Provisioning -WhatIf changes nothing                                                      Passed
        Health check fails for a department that left the hub, and for a site nobody planned      Passed
        News approval flow uses standard connectors only                                          Passed
      Tests Passed: 32, Failed: 0, Skipped: 0
    narration: >
      Thirty two Pester tests run with no tenant. The PnP module is imported, so every mock carries the real cmdlet
      signature, and a wrong parameter name fails the test. They cover an empty tenant, a second run, a half built intranet,
      what if, and a health check that fails when a department leaves the hub.

