    type: screen
    heading: "Build it, then build it again"
    image: screens/provision.jpg
    video: screens/provision.mp4
    bar: "PowerShell 7 · lab laptop"
    demo: >
      Windows Terminal (PowerShell 7) on the lab laptop, real capture. ./provision/Initialize-Intranet.ps1 -TenantName
      <tenant> -ClientId <app> -WhatIf (table of planned steps), then the same without -WhatIf (browser sign-in once per
      connection, table with Created / Registered / Associated / Added / Set), then once more (every line Exists), then
      ./provision/Test-Intranet.ps1 (all Pass). Mask the tenant name and the client id.
    narration: >
      The real run. First with what if, so we see the plan. Then for real, signed in as the lab admin: four sites, a hub,
      three associations, four links, and the home site in draft mode. Then the same command again, and every line says
      Exists.

  - id: hub-screen
    type: screen
    heading: "The hub in the browser"
    image: screens/hub.jpg
    video: screens/hub.mp4
    bar: "Edge · Contoso Home"
    demo: >
      Edge, real capture of the Contoso Home site: hub navigation across the top (People and Culture, IT Help, Operations,
      Expenses), open People and Culture to show the same navigation there; then SharePoint admin center > Active sites
      showing the hub and its three associated sites. Mask the tenant name in the address bar.
    narration: >
      And here it is in the browser. The hub navigation sits on top of the department sites, and the external link opens the
      expenses system. Hub changes can take hours to appear, so we recorded after the wait.

  - id: flow-screen
    type: screen
    heading: "News request to approval"
    image: screens/flow.jpg
    video: screens/flow.mp4
    bar: "Power Automate · News request approval"
    demo: >
      Power Automate flow designer (the three actions), then the News Requests list with a new item (Submitted), the
      approval in the Approvals app answered as the approver, and the item refreshed to Approved with the message filled.
      Real capture, lab users only.
    narration: >
      Now a news request. An employee adds an item to the list. The flow starts an approval, the communications approver
      answers it, and the flow writes Approved or Rejected back on the item. Only standard connectors, so nobody needs a
      premium licence.

  - id: viva-screen
    type: screen
    heading: "The home site, inside Teams"
    image: screens/viva.jpg
    video: screens/viva.mp4
    bar: "Microsoft Teams · lab tenant"
    demo: >
      Teams admin center > Teams apps > Setup policies > Global > Pinned apps showing the app added; SharePoint admin center >
      Settings > Home sites showing Contoso Home; then Teams desktop as alex.demo with the app pinned, opening the home site.
      Real capture. Mask the tenant name.
    narration: >
      Last, Teams. The home site is in draft mode, so nobody sees it yet. We pin the app in the Teams admin center, take the
      experience out of draft, and the same home page opens inside Teams.

  - id: gotcha
    type: bullets
    heading: "What bit us"
    short: gotcha
    bullets:
      - "-WhatIf leaks into helper functions"
      - "ForEach-Object Name returns nothing under WhatIf"
      - "A leading comma hid the health rows"
      - "PnP PowerShell: bring your own app registration"
      - "Hub changes take hours, not seconds"
    narration: >
      What bit us. First, the what if flag leaks into helper functions: a property shortcut in our validation returned
      nothing under what if, so a valid contract looked broken. Second, a function that returned an array with a leading
      comma hid every health check row from the pipeline. Third, PnP PowerShell needs your own app registration,
      and you pass its client id. And the hub is not instant, so a check right after provisioning can fail for hours.

  - id: recap
    type: bullets
    heading: "What to take away"
    bullets:
      - "One contract, many consumers"
      - "Fixed order, every step repeatable"
      - "Associate from PowerShell, not from the site script"
      - "Viva Connections is the home site in Teams"
      - "Mock with real signatures"
    narration: >
      To recap. One contract, many consumers. Build in a fixed order, and make every step safe to repeat. Associate sites
      with the hub from PowerShell, not from the site script. Treat Viva Connections as the home site, inside Teams. And
      test the provisioning with mocks that carry real signatures.

  - id: outro
    type: outro
    heading: "Code on GitHub, guides on devladlog.com"
    sub: "github.com/devladlog/mg-lab"
    narration: >
      The module, the contract, the tests and the flow definition are on GitHub, and the full guide is on devladlog dot com.
      Thanks for watching.
