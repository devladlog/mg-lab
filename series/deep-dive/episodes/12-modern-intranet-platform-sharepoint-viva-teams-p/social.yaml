linkedin_company:
  text: |
    Contoso's intranet is a pile of one-off sites. HR has one, IT has one, and nobody can find either. We build the front door, and we build it as code.

    In DEVLADLOG Deep Dive episode 12 one contract file describes the whole intranet, and a PowerShell module builds it in a fixed order:
    - A site design, then the sites, then the SharePoint hub, then the department associations, hub navigation, and last the home site
    - Viva Connections is not a separate product to deploy: it is the home site, shown inside Teams
    - A Power Automate approval for company news, on a list that the site design creates
    - Every step asks whether the thing exists first, so running it twice is the same as running it once, and -WhatIf prints the plan

    We also cover what bit us with -WhatIf, PowerShell return values and PnP app registrations.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #SharePoint #VivaConnections #PnPPowerShell #Microsoft365 #MicrosoftTeams
linkedin_personal:
  text: |
    If provisioning a SharePoint intranet is a pile of manual steps, you cannot repeat it. In episode 12 of the DEVLADLOG Deep Dive it is one contract file and one PowerShell module, and running it twice changes nothing: before every step it asks whether the thing already exists.

    Two PowerShell lessons from the same build: the -WhatIf flag leaks into helper functions (a property shortcut returned nothing under -WhatIf, so a valid contract looked broken), and a leading comma in a function's return hid every health check row from the pipeline.

    {YOUTUBE_URL}

    Narration uses an AI voice.

    #SharePoint #PnPPowerShell
