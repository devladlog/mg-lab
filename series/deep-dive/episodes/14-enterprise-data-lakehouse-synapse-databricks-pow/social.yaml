linkedin_company:
  text: |
    A Delta table can look fine in Databricks and still return deleted rows in Synapse serverless. With deletion vectors on, a DELETE marks the row without rewriting the file, and a Delta reader version 1 ignores that mark.

    Episode 14 of DEVLADLOG Deep Dive builds a small lakehouse for Contoso's order change feed:
    - Bronze keeps every line, including corrupt ones, and silver quarantines each rejected row with a named reason
    - One Delta merge handles insert, update and delete, guarded by a sequence number, so a replayed or late batch changes nothing
    - Synapse serverless views with explicit schemas, and a Power BI model written as TMDL text files
    - One contract file that the views and the model are tested against

    The 23 tests run locally on open source Spark and Delta, with no cloud. We also cover what changed since the original guide: classic Purview cannot create new accounts, and input_file_name is unsupported from Databricks runtime 17.3.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #Azure #PowerBI #Databricks #DeltaLake #Synapse
linkedin_personal:
  text: |
    The most useful test in this episode reproduces a bug I would not have caught in Spark alone. With deletion vectors on, Spark says row 7 is gone, but a Delta reader version 1, which is what Synapse serverless is, still returns it.

    So the tables are written with deletion vectors off, and a second test proves it. Lesson: test what the other engine will see, not only what Spark sees.

    Episode 14 of DEVLADLOG Deep Dive: {YOUTUBE_URL}

    Narration uses an AI voice.

    #Azure #DeltaLake #Synapse
