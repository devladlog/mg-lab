  - id: gotcha
    youtube_short_title: "Delta lakehouse gotchas: archive, deletion vectors, currencies #Shorts"
    instagram_reel:
      caption: |
        Never archive a Delta table or its _delta_log: archived blobs cannot be read. Keep deletion vectors off for Synapse readers.

        Never add revenue across currencies, because the lake has no exchange rates. And a delete that arrives before its insert is ignored, so the insert wins.

