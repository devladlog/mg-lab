  - id: silver
    youtube_short_title: "Silver layer: keep the latest row version, with a reason #Shorts"
    instagram_reel:
      caption: |
        Bronze keeps every version of every row, because every pipeline run adds files. Silver keeps the latest version of each request, using ROW_NUMBER over the request id ordered by ModifiedOn descending.

        When a rule is broken, silver adds a reject reason instead of deleting the row. Bad rows stay visible in a quality view, and they just don't reach gold.

