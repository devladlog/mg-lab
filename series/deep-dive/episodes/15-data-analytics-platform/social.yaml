      caption: |
        What bit us building a small Azure data platform:
        - Owner on the subscription is not data access. Learn says those roles manage the account but don't read the data, so assign a blob data role
        - Training data only contains decided requests, so the newest weeks look better than they are
        - Serverless SQL has no tables, only views over files

