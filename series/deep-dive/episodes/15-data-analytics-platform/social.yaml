linkedin_company:
  text: |
    Finance at Contoso wants to know, before the deadline, which open purchase requests will miss the five-day approval SLA. That is a data platform question, not a report.

    Deep Dive 15 builds a small version of the answer, with every rule in plain SQL so it can move to Fabric later:
    - Azure Data Factory copies only changed rows into the lake as Parquet, bounded by the watermark value it looked up, not by "now"
    - Synapse serverless SQL turns the files into silver and gold views: bronze keeps every row version, silver keeps the latest, bad rows get a reject reason instead of being deleted
    - A logistic regression, trained on the past and judged on the future, is exported as a T-SQL view, so scoring needs no model host
    - Power BI imports the gold layer

    The episode is also upfront about the choice: Microsoft's pages call Fabric the strategic platform and say no Synapse retirement has been announced. The data is synthetic, and the code ships with 58 Python tests and 12 Pester tests that run offline.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Full guide: {BLOG_URL}

    Narration uses an AI voice.

    #Azure #SQLServer #PowerBI #DataFactory
linkedin_personal:
  text: |
    One line of a Data Factory incremental load decides whether you lose rows: the upper bound of the copy. It should be the maximum you looked up before the copy, not the current time. A row that lands during the copy is then picked up by the next run instead of falling between two runs.

    I also learned a modelling trap. Only decided requests can be labelled, so the newest weeks look better than they are, because the slow ones are still open. Leave a gap before you judge a model.

    Deep Dive 15, a lake-to-dashboard build on synthetic data: {YOUTUBE_URL}

    Narration uses an AI voice.

    #Azure #DataFactory
