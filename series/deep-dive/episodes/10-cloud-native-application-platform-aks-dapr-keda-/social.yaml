linkedin_company:
  text: |
    A finance review queue is nearly idle on a quiet night and flooded at month end. The worker that drains it should scale with the backlog, down to zero.

    In DEVLADLOG Deep Dive episode 10 we build that on AKS with Dapr, KEDA and Service Bus:
    - Service Bus holds the messages
    - Dapr delivers them to the app through a sidecar, so the code never touches a Service Bus library
    - KEDA watches the subscription and sets the replica count: one more replica for every five messages waiting, up to ten, and zero when empty
    - Every component signs in with workload identity, so there is no connection string anywhere

    We also list the gotchas from the docs: the Dapr extension's high-availability default, keeping the subscription name identical in three places, and why the free tier and no-HA choices are for a recording, not production.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #AKS #Dapr #KEDA #ServiceBus #Azure
linkedin_personal:
  text: |
    One name, three places. In episode 10 of the DEVLADLOG Deep Dive the Service Bus subscription name has to match in Bicep, in the Dapr component (as consumerID) and in KEDA's subscriptionName. So we keep it in a single test.

    The other lesson: Dapr's raw payload mode means giving up CloudEvent features like tracing and de-duplication by message ID.

    And the Dapr extension installs in high availability by default, three replicas of each service. That is a lot for a small lab cluster, and lab choices are not production choices.

    {YOUTUBE_URL}

    Narration uses an AI voice.

    #Dapr #KEDA
