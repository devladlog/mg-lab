linkedin_company:
  text: |
    A cold room door is left open and the temperature climbs. Do you find out within minutes, or at the next morning round?

    Episode 18 of DEVLADLOG Deep Dive builds an alert pipeline for a fictional Contoso warehouse, designed to stay on the IoT Hub free tier:

    - Three simulated cold rooms send telemetry to an IoT Hub
    - A Stream Analytics job writes one-minute aggregates and a COLD_ROOM_TOO_WARM alert to blob storage
    - The alert is a hopping window: at least three readings and an average above 8 degrees, so one noisy reading cannot trigger it
    - A simulator that refuses to use more than 80 percent of the free daily message quota
    - 50 tests, including the query on Microsoft's local Stream Analytics runtime

    The gotcha: the Stream Analytics input for IoT Hub does not support managed identity, so the job needs the service policy key. The blob outputs do use managed identity.

    Watch the episode: {YOUTUBE_URL}
    Code and tests: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.
    #Azure #AzureIoTHub #StreamAnalytics #IoT
linkedin_personal:
  text: |
    I wanted every part of this IoT pipeline on managed identity. Then Microsoft Learn told me the Stream Analytics input for IoT Hub does not support it. The workaround is routing through Event Hubs. In this episode I took the other road: the job reads the hub's service policy key inside the Bicep template, never outputs it, and the blob outputs use the job's managed identity, scoped to each container.

    Use identity where it is supported and be honest where it is not.

    Episode 18 of DEVLADLOG Deep Dive: {YOUTUBE_URL}

    #Azure #StreamAnalytics
    Narration uses an AI voice.
