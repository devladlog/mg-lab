    youtube_short_title: "One Stream Analytics clause is the whole alert rule #Shorts"
    instagram_reel:
      caption: |
        The cold room alert is a hopping window: the last three minutes, recalculated every minute. HAVING COUNT(*) >= 3 AND AVG(temperatureC) > 8.0. At least three readings means a single spike or a quiet sensor cannot trigger it. The same query file runs locally and in Azure.

        Full episode: link in bio

        #Azure #StreamAnalytics #IoT
      cover_text: "THE WHOLE ALERT RULE"
