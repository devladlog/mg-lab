linkedin_company:
  text: |
    Contoso's data centre lease is ending and fourteen servers have to move. Which one goes first? Which ones must move together? And how do you know you can fail over before the big night?

    Episode 17 of DEVLADLOG Deep Dive builds the planning tools around Azure Migrate and Azure Site Recovery:

    - A PowerShell collector and a planner that check the inventory before Azure sees it
    - Waves built from who talks to whom, with shared services treated as a foundation step
    - A Bicep landing zone for an Azure to Azure Site Recovery rehearsal
    - A readiness gate that says ready or not ready, and a rule that cutover needs a recent test failover
    - 58 Python tests that run without a subscription

    The trap: every domain member talks to the domain controller. Count those connections and nearly all fourteen servers become one group, so nothing can move first.

    Watch the episode: {YOUTUBE_URL}
    Code and tests: {REPO_URL}
    Written guide: {BLOG_URL}

    Narration uses an AI voice.
    #Azure #AzureMigrate #AzureSiteRecovery #CloudMigration
linkedin_personal:
  text: |
    If you build migration waves from network connections, you will hit this: every domain member talks to the domain controller. Count those connections as dependencies and nearly all fourteen servers collapse into one giant group. Nothing can move first.

    The fix in our planner is to ignore infrastructure ports like directory, name resolution and file sharing, and treat shared services as a foundation step. What is left is the real structure: web tier, app tier, database.

    That is episode 17 of DEVLADLOG Deep Dive. {YOUTUBE_URL}

    #Azure #AzureMigrate
    Narration uses an AI voice.
