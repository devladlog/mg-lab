linkedin_company:
  text: |
    A partner has no Teams licence and no account, and nobody wants to email a raw meeting link around. How does that guest join a real Teams meeting safely?

    Episode 13 of DEVLADLOG Deep Dive builds the path, on Contoso's fictional setup:
    - The host creates the meeting with Microsoft Graph, with the lobby limited to the organizer
    - A small Azure Function broker turns the meeting link into a one-time invitation, and stores only a hash of the code
    - The browser joins through the Azure Communication Services Calling SDK with a voip-only token that lasts 60 minutes, instead of the 24 hour default
    - The Azure Function authenticates with a managed identity, with no keys

    We also cover what changed since the original guide: Microsoft's retirement guide ends several Communication Services features on 30 September 2028, so we build only the Teams interop path. The tests include a race of ten guests on a 3-use invite against the Azurite emulator.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #Azure #Microsoft365 #MicrosoftTeams #AzureFunctions #Bicep
linkedin_personal:
  text: |
    When a guest has no account, the invitation is the credential, so I treated it like one. The broker stores only a hash of the code, with an expiry and a use limit. A leaked table gives nobody a working link.

    Unknown, expired and used-up invitations all return the same 403, so the endpoint cannot be probed. And the code travels in the URL fragment, which the browser never sends to a server.

    Episode 13 of DEVLADLOG Deep Dive builds a guest join for Teams meetings: {YOUTUBE_URL}

    Narration uses an AI voice.

    #Azure #MicrosoftTeams
