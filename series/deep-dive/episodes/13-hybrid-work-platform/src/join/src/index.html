<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Join the Contoso meeting</title>
  <link rel="stylesheet" href="/api/assets/join.css">
</head>
<body>
  <main>
    <h1>Contoso partner meeting</h1>
    <label for="name">Your name</label>
    <input id="name" type="text" maxlength="64" autocomplete="name" placeholder="Riley Demo">
    <div class="row">
      <button id="join" type="button">Join</button>
      <button id="mute" type="button" disabled>Mute</button>
      <button id="leave" type="button" disabled>Leave</button>
    </div>
    <p id="status" role="status" aria-live="polite">Loading...</p>
    <p class="note">Audio only. You join as a guest; no Teams account or licence is needed.</p>
  </main>
  <script src="/api/assets/join.js"></script>
</body>
</html>
