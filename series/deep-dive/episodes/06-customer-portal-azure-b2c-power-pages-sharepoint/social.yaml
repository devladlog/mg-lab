linkedin_company:
  text: |
    Anyone on the internet can create an account on your customer portal. That is the point. The hard part is what happens next: a customer must see their company's requests and documents, and nothing from anyone else's.

    In DEVLADLOG Deep Dive episode 6 we build that with Power Pages, SharePoint and Microsoft Entra External ID:
    - Customers sign up in an external tenant, separate from the workforce directory
    - Power Pages turns each sign-in into a contact, and Dataverse holds the support requests
    - Table permissions go through relationships, never Global, so a contact sees their own account's rows
    - SharePoint stores the documents for each request

    One honest correction: the original guide says Azure AD B2C, but B2C is no longer sold to new customers since 1 May 2025. A new portal starts on Entra External ID.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #PowerPages #EntraExternalID #Dataverse #SharePoint #PowerPlatform
linkedin_personal:
  text: |
    I had to correct one of my own guides. It says Azure AD B2C in the title, but since 1 May 2025 B2C is no longer available to new customers. Existing tenants keep working, and Microsoft supports them until at least May 2030, but a new customer portal should start on Microsoft Entra External ID in an external tenant. Power Pages has a built-in provider for it.

    The design lesson from episode 6 of the DEVLADLOG Deep Dive: sign-up is authentication, and web roles are authorization. Go through the contact, so there is no account lookup for a customer to spoof.

    {YOUTUBE_URL}

    Narration uses an AI voice.

    #PowerPages #EntraExternalID
