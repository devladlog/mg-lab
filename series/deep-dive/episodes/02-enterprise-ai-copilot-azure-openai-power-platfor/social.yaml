linkedin_company:
  text: |
    An employee and a manager ask the HR copilot the same question: what is the salary range for band M2? The manager gets the answer with a citation. The employee gets "I couldn't find this in the documents you have access to."

    That is not the model being polite. The employee's request never saw the document. In DEVLADLOG Deep Dive episode 2 we build that behaviour:
    - SharePoint libraries ingested with Microsoft Graph, chunked and pushed to Azure AI Search with the Entra groups allowed to read each one
    - A security filter on every query, built only from validated group GUIDs
    - Hybrid search (keywords plus vectors) and answers from Azure OpenAI
    - A Copilot Studio agent calling the API through a custom connector with the user's own sign-in

    We also cover what to do when a user is in more than 200 groups, and why a document can contain instructions.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #AzureAI #MicrosoftCopilot #AzureOpenAI #SharePoint #CopilotStudio
linkedin_personal:
  text: |
    If your copilot answers from SharePoint, the permission check has to happen at retrieval, not in the prompt.

    In our build every search carries a filter on the caller's Entra groups, so a document the user cannot read never reaches the model. An empty group list raises an error instead of running an unfiltered query, and if nothing permitted comes back, there is no model call at all.

    One more thing I would tell a colleague: Azure AI Search can now ingest SharePoint permissions itself (GA in the 2026-10-01 API). Check that first.

    DEVLADLOG Deep Dive, episode 2: {YOUTUBE_URL}

    Narration uses an AI voice.

    #AzureAI #CopilotStudio
