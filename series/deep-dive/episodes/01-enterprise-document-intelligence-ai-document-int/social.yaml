  - id: gotcha
    youtube_short_title: "Two Power Automate traps: a trigger loop and retries that multiply #Shorts"
    instagram_reel:
      caption: |
        Two traps we designed around in the invoice flow.
        One: "when a file is created or modified" fires again when your own flow updates the file's properties, so you build a loop. Use "when a file is created (properties only)".
        Two: the SDK already retries a 429, so one call became four in our tests. The flow's default policy adds up to four more, so we set it to two.
        Full episode: link in bio.
        #PowerAutomate #SharePoint #AzureFunctions #Azure
      cover_text: "One call became four"
