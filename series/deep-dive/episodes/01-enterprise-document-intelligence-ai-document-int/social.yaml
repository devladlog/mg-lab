linkedin_company:
  text: |
    Document Intelligence can read an invoice. The harder question is who decides whether the result is good enough.

    In DEVLADLOG Deep Dive episode 1 we build invoice intake on Azure AI Document Intelligence, Power Automate and SharePoint:
    - A SharePoint library is the inbox; a flow sends each new file to an Azure Function
    - The function calls the prebuilt invoice model and applies our business rules in code, with unit tests
    - Every file ends up Ready, or Needs review with the exact reason written next to it
    - A managed identity, so there is no Document Intelligence key to store or leak
    - One contract file shared by the function, the library script and the flow

    We also cover two traps we designed around: a "created or modified" trigger that loops on its own update, and retries that multiply because the SDK already retries.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #AzureAI #DocumentIntelligence #PowerAutomate #SharePoint #Azure
linkedin_personal:
  text: |
    The part of invoice automation that took the most thinking was not the extraction. It was the decision.

    The model returns values and a confidence per field. Whether 0.78 is good enough is a business call, so in our build it lives in a policy you set per environment, and every "needs review" carries a reason a person can act on, like "subtotal plus tax does not match the total".

    Second lesson: the flow's default retry policy stacks on top of the SDK's own retries. Know who retries before you add retries.

    Episode 1 of the DEVLADLOG Deep Dive: {YOUTUBE_URL}

    Narration uses an AI voice.

    #AzureAI #PowerAutomate
