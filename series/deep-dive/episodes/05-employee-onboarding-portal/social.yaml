linkedin_company:
  text: |
    A new hire starts on Monday. Too often the account is not ready, or it was created a week early with a password somebody sent by email.

    In DEVLADLOG Deep Dive episode 5 HR fills in one form and the rest follows:
    - A Power Apps canvas app writes to a SharePoint list, and a standard flow asks the hiring manager to approve
    - A PowerShell function sends approved requests to Microsoft Entra API-driven inbound provisioning
    - Lifecycle Workflows send the manager a temporary access pass before the start date, then enable, license and group the account on day one
    - Everything people touch runs on standard connectors, so HR and managers need nothing beyond Microsoft 365

    We also solve a very Portuguese problem: names with accents cannot go into a user principal name, and duplicates are the client's job to resolve.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #EntraID #PowerApps #Microsoft365 #SharePoint #PowerShell
linkedin_personal:
  text: |
    Half the names in Portugal have accents, and a user principal name cannot contain any. A small thing, until João Gonçalves cannot sign in as João.

    In episode 5 of the DEVLADLOG Deep Dive we decompose the name, drop the accent marks and keep first given name dot last surname. The provisioning service does not resolve duplicate names (Learn says that is the client's job), so we check and take the next free one.

    Bigger lesson: send HR data to inbound provisioning instead of creating users yourself. Mapping externalId to employeeId makes every send safe to repeat.

    {YOUTUBE_URL}

    Narration uses an AI voice.

    #EntraID #PowerShell
