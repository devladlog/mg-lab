linkedin_company:
  text: |
    Intune says your devices are compliant. Compliant with what, and are all of them even covered?

    Episode 7 of DEVLADLOG Microsoft 365 enrolls a real Windows 11 machine, keeps a compliance policy in one file, pushes it with Microsoft Graph, and audits every managed device for what the dashboard tends to hide:
    - Devices that haven't synced for 30 days, or never synced
    - Unencrypted drives and Windows builds below the policy minimum
    - Userless and personal devices
    - Two records sharing one serial number, which a re-enrolled machine leaves behind

    The gotcha: the grace period is not part of the policy. Actions for noncompliance are a separate object with their own endpoint, so patching the policy does nothing useful. The module sends each change to the endpoint that owns it.

    Fifty-eight Pester tests run without a tenant.

    Watch: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #Microsoft365 #Intune #MicrosoftGraph #PowerShell
linkedin_personal:
  text: |
    I spent a while wondering why changing the grace period in my Intune compliance policy file did nothing. The answer is in the Graph model: actions for noncompliance are a separate object, with a dedicated schedule actions for rules action, and the policy must keep exactly one block action.

    So the module now sends each change to the endpoint that owns it, and a second run reports "unchanged".

    Episode 7 also audits the whole fleet for stale, unencrypted and duplicate devices.

    Watch: {YOUTUBE_URL}

    Narration uses an AI voice.

    #Microsoft365 #Intune
