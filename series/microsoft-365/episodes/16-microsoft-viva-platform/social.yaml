linkedin_company:
  text: |
    Every company ends up with the same Viva Engage problem: communities get created by hand, the person who made one leaves, and nobody owns it anymore.

    DEVLADLOG Microsoft 365 episode 16 describes the communities in one JSON file and manages them with Microsoft Graph and PowerShell:
    - A script creates only the communities that are missing and never sends a delete, because deleting a community removes its group, notebook and plans
    - Create is asynchronous: a 202 and an operation to poll, with at least 30 seconds between checks per Learn
    - Owners and members are managed on the connected Microsoft 365 group
    - An audit flags communities with no owner or too few, privacy drift, and network administrators who are not on your allowed list

    The episode also maps what Graph reaches across Viva and what it does not build: Goals is retired, and Learning and Copilot need licences the lab does not have. 54 Pester tests run against a mocked Graph, no tenant needed.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Full guide: {BLOG_URL}

    Narration uses an AI voice.

    #Microsoft365 #MicrosoftViva #VivaEngage #MicrosoftGraph
linkedin_personal:
  text: |
    Creating a Viva Engage community through Graph is not instant. You get a 202 Accepted and an operation to follow, and Learn asks you to wait more than 30 seconds between checks. My wait function refuses an interval of 30 seconds or less.

    Another lesson: you cannot add members to the community itself. You add them to the Microsoft 365 group behind it. And because deleting a community removes the group, notebook and plans, the script I wrote never deletes anything.

    Episode 16 of DEVLADLOG Microsoft 365: {YOUTUBE_URL}

    Narration uses an AI voice.

    #VivaEngage #MicrosoftGraph
