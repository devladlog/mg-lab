    instagram_reel:
      caption: |
        Creating a Viva Engage community with Graph is asynchronous. The answer is a 202 with a header that points to an operation, and Microsoft Learn asks you to wait more than thirty seconds between checks.

        So the wait function refuses an interval of thirty seconds or less. Learn names the header two ways, so we accept both. And on a 429 the request waits for the Retry-After value and tries again.

        Full episode: link in bio
