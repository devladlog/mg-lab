    type: outro
    heading: "Code on GitHub, guides on devladlog.com"
    sub: "github.com/devladlog/mg-lab"
    narration: >
      The module, the config file and the tests are on GitHub, and the complete guide is on dev lad log dot com.
      Links are in the description. Next in this series: hybrid migration strategies. Subscribe so you don't miss it.
