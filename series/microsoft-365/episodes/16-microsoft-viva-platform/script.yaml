scenes:
  - id: hook
    type: title
    heading: "Communities that manage themselves"
    sub: "Viva Engage, driven by Microsoft Graph"
    short: hook
    narration: >
      Every company ends up with the same Viva Engage problem. Communities get created by hand, the person who made
      one leaves, and nobody owns it anymore. In this episode the communities are described in one file. A script
      creates the missing ones, and an audit finds the communities without an owner, and the people who hold more
      admin power than they should.

  - id: map
    type: bullets
    heading: "Viva: what Graph can reach"
    bullets:
      - "Connections: dashboard and cards, built in SharePoint and SPFx"
      - "Engage: communities and roles, in Graph v1.0"
      - "Insights: personal and manager views, no admin API here"
      - "Learning: provider API, needs a Viva licence"
      - "Goals: retired on 31 December 2025"
    narration: >
      First, a map. Viva is a family, and Graph does not reach all of it the same way. Connections is a dashboard
      that you build in SharePoint, with cards written in SPFx. Engage has real Graph endpoints for communities and
      roles, and that is where this episode lives. Insights is mostly personal views. Learning has a provider API, but
      it needs a Viva licence. And Viva Goals was retired at the end of twenty twenty five, with no replacement.

  - id: limits
    type: bullets
    heading: "What the Engage API can and cannot do"
    bullets:
      - "Native mode networks only, not legacy or external"
      - "Create is asynchronous: 202 and an operation to poll"
      - "Owners and members are managed on the connected group"
      - "10 requests per user per 30 seconds, then 429"
      - "Deleting a community deletes its group, notebook and plans"
    narration: >
      The Engage communities API works only for networks in native mode. Creating a community returns a two oh two,
      and the work finishes later. You cannot add members to the community itself. You add them to the Microsoft 365
      group behind it. Microsoft limits you to ten requests per user every thirty seconds. And because a delete
      removes the group, the notebook and the plans, the script we build never deletes anything.

  - id: config
    type: code
    heading: "One file for the communities"
    lang: json
    code: |
      {
        "settings": { "minOwners": 2, "maxNetworkAdmins": 3,
                      "allowedNetworkAdmins": ["labadmin@contoso.com", "alex.demo@contoso.com"] },
        "communities": [
          { "displayName": "Project Falcon - Launch",
            "description": "Everything about the Falcon launch.",
            "privacy": "private",
            "owners":  ["alex.demo@contoso.com", "sam.demo@contoso.com"],
            "members": ["jordan.demo@contoso.com", "riley.demo@contoso.com"] }
        ]
      }
    narration: >
      Here is the file. The same Project Falcon team gets three communities, each with a name, a description,
      privacy, owners and members. The settings hold the policy: at least two owners, no more than three network
      administrators, and a list of who may be one. The loader checks the name, description and owner limits from
      Learn before it touches the tenant.

  - id: create
    type: code
    heading: "Create a community, then fill it"
    lang: powershell
    code: |
      $body = ConvertTo-VivaCommunityBody -Community $c    # displayName, description, privacy
      $resp = Invoke-VivaRequest -Method POST -Uri '/v1.0/employeeExperience/communities' `
                  -Body $body -WithHeaders                 # 202 Accepted: it does not exist yet
      $loc  = Get-VivaHeaderValue $resp.Headers -Name 'Operation-Location', 'Location'
      $op   = Wait-VivaOperation -OperationUri $loc
      $community = Invoke-VivaRequest -Method GET `
          -Uri "/v1.0/employeeExperience/communities/$($op.resourceId)?`$select=id,groupId,privacy"
      # owners and members live on the connected Microsoft 365 group
      Invoke-VivaRequest -Method POST -Uri "/v1.0/groups/$($community.groupId)/owners/`$ref" `
          -Body (ConvertTo-VivaGroupRefBody -UserId $userId)
    narration: >
      The create call sends three fields, name, description and privacy. With delegated permissions, the person who
      runs the script becomes the owner automatically. The answer is a two oh two with a header that points to the
      operation, so the script follows it until it has succeeded, and then reads the community to get the group ID.
      Owners and members are added to that group, one reference call each.

  - id: apply-screen
    type: screen
    heading: "WhatIf, then create the communities"
    image: screens/apply.jpg
    video: screens/apply.mp4
    bar: "PowerShell · Invoke-VivaEngage -Apply (lab tenant, masked)"
    demo: >
      Lab tenant, signed in as labadmin. Run ./Invoke-VivaEngage.ps1 -ConfigFile ./communities.lab.json -Apply -WhatIf,
      then without -WhatIf. Capture the Step / Target / Result table (CreateCommunity, AddOwner, AddMember rows).
      Then Viva Engage on the web: the new communities in the sidebar, one community open with its owners and
      members. Run -Apply a second time: only InSync rows. Mask the tenant name and the user principal names.
    narration: >
      In the lab, what if lists every step first. Then the real run creates the communities, which takes a minute
      or more because of the operation polling, and adds the owners and members. In Viva Engage they appear with the
      right privacy and the right people. Run it again and every row says in sync, because it only adds what is
      missing.

  - id: gotcha
    type: code
    heading: "The gotcha: create is not instant"
    lang: powershell
    short: gotcha
    code: |
      [ValidateRange(31, 600)][int]$IntervalSeconds = 31   # Learn: wait more than 30 seconds
      for ($i = 1; $i -le $MaxChecks; $i++) {
          $op = Invoke-VivaRequest -Method GET -Uri $OperationUri
          switch ($op.status) {
              'succeeded' { return $op }
              'failed'    { throw "Viva Engage operation failed: $($op.statusDetail)" }
          }
          Start-VVSleep -Seconds $IntervalSeconds
      }
      throw "Still not finished after $MaxChecks checks."
      # a 429 anywhere: wait for Retry-After, then try again (Invoke-VivaRequest)
    narration: >
      Here is the gotcha. Creating a community is asynchronous, and Microsoft Learn asks you to wait more than thirty
      seconds between checks. So the wait function refuses an interval of thirty seconds or less. Learn also names the
      header two ways, operation location in the text and location in the example, so we accept both. And if the
      service answers four two nine, the request waits for the retry after value and tries again.

  - id: audit
    type: code
    heading: "Who is in charge here?"
    lang: powershell
    code: |
      if ($owners.Count -eq 0) {
          & $f 'High' $name 'NoOwner' 'No owner. Nobody can manage this community.'
      }
      elseif ($owners.Count -lt $Config.settings.minOwners) {
          & $f 'Medium' $name 'FewOwners' "$($owners.Count) owner(s), policy asks for $min."
      }
      # roles: GET /employeeExperience/roles and /roles/{id}/members
      foreach ($a in $admins) {
          if ($a -notin $allowed) {
              & $f 'High' $a 'UnexpectedNetworkAdmin' 'Not in settings.allowedNetworkAdmins.'
          }
      }
    narration: >
      The audit reads every community with its owners from the connected group, and the role members from the Engage
      roles endpoints. A community with no owner is high. One with too few owners is medium. Then it counts the
      network administrators. Too many is a finding, and anyone who is not on your allowed list is a high one. It
      also reports privacy drift, empty communities, and communities that are not in the file.

  - id: audit-screen
    type: screen
    heading: "The audit, live"
    image: screens/audit.jpg
    video: screens/audit.mp4
    bar: "PowerShell · Invoke-VivaEngage -Audit (lab tenant, masked)"
    short: audit
    demo: >
      After the manual changes listed in demo.md (one community whose owner was removed, one community switched from
      private to public in Viva Engage, one extra Network Administrator). Run
      ./Invoke-VivaEngage.ps1 -ConfigFile ./communities.lab.json -Audit -OutFile ./viva-audit.md. Capture the findings
      table: NoOwner or FewOwners, PrivacyDrift, TooManyNetworkAdmins or UnexpectedNetworkAdmin. Then the Markdown
      report in the editor. Rewrite the narration to match the screen. Mask user principal names.
    narration: >
      After a few changes by hand in the lab, the audit finds the community that lost its owner, the one that was
      switched to public, and the extra network administrator, with the name of the person. The same table goes to
      a Markdown file for a ticket. It can also fail a pipeline when there is a high finding.

  - id: teams-screen
    type: screen
    heading: "What people see"
    image: screens/teams.jpg
    video: screens/teams.mp4
    bar: "Viva Engage and Viva Connections in Teams (lab tenant, alex.demo, masked)"
    demo: >
      Signed in as alex.demo in Teams. Open the Viva Engage app and show the community created by the script in the
      community list. Then open the Viva Connections app, if the tenant has a home site configured, and show the
      dashboard as it is. Do not enable any Copilot feature, the lab tenant has no Copilot licence. If Viva
      Connections is not set up, show only Engage and say so in the notes. Mask the tenant name.
    narration: >
      This is what your colleagues see. In Teams, the Viva Engage app lists the communities the script created, with
      the owners you chose. The Viva Connections dashboard is a separate piece. You set it up in SharePoint, and its
      cards are written with SPFx, so it is not part of this script.

  - id: notcovered
    type: bullets
    heading: "What this episode does not build"
    bullets:
      - "Viva Goals: retired, no replacement"
      - "Learning provider API: delegated only, Viva licence and Knowledge Administrator"
      - "Connections cards: an SPFx project, not a Graph call"
      - "Copilot in Viva: needs a Copilot licence, the lab has none"
    narration: >
      A few things I left out on purpose. Viva Goals is gone. The Learning provider API is delegated only, and needs
      a Viva Suite or Viva Learning licence plus the Knowledge Administrator role, which the lab does not have.
      Connections cards are an SPFx project. And anything that uses Copilot needs a licence we don't have, so there
      is no Copilot output in this episode.

  - id: tests
    type: code
    heading: "Fifty-four tests, no tenant"
    lang: text
    code: |
      $ Invoke-Pester ./tests
      Describing Config file
        [+] rejects a display name over 255 characters
        [+] rejects more than 100 owners
      Describing Diff
        [+] lists communities that are not in the config as Unmanaged, and never proposes a delete
      Describing Graph calls (mocked)
        [+] polls more than 30 seconds apart until succeeded
        [+] uses the Retry-After value of the response when there is one
        [+] makes no DELETE call, ever
      Tests Passed: 54, Failed: 0, Skipped: 0
    narration: >
      Fifty four Pester tests run without a tenant. They cover the config limits, the diff, every audit finding, the
      wait between operation checks, the retry after a throttled call, and a promise that the script never sends a
      delete. Two of them check our calls against the real Microsoft Graph PowerShell module.

  - id: recap
    type: bullets
    heading: "Five rules for Viva Engage"
    bullets:
      - "Describe communities in a file, create only what is missing"
      - "Create is asynchronous: follow the operation, wait over 30 seconds"
      - "Manage owners and members on the connected group"
      - "Audit ownerless communities and extra network administrators"
      - "Never script a delete: it takes the group and plans with it"
    narration: >
      Five rules. Describe the communities in a file, and create only what is missing. Create is asynchronous, so
      follow the operation and wait more than thirty seconds. Manage owners and members on the connected group. Audit
      for communities without an owner and for too many network administrators. And never script a delete.

