linkedin_company:
  text: |
    Every user has a OneDrive, and nobody looks at them until the storage runs out or somebody leaves.

    Episode 12 of DEVLADLOG Microsoft 365 covers OneDrive in three places:
    - Tenant settings checked against a baseline, read-only, through Microsoft Graph
    - An account audit from the usage report: never used, idle too long, nearly full
    - The sync app on a real Windows 11 machine, where three policies do the work: silent sign-in, Files On Demand and silent Known Folder Move

    The PC part builds a plan of registry values first, writes a rollback file before the first value, supports WhatIf, and has a check command that reads the registry back. Then the user signs in and Desktop, Documents and Pictures move into OneDrive without any action.

    The gotcha: the retention period for a deleted user's OneDrive starts when the account is deleted from Microsoft Entra ID. Blocking sign-in or removing the licence does not start it.

    Forty-seven Pester tests run without a tenant and without touching a registry.

    Watch: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #Microsoft365 #OneDrive #MicrosoftGraph #PowerShell
linkedin_personal:
  text: |
    The part of OneDrive that really protects files is not in the admin center. It is on the PC: silent sign-in plus silent Known Folder Move, so Desktop, Documents and Pictures land in OneDrive without the user doing anything.

    For episode 12 I wrote that as a plan of registry values, with a rollback file on disk before the first value is written, a WhatIf mode and a check command. Then I ran it on a real Windows 11 machine.

    Also worth knowing: the deleted-user retention clock starts when the account is deleted from Entra ID, not when you block sign-in.

    Episode 12: {YOUTUBE_URL}

    Narration uses an AI voice.

