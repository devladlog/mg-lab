        The retention period for a deleted user's OneDrive starts when the account is deleted from Microsoft Entra ID. Blocking sign-in does not start it, and neither does removing the licence.
        A OneDrive without a valid licence is archived automatically on its 93rd unlicensed day. After retention, it stays another 93 days in the recycle bin, where only a SharePoint administrator can restore it.
