linkedin_company:
  text: |
    Counting Global Administrators is not governing them. An admin who is always an admin, a guest nobody remembers inviting, and an account that still works after someone's last day are the real risk.

    Episode 4 of DEVLADLOG Microsoft 365 covers Microsoft Entra ID Governance as code, from one file:
    - PIM: eligible, time-bound admin roles with a justification, instead of standing access
    - A recurring access review of every guest, decided by group owners, deny by default
    - A leaver workflow built from built-in tasks: revoke tokens, remove from teams and groups, disable the account
    - A pre-flight check before any on-demand run

    The gotcha: when a P2 or governance licence or trial expires, eligible role assignments are removed and time-bound active assignments become permanent. The audit warns 30 days ahead and counts what will change.

    Fifty-three Pester tests run without a tenant.

    Watch: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #Microsoft365 #EntraID #PIM #IdentityGovernance
linkedin_personal:
  text: |
    The safest identity setup can quietly become the unsafe one. In episode 4 I made admins eligible for roles instead of permanent, with an end date and a justification, and then found the catch in Microsoft's docs: when the P2 or governance licence or trial expires, eligible assignments are removed and time-bound active assignments become permanent.

    So the audit now warns 30 days before the licence ends and counts exactly what will change.

    Lesson: know your licence end date before PIM finds out for you.

    Episode 4: {YOUTUBE_URL}

    Narration uses an AI voice.

    #Microsoft365 #EntraID
