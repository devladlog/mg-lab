linkedin_company:
  text: |
    The Defender portal says Standard protection is on. But which mailboxes actually get it?

    Episode 6 of DEVLADLOG Microsoft 365 covers Defender for Office 365 as code, using Microsoft's own test methods. No real malware, no real phishing:
    - Preset security policies assigned from one file: Strict for priority accounts, Standard for the domain
    - A coverage audit that computes what each mailbox really gets
    - Microsoft's configuration analyzer turned into findings
    - Hunting with KQL, with every query parsed in the tests before it runs
    - A phishing simulation read back through Microsoft Graph

    The gotcha: values of one condition are ORed, but different condition types are ANDed. Add a domain and then a group "for good measure" and only domain users who are also in the group are protected.

    Forty-eight Pester tests run without a tenant.

    Watch: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #Microsoft365 #DefenderForOffice365 #KQL #PowerShell
linkedin_personal:
  text: |
    "Standard protection: on" does not mean every mailbox is protected. In episode 6 I set up that trap on purpose. In the portal you add a domain and then a group, and it looks like more people. It is fewer: values of one condition are ORed, different condition types are ANDed, so only domain users who are also in the group are covered.

    My audit computes the real coverage per mailbox, and it found the user left on default policies.

    Lesson: check who is protected, not whether a policy exists.

    Episode 6: {YOUTUBE_URL}

    Narration uses an AI voice.

    #Microsoft365 #DefenderForOffice365
