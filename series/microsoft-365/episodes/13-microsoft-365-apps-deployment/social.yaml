linkedin_company:
  text: |
    You deployed Microsoft 365 Apps once. Months later: which channel is each PC on, how far behind is it, and is anything still the old Store version?

    Episode 13 of DEVLADLOG Microsoft 365 describes the deployment in one small JSON file and uses it two ways:
    - An Office Deployment Tool configuration.xml for a real Windows 11 machine, with WhatIf and a silent install
    - An Intune app created through Microsoft Graph, with channel names translated and a second run that reports unchanged
    - An inventory of what is really installed, compared with Microsoft's release discovery service
    - An activation audit: users at the desktop limit, stale activations, mobile-only users

    The gotcha: many scripts read the version-to-report value from the Click-to-Run key. Microsoft's guidance says that value is telemetry and can differ from what is installed. We use the inventory key, package version and product release IDs, and match the channel from the CDN address.

    Fifty-seven Pester tests run without a tenant.

    Watch: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #Microsoft365 #OfficeDeployment #Intune #PowerShell
