linkedin_company:
  text: |
    Every project starts the same way: someone creates a plan, adds the same buckets, types the same tasks, and forgets to assign half of them.

    DEVLADLOG Microsoft 365 episode 15 makes the plan one JSON file and drives Planner and To Do with Microsoft Graph and PowerShell:
    - A loader checks the file against the documented Planner limits, then creates only what is missing. It never touches a task people edited by hand
    - An audit reads the plan back and flags overdue, unassigned and undated tasks
    - A focus script copies your overdue, this-week and urgent tasks into a personal To Do list, with a link back to the Planner task
    - Gotchas: every Planner update needs an etag in If-Match, and an assignment uses the user ID as the property name

    The module comes with 55 Pester tests that run against a mocked Graph, no tenant needed. Learn also notes the Planner API in Graph covers basic plans only, not premium plans.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Full guide: {BLOG_URL}

    Narration uses an AI voice.

    #Microsoft365 #MicrosoftPlanner #MicrosoftGraph #PowerShell
linkedin_personal:
  text: |
    The Planner API has a few surprises. An assignment is an open type: the user's object ID is the property name, and you must send @odata.type and an orderHint or you get a bad request. Priority is a number, where 1 means urgent and 9 means low.

    The one that matters most is the etag. Every update needs an If-Match header with the last etag you know, so my patch function reads the current etag, sends the change, and re-reads and retries on a conflict.

    Episode 15 of DEVLADLOG Microsoft 365, a plan built from one file: {YOUTUBE_URL}

    Narration uses an AI voice.

    #MicrosoftGraph #Microsoft365
