    youtube_short_title: "Planner API gotcha: every update needs an etag #Shorts"
    instagram_reel:
      caption: |
        Every Planner update needs an If-Match header with the last etag you know. If someone changed the task in the meantime, the update is rejected with a conflict.

        So the patch function reads the current etag, sends the change, and on a conflict reads again and retries. Task details, like checklists and descriptions, always go through this path. The Pester tests cover the retry against a mocked Graph.

