linkedin_company:
  text: |
    Most migration plans start with a mailbox count and a weekend. The ones that go wrong usually fail earlier, on a user name nobody looked at.

    DEVLADLOG Microsoft 365 episode 17 plans an Exchange migration in PowerShell, directory first:
    - The path comes from Microsoft's own table, written as a testable function: cutover, staged, hybrid or IMAP. Learn suggests staying under 150 mailboxes for cutover
    - A directory check runs before synchronization: UPN suffix must be a verified domain, UPN, mail and proxy addresses must be unique, no spaces or accents
    - The only fix is the UPN suffix, with -WhatIf, a confirmation per account and a rollback file that is never overwritten
    - Mailboxes are split into waves: pilot first, shared mailboxes kept with the people who use them, very large mailboxes last

    The lab has no on-premises Exchange, so the New-MigrationBatch commands are printed, not run. 69 Pester tests cover the decisions, rules, fix and waves without a tenant.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}

    Narration uses an AI voice.

    #Microsoft365 #ExchangeOnline #HybridMigration #PowerShell
linkedin_personal:
  text: |
    A migration fails on a user name long before it fails on a mailbox. Learn says the UPN suffix must be a routable domain, and that a non-routable suffix is synchronized to the tenant's default Microsoft domain: the account exists, with a name nobody chose.

    So I wrote the directory check first and ran it before any sync. The only fix I allow is the UPN suffix, with -WhatIf, a prompt per account and a rollback file that never gets overwritten.

    Episode 17 of DEVLADLOG Microsoft 365: {YOUTUBE_URL}

    Narration uses an AI voice.

    #Microsoft365 #ExchangeOnline
