linkedin_company:
  text: |
    Unless you set an expiration policy, a Microsoft 365 group never expires. The project ends, the owner leaves, and the team, the mailbox and the SharePoint site stay forever.

    Episode 3 of DEVLADLOG Microsoft 365 gives every group an end date, from one file and real Microsoft Graph calls:
    - Create or patch the tenant expiration policy, with what-if first and a pilot on selected groups
    - Audit who actually gets the renewal email, including ownerless groups
    - Restore a deleted group inside its 30-day window
    - Archive a team, which needs an owner

    The gotcha: when you first switch expiration on, any group older than the lifetime is set to 35 days until expiration unless it is renewed. The script previews exactly which groups that hits before you confirm anything.

    Forty-seven Pester tests run without a tenant.

    Watch: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #Microsoft365 #MicrosoftGraph #EntraID #PowerShell
linkedin_personal:
  text: |
    If you turn on group expiration in an old tenant, every group older than the lifetime gets a 35-day countdown on the same day. That is what Microsoft documents, and it is the part most guides skip.

    For episode 3 I wrote the script so it previews exactly which groups that hits before you confirm anything, and starts with a pilot on selected groups.

    Lesson: for lifecycle changes, the preview is the feature. Restore and archive work the same way, one command and one confirmation.

    Episode 3: {YOUTUBE_URL}

    Narration uses an AI voice.

    #Microsoft365 #EntraID
