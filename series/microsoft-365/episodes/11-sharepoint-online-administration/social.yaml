linkedin_company:
  text: |
    Somebody changes a sharing setting in the SharePoint admin center, and nobody writes it down.

    Episode 11 of DEVLADLOG Microsoft 365 writes down what the tenant should look like, asks Microsoft Graph what it really looks like, and lists the sites that are idle, full or without an owner:
    - A baseline file where every name must be a real property of the tenant settings, so a typo cannot silently check nothing
    - Drift with a direction: a tenant wider than the baseline stays high, a narrower one is reported as low
    - Site rules read from the SharePoint site usage report
    - One fix, one property per request, with the old value written to a rollback file first, and a restore that never overwrites a newer change

    The gotcha: usage reports hide site names by default, so the report downloads as a list of hashes. The tool checks whether the addresses are real and stops instead of printing a table nobody can use.

    Fifty-three Pester tests run without a tenant.

    Watch: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #Microsoft365 #SharePoint #MicrosoftGraph #PowerShell
linkedin_personal:
  text: |
    Configuration drift has a direction. In episode 11 the SharePoint baseline compares the sharing level in order, from only people in your organization to anyone. If the tenant is wider than the baseline, it stays high severity. If it is narrower, it is low, because somebody locked something down.

    The fix is small on purpose: one property per request, the old value written to a rollback file first, and a restore that skips a setting somebody changed since.

    Episode 11: {YOUTUBE_URL}

    Narration uses an AI voice.

    #Microsoft365 #SharePoint
