linkedin_company:
  text: |
    A team created through the Graph API is public unless you say otherwise. It has one owner until that person leaves. And its name tells nobody what it is for. Teams sprawl starts on day one.

    Episode 2 of DEVLADLOG Microsoft 365 puts Teams governance in one policy file, then uses that file everywhere:
    - Preview names against the naming convention and blocked words before anything is created
    - Always set visibility, and require at least two owners
    - Create teams asynchronously and poll the operation until it finishes
    - Audit every team for ownerless teams, guests in public teams and inactivity
    - Push the same policy to the tenant's group settings

    The gotcha: Global Administrator and User Administrator are exempt from the group naming policy, so a provisioning script running as one of them enforces nothing unless the script checks the name itself.

    Thirty-nine Pester tests run without a tenant.

    Watch: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #Microsoft365 #MicrosoftTeams #MicrosoftGraph #PowerShell
linkedin_personal:
  text: |
    Teams governance fails quietly. Nobody decides who may create teams, how many owners a team needs, or what a name should look like, so every team gets whatever the creator typed.

    For episode 2 I put those decisions in one policy file and made the provisioning script enforce it. The detail that surprised me: Global Administrator and User Administrator are exempt from the group naming policy. If your script runs as one of them, only the script can enforce the convention, so mine checks the name before it calls Graph.

    Episode 2: {YOUTUBE_URL}

    Narration uses an AI voice.

    #Microsoft365 #MicrosoftTeams
