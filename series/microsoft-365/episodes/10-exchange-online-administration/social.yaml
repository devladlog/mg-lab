linkedin_company:
  text: |
    In a tenant like yours, mail may be forwarded to an address outside the company right now. An admin set it years ago, a user made an Inbox rule, or a mail flow rule copies everything to a partner.

    Episode 10 of DEVLADLOG Microsoft 365 finds all of it with Exchange Online PowerShell:
    - An audit of four places mail leaves: mailbox forwarding, Inbox rules, mail flow rules and the outbound spam policy, read-only
    - A fix that records the old address in a rollback file first, re-reads the mailbox before touching it, and only fixes what you list
    - A shared mailbox declared in a JSON file and synced idempotently
    - Message trace within its documented limits: 90 days back, 10 days per query

    The gotcha: outside does not simply mean a domain that is not yours. An external relay domain leaves your organization, so only authoritative and internal relay domains count as inside.

    Sixty-five Pester tests run without a tenant.

    Watch: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #Microsoft365 #ExchangeOnline #PowerShell #EmailSecurity
linkedin_personal:
  text: |
    "Forwarding to an outside address" sounds simple until you ask what outside means. A domain your tenant accepts mail for can still be an external relay domain, and forwarding to it leaves your organization. So in episode 10 only authoritative and internal relay domains count as inside.

    The fix follows the same habit as the audit: record the old forwarding address in a rollback file, re-read the mailbox first, support WhatIf, and only touch the mailboxes you list.

    Episode 10: {YOUTUBE_URL}

    Narration uses an AI voice.

    #Microsoft365 #ExchangeOnline
