linkedin_company:
  text: |
    Every licence nobody uses costs money every month, and the list of who holds them is spread over three places.

    Episode 9 of DEVLADLOG Microsoft 365 finds them with Microsoft Graph, reclaims a few, and keeps a way back:
    - Disabled accounts that still hold a licence
    - Users who never signed in, or stopped months ago
    - A smaller licence next to a bigger one that already covers it
    - The same licence assigned directly and through a group

    The script reclaims nothing unless you allow it: the shipped config allows no licence, admin role members and protected users are never planned, and group-assigned licences are never touched. Each removal is written to a rollback file first, and a restore command gives the licence back.

    The gotcha: the last sign-in date counts failed attempts, so someone locked out looks active. The script uses the last successful sign-in.

    Fifty-five Pester tests run without a tenant.

    Watch: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #Microsoft365 #Licensing #MicrosoftGraph #PowerShell
linkedin_personal:
  text: |
    A licence clean-up script is only useful if you can undo it. In episode 9, every removal writes the user, the SKU and the disabled plans to a rollback file right after it happens, the script refuses to overwrite an old rollback file, and a restore command gives the licence back.

    Also, the last sign-in date counts failed attempts. Someone locked out and retrying looks active. The audit uses the last successful sign-in instead.

    Lesson: be careful with the word "saving". A seat is only a saving if nobody needs it.

    Episode 9: {YOUTUBE_URL}

    Narration uses an AI voice.

    #Microsoft365 #Licensing
