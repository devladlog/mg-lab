linkedin_company:
  text: |
    Copilot answers from what each person is allowed to open. So the question to ask before you buy it is not what Copilot can do, but what it would find.

    Episode 8 of DEVLADLOG Microsoft 365 prepares a tenant for Copilot without a Copilot licence, on purpose:
    - A readiness check of subscriptions and each user's service plans
    - Copilot Chat with Entra accounts, and what it can and cannot see without the add-on
    - A bounded, read-only walk of document libraries that flags Anyone links, organization-wide links and the Everyone except external users group
    - A check of whether sensitivity labels exist

    The gotcha: a Copilot Studio trial plan even appears inside the Copilot product, and counting it would say you are licensed. The check only counts the Copilot SKUs, or plans that put Copilot in the apps, and only when provisioned.

    Forty-nine Pester tests run without a tenant, and one proves only read requests are ever sent.

    Watch: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #Microsoft365 #MicrosoftCopilot #SharePoint #MicrosoftGraph
linkedin_personal:
  text: |
    Before buying Microsoft 365 Copilot, I would ask a different question: what would it find?

    Copilot only shows what a person can already open. That is fine until a folder was shared with everyone years ago. For episode 8 I wrote a read-only script that walks document libraries and flags Anyone links, organization-wide links and the Everyone except external users group. Our lab has no Copilot licence, so everything runs without one.

    And a Copilot Studio trial is not a Copilot licence, so the check doesn't count it.

    Episode 8: {YOUTUBE_URL}

    Narration uses an AI voice.

    #Microsoft365 #MicrosoftCopilot
