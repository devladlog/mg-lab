linkedin_company:
  text: |
    A degraded service, a message center deadline next week, a full licence pool, a guest holding Global Administrator. Your Microsoft 365 tenant already reports all of it, just across five admin centers.

    Episode 1 of DEVLADLOG Microsoft 365 pulls it into one read-only report with Microsoft Graph and PowerShell:
    - Service health mapped to Healthy, Recovering, Degraded or Down
    - Message center posts with an action-required date
    - Licences that are full, unused or in a grace period
    - Global Administrators: how many, and who

    The module only sends GET requests with least-privileged read scopes, writes a Markdown report, and returns an exit code a scheduler can act on. Thirty-eight Pester tests run without a tenant.

    One gotcha: usage reports are concealed by default, so inactive users show up as hashes. The module detects that instead of naming the wrong people.

    Watch the episode: {YOUTUBE_URL}
    Code: {REPO_URL}
    Full guide: {BLOG_URL}

    Narration uses an AI voice.

    #Microsoft365 #MicrosoftGraph #PowerShell #M365Admin
linkedin_personal:
  text: |
    I started the Microsoft 365 series with the boring question: how do you know your tenant is healthy without opening five admin centers?

    My answer is a small PowerShell module that only sends GET requests with read scopes and writes one Markdown report. The surprise was in the usage reports. Since 2021 they hide user names by default, so my inactive-users check returned long hashes. The module now detects that and says so, instead of naming the wrong people.

    Lesson: a monitoring script that guesses is worse than one that says "I can't tell".

    Episode 1: {YOUTUBE_URL}

    Narration uses an AI voice.

    #Microsoft365 #MicrosoftGraph
