linkedin_company:
  text: |
    A form collects answers. Then somebody exports them to Excel every Monday, and nobody knows if the numbers are complete.

    Episode 14 of DEVLADLOG Microsoft 365 builds the other way. Forms has no public API to create a form or read its responses, so the design is:
    - A real form, made by hand in our lab tenant
    - A Power Automate flow that writes every response to a SharePoint list
    - The list created from one JSON file with Microsoft Graph: what-if first, idempotent, adds only missing columns
    - A data-quality check: missing required answers, values outside the choices, numbers out of range, duplicates, gaps, double submits and anonymous responses

    The gotcha: a flow can run twice, fail or be turned off, and Forms won't tell you. So the response ID goes into the list as a required, unique column, and the check reports gaps you can compare with the responses tab.

    Forty-eight Pester tests run without a tenant.

    Watch: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #Microsoft365 #MicrosoftForms #PowerAutomate #MicrosoftGraph
linkedin_personal:
  text: |
    The blog posts about Microsoft Forms skip one thing: the Forms connector gives a flow one trigger and two actions, and there is no public API to create a form or read its responses. So the form and the flow are built by hand, and everything around them is code.

    In episode 14 the SharePoint list comes from one JSON file, and the response ID is a required, unique column so a double write is rejected. Then a check tells you what is wrong with the data, not just how much of it there is.

    Episode 14: {YOUTUBE_URL}

    Narration uses an AI voice.

    #Microsoft365 #MicrosoftForms
