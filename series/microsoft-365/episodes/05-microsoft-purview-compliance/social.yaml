linkedin_company:
  text: |
    Data rarely leaves through an attacker. It leaves through a spreadsheet of card numbers on the wrong email, or a confidential file shared with a partner.

    Episode 5 of DEVLADLOG Microsoft 365 puts Microsoft Purview in front of that, from one file:
    - Sensitivity labels people can apply, published to a pilot group
    - DLP policies that start in simulation, with policy tips
    - A retention label that keeps contracts for seven years
    - An audit that reports drift from the file

    Two gotchas. The WhatIf switch doesn't work in Security and Compliance PowerShell, so the dry run lives in our own function. And the famous test card number doesn't trigger DLP, because Microsoft's credit card definition ignores reserved test numbers, so we generate synthetic ones that pass the Luhn check.

    Sixty Pester tests run without a tenant.

    Watch: {YOUTUBE_URL}
    Code: {REPO_URL}
    Guide: {BLOG_URL}

    Narration uses an AI voice.

    #Microsoft365 #MicrosoftPurview #DLP #PowerShell
linkedin_personal:
  text: |
    Two Purview surprises from episode 5.

    First, the -WhatIf switch doesn't work in Security and Compliance PowerShell. Every cmdlet page says so. So I built the dry run into my own function: it plans, it asks, and it never passes -WhatIf down.

    Second, people test DLP with the famous test card number and conclude DLP is broken. Microsoft's credit card definition doesn't flag reserved test numbers. Synthetic numbers that pass the Luhn check, next to a keyword, do trigger it.

    Episode 5: {YOUTUBE_URL}

    Narration uses an AI voice.

    #Microsoft365 #MicrosoftPurview
